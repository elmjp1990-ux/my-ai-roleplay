<script>
/* Wallet-cost UI: compact currency deductions and a single-chat insufficient-balance choice. */
function walletCostPreviewHTML(cost) {
  const user=currentUser()||{};
  const silver=Math.max(0,Number(user.silver||0));
  const diamonds=Math.max(0,Number(user.diamonds||0));
  const price=Math.max(0,Number(cost||0));
  const fromSilver=Math.min(silver,price);
  const fromDiamonds=Math.max(0,price-fromSilver);
  const parts=[];
  if(fromSilver>0) parts.push('<span class="wallet-cost-part" aria-label="銀幣扣除 '+fromSilver+'">🪙 −'+fromSilver+'</span>');
  if(fromDiamonds>0) parts.push('<span class="wallet-cost-part" aria-label="鑽石扣除 '+fromDiamonds+'">💎 −'+fromDiamonds+'</span>');
  if(!parts.length) parts.push('<span class="wallet-cost-part">🪙 −'+price+'</span>');
  return parts.join('<span class="wallet-cost-plus" aria-hidden="true"> </span>');
}
let walletDiamondConsentOnce = '';
function walletCostFor(mode) {
  return mode==='group' ? Math.max(1,(groupPrototype.active?.members||[]).length)*3 : 2;
}
function walletChoiceStorageKey(mode) {
  return 'personax-wallet-choice:'+String(currentUser()?.uid||'guest')+':'+mode;
}
function getTodayWalletChoice(mode) {
  try {
    const saved=JSON.parse(localStorage.getItem(walletChoiceStorageKey(mode))||'null');
    if(!saved||saved.expiresAt<=Date.now()||!['diamonds','ad'].includes(saved.choice)) {
      localStorage.removeItem(walletChoiceStorageKey(mode));
      return '';
    }
    return saved.choice;
  } catch (_) { return ''; }
}
function saveTodayWalletChoice(mode,choice) {
  const now=new Date();
  const expiresAt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).getTime()-1;
  try { localStorage.setItem(walletChoiceStorageKey(mode),JSON.stringify({choice,expiresAt})); } catch (_) {}
}
function walletPreflight(mode) {
  const user=currentUser()||{};
  const silver=Math.max(0,Number(user.silver||0));
  const diamonds=Math.max(0,Number(user.diamonds||0));
  const cost=walletCostFor(mode);
  if(silver>=cost) return true;
  const neededDiamonds=Math.max(0,cost-silver);
  if(walletDiamondConsentOnce===mode && diamonds>=neededDiamonds) {
    walletDiamondConsentOnce='';
    return true;
  }
  walletDiamondConsentOnce='';
  const remembered=getTodayWalletChoice(mode);
  if(remembered==='diamonds' && diamonds>=neededDiamonds) return true;
  if(remembered==='ad' && mode==='single') {
    showWalletAdUnavailable();
    return false;
  }
  openInsufficientFundsDialog(mode);
  return false;
}
function showWalletAdUnavailable() {
  showDialog('廣告功能尚未串接','<p>目前尚未接入廣告播放器及後端完整播放驗證，因此不會發放銀幣，也不會放行對話。接入廣告服務後，才會在確認完整播放與後端廣告回饋成功後繼續對話。</p>');
}
function openInsufficientFundsDialog(mode) {
  const user=currentUser()||{};
  const silver=Math.max(0,Number(user.silver||0));
  const diamonds=Math.max(0,Number(user.diamonds||0));
  const cost=walletCostFor(mode);
  const fromSilver=Math.min(silver,cost);
  const fromDiamonds=Math.max(0,cost-fromSilver);
  const enoughTotal=silver+diamonds>=cost;
  const remembered=getTodayWalletChoice(mode);
  const remember=remembered==='diamonds' || (mode==='single' && remembered==='ad');
  const chargePreview=(fromSilver>0?'<span>🪙 −'+fromSilver+' <small>(持有 '+silver+')</small></span>':'')+
    (fromDiamonds>0?'<span>💎 −'+fromDiamonds+' <small>(持有 '+diamonds+')</small></span>':'');
  const adOption=mode==='single'
    ? '<button type="button" class="primary" data-action="wallet-watch-ad">看廣告繼續聊</button>'
    : '';
  const diamondOption=enoughTotal
    ? '<button type="button" class="primary" data-action="wallet-confirm-diamonds" data-mode="'+mode+'">使用鑽石</button>'
    : '<button type="button" class="primary" data-action="wallet-open-shop">鑽石不足，前往商店</button>';
  const rememberOption=mode==='single'
    ? '<label class="wallet-remember-choice"><input type="checkbox" id="walletRememberChoice" '+(remember?'checked':'')+'> <span>今天都使用這個選擇，不要再提醒我</span></label>'
    : '<label class="wallet-remember-choice"><input type="checkbox" id="walletRememberChoice" '+(remembered==='diamonds'?'checked':'')+'> <span>今天都使用這個選擇，不要再提醒我</span></label>';
  const body='你的銀幣或鑽石不足，繼續對話將花費以下：';
  showDialog('銀幣或鑽石不足',`
    <p>${body}</p>
    <div class="wallet-modal-cost" aria-label="預計扣款">${chargePreview||'💎 −'+cost+' <small>(持有 '+diamonds+')</small>'}</div>
    ${mode==='single'?'<p>你也可以選擇觀看廣告，繼續對話。</p>':''}
    <div class="wallet-modal-actions">${adOption}${diamondOption}</div>
    ${rememberOption}
  `);
}
document.addEventListener('click',async event=>{
  const nsfwButton=event.target.closest('[data-action="nsfw-focus"],[data-action="dialog-close"]');
  if(nsfwButton?.dataset.action==='nsfw-focus'){$('modal')?.close();focusNsfwCheckbox();return;}
  if(nsfwButton?.dataset.action==='dialog-close'){$('modal')?.close();return;}
  const button=event.target.closest('[data-action="wallet-dialog-close"],[data-action="wallet-cost-details"],[data-action="wallet-confirm-diamonds"],[data-action="wallet-watch-ad"],[data-action="wallet-open-shop"]');
  if(!button)return;
  if(button.dataset.action==='wallet-dialog-close') {
    $('modal')?.close();
    return;
  }
  if(button.dataset.action==='wallet-cost-details') {
    const u=currentUser()||{};
    const silver=Math.max(0,Number(u.silver||0)),diamonds=Math.max(0,Number(u.diamonds||0));
    const cost=route.page==='group'?Math.max(1,(groupPrototype.active?.members||[]).length)*3:2;
    showDialog('我的資源',`
      <div class="wallet-resource-row"><span>🪙 銀幣</span><strong>持有 ${silver.toLocaleString()}</strong></div>
      <div class="wallet-resource-row"><span>💎 鑽石</span><strong>持有 ${diamonds.toLocaleString()}</strong></div>
      <p class="small muted">本次預計扣除：${walletCostPreviewHTML(cost)}</p>
    `);
    return;
  }
  if(button.dataset.action==='wallet-open-shop') {
    const modal=$('modal'); if(modal?.open) modal.close();
    go({page:'shop'});
    return;
  }
  if(button.dataset.action==='wallet-watch-ad') {
    if($('walletRememberChoice')?.checked) saveTodayWalletChoice('single','ad');
    showWalletAdUnavailable();
    return;
  }
  if(button.dataset.action==='wallet-confirm-diamonds') {
    const mode=button.dataset.mode || (route.page==='group'?'group':'single');
    if($('walletRememberChoice')?.checked) saveTodayWalletChoice(mode,'diamonds');
    walletDiamondConsentOnce=mode;
    const modal=$('modal'); if(modal?.open) modal.close();
    // Explicit player consent: only now retry the intended send action.
    if(mode==='group') await groupSendMock();
    else {
      const form=$('view').querySelector('form[data-form="message"]');
      if(form) form.requestSubmit();
    }
  }
});
</script>

<script id="poyozz-ui-quick-polish-script">
/* UI-172: file-size guard and followed-author return navigation */
document.addEventListener('change',function(event){
  const input=event.target;
  if(!(input instanceof HTMLInputElement)||input.type!=='file'||!input.dataset.maxBytes)return;
  const file=input.files&&input.files[0];
  if(file&&file.size>Number(input.dataset.maxBytes)){
    input.value='';
    toast('截圖不可超過 15 MB，請選擇較小的圖片。');
  }
});
document.addEventListener('submit',function(event){
  const form=event.target;
  if(!(form instanceof HTMLFormElement)||form.dataset.form!=='bug')return;
  const file=form.querySelector('input[type="file"][data-max-bytes]')?.files?.[0];
  if(file&&file.size>15728640){event.preventDefault();toast('截圖不可超過 15 MB，請選擇較小的圖片。');}
},true);
</script>

<script id="poyozz-city-map-mvp-script">
function renderCityMapMVP(){
  document.body.classList.add('city-map-mode');
  const view=$('view');
  view.innerHTML=`
    <section class="city-map-stage" id="cityMapStage" aria-label="POYOZZ 城市地圖">
      <div class="city-map-world" id="cityMapWorld" aria-label="可拖曳地圖">
        <div class="city-map-river"></div>
        <div class="city-map-road r1"></div><div class="city-map-road r2"></div><div class="city-map-road r3"></div>
        <div class="city-map-block cafe"></div><div class="city-map-block school"></div><div class="city-map-block park"></div><div class="city-map-block shop"></div><div class="city-map-block home"></div>
        <button class="city-map-landmark" style="left:26%;top:40%" data-action="city-landmark" data-place="cafe"><span>☕</span>星光咖啡</button>
        <button class="city-map-landmark" style="left:67%;top:23%" data-action="city-landmark" data-place="school"><span>🏫</span>晴日學園</button>
        <button class="city-map-landmark" style="left:70%;top:67%" data-action="city-landmark" data-place="park"><span>🌳</span>中央公園</button>
        <button class="city-map-landmark" style="left:23%;top:69%" data-action="city-landmark" data-place="shop"><span>🛍️</span>街角商店</button>
        <button class="city-map-landmark" style="left:78%;top:44%" data-action="city-landmark" data-place="home"><span>🏠</span>住宅區</button>
      </div>
      <div class="city-map-ui" id="cityMapUI">
        <aside class="city-map-info">
          <h2 class="city-map-title"><img src="https://raw.githubusercontent.com/elmjp1990-ux/my-ai-roleplay/main/LOGO_WEBLOGO.png?v=20261024-4" alt="POYOZZ"> <span>城市</span></h2>
          <div id="cityMapDate">台灣時間</div>
          <div class="city-map-weather"><span>🌤️</span><span id="cityMapWeather">天氣資料待串接</span><span id="cityMapTemp">溫度待串接</span></div>
          <p>這座城市充滿各種可能，也許今天你會在某個角落遇見特別的那個人。</p>
          <button class="city-map-traditional" data-action="city-traditional">⌖ 傳統探索模式</button>
        </aside>
        <div class="city-map-zoom"><button type="button" data-action="city-zoom-in" aria-label="放大地圖">＋</button><button type="button" data-action="city-zoom-out" aria-label="縮小地圖">−</button></div>
        <div class="city-map-bottom">
          <button data-action="city-traditional">✧<br>探索</button><button data-action="nav" data-page="create">✎<br>創建</button><button data-action="nav" data-page="chat">☏<br>聊天</button><button data-action="nav" data-page="shop">◇<br>商店</button><button data-action="nav" data-page="profile">♡<br>我的</button>
        </div>
      </div>
      <div class="city-map-empty">拖曳探索 · 雙指縮放 · 雙擊空白處沉浸</div>
      <section class="city-map-people" id="cityMapPeople" hidden><button type="button" data-action="city-close">關閉</button><h3 id="cityMapPlaceTitle">地標</h3><p>目前尚未連接角色出沒資料。前端 MVP 使用示意地標，不會產生虛構的即時角色名單。</p><p class="small muted">下一階段接入符合現代城鎮設定、公開且未刪除的角色。</p></section>
    </section>`;
  document.body.classList.remove('city-map-mode-immersive');
  const stage=$('cityMapStage'),world=$('cityMapWorld');
  const mapAspect=2752/1536;
  let scale=1,tx=0,ty=0,pointers=new Map(),start=null,lastTap=0,lastTapX=0,lastTapY=0,moved=false;
  const sizeWorld=()=>{const sw=stage.clientWidth,sh=stage.clientHeight;const nav=$('cityMapUI')?.querySelector('.city-map-bottom');const navExtra=Math.max(76,(nav?.offsetHeight||68)+12);const h=Math.max(sh+navExtra,sw/mapAspect);const w=h*mapAspect;world.style.width=w+'px';world.style.height=h+'px';world.style.left=((sw-w)/2)+'px';world.style.top=((sh-h)/2)+'px';world.style.backgroundSize='100% 100%';};
  sizeWorld();
  const apply=()=>{world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';};
  const clamp=()=>{scale=Math.max(1,Math.min(2.25,scale));const maxX=Math.max(0,(world.offsetWidth*scale-stage.clientWidth)/2);const maxY=Math.max(0,(world.offsetHeight*scale-stage.clientHeight)/2);tx=Math.max(-maxX,Math.min(maxX,tx));ty=Math.max(-maxY,Math.min(maxY,ty));apply();};
  const zoomBy=f=>{scale*=f;clamp();};
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.city-map-info,.city-map-zoom,.city-map-bottom,.city-map-people'))return;stage.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(pointers.size===1)start={x:e.clientX,y:e.clientY,tx,ty,time:Date.now()};else if(pointers.size===2){const a=[...pointers.values()];start={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale,kind:'pinch'};}});
  stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&start?.kind==='pinch'){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=start.scale*d/Math.max(1,start.distance);clamp();moved=true;}else if(pointers.size===1&&start&&!start.kind){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;tx=start.tx+dx;ty=start.ty+dy;clamp();}});
  const endPointer=e=>{pointers.delete(e.pointerId);if(pointers.size===0){if(start&&!moved&&Date.now()-start.time<280){const now=Date.now(),dx=e.clientX-lastTapX,dy=e.clientY-lastTapY;if(now-lastTap<320&&Math.hypot(dx,dy)<24){document.body.classList.toggle('city-map-mode-immersive');lastTap=0;}else{lastTap=now;lastTapX=e.clientX;lastTapY=e.clientY;}}start=null;}else if(pointers.size===1){const p=[...pointers.values()][0];start={x:p.x,y:p.y,tx,ty,time:Date.now()};}};
  stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);stage.addEventListener('dblclick',e=>e.preventDefault());stage.addEventListener('contextmenu',e=>e.preventDefault());
  // 2025 Taipei solar-time reference profile. Calculate the 2025 reference day locally;
  // no sunrise/sunset API or daily network request is needed.
  const taipeiSunTimes2025=(month,day)=>{
    const date=new Date(Date.UTC(2025,month-1,day));
    const n=Math.floor((date-Date.UTC(2025,0,0))/86400000);
    const lat=25.033,lon=121.5654,zenith=90.833;
    const decl=0.006918-0.399912*Math.cos(2*Math.PI*n/365)+0.070257*Math.sin(2*Math.PI*n/365)-0.006758*Math.cos(4*Math.PI*n/365)+0.000907*Math.sin(4*Math.PI*n/365)-0.002697*Math.cos(6*Math.PI*n/365)+0.00148*Math.sin(6*Math.PI*n/365);
    const cosH=(Math.cos(zenith*Math.PI/180)-Math.sin(lat*Math.PI/180)*Math.sin(decl))/(Math.cos(lat*Math.PI/180)*Math.cos(decl));
    const ha=Math.acos(Math.max(-1,Math.min(1,cosH)))*180/Math.PI;
    const solarNoon=12-lon/15+8;
    return {sunrise:solarNoon-ha/15,sunset:solarNoon+ha/15};
  };
  const taipeiTime=()=>{
    const d=new Date();
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
    const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
    const month=Number(p.month),day=Number(p.day),minuteOfDay=(Number(p.hour)%24)*60+Number(p.minute);
    const sun=taipeiSunTimes2025(month,day);
    const sunrise=Math.round(sun.sunrise*60),sunset=Math.round(sun.sunset*60);
    const isDay=minuteOfDay>=sunrise&&minuteOfDay<sunset;
    $('cityMapDate').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
    const mapImage=isDay?'https://raw.githubusercontent.com/elmjp1990-ux/my-ai-roleplay/main/Prosperous_daytime_cityscape_pai%E2%80%A6_2K_20261027142908%20(1).webp':'https://raw.githubusercontent.com/elmjp1990-ux/my-ai-roleplay/main/Add_nighttime_lighting_to_buildings_2K_20261027142959%20(1).webp';
    stage.style.backgroundColor=isDay?'#b9d9c5':'#18253e';stage.style.backgroundImage='none';world.style.backgroundImage='url("'+mapImage+'")';world.style.filter='none';
  };
  taipeiTime();
  const cityMapClock=setInterval(taipeiTime,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)taipeiTime();});

  stage.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='city-zoom-in'){zoomBy(1.18);return;}if(a==='city-zoom-out'){zoomBy(.85);return;}if(a==='city-close'){$('cityMapPeople').hidden=true;return;}if(a==='city-landmark'){const names={cafe:'星光咖啡',school:'晴日學園',park:'中央公園',shop:'街角商店',home:'住宅區'};$('cityMapPlaceTitle').textContent=names[b.dataset.place]||'地標';$('cityMapPeople').hidden=false;return;}if(a==='city-traditional'){go({page:'home'});return;}});
  window.addEventListener('resize',()=>{sizeWorld();clamp();},{passive:true});
}
</script>
