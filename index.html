async function readImage(file) {
  if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) throw Error('請選擇PNG、JPG或WebP。');
  return await new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(Error('圖片讀取失敗。'));
    reader.readAsDataURL(file);
  });
}
async function compressProfileImage(file) {
  if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) throw Error('請選擇 PNG、JPG 或 WebP 圖片。');
  if (file.size > 15 * 1024 * 1024) throw Error('頭像原始檔請小於 15 MB。');
  const source=await readImage(file);
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('無法讀取這張圖片。'));img.src=source;});
  const size=256, canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('目前瀏覽器無法壓縮圖片。');
  const scale=Math.max(size/image.width,size/image.height),width=image.width*scale,height=image.height*scale;
  ctx.drawImage(image,(size-width)/2,(size-height)/2,width,height);
  let result=canvas.toDataURL('image/webp',0.62);
  if(result.length>120000)result=canvas.toDataURL('image/jpeg',0.55);
  if(result.length>180000)result=canvas.toDataURL('image/jpeg',0.38);
  if(result.length>220000)throw Error('壓縮後圖片仍太大，請改用較簡單的圖片。');
  return result;
}

// IMG-01: compress user-selected upload images before they enter app state.
async function compressUploadImage(file, options = {}) {
  const allowedTypes=['image/png','image/jpeg','image/webp'];
  if (!file || !allowedTypes.includes(file.type)) throw Error('請選擇 PNG、JPG 或 WebP 圖片。');
  if (file.size > 15 * 1024 * 1024) throw Error('圖片原始檔請小於 15 MB。');

  // Use a temporary object URL instead of converting the full original file to Base64.
  // Always revoke it so repeated mobile selections do not retain large source buffers.
  const sourceUrl=URL.createObjectURL(file);
  let image;
  try {
    image=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(Error('無法讀取這張圖片，請換一張再試。'));
      img.src=sourceUrl;
    });
    if (!image.naturalWidth || !image.naturalHeight) throw Error('圖片尺寸無效，請換一張再試。');

    const targetBytes=Number(options.targetBytes)||500*1024;
    const maxEdge=Number(options.maxEdge)||1600;
    let scale=Math.min(1,maxEdge/Math.max(image.naturalWidth,image.naturalHeight));
    const formats=[
      {type:'image/webp',qualities:[0.84,0.76,0.68,0.60,0.52]},
      {type:'image/jpeg',qualities:[0.82,0.72,0.62,0.52]}
    ];
    let bestBlob=null,bestWidth=0,bestHeight=0;
    while(scale>=0.35) {
      const width=Math.max(1,Math.round(image.naturalWidth*scale));
      const height=Math.max(1,Math.round(image.naturalHeight*scale));
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      if(!ctx) throw Error('目前瀏覽器無法壓縮圖片。');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(const format of formats) {
        // JPEG has no alpha channel. Fill it white first so transparent PNGs
        // do not unexpectedly turn black when the fallback format is used.
        if(format.type==='image/jpeg') {
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,width,height);
        } else {
          ctx.clearRect(0,0,width,height);
        }
        ctx.drawImage(image,0,0,width,height);
        for(const quality of format.qualities) {
          const blob=await new Promise(resolve=>canvas.toBlob(resolve,format.type,quality));
          if(!blob || blob.type!==format.type) continue;
          if(!bestBlob || blob.size<bestBlob.size) {
            bestBlob=blob;bestWidth=width;bestHeight=height;
          }
          if(blob.size<=targetBytes) {
            const dataUrl=await new Promise((resolve,reject)=>{
              const reader=new FileReader();
              reader.onload=()=>resolve(reader.result);
              reader.onerror=()=>reject(Error('壓縮圖片讀取失敗，請再試一次。'));
              reader.readAsDataURL(blob);
            });
            return {dataUrl,originalBytes:file.size,compressedBytes:blob.size,width,height,mimeType:blob.type};
          }
        }
      }
      scale*=0.85;
    }
    if(!bestBlob || bestBlob.size>2*1024*1024) {
      throw Error('圖片壓縮後仍過大，請改選較小的圖片。');
    }
    const dataUrl=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(Error('壓縮圖片讀取失敗，請再試一次。'));
      reader.readAsDataURL(bestBlob);
    });
    return {dataUrl,originalBytes:file.size,compressedBytes:bestBlob.size,width:bestWidth,height:bestHeight,mimeType:bestBlob.type};
  } finally {
    URL.revokeObjectURL(sourceUrl);
    if(image) image.src='';
  }
}

/* Chat sessions: character identity stays separate from conversation identity. */
function newSession(character,options = {}) {
  const sessionId = id();
  const session = {
    id:sessionId,characterId:character.id,name:'',
    archived:false,hidden:false,pinned:false,
    startedAt:Date.now(),persona:'',suggestions:true,background:'avatar',
    messages:[{id:id(),role:'assistant',text:character.opening,at:Date.now()}],
    memories:[],album:[],...options
  };
  state.sessions[sessionId] = session;
  return session;
}
function hasUserMessage(session) {
  return (session?.messages || []).some(message =>
    message.role === 'user' && String(message.text || '').trim()
  );
}
function sessionTitle(session) {
  return String(session?.name || sessionCharacter(session)?.name || session?.characterName || '角色').trim();
}
function uniqueSessionName(base,excludeId = '') {
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== excludeId)
    .map(sessionTitle));
  const clean = [...String(base || '回憶').trim()].slice(0,25).join('') || '回憶';
  if (!used.has(clean)) return clean;
  for (let n = 1; n < 10000; n++) {
    const suffix = '-'+n;
    const candidate = [...clean].slice(0,25-[...suffix].length).join('')+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return [...clean].slice(0,20).join('')+'-'+Date.now().toString().slice(-4);
}
function newArchiveName(character,session) {
  const d = new Date(session.archivedAt || Date.now());
  const date = [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const characterName = character?.name || '角色';
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== session.id)
    .map(sessionTitle));
  for (let n = 0; n < 10000; n++) {
    const suffix = n ? '-'+n : '';
    const room = Math.max(1,25-[...date].length-1-[...suffix].length);
    const prefix = [...characterName].slice(0,room).join('');
    const candidate = prefix+'_'+date+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return uniqueSessionName(characterName+'_'+date,session.id);
}
function startChat(characterId) {
  const c = state.characters.find(c => c.id === characterId);
  if (!accessible(c)) return toast('此角色已被作者調整為私密或刪除狀態，不支持開啟新對話');
  if (!requireLogin({page:'detail',id:characterId})) return;
  const sessions = Object.values(state.sessions).filter(item =>
    item.characterId === c.id && !item.archived
  ).sort((a,b) =>
    Number(hasUserMessage(b))-Number(hasUserMessage(a)) ||
    (b.messages?.at(-1)?.at || b.startedAt || 0)-(a.messages?.at(-1)?.at || a.startedAt || 0)
  );
  let s = sessions[0] || newSession(c);
  s.hidden = false;

  go({page:'conversation',id:s.id});
}

async function toggleGroupPin(groupId) {
  const uid=currentUser()?.uid;
  const client=window.mySupabase;
  if(!groupId||!uid||!client||groupPrototype.ownerUid!==uid) {
    toast('請重新登入並載入群組後，再變更置頂。');
    return;
  }
  const group=(groupPrototype.groups||[]).find(item=>item.id===groupId);
  if(!group) {
    toast('找不到此群組，請重新載入後再試。');
    return;
  }
  const previous=group.pinned===true;
  const next=!previous;
  // 先更新畫面，雲端失敗時回復；資料以 Supabase 為準，可跨裝置同步。
  group.pinned=next;
  render();
  try {
    const {data:authData,error:authError}=await client.auth.getUser();
    if(authError||authData?.user?.id!==uid||currentUser()?.uid!==uid) {
      throw new Error('登入狀態已變更，請重新登入後再試。');
    }
    const {data,error}=await client.from('chat_groups')
      .update({pinned:next})
      .eq('id',groupId).eq('owner_id',uid)
      .select('id,pinned').maybeSingle();
    if(error) throw error;
    if(!data||data.id!==groupId||data.pinned!==next) {
      throw new Error('雲端沒有確認群組置頂變更，請重新載入後再試。');
    }
    if(currentUser()?.uid!==uid) return;
    group.pinned=data.pinned;
    render();
  } catch(error) {
    if(currentUser()?.uid===uid) {
      group.pinned=previous;
      render();
      toast('群組置頂同步失敗，已還原原設定。');
    }
    console.error('群組置頂同步失敗：',error);
  }
}

function groupRenderCharacterResults() {

function groupWithTimeout(promise, milliseconds, message) {
  let timer;
  return Promise.race([
    promise,
    new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(message)),milliseconds)})
  ]).finally(()=>clearTimeout(timer));
}
function groupFriendlyError(error) {
  const message=String(typeof error==='string'?error:(error?.message||''));
  if(message.includes('character_not_public_and_approved') || message.includes('character_not_public_or_unavailable')) return '群組只能加入已公開且未下架的角色，請重新選擇。';
  if(message.includes('character_not_accessible')) return '有角色目前不可使用，請重新選擇已公開且未下架的角色。';
  if(message.includes('invalid_group_name')||message.includes('chat_groups_name_max_25')) return '群組名稱需為 1–25 字。';
  if(message.includes('invalid_world_background')) return '世界背景超過允許長度。';
  if(message.includes('invalid_scenes')||message.includes('invalid_scene_payload')||message.includes('invalid_scene_position')) return '場景資料不完整或角色場景指派不正確，請檢查後重試。';
  if(message.includes('group_not_found_or_not_accessible')) return '找不到群組，或目前帳號沒有存取權限。';
  if(message.includes('idempotency_key_reused_with_different_content')) return '這次送出識別碼已對應其他內容，請重新送出。';
  if(message.includes('invalid_message_content')) return '訊息需為 1–2000 字。';
  if(message.includes('authentication_required')||message.includes('JWT')||message.includes('登入狀態')) return '登入狀態已失效，請重新登入後再試。';
  return message||'操作失敗，請稍後再試。';
}
async function groupLoadList(force=false) {
  const g=groupPrototype;

  groupResetForAccount(currentUser()?.uid||null);
  if(g.loadingGroups||(!force&&g.groupsLoaded)) return;
  g.loadingGroups=true;g.loadError='';
  if(!window.mySupabase) {
    g.groupsLoaded=true;g.loadingGroups=false;g.loadError='Supabase 用戶端尚未載入。';
    refreshChatEntryList();return;
  }
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) {
      g.groupsLoaded=true;g.loadingGroups=false;g.loadError='請使用已連結 Supabase 的帳號登入，才能讀取或建立雲端群組。';
      if(route.page==='group'&&!g.active) render();

    }
    const {data,error}=await window.mySupabase.from('chat_groups')
      .select('id,name,world_background,scene_mode,created_at,updated_at,pinned')
      .is('archived_at',null).order('updated_at',{ascending:false});
    if(error) throw error;
    if(user.id!==currentUser()?.uid) { groupResetForAccount(currentUser()?.uid||null); return; }
    g.ownerUid=user.id;g.groups=data||[];g.groupPreviews={};g.groupMembers={};
    if(g.groups.length) {
      try {
        const groupIdsForMembers=g.groups.map(group=>group.id);
        const {data:memberRows,error:memberError}=await window.mySupabase.from('chat_group_members')
          .select('group_id,character_id,position,character_snapshot').in('group_id',groupIdsForMembers).order('position');
        if(memberError) throw memberError;
        const characterIds=[...new Set((memberRows||[]).map(row=>row.character_id).filter(isUuid))];
        let avatars={};
        if(characterIds.length) {
          const {data:characterRows,error:avatarError}=await window.mySupabase.from('characters')
            .select('id,avatar_url').in('id',characterIds);
          if(avatarError) console.warn('讀取群組列表角色頭像失敗：',avatarError.message);
          else avatars=Object.fromEntries((characterRows||[]).map(row=>[row.id,row.avatar_url||'']));
        }
        for(const row of memberRows||[]) {
          (g.groupMembers[row.group_id] ||= []).push({
            name:row.character_snapshot?.name||'角色',
            avatar_url:avatars[row.character_id]||row.character_snapshot?.avatar_url||'',
            character_snapshot:row.character_snapshot||{}
          });
        }
      } catch(memberLoadError) {
        console.warn('讀取群組列表成員頭像失敗：',memberLoadError.message);
      }
      const groupIds=g.groups.map(group=>group.id);

      // unbounded all-history read and to keep concurrent requests modest.
      for(let i=0;i<groupIds.length;i+=10) {
        const batchIds=groupIds.slice(i,i+10);
        const previews=await Promise.all(batchIds.map(async groupId=>{
          const {data:message,error:messageError}=await window.mySupabase.from('chat_group_messages')
            .select('group_id,content,speaker_type,created_at,sequence_no')
            .eq('group_id',groupId).order('created_at',{ascending:false})
            .order('sequence_no',{ascending:false}).limit(1).maybeSingle();
          if(messageError) throw messageError;
          return [groupId,message||null];
        }));
        for(const [groupId,message] of previews) {
          if(message) g.groupPreviews[groupId]=message;
        }
      }
    }
    if(user.id!==currentUser()?.uid) { groupResetForAccount(currentUser()?.uid||null); return; }
    g.groupsLoaded=true;g.loadingGroups=false;g.loadError='';
  } catch(error) {
    g.groupsLoaded=true;g.loadingGroups=false;g.loadError=groupFriendlyError(error)||'讀取群組清單失敗。';
  }

let groupBackgroundTimer=null;
function applyGroupChatBackground() {

  if(!group||!panel||route.page!=='group')return;

  const mode=group.backgroundMode||'avatar';
  if(mode==='none'){panel.style.setProperty('--chat-photo','none');return;}
  if(mode==='memory'){
    const photo=(group.memoryPhotos||[]).find(p=>p.id===group.backgroundMemoryPhotoId);
    const url=safeURL(photo?.image_url);
    panel.style.setProperty('--chat-photo',url?'url('+JSON.stringify(url)+')':'none');return;
  }
  const members=group.members||[];let index=0;
  const setAvatar=()=>{if(!members.length){panel.style.setProperty('--chat-photo','none');return;}const member=members[index%members.length];const url=safeURL(member?.avatar_url||member?.character_snapshot?.avatar_url||member?.character_snapshot?.image||member?.image||member?.avatar);panel.style.setProperty('--chat-photo',url?'url('+JSON.stringify(url)+')':'none');index=(index+1)%members.length;};
  setAvatar();if(members.length>1)groupBackgroundTimer=setInterval(setAvatar,8000);
}

function groupReadStep() {
  const g=groupPrototype;
  if(g.step===1) {
    const availableIds=new Set(groupAvailableCharacters().map(c=>c.id));
    g.draft.memberIds=[...new Set(g.draft.memberIds.filter(id=>availableIds.has(id)))];
    const members=groupSelectedCharacters();
    if(members.length<1||members.length>3) return '請選擇 1–3 位已公開且未下架的角色。';
    if(members.length!==g.draft.memberIds.length) return '角色清單已變更，請重新選擇角色。';
    if(!g.draft.name) g.draft.name=members.map(c=>c.name).join('、').slice(0,25);
    if(!g.draft.playerName) g.draft.playerName=state.account?.nickname||'玩家';
    if(!g.draft.playerPersona) g.draft.playerPersona=state.account?.bio||'';
    if(!g.draft.worldCharacterId||!members.some(c=>c.id===g.draft.worldCharacterId)) g.draft.worldCharacterId=members[0].id;
  } else if(g.step===2) {
    const members=groupSelectedCharacters();
    g.draft.name=$('groupNameInput')?.value.trim()||'';
    g.draft.playerName=$('groupPlayerName')?.value.trim()||'';
    g.draft.playerPersona=$('groupPlayerPersona')?.value||'';
    g.draft.worldCharacterId=$('view').querySelector('input[name="groupWorldCharacter"]:checked')?.value||members[0]?.id||'';
    const worldCharacter=members.find(c=>c.id===g.draft.worldCharacterId);
    g.draft.world=String(worldCharacter?.worldBackground||worldCharacter?.world||worldCharacter?.intro||'').slice(0,10000);
    g.draft.scenes=[{name:$('groupSceneName0')?.value.trim()||'',description:$('groupSceneDesc0')?.value||''}];
    if(!g.draft.name||g.draft.name.length>25) return '群組名稱需為 1–25 字。';
    if(!g.draft.playerName||g.draft.playerName.length>80) return '請填寫 1–80 字的玩家角色名稱。';
    if(g.draft.playerPersona.length>3000) return '玩家人設不可超過 3000 字。';
    if(!worldCharacter) return '請選擇一位角色作為整體世界觀背景。';
    if(g.draft.scenes[0].name.length>80||g.draft.scenes[0].description.length>1000) return '初始場景名稱最多 80 字，開場內容最多 1000 字。';
  }
  return '';
}
async function groupNext() {

async function groupCreateMock() {
  const g=groupPrototype;

  if(err) {g.formError=err;render();return;}

  g.loading=true;g.formError='';render();
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) throw new Error('請使用已連結 Supabase 的帳號登入，才能建立雲端群組。');
    g.ownerUid=user.id;

    const scenes=[{name:g.draft.scenes[0].name.trim(),description:g.draft.scenes[0].description||''}];
    const pMembers=members.map(m=>({character_id:m.id,scene_position:1}));
    const {data:groupId,error}=await groupWithTimeout(window.mySupabase.rpc('create_chat_group',{
      p_name:g.draft.name.trim(),p_world_background:g.draft.world,p_scene_mode:'shared',p_scenes:scenes,p_members:pMembers
    }),15000,'建立群組逾時，請重新載入群組清單確認是否已建立，避免重複建立。');
    if(error) throw error;
    const {data:updated,error:updateError}=await window.mySupabase.from('chat_groups')
      .update({player_name:g.draft.playerName,player_persona:g.draft.playerPersona,world_character_id:g.draft.worldCharacterId,updated_at:new Date().toISOString()})
      .eq('id',groupId).eq('owner_id',user.id).select('id').maybeSingle();
    if(updateError||!updated) throw new Error('群組已建立，但玩家人設與世界觀選擇未能保存。請重新開啟群組並確認資料。');
    g.loading=false;

    g.loading=false;g.formError=groupFriendlyError(error)||'建立群組失敗。';render();
  }

async function groupSendMock() {

  if(platformCommand.type==='platform') {
    if(platformCommand.name==='help') toast('群組語法：@角色 指定 AI 回覆；:人名:內容 指定玩家發言顯示；/help 查看平台指令。AI 尚未串接，指定角色目前只做語法驗證。');
    else toast('尚未支援平台指令 /'+platformCommand.name+'；本次沒有保存訊息。');
    return;
  }
  const mention=parseMentionTarget(content,(g.active?.members||[]).map(member=>({id:member.characterId||member.id,name:member.name})));
  if(mention.mentioned&&!mention.valid) {g.formError=mention.reason+'，本次沒有保存訊息。';render();return;}

  g.sending=true;g.formError='';render();
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) throw new Error('登入狀態已失效，請重新登入。');
    if(!g.pendingRequest || g.pendingRequest.groupId!==g.active.id || g.pendingRequest.content!==content) {
      g.pendingRequest={groupId:g.active.id,content,requestKey:window.crypto.randomUUID()};
    }
    const {error}=await groupWithTimeout(window.mySupabase.rpc('append_chat_group_mock_turn',{
      p_group_id:g.active.id,p_request_key:g.pendingRequest.requestKey,p_content:content
    }),15000,'訊息保存逾時。請重新開啟群組確認訊息是否已保存，再決定是否重試。');
    if(error) throw error;

    g.sending=false;
    await groupOpen(g.active.id);
  } catch(error) {
    g.sending=false;g.formError=groupFriendlyError(error)||'訊息保存失敗，請重試。';render();
  }

function formatMessage(text) {
  // PersonaX roleplay action syntax is single-asterisk only: *action*.
  // Double-asterisk text is ordinary literal content, not an action marker.
  return String(text).split(/(\*\*[\s\S]*?\*\*|\*(?!\*)[^*\n]+\*(?!\*))/g).filter(Boolean).map(part => {
    if (part.startsWith('*') && !part.startsWith('**') && part.endsWith('*') && !part.endsWith('**')) {
      return `<em class="narration">${e(part.slice(1,-1))}</em>`;
    }
    return part.trim() ? `<div class="bubble">${e(part.trim())}</div>` : '';
  }).join('');
}
// Roleplay speaker prefix display. The message author remains the authenticated player.
function parseRoleplaySegments(raw, roles = []) {
  const text = String(raw ?? '');
  const lines = text.split('\n');
  const segments = [];
  let current = null;
  let foundPrefix = false;
  const flush = () => {
    if (current && current.text.length) segments.push(current);
    current = null;
  };
  for (const line of lines) {
    // Accept both “：夜辰：內容” and “夜辰：內容”.
    // Without a leading colon, only treat an exact known character name as a speaker.
    const match = line.match(/^\s*([：:]?)([^:：\n]{1,40})[:：]\s?(.*)$/u);
    const speakerName = match?.[2]?.trim() || '';
    const exact = match ? roles.filter(role => String(role.name || '').trim() === speakerName) : [];
    const knownRole = exact.length === 1 ? exact[0] : null;
    const isExplicitPrefix = Boolean(match && match[1]);
    // Some group replies prepend narration before a role label, e.g.
    // “聽見你的話，寒川（1016測試）回應：實際台詞”.
    // Strip only when a known member name is followed by a recognized response marker.
    const embeddedResponse = roles.map(role => {
      const name = String(role.name || '').trim();
      if (!name) return null;
      const nameIndex = line.indexOf(name);
      if (nameIndex < 0) return null;
      const tail = line.slice(nameIndex + name.length);
      const response = tail.match(/^[^:：\n]{0,40}?(?:回應|回答|說|表示)[:：]\s*(.*)$/u);
      return response ? {role, text:response[1] || ''} : null;
    }).filter(Boolean);
    const embedded = embeddedResponse.length === 1 ? embeddedResponse[0] : null;
    // In a single-character chat, an explicitly marked speaker still belongs
    // to the active character even if the prompt uses an alias/role label.
    const role = knownRole || (isExplicitPrefix && roles.length === 1 ? roles[0] : null);
    if (embedded) {
      foundPrefix = true;
      flush();
      current = {
        kind:'character',
        speakerName:String(embedded.role.name || '').trim(),
        characterId:embedded.role.id || null,
        avatar:embedded.role.image || embedded.role.avatar_url || '',
        text:embedded.text
      };
    } else if (match && (knownRole || isExplicitPrefix)) {
      foundPrefix = true;
      flush();
      current = {
        kind: role ? 'character' : 'temporary',
        speakerName: knownRole?.name || speakerName,
        characterId: role?.id || null,
        avatar: role?.image || role?.avatar_url || '',
        text: match[3] || ''
      };
    } else if (current) {
      current.text += (current.text ? '\n' : '') + line;
    } else {
      current = {kind:'user',speakerName:'',characterId:null,avatar:'',text:line};
    }
  }
  flush();
  if (!foundPrefix) return [{kind:'user',speakerName:'',characterId:null,avatar:'',text}];
  return segments.filter(segment => segment.text.trim() || segment.speakerName);
}
function roleplaySegmentHTML(segment) {
  const name = segment.kind === 'user' ? (currentUser()?.nickname || '你') : segment.speakerName;
  const avatarHTML = segment.kind === 'character' && segment.avatar
    ? '<img class="avatar" src="' + e(safeImage(segment.avatar)) + '" alt="">'
    : '<span class="avatar avatar-fallback">' + e(segment.kind === 'user' ? '你' : [...String(name || '?')][0] || '?') + '</span>';
  const typeClass = segment.kind === 'user' ? 'is-user' : segment.kind === 'character' ? 'is-character' : 'is-temporary';
  return '<div class="roleplay-segment ' + typeClass + '"><div class="roleplay-segment-heading">' + avatarHTML + '<span>' + e(name) + '</span></div>' + formatMessage(segment.text) + '</div>';

// Chat syntax helpers are UI validation only; they do not invoke or route an AI model.
function parseMentionTarget(raw, roles = []) {
  const match = String(raw || '').match(/^@(.+?)(?:\s+|$)/u);
  if (!match) return {mentioned:false};
  const name = match[1].trim();
  const matches = roles.filter(role => String(role.name || '').trim() === name);
  if (matches.length === 1) return {mentioned:true,valid:true,name,characterId:matches[0].id || matches[0].characterId || null};
  return {mentioned:true,valid:false,name,reason:matches.length ? '同名角色無法唯一判定' : '找不到這位群組角色'};
}
function parsePlatformCommand(raw) {
  const match = String(raw || '').trim().match(/^\/([a-zA-Z][\w-]*)(?:\s+([\s\S]*))?$/u);
  return match ? {type:'platform',name:match[1].toLowerCase(),args:match[2] || ''} : {type:'none'};
}
function renderMessages(scroll = true) {
  if (!$('messages')) return;
  const s = currentSession();
  const c = sessionCharacter(s);
  if (!s || !c) return;
  const oldScroll = $('messages').scrollTop;
  $('messages').innerHTML = s.messages.map(m => {
    const user = m.role === 'user';
    const roles = [{id:c.id,name:c.name,image:c.image || c.avatar_url}];
    // Role prefixes can appear in AI replies as well as player-authored text.
    // Previously only user messages were parsed, so an AI reply like “夜辰：...” never got its role avatar.
    const displayText = replaceRoleplayVariables(m.text, currentUser()?.nickname || '你', c.name);
    const segments = user && Array.isArray(m.displaySegments)
      ? m.displaySegments.map(segment => ({
          ...segment,
          avatar:segment.avatar || roles.find(role => role.id === segment.characterId)?.image || ''
        }))
      : parseRoleplaySegments(displayText, roles);
    const hasSpeaker = segments.some(segment => segment.kind !== 'user');
    const contentHTML = hasSpeaker
      ? '<div class="roleplay-segments">' + segments.map(roleplaySegmentHTML).join('') + '</div>'
      : '<div class="message-name">' + e(user ? (currentUser()?.nickname || '你') : c.name) + '</div>' + formatMessage(displayText);
    const outerAvatar = user
      ? avatar(currentUser())
      : (hasSpeaker ? '' : `<img class="avatar" src="${e(safeImage(c.image || c.avatar_url))}" alt="">`);
    return `<article class="message ${user ? 'user' : ''} ${hasSpeaker && !user ? 'roleplay-prefixed-message' : ''}" data-message="${e(m.id)}">
      ${outerAvatar}
      <div class="message-content">${contentHTML}</div>
      <button class="message-more" data-action="message-menu" data-id="${e(m.id)}" aria-label="訊息操作">⋯</button>
    </article>`;
  }).join('');

}
function memorySize(list) {
  return list.reduce((total,m) => total+countChars(m.text),0);
}
function addMemory(s,text) {
  const item = {id:id(),text,important:false,at:Date.now()};
  const next = [...s.memories,item];
  while (memorySize(next)>3000) {
    const i = next.findIndex(m => !m.important);
    if (i<0 || next[i].id === item.id) {
      toast('重大記憶占滿容量，本次無法新增日記。');
      return;
    }
    next.splice(i,1);
  }
  s.memories = next;
}

function renderDailyCheckinMarkup(status) {
  const day = Math.max(1, Math.min(7, Number(status.cycle_day) || 1));
  const claimed = status.claimed_today === true;
  const reward = Math.max(1, Number(status.reward) || 10);
  const enabled = status.enabled !== false;
  const doneCount = claimed ? day : day - 1;
  const days = Array.from({length:7},(_,i)=>{
    const completed = i < doneCount;
    const todayDone = claimed && i === day - 1;
    const active = !claimed && i === day - 1;
    const style = completed || todayDone
      ? 'border:1px solid #54b58b80;background:#54b58b18;color:#73d3a5'
      : active ? 'border:1px solid #c4a36a;background:#c4a36a18;color:var(--text)'
      : 'border:1px solid var(--border);background:transparent;color:var(--muted)';
    return '<div style="min-width:0;min-height:52px;box-sizing:border-box;text-align:center;padding:8px 1px;border-radius:10px;'+style+'"><div style="font-size:11px">第'+(i+1)+'天</div><div style="font-size:13px;font-weight:700;margin-top:3px">'+(completed || todayDone ? '✓' : '+'+reward)+'</div></div>';
  }).join('');
  const buttonLabel = !enabled ? '簽到暫停中' : claimed ? '今日已簽到' : '簽到領取 +' + reward + ' 銀幣';
  return '<div class="row between" style="align-items:center;gap:8px"><h2 style="margin:0">每日簽到</h2><span class="small muted" style="white-space:nowrap">第 '+day+'/7 天</span></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">'+days+'</div><button data-action="daily-checkin" '+(!enabled || claimed ? 'disabled aria-disabled="true"' : 'class="primary"')+' style="width:100%;min-height:44px">'+buttonLabel+'</button><p class="small muted" style="margin:0">每日於台灣時間 00:00 更新簽到日。</p>';
}
function scheduleDailyCheckinMidnightRefresh() {
  if (window.dailyCheckinMidnightTimer) clearTimeout(window.dailyCheckinMidnightTimer);
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const part = Object.fromEntries(parts.map(p => [p.type,p.value]));
    const nextTaipeiMidnight = Date.UTC(Number(part.year), Number(part.month)-1, Number(part.day)+1) - 8*60*60*1000;
    const delay = Math.max(1000, nextTaipeiMidnight - Date.now() + 1200);
    window.dailyCheckinMidnightTimer = setTimeout(() => { void refreshDailyCheckinCard(); }, delay);
  } catch (error) { console.warn('無法排定台灣時間簽到更新：', error); }
}
async function refreshDailyCheckinCard() {
  scheduleDailyCheckinMidnightRefresh();
  if (window.dailyCheckinStatusPromise) return window.dailyCheckinStatusPromise;
  window.dailyCheckinStatusPromise = (async () => {
    const card = $('daily-checkin-card');
    if (!card) return;
    const uid = state.account?.uid;
    if (!window.mySupabase || !uid || uid === 'demo-local-account') {
      card.innerHTML = '<div class="row between"><h2 style="margin:0">每日簽到</h2><span class="small muted">7 天循環</span></div><p class="small muted" style="margin:0">雲端簽到尚未連線，請使用已登入的測試帳號。</p>';
      return;
    }
    if (state.account?.accountDeletionPending) {
      card.innerHTML = '<h2 style="margin:0">每日簽到</h2><p class="small muted" style="margin:0">帳號刪除申請處理期間無法簽到。</p>';
      return;
    }
    const {data,error}=await window.mySupabase.rpc('get_daily_checkin_status');
    if (error) {
      console.error('每日簽到狀態讀取失敗：',error);
      // Keep the last successfully rendered status in place; do not flash back to a loading skeleton.
      if (!(window.dailyCheckinStatusCache?.uid === uid && window.dailyCheckinStatusCache?.data)) {
        card.innerHTML = '<h2 style="margin:0">每日簽到</h2><p class="small muted" style="margin:0">簽到狀態暫時無法讀取，請稍後重新整理。</p>';
      }
      return;
    }
    if (state.account?.uid !== uid) return;
    window.dailyCheckinStatusCache = {uid,data:data || {}};
    const currentCard = $('daily-checkin-card');
    if (currentCard) currentCard.innerHTML=renderDailyCheckinMarkup(data || {});
  })().finally(() => { window.dailyCheckinStatusPromise = null; });
  return window.dailyCheckinStatusPromise;
}

/* Cloud wallet ledger: read the authoritative transaction journal from Supabase. */
async function loadWalletLedger(currency) {
  walletLedgerLoadError = '';
  const uid = state.account?.uid;
  const client = window.mySupabase;
  if (!uid || !client) return false;

  const { data, error } = await client
    .from('wallet_transactions')
    .select('id, currency_type, amount, biz_type, reference_id, created_at')
    .eq('user_id', uid)
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) {
    console.error('讀取錢包花費日誌失敗：', error);
    walletLedgerLoadError = currency;
    toast('花費日誌讀取失敗，請稍後再試。');
    return false;
  }

  // Resolve a chat charge/refund to the character through the secure, user-scoped RPC.
  const { data: roleNameRows, error: roleNameError } = await client.rpc('get_my_wallet_transaction_character_names');
  if (roleNameError) console.warn('讀取交易對應角色名稱失敗：', roleNameError.message);
  const roleNames = new Map((roleNameRows || []).map(item => [item.reference_id, item.character_name]));

  const selectedType = currency === 'silver' ? 'silver_coins' : 'diamonds';
  let runningBalance = Number(currency === 'silver'
    ? state.account.silver : state.account.diamonds) || 0;
  const rows = (data || []).filter(row => row.currency_type === selectedType);
  const mappedNewestFirst = rows.map(row => {
    const amount = Number(row.amount) || 0;
    const entry = {
      id: row.id,
      currency: row.currency_type === 'silver_coins' ? 'silver' : 'diamond',
      change: amount,
      reason: (() => {
        const baseReason = ({
          signup_bonus: '註冊贈送',
          chat_turn_charge: '聊天回覆扣款',
          chat_turn_refund: '聊天失敗退款',
          daily_checkin: '每日簽到',
          reward_ad: '觀看獎勵廣告',
          purchase: '購買',
          test_purchase_200: '測試領取 200 鑽石',
          admin_adjustment: '餘額調整'
        })[row.biz_type] || row.biz_type || '錢包交易';
        const characterName = roleNames.get(row.reference_id);
        return characterName && ['chat_turn_charge', 'chat_turn_refund'].includes(row.biz_type)
          ? baseReason + ' · ' + characterName
          : baseReason;
      })(),
      at: Date.parse(row.created_at) || Date.now(),
      balance: runningBalance,
      referenceId: row.reference_id || null
    };
    runningBalance -= amount;
    return entry;
  });
  state.ledger = [
    ...state.ledger.filter(entry => entry.currency !== (currency === 'silver' ? 'silver' : 'diamond')),
    ...mappedNewestFirst.reverse()
  ];
  return true;
}

function renderArchives(sessionId) {
  const s = (sessionId && state.sessions[sessionId]) || currentSession();
  if (!s) return;
  const list = Object.values(state.sessions).filter(item =>
    item.characterId === s.characterId && item.archived
  ).sort((a,b) => (b.archivedAt || 0)-(a.archivedAt || 0));
  showDialog('舊的回憶',`
    ${list.map(item => `<article class="archive-card">
      <strong>${e(item.name)}</strong>
      <p class="small muted" style="margin:8px 0">
        ${e(timeText(item.archivedAt || item.startedAt))}<br>
        玩家訊息 ${item.messages.filter(message => message.role === 'user' && String(message.text || '').trim()).length} 筆 · 日記 ${item.memories.length} 筆 · 相片 ${item.album.length} 張

      </div>

function renderArchive(sessionId,tab) {
  const item = state.sessions[sessionId];
  if (!item) return;
  let content;
  if (tab === 'messages') {
    content = item.messages.map(m => `<article style="margin-bottom:18px">
      <strong>${m.role === 'user' ? '你' : '角色'}</strong>${formatMessage(m.text)}
    </article>`).join('');
  } else if (tab === 'memories') {
    content = item.memories.map(m =>
      `<article class="memory-item">${m.important ? '♥ 重大記憶' : ''}
        <p class="prose">${e(m.text)}</p></article>`).join('');
  } else {
    content = item.album.filter(p => safeImage(p.url)).map(p =>
      `<article class="memory-item"><img src="${e(safeImage(p.url))}" alt="回憶快照">
        <p class="small muted">${e(timeText(p.at))}</p></article>`).join('');
  }
  showDialog(item.name || '舊的回憶',`
    <div class="tabs" style="margin-bottom:15px">
      ${[['messages','對話'],['memories','甜蜜日記'],['album','回憶相簿']].map(([key,label]) =>
        `<button class="tab ${tab === key ? 'active' : ''}" data-action="archive-tab"
          data-id="${e(sessionId)}" data-value="${key}">${label}</button>`).join('')}
    </div>
    <div style="max-height:55dvh;overflow-y:auto">${content || '<div class="empty">沒有資料。</div>'}</div>
    <div class="row wrap" style="margin-top:15px">
      <button data-action="archives">返回回憶列表</button>
      <button class="primary" data-action="resume-archive" data-id="${e(sessionId)}">繼續聊天</button>
    </div>`);
}

/* GROUP-01-OPEN: capture group-open clicks before other delegated handlers.
   This makes group navigation independent of nested list markup or another handler
   stopping propagation. The normal bubble handler is skipped to prevent double-open. */
document.addEventListener('click', event => {
  const target = event.target instanceof Element
    ? event.target.closest('[data-action="group-open"]')
    : null;
  if (!target || target.disabled) return;
  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  const groupId = target.dataset.id;
  if (!groupId) {
    toast('這個群組缺少識別碼，請重新載入群組清單。');
    return;
  }
  void groupOpen(groupId);
}, true);

      case 'copy-message': {
        const m=s?.messages.find(m=>m.id===key);

          await navigator.clipboard.writeText(m.text);
          toast('已複製訊息。');

          showDialog('複製訊息',`<textarea readonly>${e(m.text)}</textarea>`);

      }
      case 'delete-message': {
        const message = s?.messages.find(m=>m.id===key);
        if (!s || !message || !confirm('確定刪除此訊息？此操作無法復原。')) break;
        // 雲端聊天先將訊息標記為軟刪除，確認成功後才移除本機副本，
        // 避免重新載入時該訊息又從 chat_messages 出現。
        if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid && window.mySupabase && isUuid(message.id)) {
          const deletedAt = new Date().toISOString();
          const { data, error } = await window.mySupabase.from('chat_messages')
            .update({deleted_at:deletedAt})
            .eq('id',message.id).eq('session_id',s.id).is('deleted_at',null)
            .select('id').maybeSingle();
          if (error) throw new Error('訊息刪除同步失敗：' + error.message);
          if (!data) throw new Error('雲端未確認這則訊息的刪除狀態；訊息仍保留，請重新整理後再試。');
        }
        s.messages=s.messages.filter(m=>m.id!==key);
        if (!persist()) {
          s.messages.push(message);
          s.messages.sort((a,b)=>(Number(a.at)||0)-(Number(b.at)||0));
          // 若本機保存失敗，嘗試撤回剛才的雲端軟刪除，避免兩端狀態不一致。
          if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid && window.mySupabase && isUuid(message.id)) {
            const { error: rollbackError } = await window.mySupabase.from('chat_messages')
              .update({deleted_at:null})
              .eq('id',message.id).eq('session_id',s.id).eq('deleted_at',deletedAt);
            if (rollbackError) console.error('訊息刪除回復同步失敗：',rollbackError.message);
          }
          break;
        }
        closeModal();
        renderMessages();
        break;
      }
      case 'photo':openModal('photo',{id:key});break;
      case 'test-chat-memory':
      case 'test-chat-photo':
      case 'clear-chat-test-data': {

            currentUser()?.uid !== s.cloudOwnerUid || !hasUserMessage(s)) {
          return toast('測試工具只適用於已同步且由目前帳號擁有的聊天。');
        }
        const previousMemories=clone(s.memories);
        const previousAlbum=clone(s.album);
        if (action === 'test-chat-memory') {
          const text='[測試資料] PersonaX 回憶同步測試：新增、重新載入與跨裝置保存。';
          if (memorySize(s.memories)+countChars(text)>3000) {
            return toast('回憶容量不足，請先清除部分測試回憶。');
          }
          s.memories.push({id:id(),text,important:false,at:Date.now(),testData:true});
        } else if (action === 'test-chat-photo') {
          const character=sessionCharacter(s);
          const url=safeImage(character?.image);
          if (!url) return toast('目前角色沒有可用的安全圖片網址，無法建立相簿測試項目。');
          s.album.push({id:id(),url,at:Date.now(),testData:true});
        } else {
          s.memories=s.memories.filter(item=>!item.testData);
          s.album=s.album.filter(item=>!item.testData);
        }
        if (!persist()) {
          s.memories=previousMemories;s.album=previousAlbum;
          return;
        }
        const synced=await saveChatSessionSafely(s);
        if (!synced) {
          s.memories=previousMemories;s.album=previousAlbum;
          persist();render();
          toast('測試資料同步失敗，已還原本機內容。');
          break;
        }
        render();
        toast(action==='clear-chat-test-data' ? '測試資料已清除並同步。' :
          '測試資料已寫入雲端；可重新整理後確認是否仍存在。');
        break;
      }
      case 'fullscreen':

      case 'daily-checkin': {

          console.error('每日簽到失敗：',error);
          toast(error.message?.includes('account deletion pending') ? '帳號刪除申請處理期間無法簽到。' : '簽到失敗，請稍後再試。');
          break;
        }
        const result=Array.isArray(data)?data[0]:data;
        if (!result) {
          toast('簽到結果讀取失敗，請稍後再試。');
          break;
        }
        state.account.silver=Number(result.silver_balance ?? state.account.silver ?? 0);
        await loadWalletLedger('silver');
        persist();
        render();
        toast(result.granted ? '簽到成功，獲得 '+Number(result.reward)+' 銀幣！' : '今天已經簽到過了，銀幣不會重複發放。');
        break;
      }
      case 'edit-profile':profileImage=currentUser()?.avatar || '';openModal('edit-profile');break;
      case 'shop':openModal('shop',{tab:'monthly'});break;
      case 'shop-tab':openModal('shop',{tab:button.dataset.value});break;
      case 'ledger': {
        await loadWalletLedger('diamond');
        openModal('ledger',{currency:'diamond'});
        break;
      }
      case 'ledger-tab': {

        openModal('ledger',{currency,kind:route.overlay?.kind || 'all'});
        break;
      }
      case 'ledger-filter': {

        openModal('ledger',{currency:route.overlay?.currency || 'diamond',kind});
        break;
      }
      case 'personas': {
        if (state.account?.uid && window.mySupabase) {
          try {
            const {data,error}=await window.mySupabase.rpc('get_my_private_profile_data');
            if(error) throw error;
            if(!data) throw new Error('找不到雲端人設資料。');
            state.account.personas=Array.isArray(data.persona_presets)?data.persona_presets:[];
            persist();
          } catch(error) { toast('讀取雲端人設失敗：'+(error.message||'請稍後再試。')); break; }
        }
        openModal('personas');break;
      }
      case 'theme-setting':openModal('theme-setting');break;
      case 'birthdate':openModal('birthdate');break;
      case 'persona-edit':openModal('personas',{editId:key});break;
      case 'persona-choose':openModal('persona-picker');break;
      case 'persona-select': {
        const selected=(Array.isArray(currentUser()?.personas)?currentUser().personas:[]).find(item=>item.id===key);
        if(!selected) { toast('找不到這組人設，請重新整理。'); break; }
        openModal('persona',{draftPersona:selected.text,selectedPersonaName:selected.name});
        break;
      }
      case 'persona-delete': {
        const list=Array.isArray(state.account?.personas) ? state.account.personas : [];
        const index=list.findIndex(item=>item.id===key);
        if(index<0 || !confirm('確定刪除此組人設？')) break;
        const previous=clone(list);list.splice(index,1);if(!list.some(item=>item.isDefault)&&list.length)list[0].isDefault=true;state.account.personas=list;persist();try { if(!window.mySupabase?.auth)throw new Error('請先登入。');const {data,error}=await window.mySupabase.auth.getUser();if(error||data?.user?.id!==state.account?.uid)throw new Error('登入狀態驗證失敗，請重新登入。');await savePersonaPresets(state.account);route.overlay={name:'personas'};render();toast('儲存成功');}catch(error){state.account.personas=previous;persist();openModal('personas');toast('人設刪除未能同步：'+(error.message||'請稍後再試。'));}break;
      }

      case 'ledger-retry': {
        const currency = button.dataset.value === 'silver' ? 'silver' : 'diamond';
        await loadWalletLedger(currency);
        openModal('ledger',{currency});
        break;
      }
      case 'purchases':openModal('purchases');break;
      case 'delete-account':openModal('delete-account');break;
      case 'bug':openModal('bug');break;
      case 'read-all':
        state.notifications.forEach(n=>n.read=true);persist();render();break;
      case 'read-notice': {
        const n=state.notifications.find(n=>n.id===key);
        if (n) n.read=true;
        persist();render();break;
      }
      case 'notice-tab':
        go({page:'notifications',unread:button.dataset.value==='unread'},true);break;
      case 'reply': {
        const c=(state.comments[route.id] || []).find(c=>c.id===key);
        if (!c || c.deleted) break;
        replyId=key;
        $('replyHint').innerHTML=`回覆 @${e(author(c.authorId).nickname)}
          <button data-action="cancel-reply">取消</button>`;
        $('view').querySelector('form[data-form="comment"] textarea').focus();
        break;
      }
      case 'cancel-reply':replyId=null;$('replyHint').textContent='';break;
      case 'comment-like': {
        if (!requireLogin({page:'detail',id:route.id})) break;
        const c=(state.comments[route.id]||[]).find(c=>c.id===key);
        if(!c||c.deleted)break;
        if(!c.cloud||!window.mySupabase)return toast('此評論尚未同步到雲端。');
        const uid=currentUser().uid;
        const {data:existing,error:findError}=await window.mySupabase.from('character_comment_likes').select('comment_id').eq('comment_id',c.id).eq('user_id',uid).maybeSingle();
        if(findError)throw findError;
        const result=existing
          ?await window.mySupabase.from('character_comment_likes').delete().eq('comment_id',c.id).eq('user_id',uid)
          :await window.mySupabase.from('character_comment_likes').insert({comment_id:c.id,user_id:uid});
        if(result.error)throw new Error('評論愛心更新失敗：'+result.error.message);
        await loadCloudComments(route.id);break;
      }
      case 'comment-menu':openModal('comment-menu',{id:key});break;
      case 'edit-comment':openModal('edit-comment',{id:key});break;
      case 'delete-comment': {
        const c=(state.comments[route.id] || []).find(c=>c.id===key);
        if (!c || c.authorId!==currentUser()?.uid || !confirm('確定刪除此評論？')) break;
        if (c.cloud && window.mySupabase) {
          const {error}=await window.mySupabase.from('character_comments').update({is_deleted:true,updated_at:new Date().toISOString()}).eq('id',c.id).eq('author_id',currentUser().uid);
          if(error)throw new Error('評論刪除失敗：'+error.message);
          await loadCloudComments(route.id);closeModal();break;
        }
        c.deleted=true;c.text='';c.likes=[];
        persist();closeModal();break;
      }
      case 'translation':openModal('translation');break;
      case 'report':
        if (!requireLogin({page:route.page,id:route.id})) break;
        openModal('report',{id:key,kind:button.dataset.kind});break;
      case 'share': {
        const kind=button.dataset.kind;
        if (kind==='detail') {
          const c=state.characters.find(c=>c.id===key);
          if (c?.visibility!=='public') return toast('私密角色不能公開分享。');
        }
        const url=routeURL({page:kind,id:key}).href;
        if (navigator.share) await navigator.share({title:'PersonaX',url});
        else if (navigator.clipboard && isSecureContext) {
          await navigator.clipboard.writeText(url);
          toast('分享網址已複製。本機角色尚未支援跨裝置讀取。');
        } else {
          showDialog('分享網址',`<input readonly value="${e(url)}">`);
          $('modal').querySelector('input').select();
        }
        break;
      }
    }
  } catch(error) {
    if (error.name !== 'AbortError') toast(error.message || '操作未完成。');
  }
});

/* Form submissions */
document.addEventListener('submit',async event => {
  const form=event.target.closest('[data-form]');
  if (!form) return;
  event.preventDefault();
  if (form.dataset.form === 'character' && isCompressingCharacterImage) {
    toast('角色圖片仍在壓縮，請稍候完成後再儲存。');
    return;
  }
  if (form.dataset.submitting === 'true') return;
  form.dataset.submitting = 'true';
  const submitButton = event.submitter || form.querySelector('button[type="submit"], button:not([type])');
  const originalButtonText = submitButton?.textContent || '';
  if (submitButton) { submitButton.disabled = true; submitButton.textContent = '儲存中…'; }
  const f=new FormData(form);
  if (event.submitter?.name) f.set(event.submitter.name, event.submitter.value);
  const type=form.dataset.form;
  const o=route.overlay || {};
  const s=currentSession();
  const text=String(f.get('text') || '').trim();

  try {
    switch(type) {
      case 'character': {
        const user = currentUser();
        if (!user?.uid || !window.mySupabase) {
          return toast('請先使用 Google 帳號登入，角色才會保存到雲端。');
        }
        const name=String(f.get('name')).trim();
        if (!validName(name)) return toast('角色名字不符合規則。'+NAME_HELP);
        if (!draftImage) return toast('請上傳角色頭像。');
        const intro=String(f.get('intro')).trim();
        const opening=String(f.get('opening')).trim();
        if (!intro || !opening) return toast('介紹與開場白不能留空。');
        const old=state.characters.find(c=>c.id===route.id);
        if (old && !owned(old)) return;
        const c={
          id:old?.id || id(),name,
          gender:String(f.get('gender')),age:String(f.get('age')).trim(),
          race:String(f.get('race')).trim(),intro,opening,
          privateInfo:String(f.get('privateInfo')).trim(),
          style:String(f.get('style')).trim(),
          visibility:String(f.get('visibility')),image:draftImage,
          rightsConfirmed:f.get('rightsConfirmed') === 'on',
          tags:[...draftTags],authorId:user.uid,owner:true,
          chats:old?.chats || '0',users:old?.users ?? null,
          createdAt:old?.createdAt || Date.now()
        };

        // 先寫入雲端；只有角色資料成功後才更新本機畫面狀態。
        const saveResult = await saveSupabaseCharacter(c, user.uid);
        clearEditorDraft();
        if (old) state.characters[state.characters.indexOf(old)]=c;
        else state.characters.unshift(c);
        persist();
        go({page:'create'});
        if (saveResult.storyError) toast(saveResult.storyError);
        else toast('角色與開場故事已儲存到雲端。');
        break;
      }
      case 'ai': {
        const name=String(f.get('name')).trim();
        const outline=String(f.get('outline')).trim();
        if (!validName(name)) return toast('角色名稱不符合規則。'+NAME_HELP);
        if (!outline) return toast('請輸入故事大綱。');
        if (!confirm('AI尚未串接，這次只建立可編輯草稿，不生成圖片、不扣鑽石。繼續嗎？')) return;
        state.characters.unshift({
          id:id(),name,gender:'ambiguous',age:'',race:'',
          intro:outline.slice(0,2000),
          opening:'**新的故事開始了。**\n「你好。」',
          privateInfo:outline,style:'',tags:[...draftTags],
          image:state.characters.find(c=>c.id==='seed-1')?.image || '',
          authorId:currentUser().uid,owner:true,visibility:'private',rightsConfirmed:false,
          chats:'0',users:null,createdAt:Date.now()
        });
        persist();go({page:'create'});break;
      }
      case 'tags': {
        const chosen=f.getAll('tag');
        if (o.mode!=='explore' && chosen.length>5) return toast('最多選擇5個標籤。');
        if (o.mode==='explore') {
          exploreTags=chosen;
          state.preferences=[...new Set([...state.preferences,...chosen])];
          persist();
        } else {
          draftTags=chosen;
          if (route.page==='editor') {
            const live=$('view').querySelector('form[data-form="character"]');
            if (live) {
              const values=new FormData(live);
              draftCharacter={
                ...(draftCharacter || {}),
                ...Object.fromEntries(values),
                image:draftImage,tags:draftTags
              };
            }
          }
        }
        back();break;
      }
      case 'delete-character': {
        if (String(f.get('confirm'))!=='Delete') return toast('請輸入「Delete」。');
        const c=state.characters.find(c=>c.id===o.id);
        const user=currentUser();
        if (!owned(c) || !user?.uid || !window.mySupabase) return toast('請登入後再刪除角色。');
        if (!confirm('最後確認：將角色下架？公開列表會隱藏，既有聊天保留，新對話將被禁止。')) return;
        const { data: authResult, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authResult?.user?.id !== user.uid) throw new Error('登入狀態驗證失敗，請重新登入。');
        const { data: deletedAt, error: deleteError } = await window.mySupabase
          .rpc('soft_delete_character',{p_character_id:c.id});
        if (deleteError) throw new Error('角色軟刪除失敗：'+deleteError.message);
        if (!deletedAt) throw new Error('資料庫未確認角色下架成功，請重新整理後再試。');
        c.visibility='private';c.deletedAt=deletedAt;c.deletionReason='author_deleted';
        for (const session of Object.values(state.sessions)) {
          if (session.characterId===c.id) {
const { privateInfo: _legacyPrivateInfo, ...safeCloudSnapshot } = session.cloudCharacterSnapshot || {};
            session.cloudCharacterSnapshot={
              ...safeCloudSnapshot,
              id:c.id,name:c.name,gender:c.gender,age:c.age,image:c.image,intro:c.intro,
              opening:c.opening,
              race:c.race,style:c.style,tags:Array.isArray(c.tags)?c.tags:[],
              authorId:c.authorId,visibility:'private',
              firstPublishedAt:c.firstPublishedAt || session.cloudCharacterSnapshot?.firstPublishedAt || null,
              deletedAt
            };
          }
        }
        state.characters=state.characters.filter(item=>item.id!==c.id);
        state.favorites=state.favorites.filter(v=>v!==c.id);
        delete state.comments[c.id];
        persist();go({page:'create'},true);
        toast('角色已下架；既有聊天保留，不能再開啟新對話。');
        break;
      }
      case 'profile': {
        const name=String(f.get('nickname')).trim();
        if (!validName(name)) return toast('暱稱不符合規則。'+NAME_HELP);
        const previous={...state.account};
        state.account.nickname=name;
        const bio=String(f.get('bio') || '').trim();
        if(Array.from(bio).length>500) return toast('帳號簡介最多 500 字。');
        state.account.bio=bio;
        state.account.avatar=profileImage || state.account.avatar || '';
        persist();
        try {
          if (window.mySupabase?.auth) {
            const { data, error } = await window.mySupabase.auth.getUser();
            if (error || data?.user?.id !== state.account.uid) throw new Error('登入狀態驗證失敗，請重新登入。');
            await saveSupabaseProfile(state.account);
          }
          // 不依賴 history.back() 的非同步 popstate；直接移除編輯視窗並立即重繪主畫面，
          // 確保剛上傳的 PersonaX 頭像即時更新到右上角與個人帳號頁。
          const returnRoute = {...route};
          delete returnRoute.overlay;
          go(returnRoute, true);
          render();
          toast('個人資料與頭像已儲存並立即更新。');
        } catch (error) {
          state.account={...previous};persist();render();
          toast('個人資料未能同步：'+(error.message || '請稍後再試。'));
        }
        break;
      }
      case 'theme-setting': {
        state.theme=f.get('theme') === 'day' ? 'day' : 'night';persist();back();render();toast('版面顏色已更新。');break;
      }
      case 'birthdate': {
        const value=String(f.get('birthdate') || '');
        if(value && (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value > new Date().toISOString().slice(0,10))) return toast('請選擇有效的出生日期。');
        const previousBirthdate=state.account.birthdate || '';
        state.account.birthdate=value;
        persist();
        try {
          if (!window.mySupabase?.auth) throw new Error('請先登入 Google 帳號。');
          const {data,error}=await window.mySupabase.auth.getUser();
          if(error || data?.user?.id!==state.account?.uid) throw new Error('登入狀態驗證失敗，請重新登入。');

          back();render();toast('生日儲存成功。');

          state.account.birthdate=previousBirthdate;persist();openModal('birthdate');
          toast('生日未能同步到雲端：'+(error.message || '請稍後再試。'));
        }
        break;
      }
      case 'personas': {

          if(!existing) return toast('找不到這組人設，請重新整理。');
          existing.name=name;existing.text=value;existing.updatedAt=Date.now();

        if(!persist()) { state.account.personas=previous; return; }
        try {
          if (!window.mySupabase?.auth) throw new Error('請先使用 Google 帳號登入，才能將人設保存到雲端。');
          const {data,error}=await window.mySupabase.auth.getUser();
          if(error || data?.user?.id!==state.account?.uid) throw new Error('登入狀態驗證失敗，請重新登入。');
          await savePersonaPresets(state.account);
          route.overlay={name:'personas'};render();toast('儲存成功');
        } catch(error) {
          state.account.personas=previous;
          persist();openModal('personas');toast('人設未能同步到資料庫：'+(error.message||'請稍後再試。'));
        }
        break;
      }
      case 'delete-account': {
        if (String(f.get('confirm')).trim() !== 'DELETE') return toast('請輸入「DELETE」。');
        if (!state.account?.uid || !window.mySupabase) return toast('請先使用 Google 帳號登入。');
        if (!confirm('確定提出帳號刪除申請？申請後會暫停使用功能，並可在後端設定的期限內取消。')) return;
        const { data: authData, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authData?.user?.id !== state.account.uid) {
          return toast('登入狀態驗證失敗，請重新登入後再試。');
        }
        const { data, error } = await window.mySupabase.rpc('request_account_deletion');
        if (error) throw new Error('申請刪除失敗：' + error.message);
        const requestRow = Array.isArray(data) ? data[0] : data;
        state.account.accountDeletionPending = true;
        state.account.deletionScheduledFor = requestRow?.scheduled_for || null;
        persist();
        openModal('account-deletion-pending', {scheduledFor: state.account.deletionScheduledFor});
        toast('已提出刪除申請；目前不會刪除錢包或修改餘額。');
        break;
      }
      case 'cancel-account-deletion': {
        if (!state.account?.uid || !window.mySupabase) return toast('請先使用原 Google 帳號登入。');
        const { data: authData, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authData?.user?.id !== state.account.uid) {
          return toast('登入狀態驗證失敗，請重新登入後再試。');
        }
        const { error } = await window.mySupabase.rpc('cancel_account_deletion');
        if (error) throw new Error('取消刪除失敗：' + error.message);
        delete state.account.accountDeletionPending;
        delete state.account.deletionScheduledFor;
        delete state.account.accountDeletionModalDismissed;
        persist();
        go({page:'home'}, true);
        try {
          await loadSupabaseProfileAndWallet(authData.user, true);
        } catch (refreshError) {
          console.error('帳號已恢復，但個人資料／錢包重新載入失敗：', refreshError);
          toast('已取消刪除申請，但個人資料或錢包重新載入失敗。請重新整理頁面；目前不需要重新申請刪除。');
          break;
        }
        toast('已取消刪除申請，原帳號與錢包餘額已保留。');
        break;
      }
      case 'group-message': {
        await groupSendMock();
        break;
      }
      case 'message': {
        if (!s || !currentUser()) return;
        // Reuse the same turn IDs after an ambiguous response; never create a new
        // charge attempt until the prior turn has an authoritative outcome.
        if (s.pendingTurn) {
          await runPendingChatTurn(s);
          break;
        }
        if (!text.trim()) return toast('請先輸入訊息，再開始新的聊天回合。');
        const platformCommand = parsePlatformCommand(text);
        if (platformCommand.type === 'platform') {
          if (platformCommand.name === 'help') {
            toast('PersonaX 語法：@角色 指定 AI 回覆；:人名:內容 指定玩家發言顯示；/help 查看平台指令。AI 尚未串接，指定角色目前只做語法驗證。');
          } else {
            toast('尚未支援平台指令 /' + platformCommand.name + '；本次沒有送出或扣款。');
          }
          break;
        }
        const currentCharacter = sessionCharacter(s);
        const availableRoles = [{id:currentCharacter?.id,name:currentCharacter?.name,image:currentCharacter?.image || currentCharacter?.avatar_url}].filter(role => role.id && role.name);
        const mention = parseMentionTarget(text, availableRoles);
        if (mention.mentioned && !mention.valid) {
          toast(mention.reason + '，請確認角色名稱；本次沒有送出或扣款。');
          break;
        }
        const displaySegments = parseRoleplaySegments(text, availableRoles)
          .map(({avatar:_avatar,...segment})=>segment);
        const messageMeta = {
          displaySegments,
          aiTargetId:mention.mentioned && mention.valid ? mention.characterId : null,
          commandType:text.trim().startsWith('!') ? 'custom' : null
        };
        // Local seed/mock characters cannot be written to the UUID-constrained
        // cloud chat schema. Keep their test messages usable locally and never charge.
        if (!window.mySupabase || !isUuid(s.characterId) || !isUuid(s.id)) {
          s.messages.push({id:id(),role:'user',text,at:Date.now(),localOnly:true,...messageMeta});
          drafts[s.id]='';
          if($('messageInput')) $('messageInput').value='';
          const saved=persist();
          renderMessages();
          toast(saved
            ? '訊息已保存在本機測試聊天；此角色尚未完成雲端聊天／AI 串接，本次不會扣款。'
            : '訊息無法保存，請檢查瀏覽器儲存空間。');
          break;
        }

        const previousMessages = s.messages.slice();
        const previousMemories = (s.memories || []).map(memory => ({...memory}));
        const userMessage = {id:id(),role:'user',text,at:Date.now(),...messageMeta};
        s.messages.push(userMessage);
        s.pendingTurn = {
          turnId:id(),
          userMessageId:userMessage.id,
          assistantMessageId:id(),
          createdAt:Date.now()
        };

        // First persist only the user message so a first-time local chat obtains
        // an owned cloud session before the trusted server reserves wallet funds.
        const userSaved = await saveChatSessionSafely(s);
        if (!userSaved) {
          s.messages = previousMessages;
          s.memories = previousMemories;
          delete s.pendingTurn;
          persist();
          await clearCloudPendingTurn(s);
          renderMessages();
          toast('訊息尚未保存到雲端，本次沒有扣款；請確認網路後再試。');
          break;
        }

        drafts[s.id]='';
        $('messageInput').value='';
        persist();
        renderMessages();
        await runPendingChatTurn(s);
        break;
      }
      case 'persona': {
        if (!s) return;
        const previousPersona=s.persona || '';
        const previousPersonaCustom=s.personaCustom === true;
        s.persona=String(f.get('persona'));
        s.personaCustom=true;
        if (!persist()) {
          s.persona=previousPersona;
          s.personaCustom=previousPersonaCustom;
          break;
        }
        if (s.cloudOwned && currentUser()?.uid===s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.persona=previousPersona;
            s.personaCustom=previousPersonaCustom;
            persist();render();
            toast('專屬人設同步失敗，已還原原設定。');
            break;
          }
        }
        toast('儲存成功');
        if (Object.prototype.hasOwnProperty.call(o,'draftPersona')) { const cleanRoute={...route}; delete cleanRoute.overlay; go(cleanRoute,true); }
        else back();
        break;
      }
      case 'rename': {
        const item=state.sessions[o.id];
        const name=String(f.get('name')).trim();
        if (!item || !validName(name)) return toast('檔名不符合規則。'+NAME_HELP);
        const duplicate=Object.values(state.sessions).some(other =>
          other.id !== item.id && sessionTitle(other) === name
        );
        if (duplicate) return alert('這個檔名已被你自己的其他聊天或角色使用，請換一個名稱。');
        const previousName=item.name;
        item.name=name;
        if (!persist()) {
          item.name=previousName;
          break;
        }
        if (item.cloudOwned && currentUser()?.uid===item.cloudOwnerUid && hasUserMessage(item)) {
          const synced=await saveChatSessionSafely(item);
          if (!synced) {
            item.name=previousName;
            persist();render();
            toast('聊天名稱同步失敗，已還原原名稱。');
            break;
          }
        }
        openModal('archives');break;
      }
      case 'memory': {
        const m=s?.memories.find(m=>m.id===o.id);
        if (!m || m.important) return;
        const previousMemories=clone(s.memories);
        if (!text) {
          if (!confirm('內容為空，確定刪除此記憶？')) return;
          s.memories=s.memories.filter(m=>m.id!==o.id);
        } else {
          if (memorySize(s.memories)-countChars(m.text)+countChars(text)>3000) {
            return toast('記憶總長度超過3000字。');
          }
          m.text=text;
        }
        if (!persist()) {
          s.memories=previousMemories;
          return;
        }
        if (s.cloudOwned && currentUser()?.uid===s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.memories=previousMemories;
            persist();
            render();
            toast('回憶同步失敗，已還原原內容；請確認網路後再試。');
            return;
          }
        }
        back();break;
      }
      case 'message-edit': {
        const m=s?.messages.find(m=>m.id===o.id);
        const latestEditableMessage = m && (m.role==='user'||m.role==='assistant') &&
          s.messages.filter(item=>item.role==='user'||item.role==='assistant').at(-1)?.id===m.id;
        if (!m || !latestEditableMessage) return;
        if (!text) return toast('訊息不可為空。');
        const previousText=m.text, wasEdited=!!m.edited;
        const client=window.mySupabase, user=currentUser();
        const isCloudMessage=!!(s.cloudOwned&&user?.uid===s.cloudOwnerUid&&client&&isUuid(m.id)&&isUuid(s.id));
        if(isCloudMessage) {
          const {data,error}=await client.from('chat_messages').update({content:text})
            .eq('id',m.id).eq('session_id',s.id).is('deleted_at',null).select('id').maybeSingle();
          if(error) throw new Error('訊息雲端更新失敗：'+error.message);
          if(!data) throw new Error('雲端未確認這則訊息的更新，原內容已保留。');
        }
        m.text=text;m.edited=true;
        if (!persist()) {
          m.text=previousText;m.edited=wasEdited;persist();
          if(isCloudMessage) await client.from('chat_messages').update({content:previousText}).eq('id',m.id).eq('session_id',s.id);
          break;
        }
        back();renderMessages();
        toast('訊息已更新；未重新生成 AI，也未扣款。');
        break;
      }
      case 'group-message-edit': {
        const group=groupPrototype.active, messageId=form.dataset.id||o.id;
        const message=groupPrototype.messages.find(item=>item.id===messageId);
        const latest=groupPrototype.messages.filter(item=>item.type==='user'||item.type==='character').at(-1);
        const user=currentUser(), client=window.mySupabase;
        if(!group||!message||message.id!==latest?.id||!['user','character'].includes(message.type)) {
          toast('只有最後一則玩家／角色訊息可以編輯。');break;
        }
        if(!text) return toast('訊息不可為空。');
        if(!user?.uid||!client||!isUuid(group.id)||!isUuid(message.id)) throw new Error('群組尚未連結有效的雲端資料，無法更新訊息。');
        const {data,error}=await client.from('chat_group_messages').update({content:text})
          .eq('id',message.id).eq('group_id',group.id).select('id').maybeSingle();
        if(error) throw new Error('群組訊息雲端更新失敗：'+error.message);
        if(!data) throw new Error('雲端未確認這則群組訊息的更新，請重新載入後再試。');
        message.content=text;message.edited=true;
        back();renderGroupConversation();
        toast('群組訊息已更新；未重新生成 AI，也未扣款。');
        break;
      }
      case 'comment': {
        if (!requireLogin({page:'detail',id:route.id})) return;
        if (!text) return toast('請輸入評論。');
        if (!window.mySupabase || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(route.id)) return toast('此角色尚未連結雲端，評論無法跨帳號保存。');
        const parent=replyId?(state.comments[route.id]||[]).find(c=>c.id===replyId):null;
        const {error}=await window.mySupabase.from('character_comments').insert({
          character_id:route.id,author_id:currentUser().uid,content:text,parent_id:replyId,
          is_whisper:!!f.get('whisper')||!!parent?.whisper
        });
        if(error)throw new Error('評論雲端保存失敗：'+error.message);
        replyId=null;form.reset();$('replyHint').textContent='';
        await loadCloudComments(route.id);toast('評論已保存到雲端。');break;
      }
      case 'comment-edit': {
        const c=(state.comments[route.id]||[]).find(c=>c.id===o.id);
        if(!c||c.deleted||c.authorId!==currentUser()?.uid)return;
        if(!text)return toast('評論不可為空。');
        if(c.cloud&&window.mySupabase){
          const {error}=await window.mySupabase.from('character_comments').update({content:text,updated_at:new Date().toISOString()}).eq('id',c.id).eq('author_id',currentUser().uid);
          if(error)throw new Error('評論修改失敗：'+error.message);
          await loadCloudComments(route.id);back();break;
        }
        c.text=text;c.edited=true;persist();back();break;
      }
      case 'report':
      case 'bug': {
        if (!text) return toast('請填寫問題說明。');
        const file=f.get('image');
        if (file?.size && !['image/png','image/jpeg','image/webp'].includes(file.type)) {
          return toast('圖片格式需為PNG、JPG或WebP。');
        }
        toast('表單檢查通過。回報API尚未串接，本次沒有實際送出。');
        break;
      }
    }
  } catch(error) {
    if (type === 'cancel-account-deletion') {
      console.error('PersonaX 帳號復原失敗：', error);
      showDialog('復原帳號失敗', `
        <p>系統目前無法取消這筆刪除申請。</p>
        <div class="notice" role="alert" style="white-space:pre-wrap;overflow-wrap:anywhere">${e(error.message || '操作未完成，請稍後再試。')}</div>
        <p class="muted small">這個錯誤視窗會一直保留，直到你手動關閉。此訊息不代表帳號已刪除；請先不要重新申請刪除或修改資料庫。</p>
        <button class="primary" type="button" data-action="back">知道了</button>
      `);
    } else {
      toast(error.message || '儲存未完成。');
    }
  } finally {
    form.dataset.submitting = 'false';
    if (submitButton?.isConnected) { submitButton.disabled = false; submitButton.textContent = originalButtonText; }
  }
});

/* Inputs */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveEditorDraft();
});
window.addEventListener('pagehide', saveEditorDraft);
window.addEventListener('blur', saveEditorDraft);
document.addEventListener('input',event => {
  const target=event.target;
  if (target.closest('form[data-form="character"]')) saveEditorDraft();
  if (target.id==='searchInput') {search=target.value;renderGrid();}
  if (target.id==='chatSearch') {
    chatSearch=target.value;
    $('chatEntries').innerHTML=chatEntries();
  }
  if (target.id==='archiveSearchInput') {
    const results=$('archiveSearchResults');
    if (results) results.innerHTML=archiveSearchResults(target.value);
  }
  if (target.id==='groupArchiveSearchInput') {

    if (results) results.innerHTML=groupArchiveSearchResults(target.value);
  }

    groupCharacterSearch=target.value;

    if(results) results.innerHTML=groupRenderCharacterResults();
  }
  if (target.id==='messageInput') {
    drafts[route.id]=target.value;

    target.style.height=Math.min(target.scrollHeight,144)+'px';

  if (target.id==='groupMessageInput') {
    target.style.height='auto';
    target.style.height=Math.min(target.scrollHeight,144)+'px';
  }
});
document.addEventListener('keydown',event => {
  // Enter inserts a newline on desktop and mobile. Only an explicit
  // Ctrl/Cmd+Enter submits, preventing accidental sends while composing text.
  if (!['messageInput','groupMessageInput'].includes(event.target.id) ||
      event.key!=='Enter' || event.isComposing ||
      !(event.ctrlKey || event.metaKey)) return;
  event.preventDefault();
  if(event.target.id==='groupMessageInput') void groupSendMock();
  else event.target.form?.requestSubmit();
});
document.addEventListener('change',async event => {
  const target=event.target;
  if (target.closest('form[data-form="character"]')) saveEditorDraft();
  try {
    if (target.id==='characterImage') {
      const file=target.files?.[0];
      if (!file) return;
      const requestId=++characterImageCompressionRequest;
      isCompressingCharacterImage=true;
      toast('正在壓縮角色圖片，請稍候…');
      try {
        const compressed=await compressUploadImage(file,{maxEdge:1600,targetBytes:500*1024});
        // Ignore stale results if the user selected another file while this one was processing.
        if(requestId!==characterImageCompressionRequest) return;
        draftImage=compressed.dataUrl;
        $('imagePreview').src=draftImage;
        $('imagePreview').classList.remove('hidden');
        const before=(compressed.originalBytes/1024).toFixed(0),after=(compressed.compressedBytes/1024).toFixed(0);
        toast(`角色頭像已自動壓縮：${before} KB → ${after} KB。`);
        saveEditorDraft();
      } catch(error) {
        if(requestId!==characterImageCompressionRequest) return;
        target.value='';
        throw error;
      } finally {
        if(requestId===characterImageCompressionRequest) isCompressingCharacterImage=false;
      }
    }
    if (target.id==='profileImage') {
      if (!target.files?.[0]) return;
      profileImage=await compressProfileImage(target.files[0]);
      const preview=$('profileImagePreview');
      if (preview) { preview.src=profileImage; preview.style.display='block'; }
      toast('頭像已壓縮，儲存後套用。');
    }
    if (target.id==='backgroundSetting') {
      const s=(target.dataset.sessionId && state.sessions[target.dataset.sessionId]) || currentSession();
      if (s && /^memory-photo:[0-9a-f-]{36}$/i.test(target.value)) {
        const previousBackground=s.background||'avatar',photoId=target.value.slice('memory-photo:'.length),client=window.mySupabase,uid=currentUser()?.uid;
        try {
          if(!client||!uid||!s.cloudOwned||s.cloudOwnerUid!==uid)throw new Error('請先使用目前帳號擁有的已同步聊天。');
          const {data:photo,error:photoError}=await client.from('chat_memory_photos').select('id').eq('id',photoId).eq('owner_id',uid).eq('chat_type','single').eq('session_id',s.id).eq('status','active').is('deleted_at',null).gt('expires_at',new Date().toISOString()).maybeSingle();
          if(photoError||!photo)throw photoError||new Error('找不到這張有效的回憶相片。');
          const {data:row,error:readError}=await client.from('chat_sessions').select('session_data').eq('id',s.id).eq('user_id',uid).maybeSingle();
          if(readError||!row)throw readError||new Error('讀取聊天設定失敗。');
          const nextData={...(row.session_data||{}),background:target.value};
          const {data:saved,error:saveError}=await client.from('chat_sessions').update({session_data:nextData,updated_at:new Date().toISOString()}).eq('id',s.id).eq('user_id',uid).select('id').maybeSingle();
          if(saveError||!saved)throw saveError||new Error('資料庫未確認背景設定已儲存。');
          s.background=target.value;persist();const panel=$('view').querySelector('.chat-main');if(panel)void window.applySingleMemoryPhotoBackground?.(s,panel);toast('已更新聊天背景。');
        } catch(err) {s.background=previousBackground;target.value=previousBackground;console.error('回憶相片背景設定失敗',err);toast('背景設定失敗：'+(err.message||'請稍後再試。')); }
      } else if (s && ['avatar','none'].includes(target.value)) {
        const previousBackground=s.background || 'avatar';
        s.background=target.value;
        if (!persist()) {
          s.background=previousBackground;
          target.value=previousBackground;
          return;
        }
        if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.background=previousBackground;
            persist();render();
            target.value=previousBackground;
            toast('聊天背景同步失敗，已還原原設定。');
            return;
          }
        }
        const panel=$('view').querySelector('.chat-main');
        if (panel && route.id === s.id) {
          panel.style.setProperty('--chat-photo',target.value==='none' ? 'none' :
            `url(${JSON.stringify(safeImage(sessionCharacter(s).image))})`);
        }
      }
    }
    if (target.dataset.memory) {
      const session=currentSession();
      const m=session?.memories.find(m=>m.id===target.dataset.memory);
      if (m) {
        const previousImportant=m.important;
        m.important=target.checked;
        persist();render();
        if (session.cloudOwned && currentUser()?.uid===session.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(session);
          if (!synced) {
            m.important=previousImportant;
            persist();render();
            toast('重大記憶同步失敗，已還原原設定。');
          }
        }
      }
    }
    if (['aiImages','aiImageCount'].includes(target.id)) updateAICost();
    if (target.id==='jsonFile') await importCharacter(target.files[0]);
  } catch(error) {
    toast(error.message);
    if (target.type==='file') target.value='';
  }
});

async function importCharacter(file) {
  $('jsonFile').value='';
  if (!file || !currentUser()) return;
  if (file.size>2097152) throw Error('JSON最多2 MB。');
  const data=JSON.parse(await file.text());
  const name=String(data.name || '').trim();
  const intro=String(data.intro || '').trim();
  const opening=String(data.opening || '').trim();
  if (!validName(name)) throw Error('角色名稱不符合規則。'+NAME_HELP);
  if (!intro || intro.length>2000 || !opening || opening.length>3000) {
    throw Error('需有intro與opening，並符合2000／3000字上限。');
  }
  if (String(data.privateInfo || '').length>10000 || String(data.style || '').length>1000) {
    throw Error('私密資訊或風格超過長度限制。');
  }
  const image=safeImage(data.image);
  if (!image) throw Error('需提供有效的HTTPS或支援的圖片資料。');
  const tags=Array.isArray(data.tags) ? [...new Set(data.tags.filter(t=>TAGS.includes(t)))] : [];
  if (tags.length>5) throw Error('標籤最多5個。');
  const user = currentUser();
  if (!user?.uid || !window.mySupabase) {
    throw Error('請先使用 Google 帳號登入，角色才能儲存到雲端。');
  }
  const character = {
    id:id(),name,intro,opening,image,tags,
    gender:['male','female','ambiguous'].includes(data.gender) ? data.gender : 'ambiguous',
    age:String(data.age || '').slice(0,20),
    race:String(data.race || '').slice(0,50),
    privateInfo:String(data.privateInfo || ''),style:String(data.style || ''),
    authorId:user.uid,owner:true,visibility:'private',rightsConfirmed:false,
    chats:'0',users:null,createdAt:Date.now()
  };
  // 匯入完成即建立雲端私密角色，不必先公開才上傳。
  const saveResult = await saveSupabaseCharacter(character, user.uid);
  state.characters.unshift(character);
  persist();go({page:'create'});
  if (saveResult.storyError) toast('角色已匯入雲端，但故事同步失敗：' + saveResult.storyError);
  else toast('角色已匯入雲端，預設為私密。');
}

/* Image errors do not inject HTML. */
document.addEventListener('error',event => {
  if (event.target instanceof HTMLImageElement) event.target.style.opacity='.15';
},true);

/* Initialization */
route=parseRoute();
history.replaceState({personax:true,depth:0,route},'',routeURL(route));
persist();
render();

// Supabase Auth 的 load 事件會在此之後恢復真正的登入身分。
// 這裡不再另外建立第二套登入 UI，避免兩套狀態互相覆蓋。
if (window.__pendingSupabaseUser) {
  syncSupabaseUser(window.__pendingSupabaseUser);
  window.__pendingSupabaseUser = null;
}
