<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonaX - AI 角色扮演平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: sans-serif; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- 頂部導覽列 -->
  <header class="h-14 border-b border-slate-800 bg-slate-900 px-4 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <span class="font-bold text-white text-base">✨ PersonaX</span>
    </div>
    <div>
      <button onclick="alert('點擊成功！')" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-xl font-medium">測試按鈕</button>
    </div>
  </header>

  <!-- 主體區域 -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 左側選單 -->
    <aside class="w-60 border-r border-slate-800 bg-slate-900 p-4 space-y-2">
      <div class="text-xs font-bold text-indigo-400 mb-2">導覽選單</div>
      <button onclick="alert('切換到探索角色')" class="w-full text-left px-3 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium">🏠 探索角色</button>
      <button onclick="alert('切換到開始暢聊')" class="w-full text-left px-3 py-2 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">💬 開始暢聊</button>
    </aside>

    <!-- 右側內容 -->
    <main class="flex-1 p-6 bg-slate-950 text-white">
      <h1 class="text-xl font-bold">歡迎來到 PersonaX</h1>
      <p class="text-xs text-slate-400 mt-2">請點擊左側按鈕測試互動是否恢復正常。</p>
    </main>
  </div>

</body>
</html>
