<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>PersonaX｜AI 角色世界</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">

<style>
:root {
  color-scheme: dark;
  --bg:#080b12;
  --panel:#101725;
  --panel2:#172033;
  --text:#eef2ff;
  --muted:#95a3b9;
  --border:#293348;
  --primary:#6366f1;
  --soft:#6366f124;
  --input:#0b1220;
  --header:#0b1120ef;
  --bubble:#1b263b;
  --shade:#080d17d9;
  --sidebar:232px;
}
body.day {
  color-scheme:light;
  --bg:#f3f5fa;
  --panel:#ffffff;
  --panel2:#edf0f7;
  --text:#182235;
  --muted:#617087;
  --border:#d6ddea;
  --input:#ffffff;
  --header:#ffffffef;
  --bubble:#ffffff;
  --shade:#f3f5fae0;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  font-size:14px;
}
button,input,textarea,select { font:inherit; }
button {
  cursor:pointer;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 13px;
}
button:hover:not(:disabled) { filter:brightness(1.1); }
button:disabled { opacity:.45; cursor:not-allowed; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
  outline:2px solid #a5b4fc;
  outline-offset:3px;
}
input,textarea,select {
  width:100%;
  padding:11px 12px;
  color:var(--text);
  background:var(--input);
  border:1px solid var(--border);
  border-radius:11px;
}
textarea { resize:vertical; min-height:105px; line-height:1.7; }
input[type="checkbox"],input[type="radio"] {
  width:auto;
  accent-color:var(--primary);
}
img { display:block; max-width:100%; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:28px; }
h2 { font-size:21px; }
h3 { font-size:16px; }
p { line-height:1.8; }
svg { pointer-events:none; }
.icon {
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  display:block;
}
.hidden { display:none!important; }
.primary { background:var(--primary); color:white; border-color:transparent; }
.danger { color:#e65a76; border-color:#e65a7650; }
.ghost { background:transparent; border-color:transparent; }
.row { display:flex; align-items:center; gap:10px; }
.between { justify-content:space-between; }
.wrap { flex-wrap:wrap; }
.grow { flex:1; min-width:0; }
.small { font-size:12px; }
.muted { color:var(--muted); }
.stack > * + * { margin-top:18px; }
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  padding:22px;
}
.prose { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.9; }
.empty {
  padding:35px 18px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:16px;
  grid-column:1/-1;
}
.tabs { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; }
.tab { white-space:nowrap; color:var(--muted); }
.tab.active { background:var(--primary); color:white; border-color:transparent; }
.tag {
  padding:5px 9px;
  font-size:11px;
  color:#a5a8ff;
  background:var(--soft);
  border:0;
  border-radius:999px;
}
body.day .tag { color:#4f46b8; }
.badge {
  display:inline-block;
  border-radius:999px;
  background:var(--soft);
  color:var(--muted);
  font-size:11px;
  padding:5px 9px;
}
.field { display:block; margin-bottom:17px; }
.field > span { display:block; font-weight:600; margin-bottom:8px; }
.field small { display:block; color:var(--muted); margin-top:6px; line-height:1.7; }
.check { display:flex; align-items:flex-start; gap:9px; line-height:1.7; }
.check input { margin-top:5px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-width { max-width:820px; }
.avatar {
  width:36px;
  height:36px;
  object-fit:cover;
  border-radius:50%;
  flex-shrink:0;
  background:#312e81;
}
.avatar-fallback { display:grid; place-items:center; color:#ddd6fe; font-weight:bold; }
.ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.character-avatar-status {
  position:relative;
  display:inline-flex;
  flex:0 0 auto;
  line-height:0;
}
.character-avatar-status .avatar {
  display:block;
}
.character-avatar-status.is-offline .avatar,
.detail-image.character-offline-image {
  filter:grayscale(1);
  opacity:.68;
}
.character-status-dot {
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:11px;
  height:11px;
  border:2px solid var(--panel);
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 1px #0003;
}
.character-avatar-status.is-offline .character-status-dot {
  background:#8993a4;
}
.character-status-label {
  display:inline-flex;
  align-items:center;
  gap:7px;
  width:max-content;
  max-width:100%;
  color:var(--muted);
  font-size:12px;
}
.character-status-label .character-status-dot {
  position:static;
  display:inline-block;
  flex:0 0 auto;
}
.character-status-banner {
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 13px;
  color:var(--muted);
  background:var(--panel2);
  line-height:1.6;
}

/* Logo / navigation */
.logo-img { width:132px; height:29px; object-fit:contain; }
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar);
  z-index:40;
  padding:18px 12px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}
.sidebar-heading { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.sidebar-heading .logo-button { padding:4px; }
.sidebar nav { display:grid; gap:6px; margin-top:25px; }
.nav-btn {
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--muted);
}
.nav-btn.active { background:var(--soft); color:var(--text); }
.nav-btn.active .chat-nav-icon { fill:currentColor; }
.sidebar-footer { margin-top:auto; display:flex; justify-content:center; }
.sidebar-footer button { padding:8px; }
.app { margin-left:var(--sidebar); }
body.collapsed { --sidebar:72px; }
body.collapsed .sidebar-heading .logo-button { display:none; }
body.collapsed .sidebar-heading { justify-content:center; }
body.collapsed .nav-label { display:none; }
body.collapsed .nav-btn { justify-content:center; padding-inline:6px; }
body.collapsed .sidebar-footer .logo-img { width:45px; height:22px; }
header {
  height:64px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--header);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}
.mobile-logo { display:none; }
.environment {
  border:0;
  padding:3px 0;
  background:transparent;
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}
.wallet-button {
  display:flex;
  align-items:center;
  gap:9px;
  padding:3px 0;
  border:0;
  border-radius:999px;
  background:transparent;
  font-size:12px;
  box-shadow:none;
}
.wallet-button:hover:not(:disabled) {
  filter:none;
}
.wallet-button .avatar {
  width:32px;
  height:32px;
  border:0;
  box-shadow:none;
}
.wallet-button .avatar-fallback {
  border:0;
}
.wallet-diamond { color:#dcad35; }
.wallet-silver { color:var(--muted); }
main { max-width:1500px; margin:auto; padding:25px; }
.mobile-nav { display:none; }

/* Explore */
.hero {
  min-height:280px;
  padding:36px;
  border-radius:25px;
  overflow:hidden;
  color:#f1f5ff;
  background:
    radial-gradient(circle at 85% 20%,#818cf845,transparent 35%),
    linear-gradient(115deg,#111827,#172554 55%,#1b1538);
  border:1px solid #818cf845;
}
.hero h1 { margin:16px 0; font-size:clamp(28px,4vw,45px); }
.hero p { max-width:670px; color:#cbd5e1; }
.hero-controls { display:flex; gap:8px; margin-top:18px; }
.hero-dot { width:10px; height:10px; padding:0; border:0; border-radius:50%; background:#ffffff45; }
.hero-dot.active { background:white; }
.toolbar { display:flex; gap:10px; flex-wrap:wrap; }
.toolbar input { max-width:420px; min-width:150px; flex:1; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:17px; }
.card { overflow:hidden; border:1px solid var(--border); border-radius:17px; background:var(--panel); min-width:0; }
.card-image { position:relative; aspect-ratio:4/5; }
.image-button { width:100%; height:100%; padding:0; border:0; border-radius:0; background:var(--panel2); overflow:hidden; }
.image-button img { width:100%; height:100%; object-fit:cover; }
.card-chat {
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  background:var(--primary);
  color:white;
  border:0;
  opacity:0;
}
.card:hover .card-chat,.card:focus-within .card-chat { opacity:1; }
.card-body { padding:13px; }
.card-body h3 { margin:9px 0 6px; }
.card-intro {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:43px;
}
.heart { border:0; background:transparent; padding:4px; font-size:21px; }
.heart.on { color:#fb7185; }
.owner-actions { display:flex; gap:7px; margin-top:12px; }
.owner-actions button { flex:1; font-size:12px; padding:8px; }
.detail-layout { display:grid; grid-template-columns:minmax(230px,360px) 1fr; gap:25px; }
.detail-image { width:100%; max-height:580px; object-fit:cover; border-radius:19px; }
.author-link { border:0; background:transparent; color:#a5a8ff; padding:0; }
.comment { padding:18px 0; border-bottom:1px solid var(--border); }
.comment.reply { margin-left:24px; border-left:2px solid var(--soft); padding-left:14px; }
.comment-tools { display:flex; gap:7px; flex-wrap:wrap; }
.comment-tools button { padding:5px 8px; font-size:11px; }

/* Chat */
body.chat-page main { max-width:none; padding:12px; }
.chat-layout {
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:12px;
  height:calc(100dvh - 88px);
  min-height:0;
}
.chat-layout.list-only { grid-template-columns:1fr; }
.chat-layout.hide-list { grid-template-columns:1fr; }
.chat-layout.hide-list .chat-list { display:none; }
.chat-list { overflow-y:auto; padding:14px; min-height:0; }
.list-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.chat-entry { display:flex; gap:7px; align-items:center; padding:9px 6px; margin-top:7px; border-radius:12px; }
.chat-entry.active { background:var(--soft); }
.select-chat { flex:1; min-width:0; border:0; background:transparent; text-align:left; padding:2px; }
.pin { padding:3px; border:0; background:transparent; color:var(--muted); }
.pin.on { color:#fb7185; }
.pin.on svg { fill:#fb718535; }
.entry-menu { opacity:0; padding:4px; background:transparent; border:0; }
.chat-entry:hover .entry-menu,.chat-entry:focus-within .entry-menu { opacity:1; }
.chat-main {
  min-width:0;
  min-height:0;
  height:100%;
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
}
.chat-main::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background-image:linear-gradient(var(--shade),var(--shade)),var(--chat-photo,none);
  background-size:cover;
  background-position:center;
}
.chat-heading {
  flex:0 0 auto;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  background:var(--header);
  backdrop-filter:blur(14px);
}
.chat-heading .avatar { width:31px; height:31px; }
.chat-heading button { padding:6px; }
.chat-name { font-size:13px; font-weight:bold; }
.chat-meta { display:none; }
.messages { flex:1 1 0; min-height:0; overflow-y:auto; padding:20px; overscroll-behavior:contain; }
.message { display:flex; gap:8px; margin-bottom:19px; position:relative; }
.message.user { flex-direction:row-reverse; }
.message .avatar { width:30px; height:30px; }
.message-content { max-width:85%; min-width:0; }
.message-name { color:var(--muted); font-size:10px; margin-bottom:5px; }
.user .message-name { text-align:right; }
.bubble {
  padding:10px 13px;
  background:var(--bubble);
  border:1px solid var(--border);
  border-radius:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.85;
  margin-bottom:7px;
}
.user .bubble { background:var(--primary); color:white; border-color:transparent; }
.narration {
  display:block;
  font-style:italic;
  color:var(--muted);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.85;
  margin:8px 0;
}
.user .narration { text-align:right; }
.message-more {
  opacity:0;
  padding:3px 7px;
  border:0;
  background:var(--panel2);
  height:28px;
  align-self:center;
}
.message:hover .message-more,.message:focus-within .message-more,.message.selected .message-more { opacity:1; }

/* Character phone */
.phone {
  flex:0 0 auto;
  margin:0 12px 7px;
  border:1px solid #b4bfd338;
  border-radius:21px;
  overflow:hidden;
  background:var(--header);
  backdrop-filter:blur(18px);
  box-shadow:0 8px 25px #0002;
}
.phone summary {
  display:flex;
  justify-content:space-between;
  align-items:center;
  list-style:none;
  cursor:pointer;
  padding:6px 12px;
  font-size:10px;
  color:var(--muted);
}
.phone summary::-webkit-details-marker { display:none; }
.phone-content { padding:8px 14px 13px; font-size:11px; }
.phone-time { font-size:23px; font-weight:bold; margin-bottom:10px; }
.phone-notices { margin-top:9px; padding:10px; border:1px solid var(--border); border-radius:14px; background:var(--soft); }
.phone-notices p { margin:5px 0; font-size:11px; }
.phone-bar { width:85px; height:3px; background:var(--muted); border-radius:5px; margin:12px auto 0; }

/* Composer */
.composer { flex:0 0 auto; padding:8px 12px 10px; border-top:1px solid var(--border); background:var(--header); }
.composer textarea { resize:none; height:42px; min-height:42px; max-height:110px; font-size:12px; padding:8px 10px; }
.suggestions { margin-bottom:7px; min-width:0; }
.suggestions-panel { border:1px solid var(--border); border-radius:12px; background:var(--panel); overflow:hidden; }
.suggestions-panel > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:40px; padding:9px 11px; cursor:pointer; list-style:none; font-size:12px; font-weight:600; }
.suggestions-panel > summary::-webkit-details-marker { display:none; }
.suggestions-panel > summary::after { content:"⌄"; color:var(--muted); font-size:16px; line-height:1; transition:transform .15s ease; }
.suggestions-panel[open] > summary::after { transform:rotate(180deg); }
.suggestions-count { color:var(--muted); font-size:11px; font-weight:400; }
.suggestion-options { display:grid; gap:8px; padding:0 8px 8px; }
.suggestion-card { display:block; width:100%; min-width:0; padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); text-align:left; font:inherit; white-space:normal; line-height:1.55; }
.suggestion-card:active { transform:scale(.995); }
.suggestion-card-title { display:block; margin-bottom:6px; font-size:12px; font-weight:700; }
.suggestion-card-action { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
.suggestion-card-dialogue { display:block; font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
.suggestion-card-hint { display:block; margin-top:8px; color:var(--muted); font-size:10px; }
.chat-tools { display:flex; gap:6px; overflow-x:auto; margin-top:6px; padding-bottom:2px; }
.chat-tools button { white-space:nowrap; font-size:10px; padding:4px 7px; flex-shrink:0; }
.reply-draft-entry { margin-top:7px; gap:8px; }
.reply-draft-entry .reply-draft-hint { color:var(--muted); font-size:11px; line-height:1.5; }
.reply-draft-entry button { white-space:nowrap; flex-shrink:0; background:var(--soft); border-color:#818cf866; }
.reply-draft-editor { min-height:170px; max-height:42dvh; font-size:14px; }
.reply-draft-notice { padding:10px 12px; border:1px solid var(--border); border-radius:12px; color:var(--muted); font-size:12px; line-height:1.7; background:var(--panel2); }
.chat-overlay { position:absolute; inset:0; z-index:15; background:var(--header); backdrop-filter:blur(20px); padding:18px; overflow-y:auto; }
.overlay-heading { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.overlay-heading h2 { margin:0; }
.memory-item,.archive-card { padding:14px; border:1px solid var(--border); border-radius:14px; margin-top:12px; background:var(--panel); }
.album-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.photo-button { position:relative; padding:0; overflow:hidden; aspect-ratio:1; }
.photo-button img { width:100%; height:100%; object-fit:cover; }
.photo-date { position:absolute; bottom:0; left:0; right:0; padding:10px; font-size:10px; color:white; background:linear-gradient(transparent,#000d); }
.log-row { padding:14px 0; border-bottom:1px solid var(--border); }
.switch-row { display:flex; gap:12px; align-items:center; padding:12px 0; }
.notice { padding:18px; border:1px solid var(--border); border-radius:16px; margin-top:12px; background:var(--panel); }

/* Dialog */
dialog {
  width:min(560px,calc(100vw - 26px));
  max-height:90dvh;
  overflow-y:auto;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:22px;
  border-radius:20px;
  box-shadow:0 25px 100px #0008;
}
dialog::backdrop { background:#000a; backdrop-filter:blur(4px); }
.modal-heading { margin-bottom:20px; }
.modal-heading h2 { margin:0; }
#toast {
  position:fixed;
  left:50%;
  top:max(18px, env(safe-area-inset-top));
  bottom:auto;
  transform:translateX(-50%);
  background:var(--text);
  color:var(--bg);
  z-index:2147483647;
  padding:12px 18px;
  border-radius:13px;
  max-width:min(90vw,560px);
  text-align:center;
  line-height:1.6;
  overflow-wrap:anywhere;
  pointer-events:none;
  box-shadow:0 8px 32px #0005;
}
@media(max-width:1050px) {
  .chat-layout { grid-template-columns:210px minmax(0,1fr); }
}
@media(max-width:767px) {
  .sidebar { display:none; }
  .app { margin-left:0; }
  header { height:58px; padding:0 10px; gap:6px; }
  .desktop-title { display:none; }
  .mobile-logo { display:block; padding:0; }
  .mobile-logo .logo-img { width:86px; height:23px; }
  .environment { font-size:8px; }
  .wallet-button { padding:4px 6px; gap:5px; font-size:10px; }
  .wallet-button .avatar { width:24px; height:24px; }
  /*
   * 手機底部導覽需與六個入口同列，避免新增「群組聊天」後自動換行，
   * 導致固定導覽列變高並遮住個人帳號頁底部操作。
   */
  .app { min-height:100dvh; }
  main {
    padding:16px 12px calc(104px + env(safe-area-inset-bottom));
    min-height:calc(100dvh - 58px);
  }
  .hero { padding:24px; min-height:275px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; }
  .card-body { padding:10px; }
  .card-chat { opacity:1; font-size:12px; padding:8px; }
  .detail-layout,.two-col { grid-template-columns:1fr; }
  .panel { padding:18px; }
  .mobile-nav {
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:40;
    border-top:1px solid var(--border);
    background:var(--header);
    backdrop-filter:blur(15px);
    padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  }
  .mobile-nav .nav-btn {
    min-width:0;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    font-size:clamp(8px,2.4vw,10px);
    line-height:1.2;

<script>
'use strict';

  const SUPABASE_URL = 'https://ouyewoagbmtqehbofrje.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_MyTDqAKNTkK4zo7eap8gZA_ZGozHRMd';

  if (!window.mySupabase) {
    window.mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  /*
   * Supabase Auth 與 PersonaX 本機 UI 狀態的唯一同步入口。
   * 不直接改 DOM，也絕對不刪除 #modal。
   */
  const USER_SESSIONS_KEY_PREFIX = 'personax-chat-sessions-v1:';

  function cacheSessionsForUser(uid) {
    if (!uid || typeof state === 'undefined') return;
    try {
      localStorage.setItem(USER_SESSIONS_KEY_PREFIX + uid, JSON.stringify(state.sessions || {}));
    } catch (error) {
      console.warn('聊天本機備份失敗：', error);
    }
  }

  function restoreSessionsForUser(uid) {
    if (!uid) return {};
    try {
      const saved = JSON.parse(localStorage.getItem(USER_SESSIONS_KEY_PREFIX + uid) || '{}');
      return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    } catch (_) {
      return {};
    }
  }

  function isolateSessionsForUser(nextUid) {
    const previousUid = state.account?.uid || null;
    if (previousUid === nextUid && nextUid) return;

    // 先把上一個帳號的聊天存入該 UID 專屬的本機區域，再切換到新帳號的聊天。
    if (previousUid) cacheSessionsForUser(previousUid);
    state.sessions = nextUid ? restoreSessionsForUser(nextUid) : {};
    // 舊聊天可能附帶只為該帳號載入的私密角色快照，不可留給下一個帳號。
    state.characters = state.characters.filter(character =>
      !character.cloudSnapshotOnly &&
      (character.visibility !== 'private' || character.authorId === nextUid)
    );
    if (route?.page === 'conversation') route = {page:'home'};
  }

  function syncSupabaseUser(user) {
    if (typeof state === 'undefined') {
      window.__pendingSupabaseUser = user || null;
      return;
    }

    if (!user) {
      isolateSessionsForUser(null);
      pendingDeletionWalletSyncUid = null;
      state.signedIn = false;
      state.account = null;
      persist();
      void loadPublicSupabaseCharacters();
      render();
      return;
    }

    isolateSessionsForUser(user.id);
    const metadata = user.user_metadata || {};
    const previous =
      state.account?.uid === user.id ? state.account : {};
    const wasPendingDeletion = previous.accountDeletionPending === true;
    const nickname =
      metadata.full_name ||
      metadata.name ||
      metadata.user_name ||
      user.email?.split('@')[0] ||
      'PersonaX 使用者';

    const avatarUrl =
      metadata.avatar_url ||
      metadata.picture ||
      previous.avatar ||
      '';

    state.account = {
      ...previous,
      uid: user.id,
      nickname,
      email: user.email || previous.email || '',
      avatar: avatarUrl,
      bio: previous.bio || '',
      diamonds: Number(
        metadata.diamonds ??
        previous.diamonds ??
        0
      ),
      silver: Number(
        metadata.silver ??
        previous.silver ??
        0
      ),
      member: metadata.member || previous.member || 'free'
    };
    state.signedIn = true;

    // 本機記錄為待刪除時，先暫緩顯示狀態視窗，等資料庫確認並讀完真實錢包。
    if (wasPendingDeletion) pendingDeletionWalletSyncUid = user.id;

    persist();
    // 真實會員資料與錢包由資料庫載入；不可把 user_metadata 當成正式餘額。
    void loadSupabaseProfileAndWallet(user);
    void loadPublicSupabaseCharacters();
    void loadSupabaseCharacters(user);
      void loadCloudChatSessions(user);

    // OAuth 返回後，不要把使用者留在登入遮罩；回到登入前想去的頁面。
    const next = localStorage.getItem('personaX_login_next');
    localStorage.removeItem('personaX_login_next');

    if (next) {
      try {
        const parsed = JSON.parse(next);
        if (parsed && parsed.page) {
          go(parsed, true);
          return;
        }
      } catch (_) {}
    }

    // 若目前還停在登入遮罩，直接關閉它；否則只重新渲染帳號區。
    if (route?.overlay?.name === 'login') {
      const cleanRoute = {...route};
      delete cleanRoute.overlay;
      go(cleanRoute, true);
    } else {
      render();
    }
  }

  // 從 Supabase Database 讀取真正的會員資料與錢包餘額。
  // 表名與欄位依目前提供的資料庫截圖：profiles / wallet_accounts。
  async function loadSupabaseProfileAndWallet(user, throwOnError = false) {
    if (!user?.id || !window.mySupabase) return;
    const client = window.mySupabase;

    try {
      // 先檢查後端帳號刪除期限；待刪除帳號只能取消申請，不能繼續使用功能。
      const { data: deletionData, error: deletionError } = await client.rpc(
        'get_account_deletion_status'
      );
      if (deletionError) throw new Error('讀取帳號刪除狀態失敗：' + deletionError.message);
      const deletionStatus = Array.isArray(deletionData) ? deletionData[0] : deletionData;
      if (deletionStatus?.is_pending) {
        if (state.account?.uid !== user.id) return;

        // 待刪除帳號仍讀取既有錢包餘額；只 SELECT，不初始化或補發銀幣。
        const { data: pendingWallet, error: pendingWalletError } = await client
          .from('wallet_accounts')
          .select('diamonds, silver_coins')
          .eq('user_id', user.id)
          .maybeSingle();

        state.account = {
          ...state.account,
          accountDeletionPending: true,
          deletionScheduledFor: deletionStatus.scheduled_for
        };
        if (!pendingWalletError && pendingWallet) {
          // 先取得資料庫餘額，才允許 render() 顯示待刪除狀態視窗。
          pendingDeletionWalletSyncUid = null;
        }
        if (pendingWalletError) {
          console.error('讀取待刪除帳號錢包失敗：', pendingWalletError);
          toast('帳號仍在待刪除狀態，但錢包餘額讀取失敗；尚未修改或補發銀幣。');
        } else if (pendingWallet) {
          state.account.diamonds = Number(pendingWallet.diamonds ?? 0);
          state.account.silver = Number(pendingWallet.silver_coins ?? 0);
        } else {
          console.warn('待刪除帳號找不到既有 wallet_accounts 資料；未自動建立錢包。');
          toast('找不到此帳號的既有錢包資料，系統沒有自動補發銀幣。');
        }

        state.signedIn = true;
        persist();
        render();
        if (!state.account.accountDeletionModalDismissed &&
            route?.overlay?.name !== 'account-deletion-pending') {
          openModal('account-deletion-pending', {
            scheduledFor: deletionStatus.scheduled_for
          });
        }
        return;
      }
      if (state.account?.uid === user.id) {
        delete state.account.accountDeletionPending;
        delete state.account.deletionScheduledFor;
      }
      // 資料庫確認帳號不在待刪除期後，解除視窗等待；正常錢包同步完成後才會重新 render。
      if (pendingDeletionWalletSyncUid === user.id) {
        pendingDeletionWalletSyncUid = null;
      }

      let { data: profile, error: profileError } = await client
        .from('profiles')
        .select('id, handle, nickname, avatar_url, bio')
        .eq('id', user.id)
        .maybeSingle();

      if (profileError) throw new Error('讀取 profiles 失敗：' + profileError.message);

      if (!profile) {
        const metadata = user.user_metadata || {};
        const baseName = metadata.full_name || metadata.name ||
          metadata.user_name || user.email?.split('@')[0] || 'PersonaX 使用者';
        const handle = 'user_' + user.id.replace(/-/g, '').slice(0, 12);
        const result = await client.from('profiles').upsert({
          id: user.id,
          handle,
          nickname: String(baseName).slice(0, 25),
          avatar_url: metadata.avatar_url || metadata.picture || null,
          bio: ''
        }, { onConflict: 'id' }).select('id, handle, nickname, avatar_url, bio').single();
        if (result.error) throw new Error('建立 profiles 失敗：' + result.error.message);
        profile = result.data;
      }

      // 安全初始化：由資料庫依 auth.uid() 建立新錢包（0 鑽石、100 銀幣），
      // 舊會員則保留原餘額。前端不再直接 INSERT/UPSERT wallet_accounts。
      const { data: walletData, error: walletError } = await client.rpc(
        'ensure_wallet_account'
      );
      if (walletError) {
        throw new Error(
          '初始化錢包失敗：' + walletError.message +
          '。請確認已在 Supabase 建立 public.ensure_wallet_account() 函式。'
        );
      }

      const walletRow = Array.isArray(walletData) ? walletData[0] : walletData;
      if (!walletRow || walletRow.diamonds == null || walletRow.silver_coins == null) {
        throw new Error('錢包初始化函式沒有回傳有效的鑽石與銀幣餘額。');
      }

      // 避免較早發出的請求覆蓋另一個已登入帳號。
      if (state.account?.uid !== user.id) return;
      state.account = {
        ...state.account,
        nickname: profile.nickname || state.account.nickname,
        handle: profile.handle || '',
        avatar: profile.avatar_url || state.account.avatar || '',
        bio: profile.bio || '',
        diamonds: Number(walletRow.diamonds ?? 0),
        silver: Number(walletRow.silver_coins ?? 0)
      };
      state.signedIn = true;
      persist();
      render();
    } catch (error) {
      console.error('PersonaX 資料庫同步失敗：', error);
      // 取消申請後的刷新由呼叫端顯示專屬訊息；一般登入流程仍使用原本提示。
      if (throwOnError) throw error;
      if (state.account?.uid === user.id) {
        toast('已登入，但會員資料或錢包同步失敗。請檢查 Supabase RLS 權限與資料表設定。');
      }
    }
  }

  // 探索頁公開角色獨立於登入帳號載入，訪客也能看見。
  // 每次登入／登出都以雲端公開清單為準，避免沿用前一個帳號的過期本機資料。
  async function loadPublicSupabaseCharacters() {
    const client = window.mySupabase;
    if (!client) return;
    try {
      const { data: rows, error } = await client
        .from('characters')
        .select('id, author_id, name, gender, age, avatar_url, visibility, review_status, intro, race, style, tags, created_at, first_published_at, latest_eligible')
        .eq('visibility', 'public')
        .is('deleted_at', null)
        .order('first_published_at', { ascending: false, nullsFirst: false });
      if (error) throw new Error(error.message);

      const ids = (rows || []).map(row => row.id);
      const authorIds = [...new Set((rows || []).map(row => row.author_id).filter(Boolean))];
      if (authorIds.length) {
        const profileResult = await client.from('profiles')
          .select('id, handle, nickname, avatar_url, bio')
          .in('id', authorIds);
        if (profileResult.error) {
          console.warn('角色作者資料載入失敗，仍繼續顯示公開角色：', profileResult.error.message);
        }
        for (const profile of profileResult.data || []) {
          state.authors[profile.id] = {
            uid:profile.id, handle:profile.handle || '',
            nickname:profile.nickname || profile.handle || 'PersonaX 使用者',
            avatar:profile.avatar_url || '', bio:profile.bio || '',
            fans:state.authors[profile.id]?.fans || 0
          };
        }
      }
      let stories = [];
      if (ids.length) {
        const result = await client
          .from('character_stories')
          .select('id, character_id, story_name, description, opening_message, visibility, created_at')
          .in('character_id', ids)
          .eq('visibility', 'public')
          .order('created_at', { ascending: false });
        if (result.error) throw new Error(result.error.message);
        stories = result.data || [];
      }
      const latestStory = new Map();
      for (const story of stories) {
        if (!latestStory.has(story.character_id)) latestStory.set(story.character_id, story);
      }

      const publicCharacters = (rows || []).map(row => {
        const story = latestStory.get(row.id);
        return {
          id: row.id, name: row.name || '未命名角色',
          gender: row.gender || 'ambiguous',
          age: row.age == null ? '' : String(row.age),
          image: row.avatar_url || '', visibility: 'public',
          reviewStatus: row.review_status, intro: row.intro || '',
          opening: story?.opening_message || '', race: row.race || '',
          privateInfo: '', style: row.style || '',
          tags: Array.isArray(row.tags) ? row.tags : [],
          authorId: row.author_id, owner: state.account?.uid === row.author_id,
          chats: '0', users: null,
          createdAt: row.created_at ? new Date(row.created_at).getTime() : 0,
          firstPublishedAt: row.first_published_at ? new Date(row.first_published_at).getTime() : null,
          latestEligible: row.latest_eligible !== false,
          rightsConfirmed: false, cloudPublic: true
        };
      });

      const publicIds = new Set(publicCharacters.map(character => character.id));
      const currentUid = state.account?.uid || null;
      // 只保留示範角色與目前登入帳號自己的未刪除角色，避免帳號切換時顯示其他帳號的本機私密草稿。
      const keepLocal = state.characters.filter(character =>
        String(character.id).startsWith('seed-') ||
        (!!currentUid && character.authorId === currentUid && !character.deletedAt)
      );
      state.characters = [...publicCharacters, ...keepLocal.filter(character => !publicIds.has(character.id))];
      persist();
      render();
    } catch (error) {
      console.error('公開角色載入失敗：', error);
      if (state.account?.uid) toast('公開角色載入失敗：' + error.message);
    }
  }

  async function loadSupabaseCharacters(user) {
    const client = window.mySupabase;
    if (!client || !user?.id) return;
    try {
      const { data: authResult, error: authError } = await client.auth.getUser();
      if (authError || authResult?.user?.id !== user.id) return;

      // 先讀取雲端角色；將此裝置上屬於目前帳號、但雲端尚不存在的舊角色補上雲端。
      // 這可修復舊版匯入只存 localStorage 的資料；不會上傳其他帳號的本機角色。
      let { data: rows, error } = await client
        .from('characters')
        .select('id, author_id, name, gender, age, avatar_url, visibility, review_status, intro, race, style, tags, created_at, first_published_at, latest_eligible, rights_confirmed, deleted_at, deletion_reason')
        .eq('author_id', user.id)
        .order('created_at', { ascending: false });
      if (error) throw new Error('讀取雲端角色失敗：' + error.message);

      if (state.account?.uid !== user.id) return;
      const localOwned = state.characters.filter(c => c.authorId === user.id && c.id);
      const cloudIdsBeforeMigration = new Set((rows || []).map(row => row.id));
      const localOnly = localOwned.filter(c => !cloudIdsBeforeMigration.has(c.id));
      const migrationErrors = [];
      let migratedCount = 0;

      for (const character of localOnly) {
        try {
          const result = await saveSupabaseCharacter(character, user.id);
          migratedCount++;
          if (result?.storyError) migrationErrors.push(character.name + '：' + result.storyError);
        } catch (migrationError) {
          migrationErrors.push((character.name || '未命名角色') + '：' + migrationError.message);
        }
      }

      // 補傳後重新讀取，以資料庫結果為準；失敗的本機角色仍會保留在本機。
      if (migratedCount > 0) {
        const refreshed = await client
          .from('characters')
          .select('id, author_id, name, gender, age, avatar_url, visibility, review_status, intro, race, style, tags, created_at, first_published_at, latest_eligible, rights_confirmed, deleted_at, deletion_reason')
          .eq('author_id', user.id)
          .order('created_at', { ascending: false });
        if (refreshed.error) throw new Error('角色補傳後重新讀取失敗：' + refreshed.error.message);
        rows = refreshed.data || [];
      }

const ids = (rows || []).map(row => row.id);
      // 隱藏設定只從作者專用資料表讀取，不再從公開 characters 資料列取得。
      const privateInfoById = new Map();
      if (ids.length) {
        const privateInfoResult = await client.from('character_private_info')
          .select('character_id, private_info')
          .eq('author_id', user.id)
          .in('character_id', ids);
        if (privateInfoResult.error) {
          throw new Error('讀取角色隱藏設定失敗：' + privateInfoResult.error.message);
        }
        for (const item of privateInfoResult.data || []) {
          privateInfoById.set(item.character_id, item.private_info || '');
        }
      }
      // 私密角色不會經過公開角色載入器；在作者自己的角色載入流程也補齊作者 profile。
      const authorIds = [...new Set((rows || []).map(row => row.author_id).filter(Boolean))];
      if (authorIds.length) {
        const profileResult = await client.from('profiles')
          .select('id, handle, nickname, avatar_url, bio')
          .in('id', authorIds);
        if (profileResult.error) {
          console.warn('私密角色作者資料載入失敗：', profileResult.error.message);
        } else {
          for (const profile of profileResult.data || []) {
            state.authors[profile.id] = {
              uid:profile.id, handle:profile.handle || '',
              nickname:profile.nickname || profile.handle || 'PersonaX 使用者',
              avatar:profile.avatar_url || '', bio:profile.bio || '',
              fans:state.authors[profile.id]?.fans || 0
            };
          }
        }
      }
      let stories = [];
      if (ids.length) {
        const result = await client
          .from('character_stories')
          .select('id, character_id, story_name, description, opening_message, visibility, created_at')
          .in('character_id', ids)
          .order('created_at', { ascending: false });
        if (result.error) throw new Error('讀取雲端角色故事失敗：' + result.error.message);
        stories = result.data || [];
      }
      const latestStory = new Map();
      for (const story of stories) {
        if (!latestStory.has(story.character_id)) latestStory.set(story.character_id, story);
      }
      if (state.account?.uid !== user.id) return;
      const localOwnedForMerge = state.characters.filter(c => c.authorId === user.id);
      const cloudCharacters = (rows || []).filter(row => !row.deleted_at).map(row => {
        const local = localOwnedForMerge.find(c => c.id === row.id) || {};
        const story = latestStory.get(row.id);
        return {
          ...local,
          id: row.id,
          name: row.name || local.name || '未命名角色',
          gender: row.gender || local.gender || 'ambiguous',
          age: row.age == null ? (local.age || '') : String(row.age),
          image: row.avatar_url || local.image || '',
          visibility: row.visibility || 'private',
          intro: row.intro ?? local.intro ?? '',
          opening: story?.opening_message ?? local.opening ?? '',
          race: row.race ?? local.race ?? '',
          privateInfo: privateInfoById.get(row.id) ?? local.privateInfo ?? '',
          style: row.style ?? local.style ?? '',
          tags: Array.isArray(row.tags) ? row.tags : (local.tags || []),
          authorId: row.author_id,
          owner: true,
          chats: local.chats || '0',
          users: local.users ?? null,
          createdAt: row.created_at ? new Date(row.created_at).getTime() : (local.createdAt || Date.now()),
          firstPublishedAt: row.first_published_at ? new Date(row.first_published_at).getTime() : null,
          latestEligible: row.latest_eligible !== false,
          rightsConfirmed: row.rights_confirmed === true
        };
      });
      const cloudIds = new Set((rows || []).map(row => row.id));
      state.characters = [
        ...cloudCharacters,
        ...state.characters.filter(c => c.authorId !== user.id || !cloudIds.has(c.id))
      ];
      persist();
      render();
      if (migrationErrors.length) {
        console.warn('PersonaX 舊角色補傳有部分失敗：', migrationErrors);
        toast('有些本機角色尚未同步：' + migrationErrors.slice(0, 2).join('；'));
      } else if (migratedCount > 0) {
        toast('已將 ' + migratedCount + ' 個本機角色補同步到雲端。');
      }
    } catch (error) {
      console.error('PersonaX 雲端角色載入失敗：', error);
      if (state.account?.uid === user.id) {
        toast('登入成功，但雲端角色載入失敗：' + error.message);
      }
    }
  }

  async function saveSupabaseCharacter(character, expectedUserId) {
    const client = window.mySupabase;
    if (!client || !expectedUserId) throw new Error('請先使用 Google 帳號登入，再儲存角色。');

    const { data: authResult, error: authError } = await client.auth.getUser();
    if (authError || authResult?.user?.id !== expectedUserId) {
      throw new Error('登入狀態驗證失敗，請重新登入後再儲存角色。');
    }

    const ageValue = String(character.age ?? '').trim();
    const age = ageValue && Number.isFinite(Number(ageValue))
      ? Number.parseInt(ageValue, 10)
      : null;

    const nextVisibility = character.visibility === 'public' ? 'public' : 'private';
    // 公開必須由創作者明確勾選權利確認；私密草稿不會自動視為已確認。
    const rightsConfirmed = character.rightsConfirmed === true || character.rightsConfirmed === 'true';
    if (nextVisibility === 'public' && !rightsConfirmed) {
      throw new Error('公開角色前，請先勾選「我確認角色沒有侵犯智慧財產權、形象或其他任何權利。」');
    }
    // 先讀取既有上架紀錄，避免 upsert 把首次公開時間或資格重設。
    const { data: existingCharacter, error: existingCharacterError } = await client
      .from('characters')
      .select('visibility, first_published_at, latest_eligible, rights_confirmed, deleted_at')
      .eq('id', character.id)
      .eq('author_id', expectedUserId)
      .maybeSingle();
    if (existingCharacterError) {
      throw new Error('讀取角色上架紀錄失敗：' + existingCharacterError.message);
    }
    if (existingCharacter?.deleted_at) {
      throw new Error('此角色已被刪除，不能重新公開或修改。若要創作新版本，請建立新角色。');
    }

    const firstPublishedAt = existingCharacter?.first_published_at ||
      (nextVisibility === 'public' ? new Date().toISOString() : null);
    // 「最新角色」資格只看首次公開時間的 24 小時窗口。
    // 轉私密不重設首次公開時間；24 小時內重新公開仍可回到最新，超過期限則不可。
    const firstPublishedMs = firstPublishedAt ? new Date(firstPublishedAt).getTime() : NaN;
    const latestEligible = Number.isFinite(firstPublishedMs) &&
      Date.now() - firstPublishedMs >= 0 &&
      Date.now() - firstPublishedMs <= DAY;

    const row = {
      id: character.id,
      author_id: expectedUserId,
      name: String(character.name || '').trim(),
      title: null,
      gender: character.gender || null,
      age,
      avatar_url: character.image || null,
      visibility: nextVisibility,
      review_status: nextVisibility === 'public' ? 'approved' : 'draft',
      first_published_at: firstPublishedAt,
      latest_eligible: latestEligible,
      rights_confirmed: rightsConfirmed || existingCharacter?.rights_confirmed === true,
      intro: character.intro || '',
      race: character.race || '',
      style: character.style || '',
      tags: Array.isArray(character.tags) ? character.tags : []
    };

    const { error: characterError } = await client
      .from('characters')
      .upsert(row, { onConflict: 'id' });
if (characterError) {
      throw new Error('角色資料寫入 Supabase 失敗：' + characterError.message);
    }
    // 隱藏設定獨立儲存，characters 公開資料列永遠不包含 privateInfo。
    const { error: privateInfoError } = await client
      .from('character_private_info')
      .upsert({
        character_id: character.id,
        author_id: expectedUserId,
        private_info: String(character.privateInfo || '').slice(0, 10000)
      }, { onConflict: 'character_id' });
    if (privateInfoError) {
      throw new Error('角色基本資料已寫入，但隱藏設定儲存失敗：' + privateInfoError.message);
    }
    // 重新讀取資料庫，避免 RLS／trigger／資料庫規則拒絕公開卻讓前端顯示成功。
    const { data: savedCharacter, error: verifyError } = await client
      .from('characters')
      .select('visibility, first_published_at, latest_eligible, rights_confirmed, deleted_at')
      .eq('id', character.id)
      .eq('author_id', expectedUserId)
      .maybeSingle();
    if (verifyError) throw new Error('角色已送出寫入，但無法驗證資料庫結果：' + verifyError.message);
    if (!savedCharacter) throw new Error('角色寫入後查不到資料，請檢查 Supabase 權限設定。');
    if (savedCharacter.visibility !== nextVisibility) {
      throw new Error('資料庫中的角色狀態仍是「' + savedCharacter.visibility + '」，沒有成功改成「' + nextVisibility + '」。請檢查 Supabase RLS 政策或資料庫 trigger。');
    }
    if (nextVisibility === 'public' && savedCharacter.rights_confirmed !== true) {
      throw new Error('資料庫尚未記錄權利確認，角色不能公開。');
    }

    // 每個角色先沿用最新的一筆故事；沒有故事時才新增，避免每次編輯都重複建立。
    const { data: existingStory, error: lookupError } = await client
      .from('character_stories')
      .select('id')
      .eq('character_id', character.id)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (lookupError) {
      return { storyError: '角色已儲存，但讀取故事資料失敗：' + lookupError.message };
    }

    const storyRow = {
      character_id: character.id,
      story_name: String(character.name || '角色') + '的故事',
      description: character.intro || '',
      opening_message: character.opening || '',
      visibility: character.visibility === 'public' ? 'public' : 'private'
    };

    let storyResult;
    if (existingStory?.id) {
      storyResult = await client
        .from('character_stories')
        .update(storyRow)
        .eq('id', existingStory.id);
    } else {
      storyResult = await client
        .from('character_stories')
        .insert(storyRow);
    }

    if (storyResult.error) {
      return { storyError: '角色已儲存，但開場故事儲存失敗：' + storyResult.error.message };
    }
    return { storyError: null, visibility: savedCharacter.visibility, rightsConfirmed: savedCharacter.rights_confirmed === true, firstPublishedAt: savedCharacter.first_published_at ? new Date(savedCharacter.first_published_at).getTime() : null, latestEligible: savedCharacter.latest_eligible !== false };
  }

    try {
      const next = route?.overlay?.next || route || {page:'home'};
      localStorage.setItem('personaX_login_next', JSON.stringify(next));

      const { error } = await window.mySupabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin,
          // 明確顯示 Google 帳號選擇器，方便切換到另一個帳號。
          queryParams: { prompt: 'select_account' }
        }
      });

      if (error) {
        localStorage.removeItem('personaX_login_next');
        console.error('Google 登入失敗：', error);
        alert('登入失敗：' + error.message);
      }
    } catch (error) {
      localStorage.removeItem('personaX_login_next');
      console.error('Google 登入例外：', error);
      alert('登入失敗，請稍後再試。');
    }
  }

  window.addEventListener('load', async () => {
    try {
      const { data, error } = await window.mySupabase.auth.getSession();

      if (error) {
        console.error('Supabase Session 讀取失敗：', error);
        return;

      syncSupabaseUser(data?.session?.user || null);

        // INITIAL_SESSION / SIGNED_IN / TOKEN_REFRESHED 等狀態都統一交給同一入口。
        syncSupabaseUser(session?.user || null);
      });
    } catch (error) {
      console.error('Supabase Auth 初始化失敗：', error);
    }
  });

  // 否則聊天／訊息會被 isUuid() 靜默略過，無法同步到雲端。
  const bytes = new Uint8Array(16);
  if (window.crypto?.getRandomValues) {

  } else {
    for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' +
    hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);

function cleanOldText(text) {

    /\s*［(?:固定示範回覆，非 AI 生成|空白送出的接續示範，非 AI 生成)］/g,''
  );

function migrateOld(old) {
  const next = freshState();
  if (!old || !Array.isArray(old.characters)) return next;

  next.account = old.user || null;
  next.signedIn = !!old.user;
  if (next.account) next.account.silver ??= 0;

  next.characters = old.characters.map(c => ({
    ...c,
    authorId:c.authorId || (c.owner ? 'demo-local-account' : 'personax-studio'),
    users:c.users ?? c.userCount ?? null
  }));
  next.authors = {...next.authors,...(old.authors || {})};
  next.comments = old.comments || {};
  next.favorites = old.favorites || [];
  next.preferences = old.preferences || [];
  next.following = old.following || [];

  for (const [characterId,chat] of Object.entries(old.chats || {})) {
    if (!next.characters.some(c => c.id === characterId)) continue;

    const sessionId = id();
    next.sessions[sessionId] = {
      id:sessionId, characterId,
      name:'', archived:false,
      hidden:!!chat.hidden, pinned:!!chat.pinned,
      persona:chat.persona || '',
      suggestions:chat.suggestions !== false,
      background:chat.settings?.background || 'avatar',
      startedAt:chat.startedAt || chat.messages?.[0]?.at || Date.now(),
      messages:(chat.messages || []).map(m => ({...m,text:cleanOldText(m.text)})),
      memories:chat.memories || [],
      album:chat.album || []
    };

    for (const archive of chat.archives || []) {
      const archiveId = id();
      next.sessions[archiveId] = {
        id:archiveId, characterId,
        name:[...String(archive.name || '舊的回憶')].slice(0,25).join(''),
        archived:true, hidden:false, pinned:false,
        persona:archive.persona || '',
        suggestions:true, background:chat.settings?.background || 'avatar',
        startedAt:archive.startedAt || Date.now(),
        archivedAt:archive.archivedAt || Date.now(),
        messages:(archive.messages || []).map(m => ({...m,text:cleanOldText(m.text)})),
        memories:archive.memories || [], album:archive.album || []
      };
    }
  }

  if (next.account) {
    next.ledger.push({
      id:id(), currency:'diamond',
      change:Number(next.account.diamonds || 0),
      balance:Number(next.account.diamonds || 0),
      reason:'轉入既有本機餘額', at:Date.now()
    });
  }
  return next;
}

    }
    return migrateOld(JSON.parse(localStorage.getItem(OLD_KEY)));

    return freshState();
  }
}

async function saveChatSessionToCloud(s, options = {}) {
  const client = window.mySupabase;
  const localUser = currentUser();
  if (!client || !localUser?.uid || !s) return false;
  if (!isUuid(s.characterId) || !isUuid(s.id)) return false;
  // 空白聊天只存在本機；玩家真正送出訊息後才建立雲端聊天紀錄。
  if (!(s.messages || []).some(message => message.role === 'user' && String(message.text || '').trim())) return false;
  const { data: authResult, error: authError } = await client.auth.getUser();
  if (authError || authResult?.user?.id !== localUser.uid) {
    throw new Error('登入狀態驗證失敗，聊天尚未同步。');
  }
  const character = state.characters.find(item => item.id === s.characterId) || null;
  if (s.cloudOwned && s.cloudOwnerUid === localUser.uid) {
    const currentRow = await client.from('chat_sessions').select('character_snapshot')
      .eq('id',s.id).eq('user_id',localUser.uid).maybeSingle();
    if (currentRow.error) throw new Error('讀取既有聊天快照失敗：'+currentRow.error.message);
    if (currentRow.data?.character_snapshot) s.cloudCharacterSnapshot = currentRow.data.character_snapshot;
  }
  const priorSnapshot = s.cloudCharacterSnapshot && typeof s.cloudCharacterSnapshot === 'object'
    ? s.cloudCharacterSnapshot : {};
  if (priorSnapshot.id && priorSnapshot.id !== s.characterId) {
    throw new Error('既有聊天角色快照與角色 ID 不一致，已停止同步以避免覆寫錯誤角色資料。');
  }
  if (!character && (!s.cloudOwned || !priorSnapshot.id)) {
    throw new Error('找不到這段聊天所屬的正式角色或既有角色快照。');
  }
// 舊版快照可能曾含隱藏設定；同步前先剔除，避免再次寫回玩家可讀的 chat_sessions。
  const { privateInfo: _legacyPrivateInfo, ...safePriorSnapshot } = priorSnapshot;
  const snapshot = {
    ...safePriorSnapshot,
    id:s.characterId,
    name:character?.name || priorSnapshot.name || s.characterName || '角色',
    gender:character?.gender || priorSnapshot.gender || 'ambiguous',
    age:character?.age ?? priorSnapshot.age ?? '',
    image:character?.image || priorSnapshot.image || '',
    intro:character?.intro ?? priorSnapshot.intro ?? '',
    opening:character?.opening ?? priorSnapshot.opening ?? '',
    race:character?.race ?? priorSnapshot.race ?? '',
    style:character?.style ?? priorSnapshot.style ?? '',
    tags:Array.isArray(character?.tags) ? character.tags : (Array.isArray(priorSnapshot.tags) ? priorSnapshot.tags : []),
    authorId:character?.authorId || priorSnapshot.authorId || '',
    visibility:priorSnapshot.visibility || character?.visibility || 'private',
    firstPublishedAt:priorSnapshot.firstPublishedAt || character?.firstPublishedAt || null,
    deletedAt:priorSnapshot.deletedAt || character?.deletedAt || null
  };
  // 若本機未標記 cloudOwned，先確認這個 ID 是否已存在，避免對舊聊天誤做 INSERT。
  if (!s.cloudOwned) {
    const existing = await client.from('chat_sessions').select('id,character_snapshot')
      .eq('id',s.id).eq('user_id',localUser.uid).maybeSingle();
    if (existing.error) throw new Error('檢查既有聊天失敗：'+existing.error.message);
    if (existing.data) {
      const existingSnapshot = existing.data.character_snapshot;
      if (existingSnapshot?.id && existingSnapshot.id !== s.characterId) {
        throw new Error('雲端既有聊天的角色快照與角色 ID 不一致，已停止同步以避免覆寫錯誤角色資料。');
      }
      s.cloudOwned = true;
      s.cloudOwnerUid = localUser.uid;
      const { privateInfo: _legacyExistingPrivateInfo, ...safeExistingSnapshot } = existingSnapshot || {};
      s.cloudCharacterSnapshot = existingSnapshot ? safeExistingSnapshot : snapshot;
      const canonical = s.cloudCharacterSnapshot;
      snapshot.authorId = canonical.authorId || snapshot.authorId;
      snapshot.visibility = canonical.visibility || snapshot.visibility;
      snapshot.firstPublishedAt = canonical.firstPublishedAt || snapshot.firstPublishedAt;
      snapshot.deletedAt = canonical.deletedAt || snapshot.deletedAt;
    }
  }
  const row = {
    id:s.id, user_id:localUser.uid, character_id:s.characterId,
    character_name:snapshot.name,
    status:s.archived ? 'archived' : 'active',
    character_snapshot:snapshot, session_data:chatSessionData(s),
    updated_at:new Date().toISOString()
  };
  let sessionWrite;
  if (s.cloudOwned && s.cloudOwnerUid === localUser.uid) {
    // 已存在的聊天使用 UPDATE；即使角色已下架，也可繼續保存原有劇情。
    sessionWrite = await client.from('chat_sessions').update(row)
      .eq('id', s.id).eq('user_id', localUser.uid).select('id').maybeSingle();
  } else {
    // 新聊天只能在角色仍可建立新對話時 INSERT。
    if (character.deletedAt || (character.visibility !== 'public' && character.firstPublishedAt)) {
      throw new Error('此角色已被作者調整為私密或刪除狀態，不支持開啟新對話');
    }
    sessionWrite = await client.from('chat_sessions').insert(row).select('id').maybeSingle();
  }
  if (sessionWrite.error) throw new Error('聊天基本資料同步失敗：'+sessionWrite.error.message);
  if (!sessionWrite.data?.id) {
    throw new Error('資料庫未確認聊天基本資料已寫入；本次不會標記同步成功。');
  }
  s.cloudOwned = true;
  s.cloudOwnerUid = localUser.uid;
  s.cloudCharacterSnapshot = snapshot;
  const messages = (s.messages || []).filter(m => isUuid(m.id)).map(m => ({
    id:m.id, session_id:s.id,
    role:m.role === 'user' ? 'user' : 'assistant',
    content:String(m.text ?? ''), created_at:new Date(Number(m.at) || Date.now()).toISOString()
  }));
  if (messages.length) {
    const { data: savedMessages, error: messageError } = await client.from('chat_messages')
      .upsert(messages,{onConflict:'id'}).select('id');
    if (messageError) throw new Error('聊天訊息同步失敗：'+messageError.message);
    if (!Array.isArray(savedMessages) || savedMessages.length !== messages.length) {
      throw new Error('資料庫回報的已儲存訊息數量不符；請重新整理確認，勿視為同步完成。');
    }
  }
  return true;
}
async function loadCloudChatSessions(user) {
  const client = window.mySupabase;
  if (!client || !user?.id) return;
  try {
    const { data: authResult, error: authError } = await client.auth.getUser();
    if (authError || authResult?.user?.id !== user.id) return;
    const { data: rows, error } = await client.from('chat_sessions')
      .select('id,user_id,character_id,character_name,status,created_at,updated_at,character_snapshot,session_data')
      .eq('user_id', user.id).is('deleted_at', null).order('updated_at', { ascending:false });
    if (error) throw new Error(error.message);
    if (state.account?.uid !== user.id) return;
    const sessions = rows || [];
    const activeSessionIds = new Set(sessions.map(row => row.id));
    let changed = false;
    // 雲端清單不再包含的本帳號聊天，可能已被軟刪除；清掉過期本機副本，避免刷新後復活。
    for (const [sessionId, cached] of Object.entries(state.sessions || {})) {
      if (cached?.cloudOwned && cached.cloudOwnerUid === user.id && !activeSessionIds.has(sessionId)) {
        delete state.sessions[sessionId];
        changed = true;
      }
    }
    if (!sessions.length) {
      if (changed) { persist(); render(); }
      return;
    }
    const sessionIds = sessions.map(row => row.id).filter(isUuid);
    let messageRows = [];
    if (sessionIds.length) {
      const result = await client.from('chat_messages').select('id,session_id,role,content,created_at')
        .in('session_id', sessionIds).is('deleted_at', null).order('created_at', { ascending:true });
      if (result.error) throw new Error(result.error.message);
      messageRows = result.data || [];
    }
    if (state.account?.uid !== user.id) return;

    // 私密／已下架角色不會出現在公開角色清單；從既有聊天快照恢復作者 ID，
    // 並只讀取作者公開的 profiles 欄位，讓其他帳號也能正確顯示 BY 名稱。
    const snapshotAuthorIds = [...new Set(sessions
      .map(row => row.character_snapshot && typeof row.character_snapshot === 'object'
        ? row.character_snapshot.authorId : null)
      .filter(Boolean))];
    if (snapshotAuthorIds.length) {
      const profileResult = await client.from('profiles')
        .select('id, handle, nickname, avatar_url, bio')
        .in('id', snapshotAuthorIds);
      // 帳號可能在 profiles 查詢等待期間切換；舊帳號請求不得再寫入目前畫面狀態。
      if (state.account?.uid !== user.id) return;
      if (profileResult.error) {
        console.warn('既有聊天作者資料載入失敗：', profileResult.error.message);
      } else {
        for (const profile of profileResult.data || []) {
          state.authors[profile.id] = {
            uid:profile.id, handle:profile.handle || '',
            nickname:profile.nickname || profile.handle || 'PersonaX 使用者',
            avatar:profile.avatar_url || '', bio:profile.bio || '',
            fans:state.authors[profile.id]?.fans || 0
          };
        }
      }
    }

    const bySession = new Map();
    for (const row of messageRows) {
      if (!bySession.has(row.session_id)) bySession.set(row.session_id, []);
      bySession.get(row.session_id).push({id:row.id, role:row.role === 'user' ? 'user' : 'assistant',
        text:row.content || '', at:row.created_at ? new Date(row.created_at).getTime() : Date.now()});
    }
    for (const row of sessions) {
      if (!isUuid(row.id) || !isUuid(row.character_id)) continue;
      const data = row.session_data && typeof row.session_data === 'object' ? row.session_data : {};
      const snapshot = row.character_snapshot && typeof row.character_snapshot === 'object' ? row.character_snapshot : {};
      // Never hydrate a chat with a snapshot belonging to a different role.
      // The server also rejects this metadata before billing; fail closed in the UI too.
      if (snapshot.id && snapshot.id !== row.character_id) {
        console.error('雲端聊天角色快照 ID 不一致，已略過此聊天：', row.id);
        continue;
      }
      const existing = state.sessions[row.id];
      const cloudMessages = bySession.get(row.id) || [];
      state.sessions[row.id] = {
        ...(existing || {}), id:row.id, characterId:row.character_id,
        characterName:row.character_name || snapshot.name || '角色',
        name:data.name || '', archived:data.archived === true || row.status === 'archived',
        hidden:data.hidden === true, pinned:data.pinned === true,
        startedAt:Number(data.startedAt) || (row.created_at ? new Date(row.created_at).getTime() : Date.now()),
        archivedAt:data.archivedAt || null, persona:data.persona || '',
        suggestions:data.suggestions !== false, background:data.background || 'avatar',
        memories:Array.isArray(data.memories) ? data.memories : [],
        album:Array.isArray(data.album) ? data.album : [],
        pendingTurn:data.pendingTurn &&
          isUuid(data.pendingTurn.turnId) &&
          isUuid(data.pendingTurn.userMessageId) &&
          isUuid(data.pendingTurn.assistantMessageId)
          ? {
              turnId:data.pendingTurn.turnId,
              userMessageId:data.pendingTurn.userMessageId,
              assistantMessageId:data.pendingTurn.assistantMessageId,
              createdAt:Number(data.pendingTurn.createdAt) || Date.now()
            }
          : null,
        messages:cloudMessages,
        cloudOwned:true, cloudOwnerUid:user.id, cloudCharacterSnapshot:snapshot
      };
      if (snapshot.id === row.character_id) {
        const existingCharacterIndex = state.characters.findIndex(character => character.id === row.character_id);
        if (existingCharacterIndex >= 0) {
          const existingCharacter = state.characters[existingCharacterIndex];
          // 既有本機角色資料若缺作者 ID，以雲端聊天快照補齊，不覆蓋已存在的作者 ID。
          if (!existingCharacter.authorId && snapshot.authorId) {
            state.characters[existingCharacterIndex] = {
              ...existingCharacter, authorId:snapshot.authorId
            };
          }
        } else {
          state.characters.push({...snapshot, id:row.character_id, name:snapshot.name || row.character_name || '角色',
            visibility:'private', reviewStatus:'draft', authorId:snapshot.authorId || '', owner:false, cloudSnapshotOnly:true});
        }
      }
      changed = true;
    }
    if (changed) { persist(); render(); }
  } catch (error) {
    console.error('雲端聊天載入失敗：', error);
    if (state.account?.uid === user.id) toast('雲端聊天載入失敗：' + error.message);
  }
}

async function saveChatSessionSafely(s) {
  try {
    const saved = await saveChatSessionToCloud(s);
    return saved;
  } catch (error) {
    console.error('PersonaX 聊天同步失敗：',error);
    toast(error.message || '聊天已保存在本機，但雲端同步失敗。');
    return false;
  }
}

async function refreshWalletBalance() {
  const user = currentUser();
  if (!user || !window.mySupabase) return;
  const { data, error } = await window.mySupabase.rpc('ensure_wallet_account');
  if (error) {
    console.warn('聊天扣款後錢包餘額同步失敗：', error.message);
    return;
  }
  const row = Array.isArray(data) ? data[0] : data;
  if (!row || state.account?.uid !== user.uid) return;
  state.account.diamonds = Number(row.diamonds ?? 0);
  state.account.silver = Number(row.silver_coins ?? 0);
  persist();
  renderShell();
}

async function clearCloudPendingTurn(s) {
  const user = currentUser();
  const client = window.mySupabase;
  if (!s || !user || !client || !s.cloudOwned || s.cloudOwnerUid !== user.uid) return;
  const { error } = await client.from('chat_sessions')
    .update({session_data:chatSessionData(s),updated_at:new Date().toISOString()})
    .eq('id',s.id).eq('user_id',user.uid);
  if (error) console.warn('清除雲端待處理回合標記失敗：',error.message);
}

async function runPendingChatTurn(s) {
  const turn = s?.pendingTurn;
  const user = currentUser();
  const client = window.mySupabase;
  if (!turn || !user || !client) return;

  let result = null;
  let invokeError = null;
  try {
    const response = await client.functions.invoke('chat-turn', {
      body: {
        turnId: turn.turnId,
        sessionId: s.id,
        userMessageId: turn.userMessageId,
        assistantMessageId: turn.assistantMessageId
      }
    });
    result = response.data;
    invokeError = response.error;
    if (invokeError && !result) {
      const context = invokeError.context;
      if (context && typeof context.json === 'function') {
        try { result = await context.json(); } catch (_) {}
      }
    }
  } catch (error) {
    invokeError = error;
  }

  if (result?.status === 'insufficient_funds' || result?.error === 'insufficient_funds') {
    delete s.pendingTurn;
    persist();
    renderMessages();
    await saveChatSessionSafely(s);
    await clearCloudPendingTurn(s);
    await refreshWalletBalance();
    openModal('wallet-insufficient');
    return;
  }

  if (
    result?.status === 'refunded' ||
    result?.error === 'assistant_persistence_failed' ||
    result?.error === 'turn_already_refunded'
  ) {
    delete s.pendingTurn;
    persist();
    renderMessages();
    await saveChatSessionSafely(s);
    await clearCloudPendingTurn(s);
    await refreshWalletBalance();
    toast('這次回覆未能保存，系統已退回本回合預扣的銀幣／鑽石。');
    return;
  }

  if (
    result?.error === 'chat_session_character_id_invalid' ||
    result?.error === 'chat_session_character_snapshot_mismatch'
  ) {
    // These server-side identity guards run before reserve_chat_turn, so no
    // charge was reserved. Stop retrying this logical turn and preserve the
    // message for diagnosis instead of leaving a permanently pending spinner.
    delete s.pendingTurn;
    persist();
    renderMessages();
    await clearCloudPendingTurn(s);
    toast('聊天角色資料不一致，本回合尚未扣款。請重新整理聊天；若持續發生，請先不要重送並回報問題。');
    return;
  }

  if (
    result?.error === 'user_message_not_found' ||
    result?.error === 'chat_session_not_owned_or_active' ||
    result?.error === 'account_not_active' ||
    result?.error === 'wallet_not_ready'
  ) {
    s.messages = s.messages.filter(message => message.id !== turn.userMessageId);
    delete s.pendingTurn;
    persist();
    await clearCloudPendingTurn(s);
    renderMessages();
    toast('這則訊息尚未進入扣款流程，請重新輸入後再送出。');
    return;
  }

  if (result?.status !== 'settled' || invokeError) {
    // Keep stable IDs locally. The next send action retries the same logical turn;
    // it must not append another user message or create another charge.
    persist();
    toast('上一回合的結果尚未確認。再次按發送會沿用同一回合查詢／恢復，請勿另開重複訊息。');
    return;
  }

  const reply = result.assistantMessage;
  if (!reply?.id || !String(reply.content || '').trim()) {
    persist();
    toast('扣款狀態已回報成功，但回覆資料尚待確認；請勿重複發送。');
    return;
  }
  // A settled response must belong to the exact assistant message reserved for
  // this pending turn. Never attach an unrelated reply to the current chat.
  if (reply.id !== turn.assistantMessageId) {
    persist();
    console.error('聊天回覆 ID 與待處理回合不一致，已保留回合供查核。', {
      expected:turn.assistantMessageId,
      received:reply.id,
      sessionId:s.id
    });
    toast('回覆識別資料不一致，已保留本回合狀態；請勿重複發送，稍後再試或回報問題。');
    return;
  }

  if (!s.messages.some(message => message.id === reply.id)) {
    s.messages.push({
      id:reply.id,
      role:'assistant',
      text:String(reply.content),
      at:Date.now()
    });
  }
  delete s.pendingTurn;

  const users = s.messages.filter(message => message.role === 'user');
  if (users.length && users.length % 5 === 0) {
    const snippets = users.slice(-5).map(message => [...message.text].slice(0,7).join('')).join('、');
    addMemory(s,[...('本輪對話摘錄：'+snippets+'。')].slice(0,50).join(''));
  }

  persist();
  renderMessages();
  await refreshWalletBalance();

  // The server has already durably saved and settled the assistant reply.
  // A later session-metadata sync failure must never trigger a refund.
  const metadataSaved = await saveChatSessionSafely(s);
  if (!metadataSaved) {
    toast('回覆與扣款已完成，但聊天附加資料同步失敗；回覆不會因此重複扣款。');
  }
}

/* History: each internal page gets an actual browser-history entry. */
function routeURL(r) {
  const url = new URL(location.href);
  let hash = r.page;
  if (r.id) hash += '/' + encodeURIComponent(r.id);
  if (r.tag) hash += '?tag=' + encodeURIComponent(r.tag);
  url.hash = hash;
  return url;
}
function parseRoute() {
  const raw = location.hash.slice(1);
  const [path,query] = raw.split('?');
  const [p,key] = path.split('/');
  let identifier;
  try { identifier = key ? decodeURIComponent(key) : undefined; }
  catch (_) { identifier = undefined; }
  return {
    page:p === 'character' ? 'detail' : (p || 'home'),
    ...(identifier ? {id:identifier} : {}),
    ...(query ? {tag:new URLSearchParams(query).get('tag')} : {})
  };
}
function captureDraft() {
  if (route.page === 'conversation' && $('messageInput')) {
    drafts[route.id] = $('messageInput').value;
  }
}
function go(next, replace = false) {
  captureDraft();
  if (JSON.stringify(route) === JSON.stringify(next)) return;
  const depth = history.state?.personax ? history.state.depth : 0;
  const snapshot = {personax:true,depth:replace ? depth : depth+1,route:next};
  if (replace) history.replaceState(snapshot,'',routeURL(next));
  else history.pushState(snapshot,'',routeURL(next));
  route = next;
  render();
  window.scrollTo(0,0);
}
function back() {
  if (history.state?.personax && history.state.depth > 0) history.back();
  else go({page:'home'},true);
}
function openModal(name, data = {}) {
  go({...route,overlay:{name,...data}},!!route.overlay);
}
function closeModal() { back(); }
function dismissPendingDeletionModal() {
  if (state.account?.accountDeletionPending) {
    state.account.accountDeletionModalDismissed = true;
    persist();
    go({page:'home'}, true);
  } else {
    back();
  }
}
window.addEventListener('popstate',event => {
  captureDraft();
  route = event.state?.personax ? event.state.route : parseRoute();
  render();
});
$('modal').addEventListener('cancel',event => {
  event.preventDefault();
  dismissPendingDeletionModal();
});
$('modal').addEventListener('click',event => {
  if (event.target !== $('modal')) return;
  const r = $('modal').getBoundingClientRect();
  if (event.clientX < r.left || event.clientX > r.right ||
      event.clientY < r.top || event.clientY > r.bottom) dismissPendingDeletionModal();
});
function showDialog(title,content) {
  let modal = $('modal');

  // 防呆：登入流程或第三方程式不得讓主要 dialog 永久消失。
  if (!modal) {
    modal = document.createElement('dialog');
    modal.id = 'modal';
    document.body.appendChild(modal);

    modal.addEventListener('cancel',event => {
      event.preventDefault();
      back();
    });

    modal.addEventListener('click',event => {
      if (event.target !== modal) return;
      const r = modal.getBoundingClientRect();
      if (event.clientX < r.left || event.clientX > r.right ||
          event.clientY < r.top || event.clientY > r.bottom) back();
    });
  }

  const pendingDeletionDialog = route?.overlay?.name === 'account-deletion-pending' && title === '帳號正在等待刪除';
  modal.innerHTML = `
    <div class="row between modal-heading">
      <h2>${e(title)}</h2>
      <button class="ghost" data-action="${pendingDeletionDialog ? 'pending-switch-account' : 'back'}"
              aria-label="${pendingDeletionDialog ? '登出並切換其他帳號' : '關閉'}"
              title="${pendingDeletionDialog ? '登出並切換其他帳號' : '關閉'}">✕</button>
    </div>${content}`;

  if (!modal.open) modal.showModal();
}

function render() {
  if ($('modal').open) $('modal').close();
  const allowed = ['home','detail','session-detail','author','chat','conversation','group','create',
    'editor','ai','notifications','favorites','profile'];
  if (!allowed.includes(route.page)) route = {page:'home'};

  if (!['home','detail','author'].includes(route.page) && !currentUser()) {
    route = {page:'home',overlay:{name:'login'}};
  }
  // 若狀態同步尚未完成，先移除可能殘留的待刪除視窗，避免舊餘額先出現。
  if (state.account?.uid &&
      pendingDeletionWalletSyncUid === state.account.uid &&
      route.overlay?.name === 'account-deletion-pending') {
    const cleanRoute = {...route};
    delete cleanRoute.overlay;
    route = cleanRoute;
  }

  // 待刪除帳號首次顯示狀態視窗；必須先確認資料庫狀態並載入既有錢包餘額。
  if (state.account?.accountDeletionPending &&
      pendingDeletionWalletSyncUid !== state.account.uid &&
      !state.account.accountDeletionModalDismissed &&
      route.overlay?.name !== 'account-deletion-pending') {
    route = {
      ...route,
      overlay: {
        name: 'account-deletion-pending',
        scheduledFor: state.account.deletionScheduledFor
      }
    };

  renderShell();
  switch(route.page) {
    case 'home':renderHome();break;
    case 'detail':renderDetail();break;
    case 'session-detail':renderDetail();break;
    case 'author':renderAuthor();break;
    case 'chat':renderChatListPage();break;
    case 'conversation':renderConversation();break;
    case 'group':renderGroupPrototype();break;
    case 'create':renderCreate();break;
    case 'editor':renderEditor();break;
    case 'ai':renderAI();break;
    case 'notifications':renderNotifications();break;
    case 'favorites':renderFavorites();break;
    case 'profile':renderProfile();break;
  }
  if (route.overlay) renderModal(route.overlay);
}

function exploreList() {

    // 其 createdAt 會在全新本機資料初始化時重新產生，不能用來判斷真正上架時間。
    list = list.filter(c => !String(c.id).startsWith('seed-') &&
      Number.isFinite(Number(c.firstPublishedAt ?? c.createdAt)) &&
      Date.now()-Number(c.firstPublishedAt ?? c.createdAt) >= 0 &&
      Date.now()-Number(c.firstPublishedAt ?? c.createdAt) <= DAY)
      .sort((a,b) => (b.firstPublishedAt ?? b.createdAt)-(a.firstPublishedAt ?? a.createdAt)).slice(0,30);
  } else if (['male','female'].includes(filter)) {
    list = list.filter(c => c.gender === filter);
  } else {
    const score = c => (c.tags || []).filter(t => state.preferences.includes(t)).length;
    list.sort((a,b) => score(b)-score(a));
    if (list.length) {
      const offset = batch%list.length;
      list = [...list.slice(offset),...list.slice(0,offset)];

  }
  const q = search.trim().toLowerCase();
  return list.filter(c =>
    (!q || c.name.toLowerCase().includes(q) ||

async function readImage(file) {
  if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) throw Error('請選擇PNG、JPG或WebP。');

    const reader = new FileReader();

    reader.readAsDataURL(file);
  });
}

/* Chat sessions: character identity stays separate from conversation identity. */
function newSession(character,options = {}) {
  const sessionId = id();
  const session = {
    id:sessionId,characterId:character.id,name:'',
    archived:false,hidden:false,pinned:false,
    startedAt:Date.now(),persona:'',suggestions:true,background:'avatar',
    messages:[{id:id(),role:'assistant',text:character.opening,at:Date.now()}],
    memories:[],album:[],...options
  };
  state.sessions[sessionId] = session;
  return session;
}
function hasUserMessage(session) {
  return (session?.messages || []).some(message =>
    message.role === 'user' && String(message.text || '').trim()
  );
}
function sessionTitle(session) {
  return String(session?.name || sessionCharacter(session)?.name || session?.characterName || '角色').trim();
}
function uniqueSessionName(base,excludeId = '') {
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== excludeId)
    .map(sessionTitle));
  const clean = [...String(base || '回憶').trim()].slice(0,25).join('') || '回憶';
  if (!used.has(clean)) return clean;
  for (let n = 1; n < 10000; n++) {
    const suffix = '-'+n;
    const candidate = [...clean].slice(0,25-[...suffix].length).join('')+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return [...clean].slice(0,20).join('')+'-'+Date.now().toString().slice(-4);
}
function newArchiveName(character,session) {
  const d = new Date(session.archivedAt || Date.now());
  const date = [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const characterName = character?.name || '角色';
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== session.id)
    .map(sessionTitle));
  for (let n = 0; n < 10000; n++) {
    const suffix = n ? '-'+n : '';
    const room = Math.max(1,25-[...date].length-1-[...suffix].length);
    const prefix = [...characterName].slice(0,room).join('');
    const candidate = prefix+'_'+date+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return uniqueSessionName(characterName+'_'+date,session.id);
}
function startChat(characterId) {
  const c = state.characters.find(c => c.id === characterId);
  if (!accessible(c)) return toast('此角色已被作者調整為私密或刪除狀態，不支持開啟新對話');
  if (!requireLogin({page:'detail',id:characterId})) return;
  const sessions = Object.values(state.sessions).filter(item =>
    item.characterId === c.id && !item.archived
  ).sort((a,b) =>
    Number(hasUserMessage(b))-Number(hasUserMessage(a)) ||
    (b.messages?.at(-1)?.at || b.startedAt || 0)-(a.messages?.at(-1)?.at || a.startedAt || 0)
  );
  let s = sessions[0] || newSession(c);
  s.hidden = false;
  persist();
  go({page:'conversation',id:s.id});
}
function visibleSessions() {

function relativeDate(at) {

  const today = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();

function groupFriendlyError(error) {
  const message=String(typeof error==='string'?error:(error?.message||''));
  if(message.includes('character_not_public_and_approved') || message.includes('character_not_public_or_unavailable')) return '群組只能加入已公開且未下架的角色，請重新選擇。';
  if(message.includes('character_not_accessible')) return '有角色目前不可使用，請重新選擇已公開且未下架的角色。';
  if(message.includes('invalid_group_name')) return '群組名稱需為 1–80 字。';
  if(message.includes('invalid_world_background')) return '世界背景超過允許長度。';
  if(message.includes('invalid_scenes')||message.includes('invalid_scene_payload')||message.includes('invalid_scene_position')) return '場景資料不完整或角色場景指派不正確，請檢查後重試。';
  if(message.includes('group_not_found_or_not_accessible')) return '找不到群組，或目前帳號沒有存取權限。';
  if(message.includes('idempotency_key_reused_with_different_content')) return '這次送出識別碼已對應其他內容，請重新送出。';
  if(message.includes('invalid_message_content')) return '訊息需為 1–2000 字。';
  if(message.includes('authentication_required')||message.includes('JWT')||message.includes('登入狀態')) return '登入狀態已失效，請重新登入後再試。';
  return message||'操作失敗，請稍後再試。';
}
async function groupLoadList(force=false) {
  const g=groupPrototype;
  if(g.loadingGroups||(!force&&g.groupsLoaded)) return;
  g.loadingGroups=true;g.loadError='';
  if(!window.mySupabase) {
    g.groupsLoaded=true;g.loadingGroups=false;g.loadError='Supabase 用戶端尚未載入。';return;
  }
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) {
      g.groupsLoaded=true;g.loadingGroups=false;g.loadError='請使用已連結 Supabase 的帳號登入，才能讀取或建立雲端群組。';
      if(route.page==='group'&&!g.active) render();
      return;
    }
    const {data,error}=await window.mySupabase.from('chat_groups')
      .select('id,name,world_background,scene_mode,created_at,updated_at')
      .is('archived_at',null).order('updated_at',{ascending:false});
    if(error) throw error;
    if(user.id!==currentUser()?.uid) { groupResetForAccount(currentUser()?.uid||null); return; }
    g.ownerUid=user.id;g.groups=data||[];g.groupsLoaded=true;g.loadingGroups=false;
  } catch(error) {
    g.groupsLoaded=true;g.loadingGroups=false;g.loadError=groupFriendlyError(error)||'讀取群組清單失敗。';
  }
  if(route.page==='group'&&!g.active) render();
}

function groupReadStep() {
  const g=groupPrototype;
  if(g.step===1) {
    g.draft.name=$('groupNameInput')?.value.trim()||'';
    g.draft.world=$('groupWorldInput')?.value||'';
    if(!g.draft.name||g.draft.name.length>80) return '請輸入 1–80 字的群組名稱。';
    if(g.draft.world.length>10000) return '世界背景不可超過 10000 字。';
  } else if(g.step===2) {
    g.draft.mode='shared';
    g.draft.scenes=[{name:$('groupSceneName0')?.value.trim()||'',description:$('groupSceneDesc0')?.value||''}];
    if(!g.draft.scenes[0].name) return '請填寫共同場景名稱。';
    if(g.draft.scenes[0].name.length>80||g.draft.scenes[0].description.length>5000) return '場景名稱或描述超過字數限制。';
  } else if(g.step===3) {
    const availableIds=new Set(groupAvailableCharacters().map(c=>c.id));
    g.draft.memberIds=[...new Set(g.draft.memberIds.filter(id=>availableIds.has(id)))];
    const members=groupSelectedCharacters();
    if(members.length<1||members.length>3) return '請選擇 1–3 名可用角色。';
    if(members.length!==g.draft.memberIds.length) return '角色清單已變更，請重新選擇角色。';
    if(g.draft.mode==='separate' && g.draft.scenes.slice(0,members.length).some(x=>!x.name.trim())) return '分開場景模式下，每位角色都需要有場景名稱。';
  }
  return '';
}

function formatMessage(text) {
  return String(text).split(/(\*\*[\s\S]*?\*\*|\*[\s\S]*?\*)/g).filter(Boolean).map(part => {
    if (part.startsWith('**') && part.endsWith('**')) {
      return `<em class="narration">${e(part.slice(2,-2))}</em>`;
    }
    if (part.startsWith('*') && part.endsWith('*')) {
      return `<em class="narration">${e(part.slice(1,-1))}</em>`;
    }
    return part.trim() ? `<div class="bubble">${e(part.trim())}</div>` : '';
  }).join('');
}

function addMemory(s,text) {
  const item = {id:id(),text,important:false,at:Date.now()};
  const next = [...s.memories,item];
  while (memorySize(next)>3000) {
    const i = next.findIndex(m => !m.important);
    if (i<0 || next[i].id === item.id) {
      toast('重大記憶占滿容量，本次無法新增日記。');
      return;
    }
    next.splice(i,1);
  }
  s.memories = next;
}
