<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>PersonaX｜AI 角色世界</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #101725;
      --panel2: #151e30;
      --border: #273247;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #6366f1;
      --pink: #fb7185;
      --sidebar: 240px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      font-size: 14px;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button, input, textarea, select { border-radius: 12px; }
    button {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--panel2);
      padding: 10px 14px;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:focus-visible, input:focus-visible,
    textarea:focus-visible, select:focus-visible {
      outline: 2px solid #a5b4fc;
      outline-offset: 3px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      padding: 12px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
    input[type="checkbox"] { width: auto; accent-color: var(--primary); }
    input[type="file"] { font-size: 12px; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 30px; }
    h2 { font-size: 22px; }
    h3 { font-size: 17px; }
    p { line-height: 1.8; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .primary { background: var(--primary); border-color: transparent; }
    .danger { color: #fda4af; border-color: #713344; }
    .ghost { background: transparent; }
    .row { display: flex; align-items: center; gap: 10px; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .stack > * + * { margin-top: 18px; }
    .panel {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 20px;
      padding: 22px;
    }
    .empty {
      padding: 40px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #6366f11c;
      color: #c7d2fe;
    }
    .note {
      border: 1px solid #a78bfa35;
      background: #a78bfa0c;
      color: #c4b5fd;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.8;
    }
    .field { display: block; margin-bottom: 18px; }
    .field > span { display: block; margin-bottom: 8px; font-weight: 600; }
    .field small { display: block; margin-top: 6px; color: var(--muted); }
    .check { display: flex; gap: 10px; align-items: flex-start; line-height: 1.7; }
    .check input { margin-top: 5px; }

    /* Desktop navigation */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      padding: 20px 14px;
      background: #090e1b;
      border-right: 1px solid var(--border);
      z-index: 40;
      display: flex;
      flex-direction: column;
      transition: width .2s;
    }
    .brand {
      border: 0;
      background: transparent;
      font-size: 22px;
      font-weight: 900;
      color: #c7d2fe;
      padding: 8px;
    }
    .sidebar nav { display: grid; gap: 6px; margin-top: 28px; }
    .nav-btn {
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }
    .nav-btn.active { background: #6366f125; color: #c7d2fe; }
    .nav-icon { font-size: 19px; width: 24px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 14px; }
    .app { margin-left: var(--sidebar); transition: margin-left .2s; }
    body.collapsed { --sidebar: 78px; }
    body.collapsed .nav-label,
    body.collapsed .brand-name,
    body.collapsed .sidebar-footer { display: none; }
    body.collapsed .sidebar { padding-inline: 10px; }
    body.collapsed .nav-btn { justify-content: center; padding-inline: 5px; }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 68px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #0b1120e8;
      backdrop-filter: blur(18px);
    }
    main { max-width: 1500px; margin: auto; padding: 26px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      background: #312e81;
    }
    .avatar-fallback {
      display: grid;
      place-items: center;
      background: #312e81;
      color: #ddd6fe;
      font-weight: 700;
    }
    .diamonds {
      color: #fde68a;
      background: #f59e0b12;
      border: 1px solid #f59e0b30;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
    }

    /* Explore */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid #818cf840;
      padding: 38px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(circle at 85% 25%, #818cf845, transparent 35%),
        radial-gradient(circle at 25% 100%, #a855f730, transparent 40%),
        linear-gradient(120deg, #111827, #172554 55%, #0f172a);
    }
    .hero h1 { margin: 16px 0; font-size: clamp(28px, 4vw, 46px); }
    .hero p { max-width: 670px; color: #cbd5e1; }
    .hero-controls { display: flex; gap: 8px; margin-top: 18px; }
    .hero-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #ffffff45;
    }
    .hero-dot.active { background: #fff; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search { max-width: 420px; flex: 1; min-width: 180px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab { white-space: nowrap; color: var(--muted); }
    .tab.active { background: var(--primary); color: white; border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-3px); border-color: #818cf8; }
    .card-image { position: relative; aspect-ratio: 4 / 5; }
    .image-btn {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #172036;
    }
    .image-btn img { width: 100%; height: 100%; object-fit: cover; }
    .card-chat {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      opacity: 0;
      transform: translateY(5px);
      transition: .2s;
      background: #6366f1ee;
    }
    .card:hover .card-chat, .card:focus-within .card-chat {
      opacity: 1;
      transform: none;
    }
    .card-body { padding: 14px; }
    .card-body h3 { margin: 9px 0 6px; }
    .card-intro {
      color: #aebbd0;
      font-size: 12px;
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 43px;
      margin-bottom: 10px;
    }
    .heart { padding: 4px 8px; background: transparent; border: 0; font-size: 21px; }
    .heart.on { color: var(--pink); }
    .owner-actions { display: flex; gap: 8px; margin-top: 12px; }
    .owner-actions button { flex: 1; font-size: 12px; padding: 8px; }
    .detail-layout {
      display: grid;
      grid-template-columns: minmax(220px, 360px) 1fr;
      gap: 28px;
    }
    .detail-image { width: 100%; border-radius: 20px; max-height: 580px; object-fit: cover; }
    .prose { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; }
    .form-width { max-width: 820px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

    /* Chat */
    .chat-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 280px;
      gap: 16px;
      height: calc(100dvh - 190px);
      min-height: 550px;
    }
    .chat-list, .memory-panel { overflow-y: auto; }
    .chat-list { padding: 14px; }
    .chat-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 8px;
      border-radius: 12px;
    }
    .chat-entry.active { background: #6366f122; }
    .chat-entry .select-chat {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 3px;
    }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-main { padding: 0; display: flex; flex-direction: column; min-height: 0; }
    .chat-heading { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .messages { flex: 1; overflow-y: auto; padding: 20px; min-height: 150px; }
    .message { display: flex; gap: 10px; margin-bottom: 20px; }
    .message.user { flex-direction: row-reverse; }
    .message-content { max-width: 85%; min-width: 0; }
    .message-name { color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .message.user .message-name { text-align: right; }
    .bubble {
      background: #1b263b;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble { background: #4f46e5; }
    .bubble em { color: #b2bdcf; font-style: italic; }
    .status {
      margin: 0 16px 12px;
      padding: 12px 14px;
      background: #a5b4fc08;
      border: 1px solid #a5b4fc26;
      border-radius: 14px;
      color: #aebbd0;
      font-size: 12px;
      line-height: 1.8;
    }
    .composer { border-top: 1px solid var(--border); padding: 14px; }
    .composer textarea { min-height: 72px; max-height: 150px; }
    .suggestions { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 10px; }
    .suggestions button { font-size: 11px; flex-shrink: 0; }
    .chat-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .chat-tools button { font-size: 11px; padding: 8px 10px; }
    .memory-panel { padding: 16px; }
    .memory-item {
      padding: 12px;
      background: #0b1220;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 12px;
    }
    .memory-item p { margin: 7px 0; }
    .notice {
      padding: 18px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 16px;
      margin-top: 12px;
    }

    /* Modal */
    dialog {
      width: min(560px, calc(100vw - 28px));
      max-height: 90dvh;
      overflow-y: auto;
      border: 1px solid var(--border);
      background: #0d1423;
      color: var(--text);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 25px 100px #0009;
    }
    dialog::backdrop { background: #000b; backdrop-filter: blur(4px); }
    .modal-heading { margin-bottom: 20px; }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #e2e8f0;
      color: #0f172a;
      padding: 12px 20px;
      border-radius: 14px;
      z-index: 100;
      max-width: 90vw;
      box-shadow: 0 8px 30px #0005;
    }
    .mobile-nav { display: none; }

    @media (max-width: 1200px) {
      .chat-layout { grid-template-columns: 190px minmax(0, 1fr); height: auto; }
      .chat-main { min-height: 650px; }
      .messages { max-height: 480px; }
      .memory-panel { grid-column: 1 / -1; max-height: 450px; }
    }
    @media (max-width: 767px) {
      .sidebar { display: none; }
      .app, body.collapsed .app { margin-left: 0; }
      header { padding: 0 16px; height: 62px; }
      .desktop-only { display: none; }
      main { padding: 16px 14px 100px; }
      h1 { font-size: 26px; }
      .hero { padding: 24px; min-height: 290px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .card-body { padding: 10px; }
      .card-chat { opacity: 1; transform: none; font-size: 12px; }
      .card-body h3 { font-size: 15px; }
      .detail-layout, .two-col { grid-template-columns: 1fr; }
      .detail-image { max-height: 480px; }
      .panel { padding: 18px; }
      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        border-top: 1px solid var(--border);
        background: #0b1120f5;
        backdrop-filter: blur(18px);
        padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      }
      .mobile-nav .nav-btn {
        flex-direction: column;
        gap: 3px;
        padding: 7px 2px;
        font-size: 10px;
        justify-content: center;
      }
      .chat-layout { display: flex; flex-direction: column; min-height: 0; }
      .chat-list { max-height: 240px; }
      .chat-main { min-height: 650px; }
      .message-content { max-width: 82%; }
      #toast { bottom: 90px; }
      .diamonds { padding: 6px 8px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <button class="brand" onclick="navigate('home')">
      ✦ <span class="brand-name">PersonaX</span>
    </button>
    <nav id="desktopNav"></nav>
    <div class="sidebar-footer muted small">
      PersonaX V2 前端原型<br>
      資料僅保存在此瀏覽器。
    </div>
  </aside>

  <div class="app">
    <header>
      <div class="row">
        <button class="desktop-only ghost" onclick="toggleSidebar()"
                aria-label="收合或展開選單">☰</button>
        <strong id="pageTitle">探索角色</strong>
      </div>
      <div id="accountArea" class="row"></div>
    </header>
    <main id="view"></main>
  </div>

  <nav id="mobileNav" class="mobile-nav" aria-label="手機主要選單"></nav>
  <dialog id="modal"></dialog>
  <div id="toast" class="hidden" role="status"></div>

  <input id="jsonFile" type="file" accept=".json,application/json"
         class="hidden" onchange="importJSON(event)">

<script>
'use strict';

/* =========================================================
   V2 FRONTEND DEMO
   No real authentication, AI, payment or server authorization.
   Do not put API keys or real confidential data in this file.
   ========================================================= */

const STORE_KEY = 'personax-v2-demo';
const DAY = 24 * 60 * 60 * 1000;
const NOW = Date.now();

const TAGS = [
  'CEO', '深情', '掌控感', '醫生', '溫柔', '日常',
  '作家', '知性', '慢熱', '校園', '陽光', '戀愛',
  '姐姐', '成熟', '療癒', '總裁', '冷淡', '反差',
  '音樂', '可愛', '陪伴', '刑警', '懸疑', '保護',
  '奇幻', '古風', '冒險', '原創'
];

const NAV = [
  ['home', '⌕', '探索角色'],
  ['chat', '💬', '開始暢聊'],
  ['create', '✦', '創建角色'],
  ['notifications', '♧', '系統通知'],
  ['favorites', '♡', '喜愛角色']
];

const BANNERS = [
  {
    title: '找到一個，真正屬於你的角色。',
    text: '探索不同性格、故事與世界觀。每一次對話，都可以是故事的開始。'
  },
  {
    title: '你的想像，值得成為主角。',
    text: '建立自己的角色，設定介紹、開場白與對話風格。'
  },
  {
    title: '把相遇，收藏成日記。',
    text: '體驗聊天與重大記憶的介面。正式 AI 功能將由後端接入。'
  }
];

const seed = [
  ['封以恆','male',33,['CEO','深情','掌控感'],'12.8萬',
   'photo-1500648767791-00dcc994a43e',
   '冷峻強勢的 CEO，只有在你面前會露出不為人知的溫柔。'],
  ['沈知言','male',29,['醫生','溫柔','日常'],'8.6萬',
   'photo-1535713875002-d1d0cf377fde',
   '總是耐心聽你說話的年輕醫生，平靜外表下藏著很深的在意。'],
  ['顧晚晴','female',27,['作家','知性','慢熱'],'6.2萬',
   'photo-1494790108377-be9c29b29330',
   '喜歡在深夜寫故事的作家，也許下一個故事主角就是你。'],
  ['林澈','male',25,['校園','陽光','戀愛'],'4.9萬',
   'photo-1507003211169-0a1dd7228f2d',
   '笑起來很有感染力的校園人氣人物，對你的反應總是特別明顯。'],
  ['蘇晚棠','female',31,['姐姐','成熟','療癒'],'3.7萬',
   'photo-1544005313-94ddf0286df2',
   '成熟可靠的姐姐系角色，擅長在你需要時給你剛剛好的陪伴。'],
  ['裴修然','male',35,['總裁','冷淡','反差'],'9.1萬',
   'photo-1501196354995-cbb51c65aaea',
   '看似拒人於千里之外，實際上只是不知道怎麼對你坦白。'],
  ['夏妍','female',24,['音樂','可愛','陪伴'],'2.8萬',
   'photo-1488426862026-3ee34a7d66df',
   '喜歡唱歌與分享生活的小太陽，和她聊天很容易忘記時間。'],
  ['周沉','male',30,['刑警','懸疑','保護'],'7.4萬',
   'photo-1506794778202-cad84cf45f1d',
   '沉默寡言的刑警，習慣把危險擋在你之前。']
].map((r, i) => ({
  id: 'seed-' + (i + 1),
  name: r[0], gender: r[1], age: String(r[2]), race: '人類',
  tags: r[3], chats: r[4],
  image: `https://images.unsplash.com/${r[5]}?auto=format&fit=crop&w=800&q=80`,
  intro: r[6],
  opening: `**${r[0]}抬起頭，看向剛走進來的你。**\n「你來了。今天想聊些什麼？」`,
  privateInfo: '',
  style: '',
  visibility: 'public',
  owner: false,
  createdAt: NOW - i * 60 * 60 * 1000
}));

function defaultState() {
  return {
    user: null,
    characters: seed,
    favorites: [],
    chats: {},
    preferences: [],
    notifications: [
      {
        id: 'welcome',
        title: '歡迎來到 PersonaX V2',
        body: '這是前端原型。示範登入、回覆與創角均不會呼叫真正的 AI 或金流。',
        read: false,
        at: NOW
      }
    ]
  };
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.characters) &&
        Array.isArray(saved.favorites) && saved.chats &&
        Array.isArray(saved.notifications)) {
      return { ...defaultState(), ...saved };
    }
  } catch (e) {
    console.warn('Unable to load demo data', e);
  }
  return defaultState();
}

let state = loadState();
let page = 'home';
let activeCharacter = null;
let activeChat = null;
let currentFilter = 'latest';
let searchText = '';
let selectedTags = [];
let recommendationLimit = 24;
let recommendationBatch = 0;
let notificationTab = 'all';
let bannerIndex = 0;
let pendingAction = null;
let editingId = null;
let formTags = [];
let imageDraft = '';
let toastTimer;

const $ = id => document.getElementById(id);

function esc(value = '') {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  }[c]));
}

function uid() {
  return window.crypto?.randomUUID?.() ||
    'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    toast('本機儲存失敗，可能空間不足；請縮小上傳圖片。');
    return false;
  }
}

function toast(text) {
  clearTimeout(toastTimer);
  $('toast').textContent = text;
  $('toast').classList.remove('hidden');
  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 3500);
}

function modal(title, body) {
  $('modal').innerHTML = `
    <div class="row between modal-heading">
      <h2 style="margin:0">${esc(title)}</h2>
      <button onclick="closeModal()" aria-label="關閉視窗">✕</button>
    </div>
    ${body}`;
  if (!$('modal').open) $('modal').showModal();
}

function closeModal() { $('modal').close(); }

$('modal').addEventListener('click', e => {
  if (e.target !== $('modal')) return;
  const r = $('modal').getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right ||
      e.clientY < r.top || e.clientY > r.bottom) closeModal();
});

function toggleSidebar() {
  document.body.classList.toggle('collapsed');
}

function avatarHTML(user, className = '') {
  if (user?.avatar) {
    return `<img class="avatar ${className}" src="${esc(user.avatar)}" alt="使用者頭像">`;
  }
  return `<span class="avatar avatar-fallback ${className}">${esc(
    (user?.nickname || 'P').slice(0, 1)
  )}</span>`;
}

function renderShell() {
  const navPage = ['detail'].includes(page) ? 'home'
    : ['editor','ai'].includes(page) ? 'create' : page;

  const html = NAV.map(([key, icon, label]) => `
    <button class="nav-btn ${navPage === key ? 'active' : ''}"
            onclick="navigate('${key}')">
      <span class="nav-icon">${icon}</span>
      <span class="nav-label">${label}</span>
    </button>`).join('');

  $('desktopNav').innerHTML = html;
  $('mobileNav').innerHTML = html;

  const names = {
    home:'探索角色', detail:'角色介紹', chat:'開始暢聊',
    create:'創建角色', editor:'編輯角色', ai:'AI 創建',
    notifications:'系統通知', favorites:'喜愛角色', profile:'個人帳號'
  };
  $('pageTitle').textContent = names[page] || 'PersonaX';

  $('accountArea').innerHTML = state.user
    ? `<span class="diamonds">💎 ${state.user.diamonds.toLocaleString()} <span class="desktop-only">示範</span></span>
       <button class="ghost row" style="padding:3px;border:0"
               onclick="navigate('profile')" aria-label="開啟個人帳號">
         ${avatarHTML(state.user)}
       </button>`
    : `<button class="primary" onclick="openLogin()">登入 / 註冊</button>`;
}

function navigate(target) {
  if (target !== 'home' && target !== 'detail' && !state.user) {
    openLogin(() => navigate(target));
    return;
  }
  page = target;
  renderShell();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderPage() {
  switch (page) {
    case 'home': renderHome(); break;
    case 'detail': renderDetail(); break;
    case 'favorites': renderFavorites(); break;
    case 'create': renderCreate(); break;
    case 'editor': renderEditor(); break;
    case 'ai': renderAI(); break;
    case 'chat': renderChat(); break;
    case 'notifications': renderNotifications(); break;
    case 'profile': renderProfile(); break;
  }
}

function publicCharacters() {
  return state.characters.filter(c => c.visibility === 'public');
}

function recommendationScore(c) {
  const preferences = state.preferences || [];
  return c.tags.filter(t => preferences.includes(t)).length * 100 +
    parseFloat(c.chats || '0');
}

function exploreList() {
  let list = publicCharacters();
  if (currentFilter === 'latest') {
    list = list.filter(c => Date.now() - c.createdAt <= DAY)
      .sort((a,b) => b.createdAt - a.createdAt)
      .slice(0,30);
  } else if (currentFilter === 'male' || currentFilter === 'female') {
    list = list.filter(c => c.gender === currentFilter);
  } else {
    list.sort((a,b) => recommendationScore(b) - recommendationScore(a));
    if (list.length && recommendationBatch) {
      const offset = recommendationBatch % list.length;
      list = [...list.slice(offset), ...list.slice(0,offset)];
    }
  }

  const q = searchText.trim().toLowerCase();
  return list.filter(c =>
    (!q || c.name.toLowerCase().includes(q) ||
      c.tags.some(t => t.toLowerCase().includes(q))) &&
    selectedTags.every(t => c.tags.includes(t))
  );
}

function applyTags(mode) {
  const chosen = [...$('modal').querySelectorAll('input[name="tag"]:checked')]

    toast('角色最多選擇 5 個標籤。');

  if (mode === 'explore') {
    selectedTags = chosen;
    state.preferences = [...new Set([...(state.preferences || []), ...chosen])];
    save();
    closeModal();
    renderHome();
  } else {
    formTags = chosen;
    closeModal();
    if ($('formTagSummary')) {
      $('formTagSummary').textContent = chosen.length
        ? chosen.map(t => '#' + t).join(' ') : '尚未選擇標籤';
    }
  }
}

function readImageFile(file) {
  return new Promise((resolve,reject) => {
    if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) {
      reject(new Error('請選擇 PNG、JPG 或 WebP 圖片。'));
      return;
    }
    if (file.size > 1024 * 1024) {
      reject(new Error('示範版本圖片限制 1 MB。'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('圖片讀取失敗。'));
    reader.readAsDataURL(file);
  });
}

async function readCharacterImage(event) {
  try {
    imageDraft = await readImageFile(event.target.files[0]);
    $('characterImagePreview').src = imageDraft;
    $('characterImagePreview').classList.remove('hidden');
  } catch (e) {
    toast(e.message);
    event.target.value = '';
  }
}

function submitCharacter(event) {
  event.preventDefault();
  if (!state.user) return;
  const f = new FormData(event.target);
  const name = String(f.get('name')).trim();
  if (!/^[\p{L}\p{N}]{3,25}$/u.test(name)) {
    toast('名字需為 3–25 字，且只能包含文字、字母及數字。');
    return;
  }
  if (!imageDraft) { toast('請上傳角色頭像。'); return; }
  if (!String(f.get('intro')).trim() || !String(f.get('opening')).trim()) {
    toast('介紹與開場白不可只輸入空白。');
    return;
  }

/* Only our own JSON schema is supported in this demo. */
async function importJSON(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!state.user || !file) return;

  try {
    if (file.size > 2 * 1024 * 1024) throw new Error('JSON 檔案上限 2 MB。');
    const data = JSON.parse(await file.text());

    const name = String(data.name || '').trim();
    if (!/^[\p{L}\p{N}]{3,25}$/u.test(name)) {
      throw new Error('name 必須為 3–25 字的文字、字母或數字。');
    }
    const intro = String(data.intro || '').trim();
    const opening = String(data.opening || '').trim();
    if (!intro || intro.length > 2000 || !opening || opening.length > 3000) {
      throw new Error('需要 intro 與 opening，且不能超過 2000／3000 字。');
    }
    if (String(data.privateInfo || '').length > 10000 ||
        String(data.style || '').length > 1000) {
      throw new Error('私密資訊或對話風格超過長度限制。');
    }

    const image = String(data.image || '');
    let validImage = false;
    try {
      const u = new URL(image);
      validImage = u.protocol === 'https:' &&
        !u.username && !u.password;
    } catch (_) {}
    if (!validImage) throw new Error('image 請提供 HTTPS 圖片網址。');

    const tags = Array.isArray(data.tags)
      ? [...new Set(data.tags.filter(t => TAGS.includes(t)))] : [];
    if (tags.length > 5) throw new Error('標籤最多 5 個。');

    state.characters.unshift({
      id: uid(),
      name,
      intro,
      opening,
      image,
      gender: ['male','female','ambiguous'].includes(data.gender)
        ? data.gender : 'ambiguous',
      age: String(data.age || '').slice(0,20),
      race: String(data.race || '').slice(0,50),
      privateInfo: String(data.privateInfo || ''),
      style: String(data.style || ''),
      visibility: 'private',
      tags,
      owner: true,
      chats: '0',
      createdAt: Date.now()
    });
    save();
    navigate('create');
    toast('已匯入角色，預設為私密。');
  } catch (e) {
    toast('匯入失敗：' + e.message);
  }
}

/* ---------------- Diary ---------------- */

function memoryLength(memories) {
  return memories.reduce((n,m) => n + [...m.text].length,0);
}

function addMemory(chat, text) {
  const next = [...chat.memories, {
    id:uid(), text, important:false, at:Date.now()
  }];
  while (memoryLength(next) > 3000) {
    const removable = next.findIndex(m => !m.important);
    if (removable < 0) {
      toast('重大記憶已達上限，無法新增日記。');
      return;
    }
    const removed = next.splice(removable,1)[0];
    if (removed.id === next.at(-1)?.id) break;
  }
  chat.memories = next;
}

function renderMemories() {
  if (!$('memories')) return;
  const memories = state.chats[activeChat].memories;
  $('memories').innerHTML = `
    <p class="muted small">${memoryLength(memories)} / 3000 字</p>
    ${memories.map(m => `
      <div class="memory-item">
        <label class="check">
          <input type="checkbox" ${m.important ? 'checked disabled' : ''}
                 onchange="lockMemory('${m.id}',this)">
          <span>${m.important ? '🔒 重大記憶' : '設為重大記憶'}</span>
        </label>
        <p>${esc(m.text)}</p>
        <div class="muted small">${esc(new Date(m.at).toLocaleString('zh-TW'))}</div>
        <button style="margin-top:8px;font-size:11px" ${m.important ? 'disabled' : ''}
                onclick="editMemory('${m.id}')">編輯</button>
      </div>
    `).join('') || '<p class="muted small">還沒有日記。完成 5 次輸入後會建立示範摘錄。</p>'}`;
}

function lockMemory(id, input) {
  if (!confirm('設為重大記憶後，此原型不允許解除或編輯。確定嗎？')) {
    input.checked = false;
    return;
  }
  const m = state.chats[activeChat].memories.find(x => x.id === id);
  if (m) m.important = true;
  save();
  renderMemories();
}

function editMemory(id) {
  const m = state.chats[activeChat].memories.find(x => x.id === id);
  if (!m || m.important) return;
  modal('編輯日記', `
    <textarea id="memoryEdit" maxlength="3000">${esc(m.text)}</textarea>
    <button class="primary" style="margin-top:16px"
            onclick="saveMemory('${id}')">儲存</button>
  `);
}

function saveMemory(id) {
  const chat = state.chats[activeChat];
  const m = chat.memories.find(x => x.id === id);
  if (!m || m.important) return;
  const text = $('memoryEdit').value.trim();
  if (!text) { toast('日記內容不能為空。'); return; }
  const total = memoryLength(chat.memories) - [...m.text].length + [...text].length;
  if (total > 3000) {
    toast('儲存後會超過 3000 字，請縮短內容。');
    return;
  }
  m.text = text;
  save();
  closeModal();
  renderMemories();
}

    </div>`;
}

function readNotice(id) {
  const n = state.notifications.find(x => x.id === id);
  if (n) n.read = true;
  save();
  renderNotifications();
}

function readAllNotices() {
  state.notifications.forEach(n => n.read = true);
  save();
  renderNotifications();
}

/* ---------------- Profile and report ---------------- */

function renderProfile() {
  const u = state.user;
  $('view').innerHTML = `
    <div class="stack form-width">
      <h1>個人帳號</h1>
      <section class="panel stack">

let profileImageDraft = '';

function editProfile() {
  profileImageDraft = state.user.avatar;
  modal('編輯個人資料', `
    <form onsubmit="saveProfile(event)">
      <label class="field">
        <span>主頭像</span>
        <input type="file" accept="image/png,image/jpeg,image/webp"
               onchange="readProfileImage(event)">

      </label>
      <label class="field">

      </label>
      <button class="primary" type="submit">儲存修改</button>

  `);
}

async function readProfileImage(event) {
  try {
    profileImageDraft = await readImageFile(event.target.files[0]);
    toast('頭像已讀取，按儲存後套用。');
  } catch (e) {
    toast(e.message);
    event.target.value = '';
  }
}

function saveProfile(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  const nickname = String(f.get('nickname')).trim();
  if (!nickname) { toast('暱稱不能為空。'); return; }
  state.user.nickname = nickname;
  state.user.bio = String(f.get('bio')).trim();
  state.user.avatar = profileImageDraft;
  save();
  closeModal();
  renderShell();
  renderProfile();
}

function purchaseInfo() {
  modal('購買鑽石', `
    <p>目前尚未串接金流，因此不會建立訂單或收款。</p>
    <div class="note">
      正式版必須由伺服器確認付款成功，再增加鑽石；
      不能以瀏覽器按鈕或本機資料當作付款依據。
    </div>
  `);
}

function openBugReport() {
  modal('BUG 回報｜表單示範', `
    <form onsubmit="submitBugReport(event)">
      <div class="note" style="margin-bottom:18px">
        尚未接入回報 API 與驗證碼服務。內容不會上傳或寄送。
      </div>
      <label class="field">
        <span>問題說明 *</span>
        <textarea name="description" required maxlength="3000"
                  placeholder="請描述操作步驟、預期結果及實際問題…"></textarea>
      </label>
      <label class="field">
        <span>截圖｜非必填</span>
        <input name="screenshot" type="file" accept="image/png,image/jpeg,image/webp">
      </label>
      <p class="muted small">正式版需接入 Turnstile 或其他服務，並在伺服器驗證。</p>
      <button class="primary" type="submit">測試表單檢查｜不會送出</button>
    </form>
  `);
}

function submitBugReport(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  if (!String(f.get('description')).trim()) {
    toast('請填寫問題說明。');
    return;
  }
  const file = f.get('screenshot');
  if (file && file.size > 0 &&
      (!['image/png','image/jpeg','image/webp'].includes(file.type) ||
       file.size > 1024*1024)) {
    toast('截圖需為 PNG、JPG 或 WebP，且不超過 1 MB。');
    return;
  }
  closeModal();
  toast('表單檢查通過；這次沒有實際送出回報。');
}

renderShell();
renderPage();

<script>
/*
 * Requires the complete V2 index.html from the previous message.
 * Frontend demo only; no real auth, AI, translation or moderation.
 */
(() => {
  'use strict';

  const original = {
    navigate,
    renderShell,
    renderDetail,
    renderProfile,
    renderChat,
    renderExploreGrid,
    submitCharacter,
    importJSON,
    generateDemoCharacter,
    startChat,
    demoLogin,
    logout
  };

  const PIN = `
    <svg class="px-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6Z"></path>
      <path d="M12 15v7"></path>
    </svg>`;

  const LOCAL_UID = 'demo-local-account';
  let authorPageId = null;
  let mobileConversation = false;
  let chatSearch = '';
  let showingHidden = false;
  let replyTo = null;
  let exploreObserver = null;

  // Escape JSON values when used inside inline event attributes.
  const arg = value => esc(JSON.stringify(String(value)));
  const chars = value => [...String(value)];
  const currentUID = () => state.user?.uid || null;

  const dateText = time =>
    new Date(time).toLocaleString('zh-TW');

  function fallbackAuthor(id) {
    return {
      uid: id,
      nickname: '故事創作者',
      bio: 'PersonaX 示範創作者。',
      avatar: '',
      fans: 0
    };
  }

  function migrate() {
    state.authors ||= {};
    state.comments ||= {};
    state.following ||= [];

    state.authors['personax-studio'] ||= {
      uid: 'personax-studio',
      nickname: 'PersonaX工作室',
      bio: '在不同的故事中，探索不同的相遇。此為示範作者。',
      avatar: seed[0].image,
      fans: 128
    };

    state.characters.forEach(c => {
      c.authorId ||= c.owner ? LOCAL_UID : 'personax-studio';
      // Existing V2 stats do not include unique-user counts.
      c.userCount ??= null;
    });

    Object.values(state.chats).forEach(chat => {
      chat.hidden ??= false;
      chat.album ||= [];
      chat.memories ||= [];
    });

    syncMyAuthor();
  }

  function syncMyAuthor() {
    if (!state.user) return;
    const u = state.user;
    const previous = state.authors[u.uid] || {};
    state.authors[u.uid] = {
      ...previous,
      uid: u.uid,
      nickname: u.nickname,
      bio: u.bio || '',
      avatar: u.avatar || '',
      fans: previous.fans || 0
    };
  }

  function getAuthor(id) {
    if (state.user?.uid === id) syncMyAuthor();
    return state.authors[id] || fallbackAuthor(id);
  }

  function requireDemo(action) {
    if (!state.user) {
      openLogin(action);
      return false;
    }
    return true;
  }

  function shareURL(type, id) {
    const u = new URL(location.href);
    u.hash = type + '/' + encodeURIComponent(id);
    return u.href;
  }

  async function sharePage(type, id, title) {
    const url = shareURL(type, id);
    try {
      if (navigator.share) {
        await navigator.share({ title, url });
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
        toast('分享網址已複製。');
      } else {
        modal('分享網址', `
          <p class="muted small">請手動複製下方網址。</p>
          <input readonly value="${esc(url)}"
                 onclick="this.select()">
        `);
      }
    } catch (e) {
      if (e.name !== 'AbortError') toast('分享未完成，請稍後重試。');
    }
  }

  /*
   * Hash routes support seeded characters across browsers.
   * Local-created data is not available on another browser/device.
   */
  function routeHash() {
    const match = location.hash.match(/^#(character|author)\/(.+)$/);
    if (!match) return;

    let id;
    try { id = decodeURIComponent(match[2]); }
    catch (_) { return; }

    if (match[1] === 'character') {
      const c = state.characters.find(x => x.id === id);
      if (!c) {
        toast('此瀏覽器沒有該角色資料；本機創角尚未支援跨裝置分享。');
        return;
      }
      if (c.visibility !== 'public' &&
          (!state.user || c.authorId !== currentUID())) {
        toast('這是私密角色，無法公開查看。');
        return;
      }
      activeCharacter = id;
      navigate('detail');
    } else {
      authorPageId = id;
      openAuthor(id);
    }
  }

  window.addEventListener('hashchange', routeHash);

  /* ---------- Shell ---------- */

  renderShell = function() {
    original.renderShell();

    document.body.classList.toggle(
      'px-mobile-conversation',
      page === 'chat' && mobileConversation && !!activeChat
    );
    document.body.classList.toggle(
      'px-mobile-chat-list',
      page === 'chat' && !mobileConversation
    );

    const footer = document.querySelector('.sidebar-footer');
    if (footer) {
      footer.innerHTML = `
        <button class="brand" onclick="navigate('home')">
          ✦ <span class="brand-name">PersonaX</span>
        </button>
        <p class="muted small" style="text-align:center;margin:12px 0">
          本機前端原型
        </p>`;
    }

    if (page === 'author') {
      $('pageTitle').textContent = '作者主頁';
    }

    document.querySelectorAll('.nav-btn').forEach(button => {
      const label = button.querySelector('.nav-label')?.textContent;
      const icon = button.querySelector('.nav-icon');
      if (!icon) return;

      if (label === '系統通知') {
        icon.innerHTML = `
          <svg class="px-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path>
            <path d="M10 21h4"></path>
          </svg>`;
      }
      if (label === '創建角色') {
        icon.innerHTML = `
          <svg class="px-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M2 21v-2a7 7 0 0 1 12-5"></path>
            <path d="M18 13v8M14 17h8"></path>
          </svg>`;
      }
    });
  };

  navigate = function(target) {
    if (target !== 'chat') mobileConversation = false;
    if (target !== 'detail') replyTo = null;

    if (target === 'author') {
      page = 'author';
      renderShell();
      renderAuthor();
      window.scrollTo(0, 0);
      return;
    }

    original.navigate(target);
    renderShell();
  };

  demoLogin = function() {
    original.demoLogin();
    migrate();
    save();
    renderShell();
  };

  logout = function() {
    mobileConversation = false;
    original.logout();
  };

  /* ---------- Detail ---------- */

  renderDetail = function() {
    const c = state.characters.find(x => x.id === activeCharacter);
    if (!c) return original.renderDetail();

    if (c.visibility !== 'public' &&
        (!state.user || c.authorId !== currentUID())) {
      toast('無法查看其他作者的私密角色。');
      navigate('home');
      return;
    }

    original.renderDetail();

    const section = $('view').querySelector('.detail-layout > section');
    const author = getAuthor(c.authorId);

    const title = section.querySelector('h1');
    title.insertAdjacentHTML('afterend', `
      <div>
        <button class="px-author"
                onclick="PX.openAuthor(${arg(c.authorId)})">
          BY @${esc(author.nickname)}
        </button>
        <p class="muted small" style="margin:8px 0">
          👥 ${c.userCount === null ? '尚未統計' : esc(c.userCount)} 位對話用戶
          ｜💬 ${esc(c.chats)} 次對話
          <span class="badge">示範資料</span>
        </p>
      </div>`);

    const startButton = section.querySelector('button.primary');
    if (startButton) {
      startButton.outerHTML = `
        <div class="px-detail-actions">
          <button class="primary" onclick="startChat(${arg(c.id)})">
            開始聊天
          </button>
          <button onclick="PX.shareCharacter(${arg(c.id)})">↗ 分享</button>
          <button onclick="toggleFavorite(${arg(c.id)})"
                  aria-pressed="${state.favorites.includes(c.id)}">
            ${state.favorites.includes(c.id) ? '♥ 已喜愛' : '♡ 喜愛'}
          </button>
          <button onclick="PX.report('角色', ${arg(c.id)})">⚑ 檢舉</button>
        </div>`;
    }

    $('view').insertAdjacentHTML('beforeend', `
      <section class="panel" style="margin-top:24px">
        <h2>評論</h2>
        <p class="muted small">
          本機示範評論，尚未與其他使用者同步。
        </p>
        <div id="pxComments"></div>
        <div id="pxReplyHint" class="muted small"
             style="margin-top:18px"></div>
        <form onsubmit="PX.postComment(event)" style="margin-top:12px">
          <textarea id="pxCommentInput" maxlength="2000"
                    placeholder="輸入評論…"></textarea>
          <div class="row between" style="margin-top:10px">
            <span class="muted small">最多 2000 字</span>
            <button class="primary" type="submit">送出評論</button>
          </div>
        </form>
      </section>`);

    renderComments();
  };

  /* ---------- Comments ---------- */

  function commentList() {
    return state.comments[activeCharacter] ||= [];
  }

  function renderComments() {
    if (!$('pxComments')) return;
    const list = commentList();

    $('pxComments').innerHTML = list.map(comment => {
      const author = getAuthor(comment.authorId);
      const mine = comment.authorId === currentUID();
      const liked = (comment.likes || []).includes(currentUID());
      const parent = list.find(x => x.id === comment.parentId);
      const parentAuthor = parent ? getAuthor(parent.authorId) : null;

      return `
        <article class="px-comment ${comment.parentId ? 'px-comment-reply' : ''}">
          <div class="px-comment-header">
            ${avatarHTML(author)}
            <div class="grow">
              <button class="px-author"
                      onclick="PX.openAuthor(${arg(author.uid)})">
                @${esc(author.nickname)}
              </button>
              <div class="muted small">
                ${esc(dateText(comment.at))}
                ${comment.edited ? ' · 已修改' : ''}
              </div>
            </div>
            ${!comment.deleted ? `
              <button class="heart ${liked ? 'on' : ''}"
                      onclick="PX.likeComment(${arg(comment.id)})">
                ${liked ? '♥' : '♡'} ${(comment.likes || []).length}
              </button>` : ''}
          </div>

          ${parentAuthor ? `
            <p class="muted small" style="margin:10px 0 0">
              回覆 @${esc(parentAuthor.nickname)}
            </p>` : ''}

  function postComment(event) {
    event.preventDefault();
    if (!state.user) {
      openLogin(() => toast('已登入，請再次按下送出評論。'));
      return;
    }

    const input = $('pxCommentInput');
    const text = input.value.trim();
    if (!text) return toast('請輸入評論內容。');

    syncMyAuthor();
    commentList().push({
      id: uid(),
      authorId: currentUID(),
      text,
      parentId: replyTo,
      likes: [],
      deleted: false,
      at: Date.now()
    });

    replyTo = null;
    input.value = '';
    $('pxReplyHint').textContent = '';
    save();
    renderComments();
  }

  function likeComment(id) {
    if (!requireDemo(() => likeComment(id))) return;
    const c = commentList().find(x => x.id === id);
    if (!c || c.deleted) return;
    c.likes ||= [];
    const index = c.likes.indexOf(currentUID());
    if (index >= 0) c.likes.splice(index, 1);
    else c.likes.push(currentUID());
    save();
    renderComments();
  }

  function replyComment(id) {
    const c = commentList().find(x => x.id === id);
    if (!c || c.deleted) return;
    replyTo = id;
    $('pxReplyHint').innerHTML = `

      <button onclick="PX.cancelReply()" style="padding:4px 8px">取消</button>`;
    $('pxCommentInput').focus();

    modal('評論選項', mine ? `
      <div class="stack">
        <button onclick="PX.editComment(${arg(id)})" style="width:100%">修改評論</button>

    const c = commentList().find(x => x.id === id);

    modal('修改評論', `

    const c = commentList().find(x => x.id === id);
    if (!c || c.authorId !== currentUID() || c.deleted) return;
    const text = $('pxCommentEdit').value.trim();
    if (!text) return toast('評論不能留空；要移除請使用刪除。');

  function deleteComment(id) {
    const c = commentList().find(x => x.id === id);

    if (!confirm('確定刪除此評論？刪除後會保留「該筆評論已被刪除」提示。')) return;

  function checkReport(event) {
    event.preventDefault();

         image.size > 1024 * 1024)) {
      return toast('圖片需為 PNG、JPG 或 WebP，且不超過 1 MB。');
    }
    closeModal();
    toast('表單檢查通過；尚未送至管理員。');

  /* ---------- Chat list ---------- */

  function relativeDay(time) {
    const now = new Date();
    const midnight = new Date(
      now.getFullYear(), now.getMonth(), now.getDate()
    ).getTime();
    if (time >= midnight) return '今天';
    if (time >= midnight - DAY) return '昨天';
    return new Date(time).toLocaleDateString('zh-TW');
  }

  chatListHTML = function() {
    const q = chatSearch.trim().toLowerCase();
    const ids = Object.keys(state.chats).filter(id => {
      const c = state.characters.find(x => x.id === id);
      const chat = state.chats[id];
      return c && (showingHidden || !chat.hidden) &&
        (!q || c.name.toLowerCase().includes(q));
    }).sort((a, b) => {
      const x = state.chats[a], y = state.chats[b];
      return Number(y.pinned) - Number(x.pinned) ||
        (y.messages.at(-1)?.at || 0) - (x.messages.at(-1)?.at || 0);
    });

    return `
      <aside class="panel chat-list">
        <button style="width:100%" onclick="showGroupInfo()">＋ 創建群組</button>
        <input id="pxChatSearch" style="margin-top:14px"
               placeholder="搜尋角色名稱"
               value="${esc(chatSearch)}"
               oninput="PX.searchChats(this.value)">
        <label class="check muted small" style="margin:12px 0">
          <input type="checkbox" ${showingHidden ? 'checked' : ''}
                 onchange="PX.showHidden(this.checked)">
          顯示已隱藏對話
        </label>
        <div id="pxChatEntries">
          ${chatEntries(ids)}
        </div>
      </aside>`;
  };

  function chatEntries(ids) {
    return ids.map(id => {
      const c = state.characters.find(x => x.id === id);
      const chat = state.chats[id];
      const last = chat.messages.at(-1);
      return `
        <div class="chat-entry ${activeChat === id ? 'active' : ''}">
          <button class="px-pin ${chat.pinned ? 'on' : ''}"
                  aria-label="${chat.pinned ? '取消置頂' : '置頂對話'}"
                  onclick="pinChat(${arg(id)})">${PIN}</button>
          <button class="ghost" style="padding:0;border:0"
                  onclick="openDetail(${arg(id)})" aria-label="角色介紹">
            <img class="avatar" src="${esc(c.image)}" alt="">
          </button>
          <button class="select-chat" onclick="selectChat(${arg(id)})">
            <div class="row between">
              <strong>${esc(c.name)}</strong>
              <span class="muted small">${relativeDay(last?.at || 0)}</span>
            </div>
            <div class="muted small ellipsis">${esc(last?.text || '')}</div>
            ${chat.hidden ? '<span class="badge">已隱藏</span>' : ''}
          </button>
          <button class="px-chat-menu"
                  onclick="PX.chatMenu(${arg(id)})"
                  aria-label="對話選項">⋯</button>
        </div>`;
    }).join('') || '<div class="empty">沒有符合條件的對話。</div>';
  }

  function refreshChatList() {
    const holder = document.querySelector('.chat-list');
    if (!holder) return;
    holder.outerHTML = chatListHTML();
  }

  function searchChats(value) {
    chatSearch = value;
    const q = value.trim().toLowerCase();
    const ids = Object.keys(state.chats).filter(id => {
      const c = state.characters.find(x => x.id === id);
      return c && (showingHidden || !state.chats[id].hidden) &&
        (!q || c.name.toLowerCase().includes(q));
    }).sort((a, b) =>
      Number(state.chats[b].pinned) - Number(state.chats[a].pinned) ||
      (state.chats[b].messages.at(-1)?.at || 0) -
      (state.chats[a].messages.at(-1)?.at || 0)
    );
    if ($('pxChatEntries')) $('pxChatEntries').innerHTML = chatEntries(ids);
  }

  function chatMenu(id) {
    const chat = state.chats[id];
    if (!chat) return;
    modal('對話選項', `
      <div class="stack">
        <button style="width:100%" onclick="PX.hideChat(${arg(id)})">
          ${chat.hidden ? '取消隱藏' : '隱藏對話'}
        </button>
        <button class="danger" style="width:100%"

        </button>
      </div>`);

  function hideChat(id) {
    const chat = state.chats[id];
    if (!chat) return;
    chat.hidden = !chat.hidden;
    if (chat.hidden && activeChat === id) {
      activeChat = null;
      mobileConversation = false;
    }
    save();
    closeModal();
    renderChat();
    renderShell();
  }

  function removeChat(id) {
    const c = state.characters.find(x => x.id === id);
    if (!c || !state.chats[id]) return;
    if (!confirm(`確定要刪除「${c.name}」嗎？所有的對話、日記與相簿資料都會不見哦！`)) return;

    delete state.chats[id];
    if (activeChat === id) activeChat = null;
    mobileConversation = false;
    save();
    closeModal();
    renderChat();
    renderShell();
  }

  selectedChat = function() {
    if (!activeChat || !state.chats[activeChat] ||
        state.chats[activeChat].hidden) {
      activeChat = Object.keys(state.chats).find(id =>
        !state.chats[id].hidden &&
        state.characters.some(c => c.id === id)
      ) || null;
    }
    return state.chats[activeChat] || null;
  };

  startChat = function(id) {
    if (!state.user) {
      openLogin(() => startChat(id));
      return;

    const c = state.characters.find(x => x.id === id);
    if (!c) return;
    if (c.visibility !== 'public' && c.authorId !== currentUID()) {
      return toast('無法與其他作者的私密角色聊天。');
    }

    if (state.chats[id]) state.chats[id].hidden = false;
    mobileConversation = true;
    original.startChat(id);
    migrate();
    save();
    renderShell();
  };

  selectChat = function(id) {
    if (!state.chats[id]) return;
    state.chats[id].hidden = false;
    activeChat = id;

    renderChat();
    renderShell();

  /* Narration is outside speech bubbles. */
  renderMessages = function() {
    const chat = state.chats[activeChat];
    const c = state.characters.find(x => x.id === activeChat);
    if (!chat || !c || !$('messages')) return;

    $('messages').innerHTML = chat.messages.map(m => {
      const user = m.role === 'user';

      const pieces = user ? [m.text]
        : String(m.text).split(/(\*\*[\s\S]*?\*\*)/g);

      const content = pieces.filter(Boolean).map(part => {
        const narration = !user &&
          part.startsWith('**') && part.endsWith('**');

        if (narration) {
          return `<div class="px-narration">${esc(part.slice(2, -2))}</div>`;
        }
        if (!part.trim()) return '';
        return `<div class="bubble" style="margin-bottom:7px">${esc(part.trim())}</div>`;
      }).join('');

      return `
        <div class="message ${user ? 'user' : ''}">
          ${user ? avatarHTML(state.user) :
            `<img class="avatar" src="${esc(c.image)}" alt="">`}
          <div class="message-content">
            <div class="message-name">
              ${esc(user ? state.user.nickname : c.name)}
            </div>
            ${content}
          </div>
        </div>`;
    }).join('');

    $('messages').scrollTop = $('messages').scrollHeight;
  };

  /* Blank send continues the demo, without adding an empty user turn. */
  sendMessage = function(event) {
    event.preventDefault();
    const chat = state.chats[activeChat];
    if (!state.user || !chat) return;

    const text = $('messageInput').value.trim();

    if (text) {
      chat.messages.push({
        id: uid(), role: 'user', text, at: Date.now()
      });
    }

    chat.messages.push({
      id: uid(),
      role: 'assistant',
      text: text
        ? '**他將目光移向你，耐心等待你繼續說下去。**\n「我在聽。你可以慢慢說。」\n\n［固定示範回覆，非 AI 生成］'
        : '**短暫的沉默後，他再次開口。**\n「如果你還不想說，我可以先陪你待一會兒。」\n\n［空白送出的接續示範，非 AI 生成］',
      at: Date.now() + 1
    });

    const users = chat.messages.filter(m => m.role === 'user');
    if (text && users.length % 5 === 0) {
      const snippets = users.slice(-5)
        .map(m => chars(m.text).slice(0, 6).join(''))
        .join('、');

      const summary = chars(
        `本輪五次輸入摘錄：${snippets}。僅為示範，非AI摘要。`
      ).slice(0, 50).join('');

      addMemory(chat, summary);
    }

    $('messageInput').value = '';
    save();
    renderMessages();
    renderMemories();
  };

        <div class="empty">
          OH NO，你現在還沒有跟他有回憶哦。<br>
          快照功能尚未串接圖片模型。
        </div>`}`;
  }

  function viewPhoto(id) {
    const photo = state.chats[activeChat]?.album?.find(p => p.id === id);
    if (!photo) return;

    modal('回憶快照', `
      <img src="${esc(photo.url)}" alt="回憶快照"
           style="width:100%;border-radius:14px">
      <p class="muted small" style="margin-top:12px">${esc(dateText(photo.at))}</p>
      <button onclick="PX.fullscreenPhoto()">全螢幕查看</button>
    `);
  }

  async function fullscreenPhoto() {
    const image = $('modal').querySelector('img');
    if (!image?.requestFullscreen) {
      toast('此瀏覽器不支援圖片全螢幕，可用縮放查看。');
      return;
    }
    try { await image.requestFullscreen(); }
    catch (_) { toast('無法進入全螢幕。'); }
  }

  /* ---------- Diary changes ---------- */

  addMemory = function(chat, text) {
    const newMemory = {
      id: uid(), text, important: false, at: Date.now()
    };

    const next = [...chat.memories, newMemory];
    while (memoryLength(next) > 3000) {
      const index = next.findIndex(m => !m.important);

      if (index < 0) {
        toast('重大記憶已達容量上限，無法新增日記。');
        return;
      }

      const removed = next.splice(index, 1)[0];

      if (removed.id === newMemory.id) {
        toast('剩餘記憶容量不足，這次未新增日記。');
        return;
      }
    }

    chat.memories = next;
  };

  renderMemories = function() {
    if (!$('memories')) return;
    const chat = state.chats[activeChat];
    if (!chat) return;

    $('memories').innerHTML = `
      <p class="muted small">${memoryLength(chat.memories)} / 3000 字</p>
      ${chat.memories.map(m => `
        <div class="memory-item">
          <label class="check">
            <input type="checkbox" ${m.important ? 'checked' : ''}
                   onchange="PX.toggleMemory(${arg(m.id)}, this.checked)">
            <span>${m.important ? '♥ 重大記憶' : '設為重大記憶'}</span>
          </label>
          <p class="prose">${esc(m.text)}</p>
          <div class="muted small">${esc(dateText(m.at))}</div>
          <button style="margin-top:10px" ${m.important ? 'disabled' : ''}
                  onclick="editMemory(${arg(m.id)})">編輯</button>
        </div>`).join('') ||
      '<div class="empty">還沒有日記，完成 5 次輸入後會建立示範摘錄。</div>'}`;
  };

  function toggleMemory(id, checked) {
    const m = state.chats[activeChat]?.memories.find(x => x.id === id);
    if (!m) return;
    m.important = checked;
    save();
    renderMemories();
  }

  editMemory = function(id) {
    const m = state.chats[activeChat]?.memories.find(x => x.id === id);
    if (!m || m.important) return;
    modal('編輯記憶', `
      <p class="muted small">將內容全部清空後儲存，會刪除此筆記憶。</p>
      <textarea id="memoryEdit" maxlength="3000">${esc(m.text)}</textarea>
      <div class="row" style="margin-top:16px">
        <button onclick="closeModal()">取消</button>
        <button class="primary" onclick="saveMemory(${arg(id)})">存檔</button>
      </div>`);
  };

  saveMemory = function(id) {
    const chat = state.chats[activeChat];
    const m = chat?.memories.find(x => x.id === id);
    if (!m || m.important) return;

    const text = $('memoryEdit').value.trim();
    if (!text) {
      if (!confirm('內容為空，確定刪除此筆記憶？')) return;
      chat.memories = chat.memories.filter(x => x.id !== id);
    } else {
      const total = memoryLength(chat.memories) -
        chars(m.text).length + chars(text).length;
      if (total > 3000) return toast('儲存後超過 3000 字，請縮短內容。');
      m.text = text;
    }

    save();
    closeModal();
    renderMemories();
  };

  /* ---------- Recommendation infinite loading ---------- */

  renderExploreGrid = function() {
    original.renderExploreGrid();
    exploreObserver?.disconnect();

    if (currentFilter !== 'recommended' || !$('loadMoreArea')) return;

    const list = exploreList();
    const maximum = Math.min(150, list.length);

    if (recommendationLimit >= maximum) return;

    $('loadMoreArea').innerHTML = `
      <div id="pxRecommendationSentinel" style="padding:20px">
        <button onclick="loadMoreRecommendations()">載入更多角色</button>
      </div>`;

    if (!('IntersectionObserver' in window)) return;

    exploreObserver = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      exploreObserver.disconnect();
      recommendationLimit = Math.min(maximum, recommendationLimit + 24);
      renderExploreGrid();
    }, { rootMargin: '150px' });

    exploreObserver.observe($('pxRecommendationSentinel'));
  };

  /* Export only UI handlers needed by inline event attributes. */
  window.PX = {
    openAuthor,
    followAuthor,
    shareCharacter: id => {
      const c = state.characters.find(x => x.id === id);
      if (!c) return;
      if (c.visibility !== 'public') {
        toast('私密角色不能公開分享。');
        return;
      }
      sharePage('character', id, c.name + '｜PersonaX');
    },
    shareAuthor: id =>
      sharePage('author', id, getAuthor(id).nickname + '｜PersonaX'),
    postComment,
    likeComment,
    replyComment,
    cancelReply: () => {
      replyTo = null;
      if ($('pxReplyHint')) $('pxReplyHint').textContent = '';
    },
    commentMenu,
    editComment,
    saveComment,
    deleteComment,
    translationInfo: () => modal('評論翻譯', `
      <p>尚未接入翻譯服務，因此目前不能產生翻譯。</p>
      <p class="muted small">正式版可接翻譯 API，或由後端呼叫文字模型。</p>
    `),
    report,
    checkReport,
    searchChats,
    showHidden: checked => {
      showingHidden = checked;
      refreshChatList();
    },
    chatMenu,
    hideChat,
    removeChat,
    backToChatList,
    openChatOverlay,
    closeChatOverlay: () =>
      $('view').querySelector('.px-chat-overlay')?.remove(),
    viewPhoto,
    fullscreenPhoto,
    toggleMemory
  };

  migrate();
  save();
  renderShell();

  if (page === 'author') renderAuthor();
  else renderPage();

  routeHash();
})();
</script>

<script>
(() => {
  'use strict';

  if (!window.PX) {
    console.error('此更新需要先安裝第二版 PDF 更新補丁。');
    return;
  }

  const previousShell = renderShell;
  let hideDesktopList = false;
  let archiveId = null;
  let archiveTab = 'messages';

  const inlineArg = value => esc(JSON.stringify(String(value)));
  const copy = value => JSON.parse(JSON.stringify(value));

  const icon = paths => `
    <svg class="px-ui-icon" viewBox="0 0 24 24" aria-hidden="true">
      ${paths}
    </svg>`;

  const icons = {
    back: icon('<path d="m14 5-7 7 7 7"></path>'),
    album: icon(`
      <rect x="3" y="4" width="18" height="16" rx="3"></rect>
      <circle cx="8" cy="9" r="1.5"></circle>
      <path d="m4 17 5-5 4 4 3-3 5 5"></path>
    `),
    diary: icon(`
      <path d="M5 3h14v18H5z"></path>
      <path d="M3 7h4M3 12h4M3 17h4M10 8h5M10 12h5M10 16h3"></path>
    `),
    menu: icon('<path d="M4 6h16M4 12h16M4 18h16"></path>')
  };

  function prepareChat(chat) {
    chat.archives ||= [];
    chat.startedAt ||= chat.messages?.[0]?.at || Date.now();
    chat.settings ||= {};

    if (!['day', 'night'].includes(chat.settings.theme)) {
      chat.settings.theme = 'night';
    }

    if (!['avatar', 'none'].includes(chat.settings.background)) {
      chat.settings.background = 'avatar';
    }

    chat.album ||= [];
    chat.memories ||= [];
  }

  Object.values(state.chats).forEach(prepareChat);

  /* ---------- Global shell and sidebar toggle ---------- */

  renderShell = function() {
    previousShell();

    document.body.classList.toggle('px-chat-workspace', page === 'chat');
    document.body.classList.toggle(
      'px-hide-chat-list',
      page === 'chat' && hideDesktopList
    );

    // Remove old collapse control from the global header.
    const oldToggle = document.querySelector(
      '.app > header .desktop-only[onclick="toggleSidebar()"]'
    );
    oldToggle?.remove();

    const sidebar = document.querySelector('.sidebar');
    if (sidebar && !sidebar.querySelector('.px-sidebar-heading')) {
      const brand = sidebar.querySelector(':scope > .brand');

      if (brand) {
        const heading = document.createElement('div');
        heading.className = 'px-sidebar-heading';

        sidebar.insertBefore(heading, brand);
        heading.appendChild(brand);

        const toggle = document.createElement('button');
        toggle.className = 'px-sidebar-toggle';
        toggle.type = 'button';
        toggle.setAttribute('aria-label', '收合或展開網站選單');
        toggle.onclick = toggleSidebar;
        toggle.innerHTML = icons.menu;
        heading.appendChild(toggle);
      }
    }
  };

  /* ---------- Rebuild chat layout ---------- */

  renderChat = function() {
    const chat = selectedChat();
    const character = state.characters.find(c => c.id === activeChat);

    if (chat) prepareChat(chat);

    $('view').innerHTML = `
      <div class="chat-layout">
        ${chatListHTML()}

        ${chat && character ? conversationHTML(character, chat) : `
          <section class="panel chat-main">
            <div class="empty" style="margin:20px">

            <button class="primary" style="margin:0 20px"
                    onclick="navigate('home')">探索角色</button>

      'button[onclick="showGroupInfo()"]'

    if (groupButton) {

      renderMessages();

  function conversationHTML(character, chat) {
    const suggestions = [

      '可以多說一些嗎？',

    ];

    return `

            <button onclick="PX.openChatOverlay('diary')"
                    title="甜蜜日記" aria-label="甜蜜日記">

            <button onclick="CX.menu()"
                    title="聊天功能" aria-label="聊天功能">

            </button>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <details class="px-compact-phone">
          <summary>
            <span>▰ 100% · ${esc(character.name)}的手機 ▾</span>
            <span>${esc(new Date().toLocaleTimeString('zh-TW', {
              hour: '2-digit',
              minute: '2-digit'
            }))}</span>
          </summary>

          <p>地點：初始場景 · 狀態：等待你的回應</p>
          <p>通知／備忘：此為展示欄位，尚未接入 AI 動態狀態。</p>
        </details>

        <form class="composer" onsubmit="sendMessage(event)">
          ${chat.suggestions ? `
            <div class="suggestions">
              ${suggestions.map((text, index) => `
                <button type="button" onclick="useSuggestion(${index})">
                  ${esc(text)}
                </button>
              `).join('')}
            </div>
          ` : ''}

          <div class="row" style="gap:7px">
            <textarea id="messageInput" maxlength="3000"
                      placeholder="輸入對話…"
                      onkeydown="messageKeydown(event)"></textarea>

            <button class="primary" type="submit"
                    aria-label="送出或讓角色接續回應"
                    style="padding:9px 12px">➤</button>
          </div>

          <div class="chat-tools">
            <button type="button" onclick="snapshotInfo()">📷 快照</button>
            <button type="button" onclick="editPersona()">⚙ 人設</button>
            <button type="button" onclick="toggleSuggestions()">
              建議回覆 ${chat.suggestions ? 'ON' : 'OFF'}
            </button>
            <button type="button" disabled>圖片上傳｜未開放</button>
          </div>
        </form>
      </section>
    `;
  }

  function applyAppearance() {
    const chat = state.chats[activeChat];
    const character = state.characters.find(c => c.id === activeChat);
    const panel = $('view').querySelector('.chat-main');

    if (!chat || !character || !panel) return;

    prepareChat(chat);
    panel.classList.toggle('px-day', chat.settings.theme === 'day');

    panel.style.setProperty(
      '--px-chat-background',
      chat.settings.background === 'avatar'
        ? `url(${JSON.stringify(character.image)})`
        : 'none'
    );
  }

  function back() {
    if (window.matchMedia('(max-width: 767px)').matches) {
      PX.backToChatList();
      return;
    }

    hideDesktopList = !hideDesktopList;
    renderShell();
  }

  /* ---------- Same action formatting for AI and user ---------- */

  renderMessages = function() {
    const chat = state.chats[activeChat];
    const character = state.characters.find(c => c.id === activeChat);
    const holder = $('messages');

    if (!chat || !character || !holder) return;

    holder.innerHTML = chat.messages.map(message => {
      const user = message.role === 'user';

      const content = String(message.text)
        .split(/(\*\*[\s\S]*?\*\*)/g)
        .filter(Boolean)
        .map(part => {
          const narration = part.startsWith('**') && part.endsWith('**');

          if (narration) {
            return `
              <div class="px-narration">${esc(part.slice(2, -2))}</div>
            `;
          }

          if (!part.trim()) return '';

          return `
            <div class="bubble" style="margin-bottom:7px">
              ${esc(part.trim())}
            </div>
          `;
        }).join('');

      return `
        <div class="message ${user ? 'user' : ''}">
          ${user
            ? avatarHTML(state.user)
            : `<img class="avatar" src="${esc(character.image)}" alt="">`}

          <div class="message-content">
            <div class="message-name">
              ${esc(user ? state.user.nickname : character.name)}
            </div>
            ${content}
          </div>
        </div>
      `;
    }).join('');

    holder.scrollTop = holder.scrollHeight;
  };

  /* ---------- Menus ---------- */

  function listMenu() {
    modal('聊天列表', `
      <div class="stack">
        <button style="width:100%" onclick="CX.groupInfo()">＋ 創建群組</button>
        <button style="width:100%" onclick="CX.menu()">聊天管理</button>
      </div>
      <p class="muted small" style="margin-top:18px">
        群組 AI 與付費會員驗證尚未串接。
      </p>
    `);
  }

  function menu() {
    const chat = state.chats[activeChat];

    if (!chat) {
      toast('請先選擇一個角色對話。');
      return;
    }

    prepareChat(chat);

    modal('聊天功能', `
      <div class="stack">
        <button style="width:100%" onclick="CX.manage()">
          聊天管理
        </button>

        <label class="field">
          <span>預設色系</span>
          <select onchange="CX.setting('theme', this.value)">
            <option value="day"
                    ${chat.settings.theme === 'day' ? 'selected' : ''}>
              白天
            </option>
            <option value="night"
                    ${chat.settings.theme === 'night' ? 'selected' : ''}>
              黑夜
            </option>
          </select>
        </label>

        <label class="field">
          <span>聊天背景設定</span>
          <select onchange="CX.setting('background', this.value)">
            <option value="avatar"
                    ${chat.settings.background === 'avatar' ? 'selected' : ''}>
              角色頭像
            </option>
            <option value="none"
                    ${chat.settings.background === 'none' ? 'selected' : ''}>
              無背景
            </option>
          </select>
        </label>

        <button class="primary" style="width:100%" onclick="CX.newConversation()">
          開始新對話
        </button>

        <button style="width:100%" onclick="CX.archives()">
          舊的回憶 · ${chat.archives.length}
        </button>
      </div>

      <p class="muted small" style="margin-top:18px">
        色系及背景設定會保存在此瀏覽器。
        開始新對話前，現有對話、日記及相簿會封存。
      </p>
    `);
  }

  function setting(key, value) {
    const chat = state.chats[activeChat];
    if (!chat) return;

    const allowed = {
      theme: ['day', 'night'],
      background: ['avatar', 'none']
    };

    if (!allowed[key]?.includes(value)) return;

    prepareChat(chat);
    chat.settings[key] = value;
    save();
    applyAppearance();
  }

  function manage() {
    if (!activeChat || !state.chats[activeChat]) return;
    PX.chatMenu(activeChat);
  }

  /* ---------- New conversation and archives ---------- */

  function newConversation() {
    const chat = state.chats[activeChat];
    const character = state.characters.find(c => c.id === activeChat);

    if (!chat || !character) return;

    if (!confirm(
      '開始新對話嗎？目前的對話、甜蜜日記及相簿會保存到「舊的回憶」。'
    )) return;

    prepareChat(chat);

    const previous = copy(chat);

    const date = new Date(chat.startedAt);
    const dateName = [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0')
    ].join('-');

    const archive = {
      id: uid(),
      name: character.name + '_' + dateName,
      startedAt: chat.startedAt,
      archivedAt: Date.now(),
      messages: copy(chat.messages),
      memories: copy(chat.memories),
      album: copy(chat.album),
      persona: chat.persona || ''
    };

    chat.archives.unshift(archive);

    chat.messages = [{
      id: uid(),
      role: 'assistant',
      text: character.opening || '**新的故事開始了。**',
      at: Date.now()
    }];

    chat.memories = [];
    chat.album = [];
    chat.startedAt = Date.now();

    // Keep existing preferences and persona; only reset story records.
    if (!save()) {
      state.chats[activeChat] = previous;
      toast('封存失敗，未開始新對話。請確認瀏覽器儲存空間。');
      return;
    }

    closeModal();
    renderChat();
    toast('新對話已開始，舊資料已保存到「舊的回憶」。');
  }

  function archives() {
    const chat = state.chats[activeChat];
    if (!chat) return;
    prepareChat(chat);

    modal('舊的回憶', `
      <p class="muted small">
        保存之前的對話、日記與相簿；目前僅儲存在此瀏覽器。
      </p>

      ${chat.archives.map(item => `
        <article class="px-archive-card">
          <strong>${esc(item.name)}</strong>

          <p class="muted small" style="margin:8px 0">
            封存時間：
            ${esc(new Date(item.archivedAt).toLocaleString('zh-TW'))}<br>
            對話 ${item.messages.length} 筆 ·
            日記 ${item.memories.length} 筆 ·
            相片 ${item.album.length} 張
          </p>

          <button onclick="CX.viewArchive(${inlineArg(item.id)}, 'messages')">
            查看回憶
          </button>
        </article>
      `).join('') || '<div class="empty">還沒有封存的回憶。</div>'}
    `);
  }

  function archivedMessageHTML(message) {
    const text = String(message.text)
      .split(/(\*\*[\s\S]*?\*\*)/g)
      .map(part => {
        if (part.startsWith('**') && part.endsWith('**')) {
          return `<em>${esc(part.slice(2, -2))}</em>`;
        }
        return esc(part);
      }).join('');

    return `
      <div class="px-archive-message">
        <strong>${message.role === 'user' ? '你' : '角色'}</strong>
        <div>${text}</div>
      </div>
    `;
  }

  function safePhotoURL(value) {
    const url = String(value || '');

    if (/^data:image\/(png|jpeg|webp);base64,/.test(url)) return url;

    try {
      const parsed = new URL(url);
      if (parsed.protocol === 'https:' &&
          !parsed.username && !parsed.password) {
        return parsed.href;
      }
    } catch (_) {}

    return '';
  }

  function viewArchive(id, tab = 'messages') {
    const chat = state.chats[activeChat];
    const archive = chat?.archives?.find(item => item.id === id);
    if (!archive) return;

    archiveId = id;
    archiveTab = tab;

    let content = '';

    if (tab === 'messages') {
      content = archive.messages.map(archivedMessageHTML).join('');
    } else if (tab === 'memories') {
      content = archive.memories.map(memory => `
        <div class="px-archive-card">
          ${memory.important ? '<span class="badge">重大記憶</span>' : ''}
          <p class="prose" style="margin:8px 0">${esc(memory.text)}</p>
        </div>
      `).join('') || '<div class="empty">這次對話沒有日記。</div>';
    } else {
      content = archive.album.map(photo => {
        const url = safePhotoURL(photo.url);
        if (!url) return '';

        return `
          <div class="px-archive-card">
            <img src="${esc(url)}" alt="封存的回憶快照"
                 style="width:100%;border-radius:12px">
            <p class="muted small" style="margin:8px 0">
              ${esc(new Date(photo.at).toLocaleString('zh-TW'))}
            </p>
          </div>
        `;
      }).join('') || '<div class="empty">這次對話沒有相片。</div>';
    }

    modal(archive.name, `
      <div class="tabs" style="margin-bottom:14px">
        <button class="tab ${tab === 'messages' ? 'active' : ''}"
                onclick="CX.viewArchive(${inlineArg(id)}, 'messages')">
          對話
        </button>
        <button class="tab ${tab === 'memories' ? 'active' : ''}"
                onclick="CX.viewArchive(${inlineArg(id)}, 'memories')">
          甜蜜日記
        </button>
        <button class="tab ${tab === 'album' ? 'active' : ''}"
                onclick="CX.viewArchive(${inlineArg(id)}, 'album')">
          回憶相簿
        </button>
      </div>

      <div class="px-archive-content">${content}</div>

      <p class="muted small">
        此為封存記錄，只供查看，不會與目前的新對話混合。
      </p>

      <button onclick="CX.archives()">← 返回舊的回憶</button>
    `);
  }

  window.CX = {
    back,
    menu,
    listMenu,
    setting,
    manage,
    newConversation,
    archives,
    viewArchive,
    groupInfo: () => {
      closeModal();
      showGroupInfo();
    }
  };

  save();
  renderShell();

  if (page === 'chat') renderChat();
})();
</script>
</body>
</html>
