/* History: each internal page gets an actual browser-history entry. */
function routeURL(r) {
  const url = new URL(location.href);
  let hash = r.page;
  if (r.id) hash += '/' + encodeURIComponent(r.id);
  if (r.tag) hash += '?tag=' + encodeURIComponent(r.tag);
  url.hash = hash;
  return url;
}
function parseRoute() {
  const raw = location.hash.slice(1);
  const [path,query] = raw.split('?');
  const [p,key] = path.split('/');
  let identifier;
  try { identifier = key ? decodeURIComponent(key) : undefined; }
  catch (_) { identifier = undefined; }
  return {
    page:p === 'character' ? 'detail' : (p || 'citymap'),
    ...(identifier ? {id:identifier} : {}),
    ...(query ? {tag:new URLSearchParams(query).get('tag')} : {})
  };
}
function captureDraft() {
  if (route.page === 'conversation' && $('messageInput')) {
    drafts[route.id] = $('messageInput').value;
  }
}
function go(next, replace = false) {
  captureDraft();
  if (JSON.stringify(route) === JSON.stringify(next)) return;
  const depth = history.state?.personax ? history.state.depth : 0;
  const snapshot = {personax:true,depth:replace ? depth : depth+1,route:next};
  if (replace) history.replaceState(snapshot,'',routeURL(next));
  else history.pushState(snapshot,'',routeURL(next));
  route = next;
  render();
  window.scrollTo(0,0);
}
function back() {
  if (history.state?.personax && history.state.depth > 0) history.back();
  else go({page:'home'},true);
}
function openModal(name, data = {}) {
  go({...route,overlay:{name,...data}},!!route.overlay);
}
function closeModal() { back(); }
function dismissPendingDeletionModal() {
  if (state.account?.accountDeletionPending) {

    back();

}
window.addEventListener('popstate',event => {

$('modal').addEventListener('cancel',event => {
  if ($('modal').dataset.walletDialog === 'true') {
    event.preventDefault();
    $('modal').close();
    return;
  }
  event.preventDefault();

});
$('modal').addEventListener('click',event => {
  if (event.target !== $('modal')) return;
  const r = $('modal').getBoundingClientRect();
  if (event.clientX < r.left || event.clientX > r.right ||
      event.clientY < r.top || event.clientY > r.bottom) {
    if ($('modal').dataset.walletDialog === 'true') $('modal').close();
    else dismissPendingDeletionModal();
  }
});
function showDialog(title,content) {
  let modal = $('modal');

  // 防呆：登入流程或第三方程式不得讓主要 dialog 永久消失。
  if (!modal) {
    modal = document.createElement('dialog');
    modal.id = 'modal';
    document.body.appendChild(modal);

    modal.addEventListener('cancel',event => {
      event.preventDefault();
      back();
    });

    modal.addEventListener('click',event => {
      if (event.target !== modal) return;
      const r = modal.getBoundingClientRect();
      if (event.clientX < r.left || event.clientX > r.right ||
          event.clientY < r.top || event.clientY > r.bottom) back();
    });
  }

  modal.style.height='';
  modal.style.overflowY='';
  const pendingDeletionDialog = route?.overlay?.name === 'account-deletion-pending' && title === '帳號正在等待刪除';
  const deleteConfirmDialog = title === '刪除';
  const walletDialog = title === '我的資源' || title === '銀幣或鑽石不足' || title === '廣告功能尚未串接';
  modal.dataset.walletDialog = walletDialog ? 'true' : 'false';
  modal.innerHTML = `

  if (!modal.open) modal.showModal();
}

    list = list.filter(c => !String(c.id).startsWith('seed-') &&

      .sort((a,b) => (b.firstPublishedAt ?? b.createdAt)-(a.firstPublishedAt ?? a.createdAt)).slice(0,30);
  } else if (filter === 'favorites') {

  $('moreArea').innerHTML = recommended && list.length
    ? shown.length < maximum
      ? '<div id="loadSentinel"><button data-action="load-more">載入更多</button></div>'
      : '<button data-action="new-batch">換一批</button>'

  if ($('loadSentinel') && 'IntersectionObserver' in window) {

      if (!entries.some(entry => entry.isIntersecting)) return;
      gridObserver.disconnect();
      limit = Math.min(150,limit+24);

    gridObserver.observe($('loadSentinel'));
  }

async function loadCharacterTurnCounts(characterIds, forceRefresh = false) {
  const requestedIds = [...new Set((Array.isArray(characterIds) ? characterIds : [characterIds])
    .filter(isUuid))];
  // Group replies are saved asynchronously; wait for any older count request before
  // invalidating the cache, otherwise a stale response could overwrite the new count.
  if (forceRefresh) {
    const pending = requestedIds.map(id => characterTurnCountRequests.get(id)).filter(Boolean);
    if (pending.length) await Promise.all(pending.map(request => request.catch(() => {})));
    requestedIds.forEach(id => characterTurnCountCache.delete(id));
  }
  const ids = requestedIds.filter(id => !characterTurnCountCache.has(id) && !characterTurnCountRequests.has(id));
  if (!ids.length || !window.mySupabase) {
    for (const id of (Array.isArray(characterIds) ? characterIds : [characterIds])) {
      if (characterTurnCountCache.has(id)) updateCharacterTurnCountElements(id, characterTurnCountCache.get(id));
    }
    return;
  }
  const requestKey = ids.join(',');
  const request = (async () => {
    const {data,error} = await window.mySupabase.rpc('get_character_turn_counts',{p_character_ids:ids});
    if (error) throw error;
    if (!Array.isArray(data)) throw new Error('角色回合統計回傳格式無效');
    for (const row of data) {
      if (!isUuid(row.character_id)) continue;
      const count = Number(row.turn_count);
      if (!Number.isSafeInteger(count) || count < 0) continue;
      characterTurnCountCache.set(row.character_id,count);
      updateCharacterTurnCountElements(row.character_id,count);
    }
    // A successful RPC omits private characters not owned by this caller and all deleted
    // characters. Clear stale cached numbers and hide their count badges instead of showing 0.
    const returnedIds = new Set(data.filter(row => isUuid(row.character_id)).map(row => row.character_id));
    for (const id of ids) {
      if (returnedIds.has(id)) continue;
      characterTurnCountCache.delete(id);
      updateCharacterTurnCountElements(id,null);
    }
  })();
  ids.forEach(id => characterTurnCountRequests.set(id,request));
  try {
    await request;
  } catch (error) {
    // 統計載入失敗時保留現有數字，不留下「載入中」或額外統計列。
    console.warn('角色對話回合統計載入失敗：',error?.message || error);
  } finally {
    ids.forEach(id => characterTurnCountRequests.delete(id));
  }
}
function updateCharacterTurnCountElements(characterId,count) {
  document.querySelectorAll('[data-character-turn-count]').forEach(element => {
    if (element.dataset.characterTurnCount !== characterId) return;
    if (count === null || count === undefined) {
      element.style.display = 'none';
      element.removeAttribute('aria-label');
      element.removeAttribute('title');
      return;
    }
    element.style.display = '';
    const number = element.querySelector('span');
    const formatted = count.toLocaleString('zh-TW');
    if (number && number.textContent !== formatted) number.textContent = formatted;
    element.setAttribute('aria-label','對話回合數 ' + formatted);
    element.setAttribute('title','對話回合數 ' + formatted);
  });
}

async function loadCloudComments(characterId) {
  const client=window.mySupabase;
  if(!client||!characterId)return;
  try {
    const {data:rows,error}=await client.rpc('get_character_comments_safe',{p_character_id:characterId});
    if(error)throw error;
    const safeRows=(rows||[]).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at));
    // 評論 RPC 只回傳安全的留言內容；另取公開個人資料，避免其他帳號的留言者被錯誤顯示成「故事創作者」。
    const profileIds=[...new Set(safeRows.map(row=>row.author_id).filter(Boolean))];
    if(profileIds.length){
      const {data:profiles,error:profilesError}=await client.from('public_profiles')
        .select('id,nickname,avatar_url,bio').in('id',profileIds);
      if(profilesError)console.warn('PersonaX 評論作者資料載入失敗：',profilesError);
      else (profiles||[]).forEach(profile=>{
        state.authors[profile.id]={
          ...(state.authors[profile.id]||{}),uid:profile.id,
          nickname:profile.nickname||state.authors[profile.id]?.nickname||'PersonaX 使用者',
          avatar:profile.avatar_url||state.authors[profile.id]?.avatar||'',
          bio:profile.bio||state.authors[profile.id]?.bio||''
        };
      });
    }
    const ids=safeRows.filter(row=>!row.is_redacted).map(row=>row.id);
    let likes=[];
    if(ids.length){
      const {data,error:likesError}=await client.from('character_comment_likes')
        .select('comment_id,user_id').in('comment_id',ids);
      if(likesError)throw likesError;
      likes=data||[];
    }
    const mapped=safeRows.map(row=>({
      id:row.id,authorId:row.author_id,text:row.content,parentId:row.parent_id,
      whisper:!!row.is_whisper,redacted:!!row.is_redacted,deleted:!!row.is_deleted,edited:row.updated_at!==row.created_at,
      at:Date.parse(row.created_at)||Date.now(),
      likes:likes.filter(item=>item.comment_id===row.id).map(item=>item.user_id),cloud:true
    }));
    if(route.page!=='detail'||route.id!==characterId)return;
    state.comments[characterId]=mapped;
    renderComments();
  } catch(error) {
    console.error('PersonaX 雲端評論載入失敗：',error);
    const target=$('comments');
    if(target&&route.id===characterId)target.innerHTML='<div class="empty">雲端評論載入失敗，請重新整理或稍後再試。</div>';
  }
}

async function refreshAuthorFollowState(authorId) {
  const user = currentUser();
  const client = window.mySupabase;
  if (!client || !user?.uid || !isUuid(user.uid) || !isUuid(authorId) || user.uid === authorId) return;
  try {
    const [followResult, profileResult, followerCountResult] = await Promise.all([
      client.from('author_follows').select('author_id')
        .eq('follower_id', user.uid).eq('author_id', authorId).maybeSingle(),
      client.from('public_profiles').select('follower_count').eq('id', authorId).maybeSingle(),
      client.from('author_follows').select('author_id', {count:'exact', head:true})
        .eq('author_id', authorId)
    ]);
    if (followResult.error) throw followResult.error;
    if (profileResult.error) throw profileResult.error;
    if (followerCountResult.error) throw followerCountResult.error;
    const followerCount = Number.isFinite(followerCountResult.count)
      ? followerCountResult.count
      : Number(profileResult.data?.follower_count || 0);
    if (currentUser()?.uid !== user.uid || route.page !== 'author' || route.id !== authorId) return;

    const existingIndex = state.following.indexOf(authorId);
    if (followResult.data && existingIndex < 0) state.following.push(authorId);
    if (!followResult.data && existingIndex >= 0) state.following.splice(existingIndex, 1);
    state.authors[authorId] = {
      ...(state.authors[authorId] || {uid:authorId,nickname:'故事創作者',bio:'',avatar:''}),
      uid:authorId,
      fans:followerCount
    };
    persist();

    const count = document.getElementById('authorFollowerCount');
    if (count) count.textContent = '粉絲 ' + followerCount;
    const button = document.querySelector('[data-action="follow"][data-id="' + authorId + '"]');
    if (button) button.textContent = followResult.data ? '已追蹤' : '追蹤';
  } catch (error) {
    console.warn('作者追蹤狀態同步失敗：', error?.message || error);
  }
}

async function readImage(file) {
  if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) throw Error('請選擇PNG、JPG或WebP。');
  return await new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(Error('圖片讀取失敗。'));
    reader.readAsDataURL(file);
  });
}
async function compressProfileImage(file) {
  if (!file || !['image/png','image/jpeg','image/webp'].includes(file.type)) throw Error('請選擇 PNG、JPG 或 WebP 圖片。');
  if (file.size > 15 * 1024 * 1024) throw Error('頭像原始檔請小於 15 MB。');
  const source=await readImage(file);
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('無法讀取這張圖片。'));img.src=source;});
  const size=256, canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('目前瀏覽器無法壓縮圖片。');
  const scale=Math.max(size/image.width,size/image.height),width=image.width*scale,height=image.height*scale;
  ctx.drawImage(image,(size-width)/2,(size-height)/2,width,height);
  let result=canvas.toDataURL('image/webp',0.62);
  if(result.length>120000)result=canvas.toDataURL('image/jpeg',0.55);
  if(result.length>180000)result=canvas.toDataURL('image/jpeg',0.38);
  if(result.length>220000)throw Error('壓縮後圖片仍太大，請改用較簡單的圖片。');
  return result;
}

// IMG-01: compress user-selected upload images before they enter app state.
async function compressUploadImage(file, options = {}) {
  const allowedTypes=['image/png','image/jpeg','image/webp'];
  if (!file || !allowedTypes.includes(file.type)) throw Error('請選擇 PNG、JPG 或 WebP 圖片。');
  if (file.size > 15 * 1024 * 1024) throw Error('圖片原始檔請小於 15 MB。');

  // Use a temporary object URL instead of converting the full original file to Base64.
  // Always revoke it so repeated mobile selections do not retain large source buffers.
  const sourceUrl=URL.createObjectURL(file);
  let image;
  try {
    image=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(Error('無法讀取這張圖片，請換一張再試。'));
      img.src=sourceUrl;
    });
    if (!image.naturalWidth || !image.naturalHeight) throw Error('圖片尺寸無效，請換一張再試。');

    const targetBytes=Number(options.targetBytes)||500*1024;
    const maxEdge=Number(options.maxEdge)||1600;
    let scale=Math.min(1,maxEdge/Math.max(image.naturalWidth,image.naturalHeight));
    const formats=[
      {type:'image/webp',qualities:[0.84,0.76,0.68,0.60,0.52]},
      {type:'image/jpeg',qualities:[0.82,0.72,0.62,0.52]}
    ];
    let bestBlob=null,bestWidth=0,bestHeight=0;
    while(scale>=0.35) {
      const width=Math.max(1,Math.round(image.naturalWidth*scale));
      const height=Math.max(1,Math.round(image.naturalHeight*scale));
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d');
      if(!ctx) throw Error('目前瀏覽器無法壓縮圖片。');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      for(const format of formats) {
        // JPEG has no alpha channel. Fill it white first so transparent PNGs
        // do not unexpectedly turn black when the fallback format is used.
        if(format.type==='image/jpeg') {
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,width,height);
        } else {
          ctx.clearRect(0,0,width,height);
        }
        ctx.drawImage(image,0,0,width,height);
        for(const quality of format.qualities) {
          const blob=await new Promise(resolve=>canvas.toBlob(resolve,format.type,quality));
          if(!blob || blob.type!==format.type) continue;
          if(!bestBlob || blob.size<bestBlob.size) {
            bestBlob=blob;bestWidth=width;bestHeight=height;
          }
          if(blob.size<=targetBytes) {
            const dataUrl=await new Promise((resolve,reject)=>{
              const reader=new FileReader();
              reader.onload=()=>resolve(reader.result);
              reader.onerror=()=>reject(Error('壓縮圖片讀取失敗，請再試一次。'));
              reader.readAsDataURL(blob);
            });
            return {dataUrl,originalBytes:file.size,compressedBytes:blob.size,width,height,mimeType:blob.type};
          }
        }
      }
      scale*=0.85;
    }
    if(!bestBlob || bestBlob.size>2*1024*1024) {
      throw Error('圖片壓縮後仍過大，請改選較小的圖片。');
    }
    const dataUrl=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(Error('壓縮圖片讀取失敗，請再試一次。'));
      reader.readAsDataURL(bestBlob);
    });
    return {dataUrl,originalBytes:file.size,compressedBytes:bestBlob.size,width:bestWidth,height:bestHeight,mimeType:bestBlob.type};
  } finally {
    URL.revokeObjectURL(sourceUrl);
    if(image) image.src='';
  }
}

/* Chat sessions: character identity stays separate from conversation identity. */
function newSession(character,options = {}) {
  const sessionId = id();
  const session = {
    id:sessionId,characterId:character.id,name:'',
    archived:false,hidden:false,pinned:false,
    startedAt:Date.now(),persona:'',suggestions:true,background:'avatar',
    messages:[{id:id(),role:'assistant',text:character.opening,at:Date.now()}],
    memories:[],album:[],...options
  };
  state.sessions[sessionId] = session;
  return session;
}
function hasUserMessage(session) {
  return (session?.messages || []).some(message =>
    message.role === 'user' && String(message.text || '').trim()
  );
}
function sessionTitle(session) {
  return String(session?.name || sessionCharacter(session)?.name || session?.characterName || '角色').trim();
}
function uniqueSessionName(base,excludeId = '') {
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== excludeId)
    .map(sessionTitle));
  const clean = [...String(base || '回憶').trim()].slice(0,25).join('') || '回憶';
  if (!used.has(clean)) return clean;
  for (let n = 1; n < 10000; n++) {
    const suffix = '-'+n;
    const candidate = [...clean].slice(0,25-[...suffix].length).join('')+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return [...clean].slice(0,20).join('')+'-'+Date.now().toString().slice(-4);
}
function newArchiveName(character,session) {
  const d = new Date(session.archivedAt || Date.now());
  const date = [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const characterName = character?.name || '角色';
  const used = new Set(Object.values(state.sessions)
    .filter(item => item.id !== session.id)
    .map(sessionTitle));
  for (let n = 0; n < 10000; n++) {
    const suffix = n ? '-'+n : '';
    const room = Math.max(1,25-[...date].length-1-[...suffix].length);
    const prefix = [...characterName].slice(0,room).join('');
    const candidate = prefix+'_'+date+suffix;
    if (!used.has(candidate)) return candidate;
  }
  return uniqueSessionName(characterName+'_'+date,session.id);
}
function startChat(characterId) {
  const c = state.characters.find(c => c.id === characterId);
  if (!accessible(c)) return toast('此角色已被作者調整為私密或刪除狀態，不支持開啟新對話');
  if (!requireLogin({page:'detail',id:characterId})) return;
  const sessions = Object.values(state.sessions).filter(item =>
    item.characterId === c.id && !item.archived
  ).sort((a,b) =>
    Number(hasUserMessage(b))-Number(hasUserMessage(a)) ||
    (b.messages?.at(-1)?.at || b.startedAt || 0)-(a.messages?.at(-1)?.at || a.startedAt || 0)
  );
  let s = sessions[0] || newSession(c);
  s.hidden = false;
  persist();
  go({page:'conversation',id:s.id});
}

async function toggleGroupPin(groupId) {
  const uid=currentUser()?.uid;
  const client=window.mySupabase;
  if(!groupId||!uid||!client||groupPrototype.ownerUid!==uid) {
    toast('請重新登入並載入群組後，再變更置頂。');
    return;
  }
  const group=(groupPrototype.groups||[]).find(item=>item.id===groupId);
  if(!group) {
    toast('找不到此群組，請重新載入後再試。');
    return;
  }
  const previous=group.pinned===true;
  const next=!previous;
  // 先更新畫面，雲端失敗時回復；資料以 Supabase 為準，可跨裝置同步。
  group.pinned=next;
  render();
  try {
    const {data:authData,error:authError}=await client.auth.getUser();
    if(authError||authData?.user?.id!==uid||currentUser()?.uid!==uid) {
      throw new Error('登入狀態已變更，請重新登入後再試。');
    }
    const {data,error}=await client.from('chat_groups')
      .update({pinned:next})
      .eq('id',groupId).eq('owner_id',uid)
      .select('id,pinned').maybeSingle();
    if(error) throw error;
    if(!data||data.id!==groupId||data.pinned!==next) {
      throw new Error('雲端沒有確認群組置頂變更，請重新載入後再試。');
    }
    if(currentUser()?.uid!==uid) return;
    group.pinned=data.pinned;
    render();
  } catch(error) {
    if(currentUser()?.uid===uid) {
      group.pinned=previous;
      render();
      toast('群組置頂同步失敗，已還原原設定。');
    }
    console.error('群組置頂同步失敗：',error);
  }
}

function groupDiaryStorageKey(groupId=groupPrototype.active?.id) {
  const uid=currentUser()?.uid||'guest';return 'personax-group-diary-v1:'+uid+':'+String(groupId||'');
}
function readGroupDiaryLocalRecord(groupId) {
  try {const value=JSON.parse(localStorage.getItem(groupDiaryStorageKey(groupId))||'{}');return {memories:Array.isArray(value.memories)?value.memories:[],updatedAt:Number(value.updatedAt)||0};}
  catch(_){return {memories:[],updatedAt:0};}
}
function writeGroupDiaryLocalRecord(groupId,memories,updatedAt=Date.now()) {
  localStorage.setItem(groupDiaryStorageKey(groupId),JSON.stringify({memories,updatedAt}));
}
function loadGroupDiaryMemories(groupId=groupPrototype.active?.id) {
  if(!groupId)return [];
  return readGroupDiaryLocalRecord(groupId).memories;
}
const groupDiaryCloudReady=new Map();
const groupDiaryCloudSaveTimers=new Map();
const groupDiaryCloudSaveChains=new Map();
async function syncGroupDiaryCloud(groupId) {
  const client=window.mySupabase,uid=currentUser()?.uid;
  if(!client||!groupId||!uid)throw new Error('登入後才能同步群組甜蜜日記。');
  const {data:{user},error:authError}=await client.auth.getUser();
  if(authError||!user||user.id!==uid)throw new Error('登入狀態已失效，請重新登入後同步日記。');
  const local=readGroupDiaryLocalRecord(groupId);
  const {data:cloud,error}=await client.from('chat_group_diary')
    .select('group_id,owner_id,memories,updated_at').eq('group_id',groupId).maybeSingle();
  if(error)throw error;
  if(cloud) {
    const cloudUpdatedAt=Date.parse(cloud.updated_at)||0;
    // Preserve a newer local edit (for example, one made while temporarily offline);
    // otherwise hydrate this device from the cloud copy.
    if(local.updatedAt>cloudUpdatedAt && local.memories.length) {
      await saveGroupDiaryCloudNow(groupId,local.memories,local.updatedAt,uid);
    } else {
      writeGroupDiaryLocalRecord(groupId,Array.isArray(cloud.memories)?cloud.memories:[],cloudUpdatedAt||Date.now());
    }
  } else {
    // First device to open an existing group migrates its local diary to the cloud.
    await saveGroupDiaryCloudNow(groupId,local.memories,local.updatedAt||Date.now(),uid);
  }
  groupDiaryCloudReady.set(groupId,true);
  return loadGroupDiaryMemories(groupId);
}
async function saveGroupDiaryCloudNow(groupId,memories,updatedAt,uid=currentUser()?.uid) {
  const client=window.mySupabase;
  if(!client||!uid)throw new Error('登入後才能同步群組甜蜜日記。');
  const {error}=await client.from('chat_group_diary').upsert({
    group_id:groupId,owner_id:uid,memories,updated_at:new Date(Math.max(Number(updatedAt)||Date.now(),Date.now())).toISOString()
  },{onConflict:'group_id'});
  if(error)throw error;
}
function queueGroupDiaryCloudSave(groupId) {
  const oldTimer=groupDiaryCloudSaveTimers.get(groupId);
  if(oldTimer)clearTimeout(oldTimer);
  const timer=setTimeout(()=>{
    groupDiaryCloudSaveTimers.delete(groupId);
    const previous=groupDiaryCloudSaveChains.get(groupId)||Promise.resolve();
    const next=previous.catch(()=>{}).then(async()=>{
      const uid=currentUser()?.uid;
      if(!uid||!window.mySupabase)throw new Error('登入後才能同步群組甜蜜日記。');
      if(!groupDiaryCloudReady.get(groupId))await syncGroupDiaryCloud(groupId);
      const local=readGroupDiaryLocalRecord(groupId);
      await saveGroupDiaryCloudNow(groupId,local.memories,local.updatedAt,uid);
      writeGroupDiaryLocalRecord(groupId,local.memories,Date.now());
    }).catch(error=>{
      console.error('群組甜蜜日記雲端同步失敗：',error);
      toast('日記已保存在此裝置，但雲端同步失敗；請確認網路後重新開啟群組重試。');
    });
    groupDiaryCloudSaveChains.set(groupId,next);
  },350);
  groupDiaryCloudSaveTimers.set(groupId,timer);
}
function saveGroupDiaryMemories(memories,groupId=groupPrototype.active?.id) {
  if(!groupId)return false;
  try {
    writeGroupDiaryLocalRecord(groupId,memories,Date.now());
    queueGroupDiaryCloudSave(groupId);
    return true;
  } catch(_){toast('群組甜蜜日記儲存失敗，請檢查瀏覽器儲存空間。');return false;}
}
function ensureGroupDiaryMemories() {
  const group=groupPrototype.active;if(!group?.id)return [];
  const memories=loadGroupDiaryMemories(group.id);
  const messages=(groupPrototype.messages||[]).filter(m=>m.type==='user'&&String(m.content||'').trim());
  const generatedCount=memories.filter(m=>m.autoGenerated).length,due=Math.floor(messages.length/5);
  for(let batch=generatedCount;batch<due;batch++) {
    const userIds=new Set(messages.slice(batch*5,batch*5+5).map(m=>m.id));
    const lastUserIndex=groupPrototype.messages.reduce((last,m,i)=>userIds.has(m.id)?i:last,-1);
    const excerpt=groupPrototype.messages.slice(Math.max(0,lastUserIndex-9),lastUserIndex+1).filter(m=>String(m.content||'').trim()).map(m=>(m.speaker||'角色')+'：'+String(m.content||'').trim()).join('\n');
    if(!excerpt)continue;
    const item={id:id(),text:('群組故事摘錄：\n'+excerpt).slice(0,3000),important:false,at:Date.now(),autoGenerated:true,sourceUserCount:(batch+1)*5};
    const next=[...memories,item];
    while(memorySize(next)>10000){const index=next.findIndex(m=>!m.important&&m.id!==item.id);if(index<0)break;next.splice(index,1);}
    if(memorySize(next)<=10000)memories.splice(0,memories.length,...next);
  }
  saveGroupDiaryMemories(memories,group.id);return memories;
}

function groupReadStep() {
  const g=groupPrototype;
  if(g.step===1) {
    const availableIds=new Set(groupAvailableCharacters().map(c=>c.id));
    g.draft.memberIds=[...new Set(g.draft.memberIds.filter(id=>availableIds.has(id)))];
    const members=groupSelectedCharacters();
    if(members.length<1||members.length>3) return '請選擇 1–3 位已公開且未下架的角色。';
    if(members.length!==g.draft.memberIds.length) return '角色清單已變更，請重新選擇角色。';
    if(!g.draft.name) g.draft.name=members.map(c=>c.name).join('、').slice(0,25);
    if(!g.draft.playerName) g.draft.playerName=state.account?.nickname||'玩家';
    if(!g.draft.playerPersona) g.draft.playerPersona=state.account?.bio||'';
    if(!g.draft.worldCharacterId||!members.some(c=>c.id===g.draft.worldCharacterId)) g.draft.worldCharacterId=members[0].id;
  } else if(g.step===2) {
    const members=groupSelectedCharacters();
    g.draft.name=$('groupNameInput')?.value.trim()||'';
    g.draft.playerName=$('groupPlayerName')?.value.trim()||'';
    g.draft.playerPersona=$('groupPlayerPersona')?.value||'';
    g.draft.worldCharacterId=$('view').querySelector('input[name="groupWorldCharacter"]:checked')?.value||members[0]?.id||'';
    const worldCharacter=members.find(c=>c.id===g.draft.worldCharacterId);
    g.draft.world=String(worldCharacter?.worldBackground||worldCharacter?.world||worldCharacter?.intro||'').slice(0,10000);
    g.draft.scenes=[{name:$('groupSceneName0')?.value.trim()||'初始相遇',description:$('groupSceneDesc0')?.value||''}];
    if(!g.draft.name||g.draft.name.length>25) return '群組名稱需為 1–25 字。';
    if(!g.draft.playerName||g.draft.playerName.length>80) return '請填寫 1–80 字的玩家角色名稱。';
    if(g.draft.playerPersona.length>3000) return '玩家人設不可超過 3000 字。';
    if(!worldCharacter) return '請選擇一位角色作為整體世界觀背景。';
    if(g.draft.scenes[0].description.length>3000) return '初始開場情境最多 3000 字。';
  }
  return '';
}
async function groupNext() {
  const err=groupReadStep();

  groupPrototype.formError='';
  if(groupPrototype.step===1) {groupPrototype.step=2;render();return;}
  await groupCreateMock();
}
async function groupCreateMock() {
  const g=groupPrototype;
  if(g.loading) return;
  const err=groupReadStep();
  if(err) {g.formError=err;render();return;}
  if(!window.mySupabase) {g.formError='Supabase 用戶端尚未載入。';render();return;}
  g.loading=true;g.formError='';render();
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) throw new Error('請使用已連結 Supabase 的帳號登入，才能建立雲端群組。');
    g.ownerUid=user.id;
    const members=groupSelectedCharacters();
    const scenes=[{name:g.draft.scenes[0].name.trim(),description:g.draft.scenes[0].description||''}];
    const pMembers=members.map(m=>({character_id:m.id,scene_position:1}));
    const {data:groupId,error}=await groupWithTimeout(window.mySupabase.rpc('create_chat_group',{
      p_name:g.draft.name.trim(),p_world_background:g.draft.world,p_scene_mode:'shared',p_scenes:scenes,p_members:pMembers
    }),15000,'建立群組逾時，請重新載入群組清單確認是否已建立，避免重複建立。');
    if(error) throw error;
    const {data:updated,error:updateError}=await window.mySupabase.from('chat_groups')
      .update({player_name:g.draft.playerName,player_persona:g.draft.playerPersona,world_character_id:g.draft.worldCharacterId,updated_at:new Date().toISOString()})
      .eq('id',groupId).eq('owner_id',user.id).select('id,player_name,player_persona,world_character_id').maybeSingle();
    if(updateError||!updated||updated.player_name!==g.draft.playerName||updated.player_persona!==g.draft.playerPersona||updated.world_character_id!==g.draft.worldCharacterId) throw new Error('群組已建立，但雲端未能確認玩家人設與世界觀選擇完整保存。請重新開啟群組確認，勿重複建立。');
    g.loading=false;
    await groupOpen(groupId);
  } catch(error) {
    g.loading=false;g.formError=groupFriendlyError(error)||'建立群組失敗。';render();
  }
}

async function groupSendMock() {
  const input=$('groupMessageInput');
  const typedContent=input?.value.trim() || '';
  const isContinueRequest=!typedContent;
  const content=typedContent || GROUP_CONTINUE_SENTINEL;
  const g=groupPrototype;
  if(g.sending) return;
  if(!walletPreflight('group')) return;
  if(!window.mySupabase) { g.formError='Supabase 用戶端尚未載入。';render();return; }
  if(!isContinueRequest) {
    const platformCommand=parsePlatformCommand(content);
    if(platformCommand.type==='platform') {
      if(platformCommand.name==='help') toast('群組語法：@角色 指定 AI 回覆；:人名:內容 指定玩家發言顯示；/help 查看平台指令。AI 尚未串接，指定角色目前只做語法驗證。');
      else toast('尚未支援平台指令 /'+platformCommand.name+'；本次沒有保存訊息。');
      return;
    }
    const mention=parseMentionTarget(content,(g.active?.members||[]).map(member=>({id:member.characterId||member.id,name:member.name})));
    if(mention.mentioned&&!mention.valid) {g.formError=mention.reason+'，本次沒有保存訊息。';render();return;}
  }
  if(!g.active?.id) {g.formError='群組尚未保存，請重新開啟群組。';render();return;}
  if(!window.crypto?.randomUUID) {g.formError='此瀏覽器無法產生安全的回合識別碼，請更新瀏覽器後重試。';render();return;}
  g.sending=true;g.formError='';render();
  try {
    const {data:{user},error:authError}=await window.mySupabase.auth.getUser();
    if(authError||!user||user.id!==currentUser()?.uid) throw new Error('登入狀態已失效，請重新登入。');
    if(!g.pendingRequest || g.pendingRequest.groupId!==g.active.id || g.pendingRequest.content!==content) {
      g.pendingRequest={groupId:g.active.id,content,requestKey:window.crypto.randomUUID()};
    }
    const {error}=await groupWithTimeout(window.mySupabase.rpc('append_chat_group_mock_turn',{
      p_group_id:g.active.id,p_request_key:g.pendingRequest.requestKey,p_content:content
    }),15000,'訊息保存逾時。請重新開啟群組確認訊息是否已保存，再決定是否重試。');
    if(error) throw error;
    const activeGroupId=g.active.id;
    // The RPC commits the group turn and wallet debit atomically. Refresh the visible
    // wallet immediately so the header/composer never keeps showing the pre-charge balance.
    await refreshWalletBalance();
    // Keep the same request key until the saved messages are reloaded successfully. If
    // that read times out, retrying the send reuses the key and cannot charge twice.
    // Refresh only the message rows; do not reopen the entire group, clear its active
    // state, or flash the loading screen after every send.
    const {data:rows,error:rowsError}=await groupWithTimeout(
      window.mySupabase.from('chat_group_messages')
        .select('id,group_id,scene_id,turn_id,sequence_no,speaker_type,character_id,speaker_snapshot,content,created_at')
        .eq('group_id',activeGroupId).is('deleted_at',null)
        .order('created_at',{ascending:true}).order('sequence_no',{ascending:true}),
      15000,'訊息已送出，但重新整理訊息清單逾時。請稍後重新開啟群組確認。'
    );
    if(rowsError) throw rowsError;
    if(g.active?.id!==activeGroupId) return;
    const members=g.active.members||[], scenes=g.active.scenes||[];
    g.messages=(rows||[]).map(m=>{
      const speakerSnapshot=m.speaker_snapshot||{};
      const member=members.find(x=>x.characterId===m.character_id)||members.find(x=>x.characterSnapshotId===speakerSnapshot.id||x.id===speakerSnapshot.id);
      const scene=scenes.find(x=>x.id===m.scene_id);
      const type=m.speaker_type==='user'?'user':m.speaker_type==='system'?'system':'character';
      const speaker=type==='user'?'你':type==='system'?'系統':(speakerSnapshot.name||member?.name||'角色')+(scene?' · '+scene.name:'');
      return {id:m.id,type,speaker,characterId:m.character_id||null,speakerSnapshot,sceneId:m.scene_id||null,sceneName:scene?.name||'',content:type==='user' && m.content===GROUP_CONTINUE_SENTINEL ? '' : m.content,createdAt:m.created_at};
    });
    g.turn=g.messages.filter(m=>m.type==='user').length;
    g.pendingRequest=null;
    // Refresh cumulative character-card counts after a group turn has been saved.
    // The database RPC already includes group messages; invalidate the stale frontend cache.
    void loadCharacterTurnCounts(members.map(member=>member.characterId||member.id), true);
    ensureGroupDiaryMemories();
    g.sending=false;g.formError='';
    renderGroupConversation();
    const sendButton=$('view')?.querySelector('[data-action="group-send"]');if(sendButton){sendButton.disabled=false;sendButton.innerHTML=ICON.send;sendButton.setAttribute('aria-label','送出群組訊息');sendButton.title='送出訊息';}
    const messagePane=$('groupMessages');
    if(messagePane) requestAnimationFrame(()=>{if(messagePane.isConnected) messagePane.scrollTop=messagePane.scrollHeight;});
  } catch(error) {
    g.sending=false;
    const rawError=String(error?.message||error||'');
    if(rawError.includes('group_insufficient_funds')||rawError.includes('insufficient_funds')) {
      g.formError='';
      openInsufficientFundsDialog('group');
      renderGroupConversation();
      return;
    }
    g.formError=groupFriendlyError(error)||'訊息保存失敗，請重試。';render();
  }
}

  return String(text).split(/(\*\*[\s\S]*?\*\*|\*(?!\*)[^*\n]+\*(?!\*))/g).filter(Boolean).map(part => {

function renderDailyCheckinMarkup(status) {
  const day = Math.max(1, Math.min(7, Number(status.cycle_day) || 1));
  const claimed = status.claimed_today === true;
  const reward = Math.max(1, Number(status.reward) || 10);
  const enabled = status.enabled !== false;
  const doneCount = claimed ? day : day - 1;
  const days = Array.from({length:7},(_,i)=>{
    const completed = i < doneCount;
    const todayDone = claimed && i === day - 1;
    const active = !claimed && i === day - 1;
    const style = completed || todayDone
      ? 'border:1px solid #54b58b80;background:#54b58b18;color:#73d3a5'
      : active ? 'border:1px solid #c4a36a;background:#c4a36a18;color:var(--text)'
      : 'border:1px solid var(--border);background:transparent;color:var(--muted)';
    return '<div style="min-width:0;min-height:52px;box-sizing:border-box;text-align:center;padding:8px 1px;border-radius:10px;'+style+'"><div style="font-size:11px">第'+(i+1)+'天</div><div style="font-size:13px;font-weight:700;margin-top:3px">'+(completed || todayDone ? '✓' : '+'+reward)+'</div></div>';
  }).join('');
  const buttonLabel = !enabled ? '簽到暫停中' : claimed ? '今日已簽到' : '簽到領取 +' + reward + ' 銀幣';
  return '<div class="row between" style="align-items:center;gap:8px"><h2 style="margin:0">每日簽到</h2><span class="small muted" style="white-space:nowrap">第 '+day+'/7 天</span></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">'+days+'</div><button data-action="daily-checkin" '+(!enabled || claimed ? 'disabled aria-disabled="true"' : 'class="primary"')+' style="width:100%;min-height:44px">'+buttonLabel+'</button><p class="small muted" style="margin:0">每日於台灣時間 00:00 更新簽到日。</p>';
}
function scheduleDailyCheckinMidnightRefresh() {
  if (window.dailyCheckinMidnightTimer) clearTimeout(window.dailyCheckinMidnightTimer);
  try {
    const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const part = Object.fromEntries(parts.map(p => [p.type,p.value]));
    const nextTaipeiMidnight = Date.UTC(Number(part.year), Number(part.month)-1, Number(part.day)+1) - 8*60*60*1000;
    const delay = Math.max(1000, nextTaipeiMidnight - Date.now() + 1200);
    window.dailyCheckinMidnightTimer = setTimeout(() => { void refreshDailyCheckinCard(); }, delay);
  } catch (error) { console.warn('無法排定台灣時間簽到更新：', error); }
}

  window.dailyCheckinStatusPromise = (async () => {
    const card = $('daily-checkin-card');
    if (!card) return;
    const uid = state.account?.uid;
    if (!window.mySupabase || !uid || uid === 'demo-local-account') {
      card.innerHTML = '<div class="row between"><h2 style="margin:0">每日簽到</h2><span class="small muted">7 天循環</span></div><p class="small muted" style="margin:0">雲端簽到尚未連線，請使用已登入的測試帳號。</p>';
      return;
    }
    if (state.account?.accountDeletionPending) {
      card.innerHTML = '<h2 style="margin:0">每日簽到</h2><p class="small muted" style="margin:0">帳號刪除申請處理期間無法簽到。</p>';
      return;
    }
    const {data,error}=await window.mySupabase.rpc('get_daily_checkin_status');
    if (error) {
      console.error('每日簽到狀態讀取失敗：',error);
      // Keep the last successfully rendered status in place; do not flash back to a loading skeleton.
      if (!(window.dailyCheckinStatusCache?.uid === uid && window.dailyCheckinStatusCache?.data)) {
        card.innerHTML = '<h2 style="margin:0">每日簽到</h2><p class="small muted" style="margin:0">簽到狀態暫時無法讀取，請稍後重新整理。</p>';
      }
      return;
    }
    if (state.account?.uid !== uid) return;
    window.dailyCheckinStatusCache = {uid,data:data || {}};
    const currentCard = $('daily-checkin-card');
    if (currentCard) currentCard.innerHTML=renderDailyCheckinMarkup(data || {});
  })().finally(() => { window.dailyCheckinStatusPromise = null; });
  return window.dailyCheckinStatusPromise;
}

/* Cloud wallet ledger: read the authoritative transaction journal from Supabase. */
async function loadWalletLedger(currency) {
  walletLedgerLoadError = '';
  const uid = state.account?.uid;
  const client = window.mySupabase;
  if (!uid || !client) return false;

  const { data, error } = await client
    .from('wallet_transactions')
    .select('id, currency_type, amount, biz_type, reference_id, created_at')
    .eq('user_id', uid)
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) {
    console.error('讀取錢包花費日誌失敗：', error);
    walletLedgerLoadError = currency;
    toast('花費日誌讀取失敗，請稍後再試。');
    return false;
  }

  // Resolve a chat charge/refund to the character through the secure, user-scoped RPC.
  const { data: roleNameRows, error: roleNameError } = await client.rpc('get_my_wallet_transaction_character_names');
  if (roleNameError) console.warn('讀取交易對應角色名稱失敗：', roleNameError.message);
  const roleNames = new Map((roleNameRows || []).map(item => [item.reference_id, item.character_name]));

  const selectedType = currency === 'silver' ? 'silver_coins' : 'diamonds';
  let runningBalance = Number(currency === 'silver'
    ? state.account.silver : state.account.diamonds) || 0;
  const rows = (data || []).filter(row => row.currency_type === selectedType);
  const mappedNewestFirst = rows.map(row => {
    const amount = Number(row.amount) || 0;
    const entry = {
      id: row.id,
      currency: row.currency_type === 'silver_coins' ? 'silver' : 'diamond',
      change: amount,
      reason: (() => {
        const baseReason = ({
          signup_bonus: '註冊贈送',
          chat_turn_charge: '聊天回覆扣款',
          chat_turn_refund: '聊天失敗退款',
          daily_checkin: '每日簽到',
          reward_ad: '觀看獎勵廣告',
          purchase: '購買',
          test_purchase_200: '測試領取 200 鑽石',
          admin_adjustment: '餘額調整'
        })[row.biz_type] || row.biz_type || '錢包交易';
        const characterName = roleNames.get(row.reference_id);
        return characterName && ['chat_turn_charge', 'chat_turn_refund'].includes(row.biz_type)
          ? baseReason + ' · ' + characterName
          : baseReason;
      })(),
      at: Date.parse(row.created_at) || Date.now(),
      balance: runningBalance,
      referenceId: row.reference_id || null
    };
    runningBalance -= amount;
    return entry;
  });
  state.ledger = [
    ...state.ledger.filter(entry => entry.currency !== (currency === 'silver' ? 'silver' : 'diamond')),
    ...mappedNewestFirst.reverse()
  ];
  return true;
}

/* Keep the suggestion hint in sync with the native details open/closed state. */
document.addEventListener('toggle', event => {

  if (!(panel instanceof HTMLDetailsElement) || !panel.classList.contains('suggestions-panel')) return;
  const hint = panel.querySelector('.suggestions-count');
  if (!hint) return;

}, true);

/* UI-1024: robust horizontal swipe navigation for single/group suggested replies.
   Touch devices use touch events (with vertical scrolling preserved); mouse uses pointer events.
   Delegation keeps the behavior alive across chat rerenders. */
(function installSuggestionSwipe(){
  let gesture = null;
  let suppressClickUntil = 0;
  let lastSwipeAt = 0;
  const findCard = target => target instanceof Element ? target.closest('.suggestion-card') : null;
  const begin = (panel, x, y, kind, id) => {
    if (!panel || !panel.open) return;
    gesture = { panel, startX:x, startY:y, kind, id };
  };
  const finish = (x, y, kind, id, event) => {
    if (!gesture || gesture.kind !== kind || (id != null && gesture.id !== id)) return;
    const current = gesture;
    gesture = null;
    const dx = x - current.startX;
    const dy = y - current.startY;
    if (Math.abs(dx) < 32 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
    const cards = Array.from(current.panel.querySelectorAll('.suggestion-card'));
    if (cards.length < 2) return;
    const activeIndex = cards.findIndex(card => card.classList.contains('active'));
    if (activeIndex < 0) return;
    const nextIndex = Math.max(0, Math.min(cards.length - 1, activeIndex + (dx < 0 ? 1 : -1)));
    if (nextIndex === activeIndex) return;
    current.panel.querySelectorAll('.suggestion-card').forEach((card, index) => card.classList.toggle('active', index === nextIndex));
    current.panel.querySelectorAll('.suggestion-light').forEach((light, index) => light.setAttribute('aria-pressed', String(index === nextIndex)));
    lastSwipeAt = Date.now();
    suppressClickUntil = lastSwipeAt + 500;
    if (event && event.cancelable) event.preventDefault();
  };
  document.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.button !== 0) return;
    const card = findCard(event.target);
    begin(card?.closest('.suggestions-panel'), event.clientX, event.clientY, 'mouse', event.pointerId);
  }, {passive:true});
  document.addEventListener('pointerup', event => {
    if (event.pointerType !== 'mouse') return;
    finish(event.clientX, event.clientY, 'mouse', event.pointerId, event);
  }, {passive:false});
  document.addEventListener('pointercancel', event => {
    if (gesture?.kind === 'mouse' && gesture.id === event.pointerId) gesture = null;
  }, {passive:true});
  document.addEventListener('touchstart', event => {
    if (event.touches.length !== 1) { gesture = null; return; }
    const card = findCard(event.target);
    begin(card?.closest('.suggestions-panel'), event.touches[0].clientX, event.touches[0].clientY, 'touch', 0);
  }, {passive:true});
  document.addEventListener('touchend', event => {
    if (!gesture || gesture.kind !== 'touch' || !event.changedTouches.length) return;
    const touch = event.changedTouches[0];
    finish(touch.clientX, touch.clientY, 'touch', 0, event);
  }, {passive:false});
  document.addEventListener('touchcancel', () => {
    if (gesture?.kind === 'touch') gesture = null;
  }, {passive:true});
  document.addEventListener('click', event => {
    if (Date.now() > suppressClickUntil) return;
    const target = findCard(event.target);
    if (!target) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    suppressClickUntil = 0;
  }, true);
})();
 
/* GROUP-01-OPEN: capture group-open clicks before other delegated handlers.
   This makes group navigation independent of nested list markup or another handler
   stopping propagation. The normal bubble handler is skipped to prevent double-open. */
document.addEventListener('click', event => {
  const target = event.target instanceof Element
    ? event.target.closest('[data-action="group-open"]')
    : null;
  if (!target || target.disabled) return;
  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  const groupId = target.dataset.id;
  if (!groupId) {
    toast('這個群組缺少識別碼，請重新載入群組清單。');
    return;
  }
  void groupOpen(groupId);
}, true);

/* GROUP MESSAGE ACTION CAPTURE FIX
   Handle group-message menu and delete clicks in capture phase so an ancestor
   handler cannot swallow the click before the action reaches the delegated router. */
document.addEventListener('click', async event => {

  if (!target || target.disabled) return;

  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();

  try {
    if (state.account?.accountDeletionPending) {
      toast('此帳號正在等待刪除，目前不能使用 PersonaX 功能。你可以取消刪除申請以恢復帳號。');
      return;
    }
    if (action === 'group-message-menu') {
      const message = groupPrototype.messages.find(item => item.id === id);
      const latest = message && groupPrototype.messages.filter(item => item.type === message.type).at(-1);
      if (!message || message.id !== latest?.id || !['user','character'].includes(message.type)) {
        toast('只能操作各自最新的一則玩家或角色訊息。');
        return;
      }
      showDialog('訊息操作','<div class="stack">'+
        '<button style="width:100%" data-action="copy-group-message" data-id="'+e(message.id)+'">複製</button>'+
        '<button style="width:100%" data-action="edit-group-message" data-id="'+e(message.id)+'">編輯</button>'+
        '<button class="danger" style="width:100%" data-action="delete-group-message" data-id="'+e(message.id)+'">刪除</button></div>');
      return;
    }
    if (action === 'delete-group-message') {
      const group = groupPrototype.active;
      const message = groupPrototype.messages.find(item => item.id === id);
      const latest = message && groupPrototype.messages.filter(item => item.type === message.type).at(-1);
      if (!group || !message || message.id !== latest?.id || !['user','character'].includes(message.type)) {
        toast('只能刪除各自最新的一則玩家或角色訊息。');
        return;
      }
      showDialog('確認刪除訊息',
        '<p>確定刪除此訊息？此操作無法復原。</p>'+
        '<div class="row end" style="gap:8px;margin-top:16px">'+
        '<button type="button" data-action="back">取消</button>'+
        '<button type="button" class="danger" data-action="confirm-delete-group-message" data-id="'+e(message.id)+'">確定刪除</button></div>');
      return;
    }
    const group = groupPrototype.active;
    const message = groupPrototype.messages.find(item => item.id === id);
    const user = currentUser(), client = window.mySupabase;
    const latest = message && groupPrototype.messages.filter(item => item.type === message.type).at(-1);
    if (!group || !message || message.id !== latest?.id || !['user','character'].includes(message.type)) {
      toast('找不到可刪除的最新群組訊息，請重新開啟群組後再試。');
      return;
    }
    if (!user?.uid || !client || !isUuid(group.id) || !isUuid(message.id)) {
      toast('群組尚未連結有效的雲端資料，無法刪除訊息。');
      return;
    }
    target.disabled = true;
    const deletedAt = new Date().toISOString();
    const {data,error} = await client.from('chat_group_messages').update({deleted_at:deletedAt})
      .eq('id',message.id).eq('group_id',group.id).is('deleted_at',null).select('id').maybeSingle();
    if (error) throw new Error('群組訊息刪除同步失敗：'+error.message);
    if (!data) throw new Error('雲端未確認這則訊息的刪除狀態，請重新載入後再試。');
    groupPrototype.messages = groupPrototype.messages.filter(item => item.id !== message.id);
    $('modal')?.close();
    renderGroupConversation();
    toast('群組訊息已刪除。');
  } catch (error) {
    console.error('群組訊息操作失敗：', error);
    toast(error?.message || '群組訊息操作失敗，請稍後再試。');
  } finally {
    if (target.isConnected) target.disabled = false;
  }
}, true);

/* Homepage explore tag picker: search/select existing public tags only; never creates tags. */
function refreshExploreTagPicker() {
  const modal=$('modal');
  const input=modal?.querySelector('input[name="exploreTagSearch"]');
  const options=modal?.querySelector('#exploreTagList');
  const results=modal?.querySelector('#exploreTagResults');
  const selectedArea=modal?.querySelector('#exploreTagSelected');
  const count=modal?.querySelector('#exploreTagCount');
  const empty=modal?.querySelector('#exploreTagEmpty');
  if(!input||!options||!results||!selectedArea||!count||!empty)return;
  const query=String(input.value||'').trim().toLocaleLowerCase('zh-Hant');
  const checkboxes=[...options.querySelectorAll('input[name="tag"]')];
  const matches=checkboxes.filter(item=>!query||item.value.toLocaleLowerCase('zh-Hant').includes(query));
  results.innerHTML=matches.map(item=>`<button type="button" class="tag-picker-chip ${item.checked?'selected':''}" data-action="toggle-explore-tag" data-tag="${e(item.value)}" aria-pressed="${item.checked}">${e(item.value)}${item.checked?' ✓':''}</button>`).join('');
  empty.hidden=matches.length>0;
  const chosen=checkboxes.filter(item=>item.checked);
  count.textContent='['+chosen.length+']';
  selectedArea.innerHTML=chosen.map(item=>`<button type="button" class="tag-picker-chip selected" data-action="toggle-explore-tag" data-tag="${e(item.value)}" aria-label="取消選擇 ${e(item.value)}">${e(item.value)} ×</button>`).join('') || '<span class="small muted">尚未選擇標籤</span>';
}
function updateCharacterCounters(root=document) {
  root.querySelectorAll('.char-counter[data-count-for]').forEach(counter => {
    const name=counter.dataset.countFor;
    const field=name==='groupSceneDesc0' ? root.querySelector('#groupSceneDesc0') : root.querySelector('[name="'+name+'"]');
    if(!field) return;
    const max=field.maxLength > 0 ? field.maxLength : 3000;
    const actualCount=typeof Intl!=='undefined'&&Intl.Segmenter?[...new Intl.Segmenter('zh-Hant',{granularity:'grapheme'}).segment(field.value)].length:Array.from(field.value).length;
    counter.textContent=actualCount+'/'+max+(name==='privateInfo'?'，不會顯示在公開介紹，請勿填寫真實機密':'');
  });
}
document.addEventListener('input', event => {
  const field=event.target;
  if(field.matches('textarea[data-count-for]')) updateCharacterCounters(field.closest('form, .group-field') || document);
  else if(field.matches('form[data-form="character"] textarea, form[data-form="ai"] textarea')) updateCharacterCounters(field.closest('form'));
});
document.addEventListener('input', event => {
  const input=event.target;
  if(input instanceof HTMLInputElement && input.name==='exploreTagSearch' && input.closest('.explore-tag-picker')) refreshExploreTagPicker();
});
document.addEventListener('click', event => {
  const button=event.target.closest('[data-action="toggle-explore-tag"]');
  if(!button)return;
  const options=$('modal')?.querySelector('#exploreTagList');
  const input=options&&[...options.querySelectorAll('input[name="tag"]')].find(item=>item.value===button.dataset.tag);
  if(!input)return;
  input.checked=!input.checked;
  refreshExploreTagPicker();
});

/* Shared character-tag picker: live-search chips, selected count, and a five-tag limit. */
function refreshCustomTagPicker() {
  const modal=$('modal');
  const input=modal?.querySelector('input[name="tagSearch"]');
  const options=modal?.querySelector('#customTagList');
  const results=modal?.querySelector('#customTagResults');
  const selectedArea=modal?.querySelector('#customTagSelected');
  const count=modal?.querySelector('#customTagCount');
  if(!input||!options||!results||!selectedArea||!count)return;
  const query=String(input.value||'').trim().toLocaleLowerCase('zh-Hant');
  const checkboxes=[...options.querySelectorAll('input[name="tag"]')];
  const matches=checkboxes.filter(item=>!query||item.value.toLocaleLowerCase('zh-Hant').includes(query));
  results.innerHTML=matches.map(item=>`<button type="button" class="tag-picker-chip ${item.checked?'selected':''}" data-action="toggle-custom-tag" data-tag="${e(item.value)}" aria-pressed="${item.checked}">${e(item.value)}${item.checked?' ✓':''}</button>`).join('');
  if(!matches.length && !query) {
    results.innerHTML='<p class="small muted">尚無可用標籤，輸入至少2字即可新增。</p>';
  } else if(!matches.length) {
    results.innerHTML='<p class="small muted">沒有符合的標籤，可新增這個標籤。</p>';
  }
  const chosen=checkboxes.filter(item=>item.checked);
  count.textContent='['+chosen.length+'/5]';
  selectedArea.innerHTML=chosen.map(item=>`<button type="button" class="tag-picker-chip selected" data-action="toggle-custom-tag" data-tag="${e(item.value)}" aria-label="取消選擇 ${e(item.value)}">${e(item.value)} ×</button>`).join('') || '<span class="small muted">尚未選擇標籤</span>';
  const addButton=modal.querySelector('[data-action="add-custom-tag"]');
  if(addButton) {
    addButton.hidden=!(validCharacterTag(input.value)&&matches.length===0);
    addButton.textContent='新增';
    addButton.setAttribute('aria-label','新增標籤 '+String(input.value||'').trim());
  }
}
document.addEventListener('input', event => {
  const input=event.target;
  if(input instanceof HTMLInputElement && input.name==='tagSearch' && input.closest('.tag-picker')) refreshCustomTagPicker();
});
document.addEventListener('click', event => {
  const button=event.target.closest('[data-action="toggle-custom-tag"]');
  if(!button)return;
  const options=$('modal')?.querySelector('#customTagList');
  const input=options&&[...options.querySelectorAll('input[name="tag"]')].find(item=>item.value===button.dataset.tag);
  if(!input)return;
  const checked=[...options.querySelectorAll('input[name="tag"]:checked')];
  if(!input.checked&&checked.length>=5){toast('角色最多選擇5個標籤。');return;}
  input.checked=!input.checked;
  refreshCustomTagPicker();
});
document.addEventListener('change', event => {
  const input=event.target;
  if(!(input instanceof HTMLInputElement)||input.name!=='tag'||!input.closest('#customTagList'))return;
  const checked=[...document.querySelectorAll('#customTagList input[name="tag"]:checked')];
  if(checked.length>5){input.checked=false;toast('角色最多選擇5個標籤。');}
  refreshCustomTagPicker();
});

});

const DEFAULT_NSFW_TERMS=['18禁','成人','成人內容','成人向','成人情節','性愛','性行為','性暗示','性幻想','性器','性器官','性描寫','露骨','露骨性','情色','色情','色情內容','性交','做愛','約炮','口交','肛交','自慰','手淫','高潮','裸露','裸身','裸體','全裸','露點','乳房','乳頭','陰莖','陰道','性奴','性侵','強姦','亂倫','猥褻','淫亂','NSFW'];
let cachedNsfwTerms=null;
async function loadNsfwTerms(){
  if(cachedNsfwTerms)return cachedNsfwTerms;
  const client=window.mySupabase;
  if(!client)return DEFAULT_NSFW_TERMS;
  let databaseTerms=[];
  if(client){
    try{
      const {data,error}=await client.from('content_restriction_terms').select('term').eq('is_active',true);
      if(error)throw error;
      databaseTerms=(data||[]).map(row=>String(row.term||'').trim()).filter(Boolean);
    }catch(error){
      console.warn('限制詞清單載入失敗，仍使用內建限制詞。',error.message);
    }
  }
  // 管理員自訂詞只會補充，不會覆蓋內建詞；避免資料表有少數詞時漏掉常見敏感詞。
  cachedNsfwTerms=[...new Set([...DEFAULT_NSFW_TERMS,...databaseTerms].map(term=>String(term).normalize('NFKC').trim()).filter(Boolean))];
  return cachedNsfwTerms;
}
function findNsfwTerms(character,terms){
  const normalize=value=>String(value||'').normalize('NFKC').toLocaleLowerCase('zh-Hant');
  // 移除中英文字間常見空白與標點的影響，避免「成 人」「性-描寫」等寫法繞過基本字串偵測。
  const text=normalize([character.name,character.intro,character.opening,character.privateInfo,character.style].filter(Boolean).join('\n'))
    .replace(/[\s\p{P}\p{S}]+/gu,'');
  return [...new Set(terms.map(normalize).filter(Boolean))].filter(term=>text.includes(term.replace(/[\s\p{P}\p{S}]+/gu,'')));
}

  const input=$('view')?.querySelector('input[name="isNSFW"]');

});

document.addEventListener('keydown',event => {
  // Enter inserts a newline on desktop and mobile. Only an explicit
  // Ctrl/Cmd+Enter submits, preventing accidental sends while composing text.
  if (!['messageInput','groupMessageInput'].includes(event.target.id) ||
      event.key!=='Enter' || event.isComposing ||
      !(event.ctrlKey || event.metaKey)) return;
  event.preventDefault();
  if(event.target.id==='groupMessageInput') void groupSendMock();
  else event.target.form?.requestSubmit();
});
document.addEventListener('change',async event => {

          const url=URL.createObjectURL(file),probe=document.createElement('video');probe.preload='metadata';probe.muted=true;probe.src=url;
          const meta=await new Promise((resolve,reject)=>{probe.onloadedmetadata=()=>resolve({duration:probe.duration,width:probe.videoWidth,height:probe.videoHeight});probe.onerror=()=>reject(new Error('無法讀取影片，請確認格式正確。'));});
          if(requestId!==characterImageCompressionRequest){URL.revokeObjectURL(url);return;}
          if(!Number.isFinite(meta.duration)||meta.duration<=0||meta.duration>10){URL.revokeObjectURL(url);throw new Error('影片長度需在 10 秒內。');}
          if(!meta.width||!meta.height){URL.revokeObjectURL(url);throw new Error('影片尺寸無效，請換一個影片檔案。');}
          const frame=document.createElement('video');frame.preload='auto';frame.muted=true;frame.src=url;
          await new Promise((resolve,reject)=>{frame.onseeked=resolve;frame.onerror=()=>reject(new Error('無法擷取影片封面。'));frame.onloadeddata=()=>{frame.currentTime=Math.min(.1,meta.duration/2);};});
          if(requestId!==characterImageCompressionRequest){URL.revokeObjectURL(url);return;}
          const canvas=document.createElement('canvas');canvas.width=Math.min(1200,meta.width);canvas.height=Math.max(1,Math.round(canvas.width*meta.height/meta.width));
          const ctx=canvas.getContext('2d');if(!ctx)throw new Error('無法產生影片封面。');ctx.drawImage(frame,0,0,canvas.width,canvas.height);
          draftImage=canvas.toDataURL('image/jpeg',.82);draftVideoFile=file;draftVideoPath='';
          if(draftVideoPreviewUrl)URL.revokeObjectURL(draftVideoPreviewUrl);draftVideoPreviewUrl=url;
          $('imagePreview').src=draftImage;$('imagePreview').classList.add('hidden');
          const preview=$('characterVideoPreview');preview.src=url;preview.classList.remove('hidden');
          toast('影片符合 10 秒與 15 MB 限制，已擷取角色卡封面。');saveEditorDraft();
        }else{
          if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw new Error('圖片格式僅支援 PNG、JPG 或 WebP。');
          if(draftVideoPreviewUrl){URL.revokeObjectURL(draftVideoPreviewUrl);draftVideoPreviewUrl='';}
          draftVideoFile=null;draftVideoPath='';
          const preview=$('characterVideoPreview');preview.removeAttribute('src');preview.classList.add('hidden');
          $('imagePreview').classList.remove('hidden');
          toast('正在壓縮角色圖片，請稍候…');
          const compressed=await compressUploadImage(file,{maxEdge:1600,targetBytes:500*1024});
          if(requestId!==characterImageCompressionRequest)return;
          draftImage=compressed.dataUrl;$('imagePreview').src=draftImage;$('imagePreview').classList.remove('hidden');
          toast('角色頭像已自動壓縮。');saveEditorDraft();
        }
      }catch(error){if(requestId!==characterImageCompressionRequest)return;target.value='';throw error;}
      finally{if(requestId===characterImageCompressionRequest)isCompressingCharacterImage=false;}
    }
    if (target.id==='profileImage') {
      if (!target.files?.[0]) return;
      profileImage=await compressProfileImage(target.files[0]);
      const preview=$('profileImagePreview');
      if (preview) { preview.src=profileImage; preview.style.display='block'; }
      toast('頭像已壓縮，儲存後套用。');
    }
    if (target.id==='backgroundSetting') {
      const s=(target.dataset.sessionId && state.sessions[target.dataset.sessionId]) || currentSession();
      if (s && /^memory-photo:[0-9a-f-]{36}$/i.test(target.value)) {
        const previousBackground=s.background||'avatar',photoId=target.value.slice('memory-photo:'.length),client=window.mySupabase,uid=currentUser()?.uid;
        try {
          if(!client||!uid||!s.cloudOwned||s.cloudOwnerUid!==uid)throw new Error('請先使用目前帳號擁有的已同步聊天。');
          const {data:photo,error:photoError}=await client.from('chat_memory_photos').select('id').eq('id',photoId).eq('owner_id',uid).eq('chat_type','single').eq('session_id',s.id).eq('status','active').is('deleted_at',null).gt('expires_at',new Date().toISOString()).maybeSingle();
          if(photoError||!photo)throw photoError||new Error('找不到這張有效的回憶相片。');
          const {data:row,error:readError}=await client.from('chat_sessions').select('session_data').eq('id',s.id).eq('user_id',uid).maybeSingle();
          if(readError||!row)throw readError||new Error('讀取聊天設定失敗。');
          const nextData={...(row.session_data||{}),background:target.value};
          const {data:saved,error:saveError}=await client.from('chat_sessions').update({session_data:nextData,updated_at:new Date().toISOString()}).eq('id',s.id).eq('user_id',uid).select('id').maybeSingle();
          if(saveError||!saved)throw saveError||new Error('資料庫未確認背景設定已儲存。');
          s.background=target.value;persist();const panel=$('view').querySelector('.chat-main');if(panel)void window.applySingleMemoryPhotoBackground?.(s,panel);toast('已更新聊天背景。');
        } catch(err) {s.background=previousBackground;target.value=previousBackground;console.error('回憶相片背景設定失敗',err);toast('背景設定失敗：'+(err.message||'請稍後再試。')); }
      } else if (s && ['avatar','none'].includes(target.value)) {
        const previousBackground=s.background || 'avatar';
        s.background=target.value;
        if (!persist()) {
          s.background=previousBackground;
          target.value=previousBackground;
          return;
        }
        if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.background=previousBackground;
            persist();render();
            target.value=previousBackground;
            toast('聊天背景同步失敗，已還原原設定。');
            return;
          }
        }
        const panel=$('view').querySelector('.chat-main');
        if (panel && route.id === s.id) {
          panel.style.setProperty('--chat-photo',target.value==='none' ? 'none' :
            `url(${JSON.stringify(safeImage(sessionCharacter(s).image))})`);
        }
      }
    }
    if(target.dataset.groupMemory) {
      const memories=loadGroupDiaryMemories();
      const memory=memories.find(item=>item.id===target.dataset.groupMemory);
      if(memory) {const previous=memory.important;memory.important=target.checked;if(!saveGroupDiaryMemories(memories)){memory.important=previous;target.checked=previous;}else renderGroupConversation();}
    }
    if (target.dataset.memory) {
      const session=currentSession();
      const m=session?.memories.find(m=>m.id===target.dataset.memory);
      if (m) {
        const previousImportant=m.important;
        m.important=target.checked;
        persist();render();
        if (session.cloudOwned && currentUser()?.uid===session.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(session);
          if (!synced) {
            m.important=previousImportant;
            persist();render();
            toast('重大記憶同步失敗，已還原原設定。');
          }
        }
      }
    }
    if (['aiImages','aiImageCount'].includes(target.id)) updateAICost();
    if (target.id==='jsonFile') await importCharacter(target.files[0]);
  } catch(error) {
    toast(error.message);
    if (target.type==='file') target.value='';
  }
});

async function importCharacter(file) {
  $('jsonFile').value='';
  if (!file || !currentUser()) return;
  if (file.size>2097152) throw Error('JSON最多2 MB。');
  const data=JSON.parse(await file.text());
  const name=String(data.name || '').trim();
  const intro=String(data.intro || '').trim();
  const opening=String(data.opening || '').trim();
  if (!validName(name)) throw Error('角色名稱不符合規則。'+NAME_HELP);
  if (!intro || intro.length>2000 || !opening || opening.length>3000) {
    throw Error('需有intro與opening，並符合2000／3000字上限。');
  }
  if (String(data.privateInfo || '').length>10000 || String(data.style || '').length>1000) {
    throw Error('私密資訊或風格超過長度限制。');
  }
  const image=safeImage(data.image);
  if (!image) throw Error('需提供有效的HTTPS或支援的圖片資料。');
  let tags=[];
  try { tags=validateCharacterTags(Array.isArray(data.tags) ? [...new Set(data.tags)] : []); }
  catch(error) { throw Error('匯入標籤格式不符：' + error.message); }
  const user = currentUser();
  if (!user?.uid || !window.mySupabase) {
    throw Error('請先使用 Google 帳號登入，角色才能儲存到雲端。');
  }
  const character = {
    id:id(),name,intro,opening,image,tags,
    gender:['male','female','ambiguous'].includes(data.gender) ? data.gender : 'ambiguous',
    age:String(data.age || '').slice(0,20),
    race:String(data.race || '').slice(0,50),
    privateInfo:String(data.privateInfo || ''),style:String(data.style || ''),
    authorId:user.uid,owner:true,visibility:'private',rightsConfirmed:false,
    chats:'0',users:null,createdAt:Date.now()
  };
  // 匯入完成即建立雲端私密角色，不必先公開才上傳。
  const saveResult = await saveSupabaseCharacter(character, user.uid);
  state.characters.unshift(character);
  persist();go({page:'create'});
  if (saveResult.storyError) toast('角色已匯入雲端，但故事同步失敗：' + saveResult.storyError);
  else toast('角色已匯入雲端，預設為私密。');
}

/* Image errors do not inject HTML. */
document.addEventListener('error',event => {
  if (event.target instanceof HTMLImageElement) event.target.style.opacity='.15';
},true);

/* Initialization */
route=parseRoute();
history.replaceState({personax:true,depth:0,route},'',routeURL(route));
persist();
render();

// Supabase Auth 的 load 事件會在此之後恢復真正的登入身分。
// 這裡不再另外建立第二套登入 UI，避免兩套狀態互相覆蓋。
if (window.__pendingSupabaseUser) {
  syncSupabaseUser(window.__pendingSupabaseUser);
  window.__pendingSupabaseUser = null;
}
</script>

<script>
(function(){
  const BUCKET='personax-memory-photos';
  const urlCache=new Map();
  const dateLabel=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'日期不明':d.toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'});};
  function albumMount(type,id){
    return '<section class="memory-album-stack" data-memory-album-type="'+e(type)+'" data-memory-album-id="'+e(id)+'">'+
      '<p class="small muted" style="margin:0 0 12px">回憶相簿可保存一年，請記得即時下載哦</p>'+
      '<div class="panel stack" style="gap:10px;padding:12px;margin-bottom:14px">'+
      '<label class="field"><span>回憶名稱</span><input id="memoryAlbumCaption" maxlength="80" placeholder="例如：第一次遇見"></label>'+
      '<label class="field"><span>上傳回憶相片（JPEG、PNG、WebP，單張上限 10 MB）</span><input id="memoryAlbumFile" type="file" accept="image/jpeg,image/png,image/webp" data-album-type="'+e(type)+'" data-album-id="'+e(id)+'"></label></div>'+
      '<div id="memoryAlbumItems" class="memory-album-items"><div class="empty">正在讀取回憶相簿…</div></div></section>';
  }
  async function loadAlbum(type,chatId){
    const mount=$('memoryAlbumItems');if(!mount)return;
    const client=window.mySupabase;
    if(!client||!currentUser()?.uid){mount.innerHTML='<div class="empty">請先登入，才能查看與保存回憶相片。</div>';return;}
    try{
      const {data:{user},error:authError}=await client.auth.getUser();
      if(authError||!user||user.id!==currentUser()?.uid)throw new Error('登入狀態驗證失敗，請重新登入。');
      const {data,error}=await client.from('chat_memory_photos').select('id,owner_id,chat_type,session_id,group_id,storage_path,caption,created_at,expires_at')
        .eq('owner_id',user.id).eq('chat_type',type).eq(type==='single'?'session_id':'group_id',chatId)
        .eq('status','active').is('deleted_at',null).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});
      if(error)throw error;
      const cards=await Promise.all((data||[]).map(async photo=>{
        const {data:signed,error:signedError}=await client.storage.from(BUCKET).createSignedUrl(photo.storage_path,3600);
        const imageUrl=!signedError&&signed?.signedUrl?signed.signedUrl:'';
        if(!imageUrl)console.warn('相簿簽名網址取得失敗',signedError?.message);
        urlCache.set(photo.id,{url:imageUrl,photo});
        const thumbnail=imageUrl
          ? '<button type="button" class="memory-photo-thumb" data-action="memory-photo-open" data-id="'+e(photo.id)+'" aria-label="開啟相片"><img src="'+e(imageUrl)+'" alt="'+e(photo.caption||'回憶相片')+'" loading="lazy"></button>'
          : '<div class="memory-photo-thumb" style="display:grid;place-items:center;color:var(--muted);font-size:11px;padding:6px;text-align:center">圖片檔案遺失<br>仍可刪除紀錄</div>';
        return '<article class="memory-photo-row">'+thumbnail+
          '<div class="memory-photo-details"><div class="memory-photo-title-edit"><strong>'+e(photo.caption||'回憶快照')+'</strong>'+(imageUrl?'<button type="button" class="ghost memory-photo-icon" data-action="memory-photo-edit" data-id="'+e(photo.id)+'" aria-label="修改標題" title="修改標題">✎</button>':'')+'</div><span class="small muted">'+e(dateLabel(photo.created_at))+'</span><span class="memory-photo-expiry">到期日：'+e(dateLabel(photo.expires_at))+'</span></div>'+
          '<div class="memory-photo-actions"><button type="button" class="ghost memory-photo-icon" data-action="memory-photo-delete" data-id="'+e(photo.id)+'" aria-label="刪除相片" title="刪除相片">🗑</button></div></article>';
      }));
      if(!mount.isConnected)return;
      mount.innerHTML=cards.filter(Boolean).join('')||'<div class="empty">目前還沒有回憶相片哦</div>';
    }catch(err){console.error('讀取回憶相簿失敗',err);mount.innerHTML='<div class="empty">相簿讀取失敗：'+e(err.message||'請稍後重試。')+'</div>';}
  }
  async function compressMemoryImage(file){
    const image=await createImageBitmap(file);const maxSide=1920;const scale=Math.min(1,maxSide/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('目前裝置無法壓縮圖片。');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close?.();
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('圖片壓縮失敗。')),'image/webp',.86));
    return new File([blob],(file.name.replace(/\.[^.]+$/,'')||'memory-photo')+'.webp',{type:'image/webp',lastModified:Date.now()});
  }
  function setAlbumUploadStatus(input,message,isError=false){
    const stack=input.closest('.memory-album-stack');
    if(!stack)return;
    let status=stack.querySelector('[data-memory-upload-status]');
    if(!status){
      status=document.createElement('div');status.dataset.memoryUploadStatus='true';
      status.className='small';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
      const items=stack.querySelector('#memoryAlbumItems');
      if(items)stack.insertBefore(status,items);else stack.appendChild(status);
    }
    status.textContent=message;
    status.style.color=isError?'var(--danger, #b42318)':'var(--muted, #667085)';
  }
  async function uploadAlbum(input){
    const type=input.dataset.albumType,chatId=input.dataset.albumId,file=input.files?.[0];
    if(!file)return;
    const caption=$('memoryAlbumCaption')?.value.trim()||'回憶快照';
    if(!['single','group'].includes(type)||!isUuid(chatId)){input.value='';toast('無法確認相片所屬聊天，請重新開啟相簿。');return;}
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){input.value='';toast('相片格式僅支援 JPEG、PNG 或 WebP。');return;}
    if(file.size>10*1024*1024){input.value='';toast('單張相片不可超過 10 MB，請先壓縮後再上傳。');return;}
    const client=window.mySupabase;
    if(!client||!currentUser()?.uid){input.value='';toast('請先登入後再上傳相片。');return;}
    let path='';
    input.disabled=true;
    setAlbumUploadStatus(input,'正在壓縮並上傳相片，請稍候…');
    toast('正在上傳回憶相片，請稍候…');
    try{
      const {data:{user},error:authError}=await client.auth.getUser();
      if(authError||!user||user.id!==currentUser()?.uid)throw new Error('登入狀態驗證失敗，請重新登入。');
      const compressed=await compressMemoryImage(file);
      const ext='webp';
      path=user.id+'/'+type+'/'+chatId+'/'+(crypto.randomUUID?crypto.randomUUID():id())+'.'+ext;
      const {error:upError}=await client.storage.from(BUCKET).upload(path,compressed,{contentType:'image/webp',upsert:false});
      if(upError)throw upError;
      const created=new Date(),expires=new Date(created);expires.setFullYear(expires.getFullYear()+1);
      const {error:dbError}=await client.from('chat_memory_photos').insert({
        owner_id:user.id,chat_type:type,session_id:type==='single'?chatId:null,group_id:type==='group'?chatId:null,
        storage_path:path,caption:caption.slice(0,80),created_at:created.toISOString(),expires_at:expires.toISOString(),status:'active'
      });
      if(dbError)throw dbError;
      input.value='';if($('memoryAlbumCaption'))$('memoryAlbumCaption').value='';
      toast('回憶相片已保存。保存期限為一年，實際自動清理排程仍待完成。');
      setAlbumUploadStatus(input,'上傳成功，正在更新相簿…');
      await loadAlbum(type,chatId);
      setAlbumUploadStatus(input,'相片已保存並更新相簿。');
    }catch(err){
      if(path){const {error:cleanup}=await client.storage.from(BUCKET).remove([path]);if(cleanup)console.error('清理未完成上傳檔案失敗',cleanup.message);}
      console.error('回憶相片上傳失敗',err);
      setAlbumUploadStatus(input,'上傳失敗：'+(err.message||'請稍後重試。'),true);
      toast('相片上傳失敗：'+(err.message||'請稍後重試。'));
    }finally{
      input.disabled=false;
    }
  }
  async function applySingleMemoryPhotoBackground(session,panel){
    const client=window.mySupabase,uid=currentUser()?.uid;
    const match=String(session?.background||'').match(/^memory-photo:([0-9a-f-]{36})$/i);
    if(!client||!uid||!match||session.cloudOwnerUid!==uid){panel.style.setProperty('--chat-photo','none');return;}
    try{
      const {data:photo,error}=await client.from('chat_memory_photos').select('id,storage_path')
        .eq('id',match[1]).eq('owner_id',uid).eq('chat_type','single').eq('session_id',session.id)
        .eq('status','active').is('deleted_at',null).gt('expires_at',new Date().toISOString()).maybeSingle();
      if(error)throw error;
      if(!photo){session.background='none';persist();panel.style.setProperty('--chat-photo','none');return;}
      const {data:signed,error:signedError}=await client.storage.from(BUCKET).createSignedUrl(photo.storage_path,3600);
      if(signedError||!signed?.signedUrl)throw signedError||new Error('無法取得背景圖片。');
      if(currentSession()?.id===session.id)panel.style.setProperty('--chat-photo','url('+JSON.stringify(signed.signedUrl)+')');
    }catch(err){console.error('讀取單聊相簿背景失敗',err);panel.style.setProperty('--chat-photo','none');}
  }
  async function applyGroupMemoryPhotoBackground(group,panel){
    const client=window.mySupabase,uid=currentUser()?.uid,photoId=group?.backgroundMemoryPhotoId;
    if(!client||!uid||!photoId||groupPrototype.active?.id!==group.id){panel.style.setProperty('--chat-photo','none');return;}
    try{
      const {data:photo,error}=await client.from('chat_memory_photos').select('id,storage_path')
        .eq('id',photoId).eq('owner_id',uid).eq('chat_type','group').eq('group_id',group.id)
        .eq('status','active').is('deleted_at',null).gt('expires_at',new Date().toISOString()).maybeSingle();
      if(error)throw error;
      if(!photo){
        panel.style.setProperty('--chat-photo','none');
        const {data:cleared,error:clearError}=await client.from('chat_groups')
          .update({background_mode:'none',background_memory_photo_id:null,updated_at:new Date().toISOString()})
          .eq('id',group.id).eq('owner_id',uid).eq('background_mode','memory').eq('background_memory_photo_id',photoId)
          .select('id').maybeSingle();
        if(clearError)console.warn('失效群組背景已回退畫面，但資料庫設定清理失敗',clearError.message);
        if(cleared&&groupPrototype.active?.id===group.id){group.backgroundMode='none';group.backgroundMemoryPhotoId=null;}

          group.memoryPhotos=Array.isArray(group.memoryPhotos)?group.memoryPhotos.filter(item=>item.id!==photo.id):[];group.memoryPhotos.unshift({...photo,image_url:cached.url});group.backgroundMode='memory';group.backgroundMemoryPhotoId=photo.id;render();toast('已將這張回憶相片設為群組背景。');
        }

      viewer.addEventListener('click',ev=>{if(ev.target===viewer){viewer.remove();return;}if(ev.target.matches('[data-memory-viewer-image]'))viewer.querySelector('.memory-viewer-controls')?.classList.toggle('visible');});
