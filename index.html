<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>PersonaX｜AI 角色世界</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/elmjp1990-ux/my-ai-roleplay/main/LOGO_WEBICON.png">

<style>
:root {
  color-scheme: dark;
  /* POYOZZ premium immersive palette preview */
  --bg:#090c14;
  --panel:#151c2d;
  --panel2:#1b2440;
  --text:#f4f3ff;
  --muted:#a4adc2;
  --border:#2a3349;
  --primary:#8b7cff;
  --soft:#272347;
  --input:#101726;
  --header:#101726ed;
  --bubble:#20243b;
  --shade:#090c14e8;
  --sidebar:232px;
  --px-primary-hover:#a99bff;
  --px-accent-pink:#e9b7e8;
}
body.day {
  color-scheme:light;
  --bg:#f3f5fa;
  --panel:#ffffff;
  --panel2:#edf0f7;
  --text:#182235;
  --muted:#617087;
  --border:#d6ddea;
  --input:#ffffff;
  --header:#ffffffef;
  --bubble:#ffffff;
  --shade:#f3f5fae0;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  font-size:14px;
}
button,input,textarea,select { font:inherit; }
button {
  cursor:pointer;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:11px;
  padding:10px 13px;
}
button:hover:not(:disabled) { filter:brightness(1.1); }
button:disabled { opacity:.45; cursor:not-allowed; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
  outline:2px solid #a5b4fc;
  outline-offset:3px;
}
input,textarea,select {
  width:100%;
  padding:11px 12px;
  color:var(--text);
  background:var(--input);
  border:1px solid var(--border);
  border-radius:11px;
}
textarea { resize:vertical; min-height:105px; line-height:1.7; }
input[type="checkbox"],input[type="radio"] {
  width:auto;
  accent-color:var(--primary);
}
img { display:block; max-width:100%; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:28px; }
h2 { font-size:21px; }
h3 { font-size:16px; }
p { line-height:1.8; }
svg { pointer-events:none; }
.icon {
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  display:block;
}
.hidden { display:none!important; }
.primary { background:var(--primary); color:white; border-color:transparent; }
/* Shared deep POYOZZ action style for persona-picker Apply buttons. */
.persona-picker-apply { width:100%; min-height:44px; color:#f7f8ff; font-weight:650; letter-spacing:.04em; background:linear-gradient(135deg,#303d68 0%,#29284f 52%,#3b2d59 100%); border:1px solid #7180b8; box-shadow:0 7px 18px #05091455,inset 0 1px #ffffff22; }
.persona-picker-apply:hover:not(:disabled) { background:linear-gradient(135deg,#3a4b7e 0%,#353363 52%,#4a376c 100%); border-color:#9ba9e4; filter:none; }
.persona-picker-apply:disabled { background:linear-gradient(135deg,#20283c,#24243b); color:#8790a8; border-color:#343d54; box-shadow:none; opacity:1; }
.danger { color:#e65a76; border-color:#e65a7650; }
.ghost { background:transparent; border-color:transparent; }
.row { display:flex; align-items:center; gap:10px; }
.between { justify-content:space-between; }
.wrap { flex-wrap:wrap; }
.grow { flex:1; min-width:0; }
.small { font-size:12px; }
.muted { color:var(--muted); }
.stack > * + * { margin-top:18px; }
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:19px;
  padding:22px;
}
.prose { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.9; }
.bio-scroll { max-height:9.5em; overflow-y:auto; overscroll-behavior:contain; padding-right:5px; }
.empty {
  padding:35px 18px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:16px;
  grid-column:1/-1;
}
.tabs { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; }
.tab { white-space:nowrap; color:var(--muted); }
.tab.active { background:var(--primary); color:white; border-color:transparent; }
.tag {
  padding:5px 9px;
  font-size:11px;
  color:#a5a8ff;
  background:var(--soft);
  border:0;
  border-radius:999px;
}
body.day .tag { color:#4f46b8; }
.badge {
  display:inline-block;
  border-radius:999px;
  background:var(--soft);
  color:var(--muted);
  font-size:11px;
  padding:5px 9px;
}
.field { display:block; margin-bottom:17px; }
.field > span { display:block; font-weight:600; margin-bottom:8px; }
.field small { display:block; color:var(--muted); margin-top:6px; line-height:1.7; }
.tag-picker-search-field{margin-bottom:12px}
.tag-picker-input-row{display:flex;align-items:center;gap:8px}
.tag-picker-input-row input{width:100%;min-width:0;flex:1;padding:12px 14px}
.tag-picker-input-row .tag-picker-add{flex:0 0 auto;font-size:11px;padding:8px 10px}
.tag-picker-search-field small{font-size:11px;margin-top:4px}
.tag-picker-chips{display:flex;flex-wrap:wrap;gap:8px;min-height:28px}
.tag-picker-chip,.tag-picker-add{font-size:12px;padding:7px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);line-height:1.3}
.tag-picker-chip.selected{color:#c7d2fe;background:var(--soft);border-color:#818cf8}
.tag-picker-add{font-size:12px;color:#fff;background:var(--primary);border-color:transparent}
.tag-picker-options{display:none!important}
.tag-picker-selected-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;font-size:12px;color:var(--muted)}
.tag-picker-selected-heading strong{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.tag-picker-selected{margin-top:8px;min-height:30px}
.tag-picker-apply{padding:11px 14px}
.followed-author-profile-link{flex:0 0 auto;display:inline-flex;padding:0;border:0;background:transparent;border-radius:50%}
.followed-author-profile-link .avatar{width:44px;height:44px}
.followed-author-name{display:block;max-width:100%;padding:0;border:0;background:transparent;text-align:left;font-weight:700;overflow-wrap:anywhere}
.followed-author-name:hover{text-decoration:underline}
.followed-author-more{flex:0 0 auto;padding:6px 10px;font-size:11px;letter-spacing:.08em;border-radius:9px}

.check { display:flex; align-items:flex-start; gap:9px; line-height:1.7; }
.nsfw-attention{outline:2px solid #f59e0b;outline-offset:5px;border-radius:8px;background:#f59e0b12;}
.check input { margin-top:5px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-width { max-width:820px; }
.avatar {
  width:36px;
  height:36px;
  object-fit:cover;
  border-radius:50%;
  flex-shrink:0;
  background:#312e81;
}
.avatar-fallback { display:grid; place-items:center; color:#ddd6fe; font-weight:bold; }
.group-list-avatar { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; flex-shrink:0; color:#e0e7ff; background:linear-gradient(135deg,#6366f1,#8b5cf6); font-weight:700; font-size:13px; }
.group-avatar-stack{width:36px;height:36px;flex:0 0 36px;position:relative;display:block}
.group-avatar-stack .group-avatar-image{position:absolute;width:25px;height:25px;border-radius:50%;object-fit:cover;border:2px solid var(--panel);background:var(--panel2)}
.group-avatar-stack .group-avatar-image:nth-child(1){left:0;top:0}
.group-avatar-stack .group-avatar-image:nth-child(2){right:0;top:0}
.group-avatar-stack .group-avatar-image:nth-child(3){left:7px;bottom:0}
.group-avatar-stack .group-avatar-fallback{position:absolute;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:10px;border:2px solid var(--panel);background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#e0e7ff}
.group-avatar-stack .group-avatar-fallback:nth-child(1){left:0;top:0}
.group-avatar-stack .group-avatar-fallback:nth-child(2){right:0;top:0}
.group-avatar-stack .group-avatar-fallback:nth-child(3){left:7px;bottom:0}
.group-pin{flex:0 0 auto}
.group-chat-entry .group-chat-open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:2px;cursor:pointer}
.group-chat-entry .group-chat-copy{display:block;flex:1;min-width:0;overflow:hidden}
.group-chat-entry .group-chat-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.group-chat-entry .group-chat-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-chat-entry .group-chat-preview{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-chat-entry .group-chat-date{flex:0 0 auto;white-space:nowrap}
.group-chat-entry .group-entry-menu-spacer{visibility:hidden;pointer-events:none;flex:0 0 auto}
.ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.character-avatar-status {
  position:relative;
  display:inline-flex;
  flex:0 0 auto;
  line-height:0;
}
.character-avatar-status .avatar {
  display:block;
}
.character-avatar-status.is-offline .avatar,
.detail-image.character-offline-image {
  filter:grayscale(1);
  opacity:.68;
}
.character-status-dot {
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:11px;
  height:11px;
  border:2px solid var(--panel);
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 1px #0003;
}
.character-avatar-status.is-offline .character-status-dot {
  background:#8993a4;
}
.character-status-label {
  display:inline-flex;
  align-items:center;
  gap:7px;
  width:max-content;
  max-width:100%;
  color:var(--muted);
  font-size:12px;
}
.character-status-label .character-status-dot {
  position:static;
  display:inline-block;
  flex:0 0 auto;
}
.character-status-banner {
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 13px;
  color:var(--muted);
  background:var(--panel2);
  line-height:1.6;
}

/* Logo / navigation */
.logo-img { width:132px; height:29px; object-fit:contain; }
.group-member-avatar-link{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;border:0;border-radius:50%;background:transparent;line-height:0}
.group-member-avatar-link:hover{filter:brightness(1.12)}
.group-member-avatar-link:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar);
  z-index:40;
  padding:18px 12px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}
.sidebar-heading { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.sidebar-heading .logo-button { padding:4px; }
.sidebar nav { display:grid; gap:6px; margin-top:25px; }
.nav-btn {
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--muted);
}
.nav-btn.active { background:var(--soft); color:var(--text); }
.nav-btn.active .chat-nav-icon { fill:currentColor; }
.sidebar-footer { margin-top:auto; display:flex; justify-content:center; }
.sidebar-footer button { padding:8px; }
.app { margin-left:var(--sidebar); }
body.collapsed { --sidebar:72px; }
body.collapsed .sidebar-heading .logo-button { display:none; }
body.collapsed .sidebar-heading { justify-content:center; }
body.collapsed .nav-label { display:none; }
body.collapsed .nav-btn { justify-content:center; padding-inline:6px; }
.sidebar-iconmark { display:none; width:34px; height:34px; object-fit:contain; }
body.collapsed .sidebar-footer-logo { display:flex; align-items:center; justify-content:center; width:44px; height:44px; padding:4px; }
body.collapsed .sidebar-footer .sidebar-wordmark { display:none; }
body.collapsed .sidebar-footer .sidebar-iconmark { display:block; }
header {
  height:64px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--header);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
}
.mobile-logo { display:none; }
.environment {
  border:0;
  padding:3px 0;
  background:transparent;
  font-size:10px;
  color:var(--muted);
  white-space:nowrap;
}
.wallet-button {
  display:flex;
  align-items:center;
  gap:9px;
  padding:3px 0;
  border:0;
  border-radius:999px;
  background:transparent;
  font-size:12px;
  box-shadow:none;
}
.wallet-button:hover:not(:disabled) {
  filter:none;
}
.wallet-button .avatar {
  width:32px;
  height:32px;
  border:0;
  box-shadow:none;
}
.wallet-button .avatar-fallback {
  border:0;
}
.wallet-diamond { color:#dcad35; }
.wallet-silver { color:var(--muted); }
main { max-width:1500px; margin:auto; padding:25px; }
.mobile-nav { display:none; }

/* Explore */
.hero {
  min-height:280px;
  padding:36px;
  border-radius:25px;
  overflow:hidden;
  color:#f1f5ff;
  background:
    radial-gradient(circle at 85% 20%,#818cf845,transparent 35%),
    linear-gradient(115deg,#111827,#172554 55%,#1b1538);
  border:1px solid #818cf845;
}
.hero h1 { margin:16px 0; font-size:clamp(28px,4vw,45px); }
.hero p { max-width:670px; color:#cbd5e1; }
.hero-controls { display:flex; gap:8px; margin-top:18px; }
.hero-dot { width:10px; height:10px; padding:0; border:0; border-radius:50%; background:#ffffff45; }
.hero-dot.active { background:white; }
.toolbar { display:flex; gap:10px; flex-wrap:wrap; }
.toolbar input { max-width:420px; min-width:150px; flex:1; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:17px; }
.card { overflow:hidden; border:1px solid var(--border); border-radius:17px; background:var(--panel); min-width:0; }
.card-image { position:relative; aspect-ratio:4/5; }
.image-button { width:100%; height:100%; padding:0; border:0; border-radius:0; background:var(--panel2); overflow:hidden; }
.image-button img { width:100%; height:100%; object-fit:cover; }
.image-button video { display:block; width:100%; height:100%; object-fit:cover; background:var(--panel2); }
.chat-cta{min-height:42px;border:1px solid #cbd0dc;border-radius:12px;background:linear-gradient(135deg,#f1f3f7,#dfe3eb);color:#252a36;font-size:13px;font-weight:650;letter-spacing:.02em;box-shadow:0 3px 10px #080b1218,inset 0 1px #ffffffb8;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.chat-cta:hover{background:linear-gradient(135deg,#fff,#e8ebf2);border-color:#aeb5c4}
.chat-cta:active{transform:scale(.985)}
.card-chat{position:absolute;z-index:4;left:10px;right:10px;bottom:10px;min-height:40px;border-color:#ffffff55;background:linear-gradient(135deg,#e7e9ef38,#8d95a733);color:#f7f8fc;font-size:12px;letter-spacing:.08em;box-shadow:0 8px 22px #080b1260,inset 0 1px #ffffff28;backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%);opacity:1}
.card:hover .card-chat,.card:focus-within .card-chat{background:linear-gradient(135deg,#e7e9ef55,#8d95a744);border-color:#ffffff80}
.card-chat:hover{background:linear-gradient(135deg,#e7e9ef65,#8d95a755);border-color:#ffffff90}
.nsfw-card-badge{position:static;display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.035em;box-shadow:none;line-height:1.4}
.card-body { padding:13px; }
.card-body h3 { margin:9px 0 6px; }
.card-intro {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:43px;
}
.heart { border:0; background:transparent; padding:4px; font-size:21px; color:#b8c0cf; transition:color .18s ease,transform .18s ease; }
.heart.on { color:#ff405f; }
.heart:active { transform:scale(.96); }
.owner-actions { display:flex; gap:7px; margin-top:12px; }
.owner-actions button { flex:1; font-size:12px; padding:8px; }
.detail-layout { display:grid; grid-template-columns:minmax(230px,360px) 1fr; gap:25px; }
.detail-portrait{position:relative;align-self:start;overflow:hidden;border-radius:19px;background:var(--panel2);isolation:isolate}
.detail-image { display:block;width:100%;height:min(72vh,580px);min-height:360px;object-fit:cover;border-radius:19px; }
.detail-portrait::after{content:"";position:absolute;inset:35% 0 0;z-index:0;pointer-events:none;background:linear-gradient(transparent,#080b12ed)}
.detail-portrait-meta{position:absolute;z-index:1;left:22px;right:18px;bottom:20px;color:#fff;text-shadow:0 2px 12px #000b}
.detail-portrait-meta h1{font-size:clamp(25px,3vw,38px);line-height:1.15;margin:0 0 8px;letter-spacing:-.035em}
.detail-portrait-meta .author-link{color:#f1f5ff;padding:0;text-shadow:0 1px 8px #000}
.detail-portrait-meta .detail-chat-count{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:10px;color:#f8fafc;opacity:.95}.detail-portrait-meta .detail-chat-count svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.comment-like-row{display:flex;align-items:center;justify-content:flex-start;margin:0 0 8px}
.comment-like-button{display:inline-flex;align-items:center;gap:5px;padding:2px 5px;border:0;background:transparent;color:var(--muted);font-size:12px;line-height:1.2;min-height:24px;box-shadow:none}
.comment-like-button .like-symbol{font-size:15px;line-height:1}
.comment-like-button.on{color:#fb7185}
.author-link { border:0; background:transparent; color:#a5a8ff; padding:0; }
.comment { padding:18px 0; border-bottom:1px solid var(--border); }
.comment.reply { margin-left:24px; border-left:2px solid var(--soft); padding-left:14px; }
.comment-tools { display:flex; gap:7px; flex-wrap:wrap; }
.comment-tools button { padding:5px 8px; font-size:11px; }
.whisper-option{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;color:#c4b5fd;font-size:12px;cursor:pointer}
.whisper-option input{width:14px;height:14px;margin:0;accent-color:#8b5cf6}
.whisper-option small{color:var(--muted);font-size:10px}
.comment-whisper-label{display:inline-flex;align-items:center;gap:4px;margin-left:7px;padding:2px 6px;border:1px solid #a78bfa55;border-radius:999px;color:#c4b5fd;font-size:10px}


/* UI-02-01: premium mobile-first exploration polish */
.explore-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 4px}
.explore-eyebrow{color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}
.explore-title{margin:0;font-size:clamp(24px,3vw,31px);letter-spacing:-.04em}
.explore-subtitle{margin:7px 0 0;color:var(--muted);font-size:12px}
.explore-shortcuts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.explore-shortcut{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:13px 4px 11px;border-radius:15px;background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--border);color:var(--muted);font-size:11px;transition:transform .18s ease,border-color .18s ease,background .18s ease}
.explore-shortcut .icon{width:19px;height:19px;color:var(--text)}
.explore-shortcut.active{border-color:#818cf8a8;background:var(--soft);color:var(--text);box-shadow:inset 0 0 0 1px #818cf822}
.explore-shortcut:active{transform:scale(.97)}
.explore-search-row{display:flex;gap:8px;align-items:center}
.explore-search-row input{min-width:0;flex:1}
.explore-search-row .icon-button{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;padding:0}
.explore-section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 12px}
.explore-section-heading h2{margin:0;font-size:19px;letter-spacing:-.02em}
.explore-section-heading p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.card{box-shadow:0 5px 22px #0000000a;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);border-color:#818cf855;box-shadow:0 12px 30px #00000018}
.card-image{position:relative}
.card-image::after{content:"";position:absolute;inset:45% 0 0;pointer-events:none;background:linear-gradient(transparent,#080b12a8)}
.card-image .image-button{display:block}
.card-body h3{letter-spacing:-.02em}

.card-image .heart,.card-image .card-chat-count{position:absolute;z-index:4;top:9px;height:29px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:#fff;font-size:16px;text-shadow:0 1px 4px #000b;backdrop-filter:none;box-shadow:none}
.card-image .heart{right:9px;width:29px;font-size:19px}
.card-image .heart.on{color:#fb7185;background:transparent}
.card-image .card-chat-count{left:9px;right:auto;gap:4px;width:auto;min-width:0;padding:0;font-size:11px;border-radius:0;color:#fff}

/* Chat */
/* 單人對話使用完整視窗高度，不顯示全站標頭（頁名／測試環境／錢包／帳號）。 */
body.conversation .app > header { display:none !important; }
body.conversation main { max-width:none; height:100dvh; padding:0; }
body.conversation .chat-layout { height:100dvh; }
body.chat-page main { max-width:none; padding:12px; }
body.group-chat-page .app > header,body.group-chat-page .mobile-nav { display:none !important; }
body.group-chat-page .sidebar { display:flex; }
body.group-chat-page .app { margin-left:var(--sidebar); }
body.group-chat-page:has(.group-wizard) .sidebar { display:none !important; }
body.group-chat-page:has(.group-wizard) .app { margin-left:0; }
body.group-chat-page main { max-width:none; height:100dvh; min-height:0; padding:0; overflow:hidden; }
body.group-chat-page .chat-layout { height:100dvh; }
body.group-chat-page .chat-main { height:100%; border:0; border-radius:0; }
body.group-chat-page .chat-heading { padding-top:calc(8px + env(safe-area-inset-top)); }
body.group-chat-page .messages { padding:14px 10px; }
body.group-chat-page .composer { padding:5px 8px calc(5px + env(safe-area-inset-bottom)); }

/* Group creation wizard must scroll independently from the full-screen chat shell. */
body.group-chat-page:has(.group-wizard) {
  height:auto;
  min-height:100dvh;
  overflow-y:auto;
}
body.group-chat-page:has(.group-wizard) .app {
  height:auto;
  min-height:100dvh;
  overflow:visible;
}
body.group-chat-page:has(.group-wizard) main {
  height:auto;
  min-height:100dvh;
  overflow:visible;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
body.group-chat-page:has(.group-wizard) #view {
  min-height:100%;
  overflow:visible;
}

.chat-layout {
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:12px;
  height:calc(100dvh - 88px);
  min-height:0;
}
.chat-layout.list-only { grid-template-columns:1fr; }
.chat-layout.hide-list { grid-template-columns:1fr; }
.chat-layout.hide-list .chat-list { display:none; }
.chat-list { overflow-y:auto; padding:clamp(14px,2.4vw,22px); min-height:0; background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 94%,var(--primary))); }
.chat-list-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
.chat-brand { display:inline-flex; align-items:center; gap:9px; padding:0; border:0; background:transparent; color:var(--text); font-size:18px; font-weight:800; letter-spacing:.02em; }
.chat-brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:12px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; box-shadow:0 5px 18px #6366f133; }
.chat-list-actions { display:flex; align-items:center; gap:6px; }
.chat-list-icon { display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--border); border-radius:13px; background:var(--panel2); color:var(--text); }
.chat-list-icon svg { width:19px; height:19px; }
.chat-list-search { display:flex; gap:9px; margin-bottom:13px; }
.chat-list-search input { min-width:0; width:100%; border-radius:14px; padding:12px 14px; background:var(--input); }
.chat-list-search.collapsed { display:none; }
.chat-top-actions { display:flex; align-items:center; gap:7px; }
.chat-top-action { width:38px; height:38px; display:grid; place-items:center; padding:0; border:1px solid var(--border); border-radius:12px; background:var(--panel2); color:var(--text); }
.chat-top-action svg { width:19px; height:19px; }
@media (max-width:520px) { .chat-top-actions { gap:5px; } .chat-top-action { width:35px; height:35px; border-radius:11px; } }
.chat-announcement { display:flex; align-items:center; gap:11px; padding:12px 13px; margin-bottom:15px; border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border)); border-radius:15px; background:linear-gradient(110deg,var(--soft),transparent); text-align:left; width:100%; }
.chat-announcement-mark { display:grid; place-items:center; flex:0 0 38px; height:38px; border-radius:12px; background:#16a34a22; color:#4ade80; font-size:18px; }
.chat-announcement-copy { min-width:0; display:flex; flex-direction:column; gap:3px; }
.chat-announcement-copy strong { font-size:13px; }
.chat-announcement-copy span { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-list-section { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:17px 2px 8px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.04em; }
.chat-entry { display:flex; gap:10px; align-items:center; padding:10px 8px; margin-top:5px; border:1px solid transparent; border-radius:15px; transition:background .16s,border-color .16s; }
.chat-entry:hover { background:var(--panel2); }
.chat-entry.active { background:var(--soft); border-color:color-mix(in srgb,var(--primary) 32%,transparent); }
.select-chat { flex:1; min-width:0; border:0; background:transparent; text-align:left; padding:2px; }
.pin { padding:3px; border:0; background:transparent; color:var(--muted); }
.pin.on { color:#fb7185; }
.pin.on svg { fill:#fb718535; }
.entry-menu { display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;line-height:1;opacity:0;cursor:pointer;transition:opacity .16s,background .16s,border-color .16s,color .16s; }
.chat-entry:hover .entry-menu,.chat-entry:focus-within .entry-menu { opacity:1; }
.entry-menu:hover,.entry-menu:focus-visible { opacity:1;background:var(--soft);border-color:var(--border);color:var(--text);outline:none; }
.group-entry-menu{margin-left:auto;}
@media (hover:none){.entry-menu{opacity:1;}}
.chat-main {
  min-width:0;
  min-height:0;
  height:100%;
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
}
.chat-main::before {
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background-image:linear-gradient(rgba(112,118,130,.30),rgba(112,118,130,.30)),var(--chat-photo,none);
  background-size:cover;
  background-position:center;
}
.chat-heading {
  flex:0 0 auto;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  background:var(--header);
  backdrop-filter:blur(14px);
}
.chat-heading .avatar { width:31px; height:31px; }
.chat-heading button { padding:6px; }
.chat-name { font-size:13px; font-weight:bold; }
.chat-meta { display:none; }
.messages { flex:1 1 0; min-height:0; overflow-y:auto; padding:20px; overscroll-behavior:contain; }
.message { display:flex; gap:8px; margin-bottom:19px; position:relative; }
.message.user { flex-direction:row-reverse; }
.message.user > .avatar { display:none !important; }
.message .avatar { width:30px; height:30px; }
.message-content { max-width:85%; min-width:0; }
.message-name { color:var(--muted); font-size:10px; margin-bottom:5px; }
.user .message-name { text-align:right; }
.roleplay-segments { display:grid; gap:5px; }
.roleplay-segment { min-width:0; }
.roleplay-segment-heading { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; margin:4px 0 5px; }
.roleplay-segment-heading .avatar { width:30px !important; height:30px !important; flex:0 0 30px; object-fit:cover; }
.roleplay-avatar-wrap { position:relative; display:block; flex:0 0 30px; width:30px; min-width:30px; height:30px; min-height:30px; overflow:visible; }
.roleplay-avatar-wrap > .avatar { display:block; box-sizing:border-box; width:30px !important; height:30px !important; min-width:30px; min-height:30px; max-width:30px; max-height:30px; }
.roleplay-avatar-wrap.has-player-badge::after { content:'你'; position:absolute; z-index:20; right:-3px; bottom:-3px; display:flex; box-sizing:border-box; width:16px; height:16px; min-width:16px; min-height:16px; align-items:center; justify-content:center; border:1px solid var(--panel); border-radius:3px; background:var(--primary); color:#fff; font-size:8px; font-weight:700; line-height:1; white-space:nowrap; pointer-events:none; }
.roleplay-prefixed-message .message-content { max-width:calc(100% - 8px); }
.roleplay-segment.is-character .bubble { background:var(--bubble); color:var(--text); border-color:var(--border); }
.roleplay-segment.is-temporary .bubble { background:var(--panel2); color:var(--text); border:1px dashed var(--border); }
.roleplay-segment.is-user .bubble { background:var(--primary); color:white; border-color:transparent; }
.roleplay-message-character .message-content { text-align:left; }
.roleplay-message-character .message-name { text-align:left; }
.roleplay-message-player .message-name { text-align:right; }
.bubble {
  font-size:16px;
  padding:12px 14px;
  background:var(--bubble);
  border:1px solid var(--border);
  border-radius:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.85;
  margin-bottom:3px;
}
.user .bubble { background:var(--primary); color:white; border-color:transparent; }
.narration {
  display:block;
  font-size:16px;
  font-style:italic;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.96),0 0 7px rgba(0,0,0,.62);
  -webkit-text-stroke:.12px rgba(0,0,0,.45);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.85;
  margin:3px 0;
}
.user .narration { text-align:right; }
.message-more {
  opacity:0;
  padding:3px 7px;
  border:0;
  background:var(--panel2);
  height:28px;
  align-self:center;
}
.message:hover .message-more,.message:focus-within .message-more,.message.selected .message-more { opacity:1; }

/* Character phone */
.phone-modal-backdrop{position:fixed;inset:0;z-index:12000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(7,10,22,.68);backdrop-filter:blur(8px)}
.phone-device{width:min(360px,100%);height:min(500px,90dvh);min-height:min(440px,90dvh);display:flex;flex-direction:column;overflow:hidden;padding:17px;border:1px solid var(--border);border-radius:30px;background:linear-gradient(155deg,var(--panel) 0%,var(--panel2) 100%);color:var(--text);box-shadow:0 24px 90px #0008,inset 0 1px #ffffff12;border-top:4px solid var(--primary)}
.phone-device-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:650;letter-spacing:.01em;color:var(--text)}
.phone-battery{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--primary)!important}
.phone-battery-shape{width:28px;height:13px;border:1px solid currentColor;border-radius:4px;padding:2px;position:relative;box-shadow:inset 0 0 0 1px #ffffff88;background:var(--panel2)}
.phone-battery-shape:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.phone-battery-fill{height:100%;min-width:0;border-radius:2px;background:linear-gradient(90deg,#80c9a4,#4eaf78);transition:width .18s ease}
.phone-member-switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px}
.phone-member-switch button{min-width:30px;height:28px;padding:3px 9px;font-size:13px;border:1px solid #ded4fa;background:var(--panel2);border-radius:10px;color:var(--text)}
.phone-member-name{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phone-content{padding:13px 2px 7px;font-size:11px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.phone-time{font-size:12px;font-weight:600;letter-spacing:.01em;margin-bottom:9px;color:var(--text)}
.phone-location{padding:9px 11px;border-radius:13px;background:var(--panel2);border:1px solid var(--border);margin-top:9px;font-size:10px;line-height:1.65;color:var(--text)}
.phone-notices{margin-top:10px;padding:11px 12px;border:1px solid var(--border);border-radius:15px;background:var(--panel2);color:var(--text)}
.phone-notices p{margin:6px 0;font-size:10px;line-height:1.65}.phone-notice-list{max-height:132px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}.phone-notice-list p{margin:4px 0;font-size:10px;line-height:1.65}
.phone-notice-title{font-size:11px;font-weight:650;color:var(--primary);margin-bottom:7px}body:not(.day) .phone-notice-title{color:#fff}body:not(.day) .phone-battery{color:#fff!important}
.phone-close-row{display:flex;justify-content:center;margin-top:12px}
.phone-close-row button{border:1px solid #ded4f5;background:var(--panel2);color:var(--text);border-radius:999px;padding:7px 18px;font-size:10px}
.phone-bar{width:85px;height:3px;background:var(--muted);border-radius:5px;margin:12px auto 0}
.phone-warning{border-color:#e5a34b;background:rgba(229,163,75,.12)}
.phone {
  flex:0 0 auto;
  margin:0 12px 7px;
  border:1px solid #b4bfd338;
  border-radius:21px;
  overflow:hidden;
  background:var(--header);
  backdrop-filter:blur(18px);
  box-shadow:0 8px 25px #0002;
}
.phone summary {
  display:flex;
  justify-content:space-between;
  align-items:center;
  list-style:none;
  cursor:pointer;
  padding:6px 12px;
  font-size:10px;
  color:var(--muted);
}
.phone summary::-webkit-details-marker { display:none; }
.phone-content { padding:8px 14px 13px; font-size:11px; }
.phone-time { font-size:17px; font-weight:600; letter-spacing:.015em; margin-bottom:10px; }
.phone-notices { margin-top:9px; padding:10px; border:1px solid var(--border); border-radius:14px; background:var(--soft); }
.phone-notices p { margin:5px 0; font-size:11px; }
.phone-bar { width:85px; height:3px; background:var(--muted); border-radius:5px; margin:12px auto 0; }

/* Composer: compact tools and wallet share the same bottom row. */
.composer { flex:0 0 auto; padding:8px 12px 10px; border-top:1px solid var(--border); background:var(--header); }
.composer-input-row { display:flex; align-items:flex-end; }
.composer-input-row textarea { flex:1; min-width:0; width:100%; resize:none; height:42px; min-height:42px; max-height:120px; font-size:13px; padding:9px 11px; line-height:1.55; overflow-y:auto; }
.composer-bottom-row { display:flex; align-items:center; gap:7px; margin-top:7px; min-width:0; }
.composer-bottom-left { display:flex; align-items:center; gap:5px; flex:1 1 auto; min-width:0; overflow:hidden; }
.composer-bottom-right { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-left:0; flex:0 0 auto; min-width:0; }
.composer-icon-button { width:30px; height:30px; min-width:30px; padding:5px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:transparent; border:1px solid var(--border); }
.composer-icon-button .icon { width:16px; height:16px; }
.composer-send { width:38px; height:38px; min-width:38px; padding:7px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; }
.composer-cost{display:inline-flex;align-items:center;white-space:nowrap;font-size:12px;line-height:1.2;color:var(--muted);padding:5px 7px;border:1px solid var(--border);border-radius:999px;background:var(--surface);}
.composer-wallet { display:flex; align-items:center; gap:8px; font-size:11px; white-space:nowrap; }
.composer-wallet .wallet-value { display:inline-flex; align-items:center; gap:3px; }
.composer-wallet .wallet-diamond { color:#dcad35; }
.composer-wallet .wallet-silver { color:var(--muted); }
.composer-wallet button { padding:0; border:0; background:transparent; font-size:11px; }
.composer .chat-tools { display:flex; align-items:center; gap:5px; flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; margin:0; padding:0 0 2px; scrollbar-width:none; }
.composer .chat-tools::-webkit-scrollbar { display:none; }
.composer .chat-tools.hidden { display:none !important; }
 .composer .chat-tools button { white-space:nowrap; font-size:10px; line-height:1.25; padding:5px 7px; flex:0 0 auto; }
.chat-tools button[data-action="suggestions"] { display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:142px; text-align:left; }
.chat-tools .suggestion-toggle-track { display:inline-flex; align-items:center; width:30px; height:17px; padding:2px; border-radius:999px; background:var(--border); transition:background .15s ease; flex:0 0 auto; }
.chat-tools .suggestion-toggle-thumb { display:block; width:13px; height:13px; border-radius:50%; background:var(--panel); box-shadow:0 1px 2px #0003; transform:translateX(0); transition:transform .15s ease; }
.chat-tools button[data-action="suggestions"][aria-pressed="true"] .suggestion-toggle-track { background:#34d399; }
.chat-tools button[data-action="suggestions"][aria-pressed="true"] .suggestion-toggle-thumb { transform:translateX(13px); }
.chat-tools .suggestion-toggle-state { min-width:22px; font-size:10px; font-weight:700; }
.suggestions { margin-bottom:5px; min-width:0; }
.suggestions-panel { border:1px solid var(--border); border-radius:10px; background:var(--panel); overflow:hidden; }
.suggestions-panel > summary { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px; padding:5px 9px; cursor:pointer; list-style:none; font-size:11px; font-weight:600; }
.suggestions-panel > summary::-webkit-details-marker { display:none; }
.suggestions-panel > summary::after { content:"⌄"; color:var(--muted); font-size:14px; line-height:1; transition:transform .15s ease; }
.suggestions-panel[open] > summary::after { transform:rotate(180deg); }
.suggestions-count { color:var(--muted); font-size:10px; font-weight:400; }
.suggestion-options { display:flex; align-items:center; gap:5px; padding:0 8px 5px; }
.suggestion-light { width:10px; height:10px; min-width:10px; padding:0; border:0; border-radius:50%; background:var(--border); box-shadow:inset 0 0 0 1px var(--muted); }
.suggestion-light[aria-pressed="true"] { background:#34d399; box-shadow:0 0 6px #34d399aa; }
.suggestion-card { touch-action:pan-y; -webkit-user-select:none; user-select:none; display:none; width:100%; min-width:0; max-height:120px; overflow:hidden; padding:6px 9px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); text-align:left; font:inherit; white-space:normal; line-height:1.35; }
.suggestion-card.active { display:block; }
.suggestion-card:active { transform:scale(.995); }
.suggestion-card-title { display:block; margin-bottom:3px; font-size:12px; font-weight:700; }
.suggestion-card-action,.suggestion-card-dialogue { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; font-size:15px; line-height:1.35; }
.suggestion-card-action { color:var(--muted); }
.suggestion-card-dialogue { display:-webkit-box; margin-top:2px; }
.chat-tools { display:flex; gap:6px; overflow-x:auto; margin-top:6px; padding-bottom:2px; }
.chat-tools button { white-space:nowrap; font-size:10px; padding:4px 7px; flex-shrink:0; }
.reply-draft-entry { margin-top:7px; gap:8px; }
.reply-draft-entry .reply-draft-hint { color:var(--muted); font-size:11px; line-height:1.5; }
.reply-draft-entry button { white-space:nowrap; flex-shrink:0; background:var(--soft); border-color:#818cf866; }
.reply-draft-editor { min-height:170px; max-height:42dvh; font-size:14px; }
.reply-draft-notice { padding:10px 12px; border:1px solid var(--border); border-radius:12px; color:var(--muted); font-size:12px; line-height:1.7; background:var(--panel2); }
.chat-overlay { position:absolute; inset:0; z-index:15; background:var(--header); backdrop-filter:blur(20px); padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom)); overflow-y:auto; }
.chat-settings-overlay { position:fixed; inset:0; z-index:10000; width:100vw; height:100dvh; max-height:100dvh; overflow-y:auto; border:0; border-radius:0; padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); background:var(--bg); backdrop-filter:blur(20px); }
.chat-settings-options,.chat-background-options { gap:8px; }

<script>
'use strict';

  const SUPABASE_URL = 'https://ouyewoagbmtqehbofrje.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_MyTDqAKNTkK4zo7eap8gZA_ZGozHRMd';

  if (!window.mySupabase) {
    window.mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  /*
   * Supabase Auth 與 PersonaX 本機 UI 狀態的唯一同步入口。
   * 不直接改 DOM，也絕對不刪除 #modal。
   */
  const USER_SESSIONS_KEY_PREFIX = 'personax-chat-sessions-v1:';

  function cacheSessionsForUser(uid) {
    if (!uid || typeof state === 'undefined') return;
    try {
      localStorage.setItem(USER_SESSIONS_KEY_PREFIX + uid, JSON.stringify(state.sessions || {}));
    } catch (error) {
      console.warn('聊天本機備份失敗：', error);
    }
  }

  function restoreSessionsForUser(uid) {
    if (!uid) return {};
    try {
      const saved = JSON.parse(localStorage.getItem(USER_SESSIONS_KEY_PREFIX + uid) || '{}');
      return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    } catch (_) {
      return {};
    }
  }

  function isolateSessionsForUser(nextUid) {
    const previousUid = state.account?.uid || null;
    if (previousUid === nextUid && nextUid) return;

    // 先把上一個帳號的聊天存入該 UID 專屬的本機區域，再切換到新帳號的聊天。
    if (previousUid) cacheSessionsForUser(previousUid);
    state.sessions = nextUid ? restoreSessionsForUser(nextUid) : {};
    // 舊聊天可能附帶只為該帳號載入的私密角色快照，不可留給下一個帳號。
    state.characters = state.characters.filter(character =>
      !character.cloudSnapshotOnly &&
      (character.visibility !== 'private' || character.authorId === nextUid)
    );
    if (route?.page === 'conversation') route = {page:'home'};
  }

  function syncSupabaseUser(user) {
    if (typeof state === 'undefined') {
      window.__pendingSupabaseUser = user || null;
      return;
    }

    if (!user) {
      isolateSessionsForUser(null);
      pendingDeletionWalletSyncUid = null;
      state.signedIn = false;
      state.account = null;
      persist();
      void loadPublicSupabaseCharacters();
      render();
      return;
    }

    isolateSessionsForUser(user.id);
    const metadata = user.user_metadata || {};
    const previous =
      state.account?.uid === user.id ? state.account : {};
    const wasPendingDeletion = previous.accountDeletionPending === true;
    const nickname =
      metadata.full_name ||
      metadata.name ||
      metadata.user_name ||
      user.email?.split('@')[0] ||
      'PersonaX 使用者';

    // profiles.avatar_url 才是使用者在 PersonaX 編輯後的主頭像來源。
    // OAuth metadata 可能仍保留 Google 舊頭像，不能在登入初始 render 覆蓋已同步的頭像。
    // 登入初始階段不顯示 OAuth 的 Google 頭像，也不信任舊快取作為最新頭像。
    // 先用預設字母頭像，等 profiles.avatar_url 讀回後再顯示 PersonaX 主頭像。
    const avatarUrl = '';

    state.account = {
      ...previous,
      uid: user.id,
      nickname,
      email: user.email || previous.email || '',
      avatar: avatarUrl,
      profileReady: false,
      bio: previous.bio || '',
      diamonds: Number(
        metadata.diamonds ??
        previous.diamonds ??
        0
      ),
      silver: Number(
        metadata.silver ??
        previous.silver ??
        0
      ),
      member: metadata.member || previous.member || 'free'
    };
    state.signedIn = true;

    // 本機記錄為待刪除時，先暫緩顯示狀態視窗，等資料庫確認並讀完真實錢包。
    if (wasPendingDeletion) pendingDeletionWalletSyncUid = user.id;

    persist();
    // 真實會員資料與錢包由資料庫載入；不可把 user_metadata 當成正式餘額。
    void loadSupabaseProfileAndWallet(user);
    void loadPublicSupabaseCharacters();
    void loadSupabaseCharacters(user);
      void loadCloudChatSessions(user);

    // OAuth 返回後，不要把使用者留在登入遮罩；回到登入前想去的頁面。
    const next = localStorage.getItem('personaX_login_next');
    localStorage.removeItem('personaX_login_next');

    if (next) {
      try {
        const parsed = JSON.parse(next);
        if (parsed && parsed.page) {
          go(parsed, true);
          return;
        }
      } catch (_) {}
    }

    // 若目前還停在登入遮罩，直接關閉它；否則只重新渲染帳號區。
    if (route?.overlay?.name === 'login') {
      const cleanRoute = {...route};
      delete cleanRoute.overlay;
      go(cleanRoute, true);
    } else {
      render();
    }
  }

  // 從 Supabase Database 讀取真正的會員資料與錢包餘額。
  // 表名與欄位依目前提供的資料庫截圖：profiles / wallet_accounts。
  async function loadSupabaseProfileAndWallet(user, throwOnError = false) {
    if (!user?.id || !window.mySupabase) return;
    const client = window.mySupabase;

    let syncStage = '檢查帳號狀態';
    try {
      // 先檢查後端帳號刪除期限；待刪除帳號只能取消申請，不能繼續使用功能。
      const { data: deletionData, error: deletionError } = await client.rpc(
        'get_account_deletion_status'
      );
      if (deletionError) throw new Error('讀取帳號刪除狀態失敗：' + deletionError.message);
      const deletionStatus = Array.isArray(deletionData) ? deletionData[0] : deletionData;
      if (deletionStatus?.is_pending) {
        if (state.account?.uid !== user.id) return;

        // 待刪除帳號仍讀取既有錢包餘額；只 SELECT，不初始化或補發銀幣。
        const { data: pendingWallet, error: pendingWalletError } = await client
          .from('wallet_accounts')
          .select('diamonds, silver_coins')
          .eq('user_id', user.id)
          .maybeSingle();

        state.account = {
          ...state.account,
          accountDeletionPending: true,
          deletionScheduledFor: deletionStatus.scheduled_for
        };
        if (!pendingWalletError && pendingWallet) {
          // 先取得資料庫餘額，才允許 render() 顯示待刪除狀態視窗。
          pendingDeletionWalletSyncUid = null;
        }
        if (pendingWalletError) {
          console.error('讀取待刪除帳號錢包失敗：', pendingWalletError);
          toast('帳號仍在待刪除狀態，但錢包餘額讀取失敗；尚未修改或補發銀幣。');
        } else if (pendingWallet) {
          state.account.diamonds = Number(pendingWallet.diamonds ?? 0);
          state.account.silver = Number(pendingWallet.silver_coins ?? 0);
        } else {
          console.warn('待刪除帳號找不到既有 wallet_accounts 資料；未自動建立錢包。');
          toast('找不到此帳號的既有錢包資料，系統沒有自動補發銀幣。');
        }

        state.signedIn = true;
        persist();
        render();
        if (!state.account.accountDeletionModalDismissed &&
            route?.overlay?.name !== 'account-deletion-pending') {
          openModal('account-deletion-pending', {
            scheduledFor: deletionStatus.scheduled_for
          });
        }
        return;
      }
      if (state.account?.uid === user.id) {
        delete state.account.accountDeletionPending;
        delete state.account.deletionScheduledFor;
      }
      // 資料庫確認帳號不在待刪除期後，解除視窗等待；正常錢包同步完成後才會重新 render。
      if (pendingDeletionWalletSyncUid === user.id) {
        pendingDeletionWalletSyncUid = null;
      }

      syncStage = '讀取公開會員資料';
      let { data: profile, error: profileError } = await client
        .from('profiles')
        .select('id, handle, nickname, avatar_url, bio, follower_count')
        .eq('id', user.id)
        .maybeSingle();

      if (profileError) throw new Error('讀取 profiles 失敗：' + profileError.message);

      if (!profile) {
        syncStage = '建立會員資料';
        const metadata = user.user_metadata || {};
        const baseName = metadata.full_name || metadata.name ||
          metadata.user_name || user.email?.split('@')[0] || 'PersonaX 使用者';
        const handle = 'user_' + user.id.replace(/-/g, '').slice(0, 12);
        const result = await client.from('profiles').upsert({
          id: user.id,
          handle,
          nickname: String(baseName).slice(0, 25),
          avatar_url: metadata.avatar_url || metadata.picture || null,
          bio: '',
          persona_presets: [],
          birthdate: null
        }, { onConflict: 'id' }).select('id, handle, nickname, avatar_url, bio, follower_count').single();
        if (result.error) throw new Error('建立 profiles 失敗：' + result.error.message);
        profile = result.data;
      }

      // 私密欄位只透過依 auth.uid() 限定的 RPC 讀取，避免公開 profiles 查詢暴露生日／人設。
      syncStage = '讀取個人專屬資料';
      const { data: privateProfileData, error: privateProfileError } = await client.rpc(
        'get_my_private_profile_data'
      );
      if (privateProfileError) {
        throw new Error('讀取個人專屬資料失敗：' + privateProfileError.message);
      }
      const privateProfile = privateProfileData && typeof privateProfileData === 'object'
        ? privateProfileData : {};

      // 安全初始化：由資料庫依 auth.uid() 建立新錢包（0 鑽石、100 銀幣），
      // 舊會員則保留原餘額。前端不再直接 INSERT/UPSERT wallet_accounts。
      syncStage = '初始化錢包';
      const { data: walletData, error: walletError } = await client.rpc(
        'ensure_wallet_account'
      );
      if (walletError) {
        throw new Error(
          '初始化錢包失敗：' + walletError.message +
          '。請確認已在 Supabase 建立 public.ensure_wallet_account() 函式。'
        );
      }

      const walletRow = Array.isArray(walletData) ? walletData[0] : walletData;
      if (!walletRow || walletRow.diamonds == null || walletRow.silver_coins == null) {
        throw new Error('錢包初始化函式沒有回傳有效的鑽石與銀幣餘額。');
      }

      // 避免較早發出的請求覆蓋另一個已登入帳號。
      syncStage = '更新登入狀態';
      if (state.account?.uid !== user.id) return;
      state.account = {
        ...state.account,
        nickname: profile.nickname || state.account.nickname,
        handle: profile.handle || '',
        avatar: profile.avatar_url || '',
        profileReady: true,
        bio: profile.bio || '',
        birthdate: privateProfile.birthdate || '',
        personas: Array.isArray(privateProfile.persona_presets) ? privateProfile.persona_presets : [],
        diamonds: Number(walletRow.diamonds ?? 0),
        silver: Number(walletRow.silver_coins ?? 0)
      };
      state.signedIn = true;
      persist();
      render();
    } catch (error) {
      console.error('PersonaX 資料庫同步失敗（階段：' + syncStage + '）：', error);
      // 取消申請後的刷新由呼叫端顯示專屬訊息；一般登入流程仍使用原本提示。
      if (throwOnError) throw error;
      if (state.account?.uid === user.id) {
        const detail = String(error?.message || '未知錯誤').replace(/\s+/g, ' ').slice(0, 180);
        toast('已登入，但同步在「' + syncStage + '」階段失敗：' + detail);
      }
    }
  }

          opening: story?.opening_message || '', race: row.race || '',
          privateInfo: '', style: row.style || '',
          personalityProfile: normalizePersonalityProfile(row.personality_profile),

          tags: Array.isArray(row.tags) ? row.tags : [],

          rightsConfirmed: false, cloudPublic: true

      });

      const publicIds = new Set(publicCharacters.map(character => character.id));

      const keepLocal = state.characters.filter(character =>

  async function loadSupabaseCharacters(user) {
    const client = window.mySupabase;
    if (!client || !user?.id) return;
    try {
      const { data: authResult, error: authError } = await client.auth.getUser();
      if (authError || authResult?.user?.id !== user.id) return;

      // 先讀取雲端角色；將此裝置上屬於目前帳號、但雲端尚不存在的舊角色補上雲端。
      // 這可修復舊版匯入只存 localStorage 的資料；不會上傳其他帳號的本機角色。
      let { data: rows, error } = await client
        .from('characters')
        .select('id, author_id, name, gender, age, avatar_url, avatar_video_path, is_nsfw, visibility, review_status, intro, race, style, personality_profile, tags, phone_settings, nsfw_workplace_warning, created_at, first_published_at, latest_eligible, rights_confirmed, deleted_at, deletion_reason')
        .eq('author_id', user.id)
        .order('created_at', { ascending: false });
      if (error) throw new Error('讀取雲端角色失敗：' + error.message);

      if (state.account?.uid !== user.id) return;
      const localOwned = state.characters.filter(c => c.authorId === user.id && c.id);
      const cloudIdsBeforeMigration = new Set((rows || []).map(row => row.id));
      const localOnly = localOwned.filter(c => !cloudIdsBeforeMigration.has(c.id));
      const migrationErrors = [];
      let migratedCount = 0;

      for (const character of localOnly) {
        try {
          const result = await saveSupabaseCharacter(character, user.id);
          migratedCount++;
          if (result?.storyError) migrationErrors.push(character.name + '：' + result.storyError);
        } catch (migrationError) {
          migrationErrors.push((character.name || '未命名角色') + '：' + migrationError.message);
        }
      }

      // 補傳後重新讀取，以資料庫結果為準；失敗的本機角色仍會保留在本機。
      if (migratedCount > 0) {
        const refreshed = await client
          .from('characters')
          .select('id, author_id, name, gender, age, avatar_url, visibility, review_status, intro, race, style, personality_profile, tags, phone_settings, nsfw_workplace_warning, created_at, first_published_at, latest_eligible, rights_confirmed, deleted_at, deletion_reason')
          .eq('author_id', user.id)
          .order('created_at', { ascending: false });
        if (refreshed.error) throw new Error('角色補傳後重新讀取失敗：' + refreshed.error.message);
        rows = refreshed.data || [];
      }

const ids = (rows || []).map(row => row.id);
      // 隱藏設定只從作者專用資料表讀取，不再從公開 characters 資料列取得。
      const privateInfoById = new Map();
      if (ids.length) {
        const privateInfoResult = await client.from('character_private_info')
          .select('character_id, private_info')
          .eq('author_id', user.id)
          .in('character_id', ids);
        if (privateInfoResult.error) {
          throw new Error('讀取角色隱藏設定失敗：' + privateInfoResult.error.message);
        }
        for (const item of privateInfoResult.data || []) {
          privateInfoById.set(item.character_id, item.private_info || '');
        }
      }
      // 私密角色不會經過公開角色載入器；在作者自己的角色載入流程也補齊作者 profile。
      const authorIds = [...new Set((rows || []).map(row => row.author_id).filter(Boolean))];
      if (authorIds.length) {
        const profileResult = await client.from('public_profiles')
          .select('id, handle, nickname, avatar_url, bio, follower_count')
          .in('id', authorIds);
        if (profileResult.error) {
          console.warn('私密角色作者資料載入失敗：', profileResult.error.message);
        } else {
          for (const profile of profileResult.data || []) {
            state.authors[profile.id] = {
              uid:profile.id, handle:profile.handle || '',
              nickname:profile.nickname || profile.handle || 'PersonaX 使用者',
              avatar:profile.avatar_url || '', bio:profile.bio || '',
              fans:Number(profile.follower_count || 0)
            };
          }
        }
      }
      let stories = [];
      if (ids.length) {
        const result = await client
          .from('character_stories')
          .select('id, character_id, story_name, description, opening_message, visibility, created_at')
          .in('character_id', ids)
          .order('created_at', { ascending: false });
        if (result.error) throw new Error('讀取雲端角色故事失敗：' + result.error.message);
        stories = result.data || [];
      }
      const latestStory = new Map();
      for (const story of stories) {
        if (!latestStory.has(story.character_id)) latestStory.set(story.character_id, story);
      }
      if (state.account?.uid !== user.id) return;
      const localOwnedForMerge = state.characters.filter(c => c.authorId === user.id);
      const cloudCharacters = (rows || []).filter(row => !row.deleted_at).map(row => {
        const local = localOwnedForMerge.find(c => c.id === row.id) || {};
        const story = latestStory.get(row.id);
        return {
          ...local,
          id: row.id,
          name: row.name || local.name || '未命名角色',
          gender: row.gender || local.gender || 'ambiguous',
          age: row.age == null ? (local.age || '') : String(row.age),
          image: row.avatar_url || local.image || '',
          avatarVideoPath:row.avatar_video_path || local.avatarVideoPath || '',
          visibility: row.visibility || 'private',
          intro: row.intro ?? local.intro ?? '',
          opening: story?.opening_message ?? local.opening ?? '',
          race: row.race ?? local.race ?? '',
          privateInfo: privateInfoById.get(row.id) ?? local.privateInfo ?? '',
          style: row.style ?? local.style ?? '',
          personalityProfile: normalizePersonalityProfile(row.personality_profile ?? local.personalityProfile),
          phoneSettings:row.phone_settings && typeof row.phone_settings==='object' ? row.phone_settings : (local.phoneSettings || {}),
          nsfwWorkplaceWarning:row.nsfw_workplace_warning === true,
          tags: Array.isArray(row.tags) ? row.tags : (local.tags || []),
          authorId: row.author_id,
          owner: true,
          chats: local.chats || '0',
          users: local.users ?? null,
          createdAt: row.created_at ? new Date(row.created_at).getTime() : (local.createdAt || Date.now()),
          firstPublishedAt: row.first_published_at ? new Date(row.first_published_at).getTime() : null,
          latestEligible: row.latest_eligible !== false,
          rightsConfirmed: row.rights_confirmed === true
        };
      });
      const cloudIds = new Set((rows || []).map(row => row.id));
      state.characters = [
        ...cloudCharacters,
        ...state.characters.filter(c => c.authorId !== user.id || !cloudIds.has(c.id))
      ];
      persist();
      render();
      if (migrationErrors.length) {
        console.warn('PersonaX 舊角色補傳有部分失敗：', migrationErrors);
        toast('有些本機角色尚未同步：' + migrationErrors.slice(0, 2).join('；'));
      } else if (migratedCount > 0) {
        toast('已將 ' + migratedCount + ' 個本機角色補同步到雲端。');
      }
    } catch (error) {
      console.error('PersonaX 雲端角色載入失敗：', error);
      if (state.account?.uid === user.id) {
        toast('登入成功，但雲端角色載入失敗：' + error.message);
      }
    }
  }

  async function uploadCharacterAvatarVideo(file,userId,characterId){
  const client=window.mySupabase;
  if(!client||!userId||!characterId)throw new Error('請先登入再上傳角色影片。');
  if(file.size>15*1024*1024)throw new Error('影片不可超過 15 MB。');
  const ext=({'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'})[file.type];
  if(!ext)throw new Error('影片格式僅支援 MP4、WebM 或 MOV。');
  const path=userId+'/'+characterId+'/'+id()+'.'+ext;
  const {error}=await client.storage.from('character-avatar-videos').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'3600'});
  if(error)throw new Error('角色影片上傳失敗：'+error.message);
  return path;
}
async function hydrateCharacterVideo(video){
  const path=video?.dataset?.characterVideo;
  if(!path||!window.mySupabase||video.dataset.videoHydrated==='true')return;
  // 所有角色影片（卡片與詳情頁）都固定靜音，並移除原生控制列。
  video.controls=false;
  video.removeAttribute('controls');
  video.muted=true;
  video.defaultMuted=true;
  video.volume=0;
  if(video.dataset.muteLock!=='true'){
    video.dataset.muteLock='true';
    video.addEventListener('volumechange',()=>{
      if(!video.muted||video.volume!==0){video.muted=true;video.volume=0;}
    });
  }
  video.dataset.videoHydrated='true';
  const {data,error}=await window.mySupabase.storage.from('character-avatar-videos').createSignedUrl(path,300);
  if(error||!data?.signedUrl||!video.isConnected){video.dataset.videoHydrated='false';console.warn('角色影片載入失敗',error);return;}
  video.src=data.signedUrl;video.load();
  if(video.hasAttribute('autoplay'))video.play().catch(()=>{});
}
function normalizePersonalityProfile(value) {
  const source=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  const limits={coreTraits:500,values:500,speechStyle:500,behaviorRules:700,likes:300,dislikes:300,boundaries:500,relationshipPacing:300};
  return Object.fromEntries(Object.entries(limits).map(([key,max])=>[key,String(source[key]??'').trim().slice(0,max)]));
}

async function saveSupabaseCharacter(character, expectedUserId) {
    const client = window.mySupabase;
    if (!client || !expectedUserId) throw new Error('請先使用 Google 帳號登入，再儲存角色。');
    character.tags = validateCharacterTags(Array.isArray(character.tags) ? character.tags : []);

    // 先用登入者專屬 RPC 取得生日，避免未成年作者勾選 NSFW 後才收到泛用的 RLS 寫入錯誤。
    // 資料庫 INSERT／UPDATE 年齡政策仍是最終安全防線。
    if (character.isNSFW === true) {
      const { data: privateProfile, error: privateProfileError } = await client.rpc('get_my_private_profile_data');
      if (privateProfileError) throw new Error('讀取年齡資格失敗，請重新登入後再試。');
      const birthdate = String(privateProfile?.birthdate || '');
      const today = new Date();
      const cutoff = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
      const cutoffDate = cutoff.getFullYear() + '-' + String(cutoff.getMonth()+1).padStart(2,'0') + '-' + String(cutoff.getDate()).padStart(2,'0');
      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(birthdate) || birthdate > cutoffDate) {
        throw new Error('[年齡未達許可] 此帳號未滿 18 歲或尚未完成生日驗證，無法建立或修改 NSFW 角色。');
      }
    }

    const { data: authResult, error: authError } = await client.auth.getUser();
    if (authError || authResult?.user?.id !== expectedUserId) {
      throw new Error('登入狀態驗證失敗，請重新登入後再儲存角色。');
    }

    const ageValue = String(character.age ?? '').trim();
    const age = ageValue && Number.isFinite(Number(ageValue))
      ? Number.parseInt(ageValue, 10)
      : null;

    const nextVisibility = character.visibility === 'public' ? 'public' : 'private';
    // 公開必須由創作者明確勾選權利確認；私密草稿不會自動視為已確認。
    const rightsConfirmed = character.rightsConfirmed === true || character.rightsConfirmed === 'true';
    if (nextVisibility === 'public' && !rightsConfirmed) {
      throw new Error('公開角色前，請先勾選「我確認角色沒有侵犯智慧財產權、形象或其他任何權利。」');
    }
    // 先讀取既有上架紀錄，避免 upsert 把首次公開時間或資格重設。
    const { data: existingCharacter, error: existingCharacterError } = await client
      .from('characters')
      .select('visibility, first_published_at, latest_eligible, rights_confirmed, nsfw_workplace_warning, is_nsfw, deleted_at')
      .eq('id', character.id)
      .eq('author_id', expectedUserId)
      .maybeSingle();
    if (existingCharacterError) {
      throw new Error('讀取角色上架紀錄失敗：' + existingCharacterError.message);
    }
    if (existingCharacter?.deleted_at) {
      throw new Error('此角色已被刪除，不能重新公開或修改。若要創作新版本，請建立新角色。');
    }

    const firstPublishedAt = existingCharacter?.first_published_at ||
      (nextVisibility === 'public' ? new Date().toISOString() : null);
    // 「最新角色」資格只看首次公開時間的 24 小時窗口。
    // 轉私密不重設首次公開時間；24 小時內重新公開仍可回到最新，超過期限則不可。
    const firstPublishedMs = firstPublishedAt ? new Date(firstPublishedAt).getTime() : NaN;
    const latestEligible = Number.isFinite(firstPublishedMs) &&
      Date.now() - firstPublishedMs >= 0 &&
      Date.now() - firstPublishedMs <= DAY;

    const row = {
      id: character.id,
      author_id: expectedUserId,
      name: String(character.name || '').trim(),
      title: null,
      gender: character.gender || null,
      age,
      avatar_url: character.image || null,
      avatar_video_path: character.avatarVideoPath || null,
      visibility: nextVisibility,
      review_status: nextVisibility === 'public' ? 'approved' : 'draft',
      first_published_at: firstPublishedAt,
      latest_eligible: latestEligible,
      rights_confirmed: rightsConfirmed || existingCharacter?.rights_confirmed === true,
      intro: character.intro || '',
      race: character.race || '',
      style: character.style || '',
      personality_profile: normalizePersonalityProfile(character.personalityProfile),
      phone_settings:character.phoneSettings && typeof character.phoneSettings==='object' ? {noticePrompts:(Array.isArray(character.phoneSettings.noticePrompts)?character.phoneSettings.noticePrompts:Array.isArray(character.phoneSettings.notices)?character.phoneSettings.notices:[]).slice(0,8).map(x=>String(x).slice(0,150))} : {},
      nsfw_workplace_warning: character.nsfwWorkplaceWarning === true,
      is_nsfw: character.isNSFW === true,
      tags: Array.isArray(character.tags) ? character.tags : []
    };

    const { error: characterError } = await client
      .from('characters')
      .upsert(row, { onConflict: 'id' });
if (characterError) {
      throw new Error('角色資料寫入 Supabase 失敗：' + characterError.message);
    }
    // 隱藏設定獨立儲存，characters 公開資料列永遠不包含 privateInfo。
    const { error: privateInfoError } = await client
      .from('character_private_info')
      .upsert({
        character_id: character.id,
        author_id: expectedUserId,

      .eq('id',s.id).eq('user_id',localUser.uid).maybeSingle();
    if (existing.error) throw new Error('檢查既有聊天失敗：'+existing.error.message);
    if (existing.data) {
      const existingSnapshot = existing.data.character_snapshot;
      if (existingSnapshot?.id && existingSnapshot.id !== s.characterId) {
        throw new Error('雲端既有聊天的角色快照與角色 ID 不一致，已停止同步以避免覆寫錯誤角色資料。');
      }

async function loadCloudChatSessions(user) {
  const client = window.mySupabase;
  if (!client || !user?.id) return;
  try {
    const { data: authResult, error: authError } = await client.auth.getUser();
    if (authError || authResult?.user?.id !== user.id) return;
    const { data: rows, error } = await client.from('chat_sessions')
      .select('id,user_id,character_id,character_name,status,created_at,updated_at,character_snapshot,session_data')
      .eq('user_id', user.id).is('deleted_at', null).order('updated_at', { ascending:false });
    if (error) throw new Error(error.message);
    if (state.account?.uid !== user.id) return;
    const sessions = rows || [];
    const activeSessionIds = new Set(sessions.map(row => row.id));
    let changed = false;
    // 雲端清單不再包含的本帳號聊天，可能已被軟刪除；清掉過期本機副本，避免刷新後復活。
    for (const [sessionId, cached] of Object.entries(state.sessions || {})) {
      if (cached?.cloudOwned && cached.cloudOwnerUid === user.id && !activeSessionIds.has(sessionId)) {
        delete state.sessions[sessionId];
        changed = true;
      }
    }
    if (!sessions.length) {
      if (changed) { persist(); render(); }
      return;
    }
    const sessionIds = sessions.map(row => row.id).filter(isUuid);
    let messageRows = [];
    if (sessionIds.length) {
      const result = await client.from('chat_messages').select('id,session_id,role,content,created_at')
        .in('session_id', sessionIds).is('deleted_at', null).order('created_at', { ascending:true });
      if (result.error) throw new Error(result.error.message);
      messageRows = result.data || [];
    }
    if (state.account?.uid !== user.id) return;

    // 私密／已下架角色不會出現在公開角色清單；從既有聊天快照恢復作者 ID，
    // 並只讀取作者公開的 profiles 欄位，讓其他帳號也能正確顯示 BY 名稱。
    const snapshotAuthorIds = [...new Set(sessions
      .map(row => row.character_snapshot && typeof row.character_snapshot === 'object'
        ? row.character_snapshot.authorId : null)
      .filter(Boolean))];
    if (snapshotAuthorIds.length) {
      const profileResult = await client.from('public_profiles')
        .select('id, handle, nickname, avatar_url, bio, follower_count')
        .in('id', snapshotAuthorIds);
      // 帳號可能在 profiles 查詢等待期間切換；舊帳號請求不得再寫入目前畫面狀態。
      if (state.account?.uid !== user.id) return;
      if (profileResult.error) {
        console.warn('既有聊天作者資料載入失敗：', profileResult.error.message);
      } else {
        for (const profile of profileResult.data || []) {
          state.authors[profile.id] = {
            uid:profile.id, handle:profile.handle || '',
            nickname:profile.nickname || profile.handle || 'PersonaX 使用者',
            avatar:profile.avatar_url || '', bio:profile.bio || '',
            fans:Number(profile.follower_count || 0)
          };
        }
      }
    }

    const bySession = new Map();
    for (const row of messageRows) {
      if (!bySession.has(row.session_id)) bySession.set(row.session_id, []);
      bySession.get(row.session_id).push({id:row.id, role:row.role === 'user' ? 'user' : 'assistant',
        text:row.content || '', at:row.created_at ? new Date(row.created_at).getTime() : Date.now()});
    }
    for (const row of sessions) {
      if (!isUuid(row.id) || !isUuid(row.character_id)) continue;
      const data = row.session_data && typeof row.session_data === 'object' ? row.session_data : {};
      const snapshot = row.character_snapshot && typeof row.character_snapshot === 'object' ? row.character_snapshot : {};
      // Never hydrate a chat with a snapshot belonging to a different role.
      // The server also rejects this metadata before billing; fail closed in the UI too.
      if (snapshot.id && snapshot.id !== row.character_id) {
        console.error('雲端聊天角色快照 ID 不一致，已略過此聊天：', row.id);
        continue;
      }
      const existing = state.sessions[row.id];
      const cloudMessages = bySession.get(row.id) || [];
      const roleplayMeta = data.roleplayMeta && typeof data.roleplayMeta === 'object' ? data.roleplayMeta : {};
      for (const message of cloudMessages) {
        const metadata = roleplayMeta[message.id];
        if (metadata && typeof metadata === 'object') Object.assign(message, metadata);
      }
      state.sessions[row.id] = {
        ...(existing || {}), id:row.id, characterId:row.character_id,
        characterName:row.character_name || snapshot.name || '角色',
        name:data.name || '', archived:data.archived === true || row.status === 'archived',
        hidden:data.hidden === true, pinned:data.pinned === true,
        startedAt:Number(data.startedAt) || (row.created_at ? new Date(row.created_at).getTime() : Date.now()),
        archivedAt:data.archivedAt || null, persona:data.persona || '',
        personaCustom: data.personaCustom === true || (data.personaCustom !== false && !!data.persona),
        suggestions:data.suggestions !== false, background:data.background || 'avatar',
        memories:Array.isArray(data.memories) ? data.memories : [],
        album:Array.isArray(data.album) ? data.album : [],
        pendingTurn:data.pendingTurn &&
          isUuid(data.pendingTurn.turnId) &&
          isUuid(data.pendingTurn.userMessageId) &&
          isUuid(data.pendingTurn.assistantMessageId)
          ? {
              turnId:data.pendingTurn.turnId,
              userMessageId:data.pendingTurn.userMessageId,
              assistantMessageId:data.pendingTurn.assistantMessageId,
              createdAt:Number(data.pendingTurn.createdAt) || Date.now()
            }
          : null,
        messages:(()=>{
          const opening=data.openingMessage && String(data.openingMessage.text || '').trim()
            ? {id:'opening-'+row.id,role:'assistant',text:String(data.openingMessage.text),at:Number(data.openingMessage.at)||Date.now()}
            : null;
          const firstCloud=cloudMessages[0];
          const alreadyStored=opening && firstCloud?.role==='assistant' && firstCloud.text===opening.text;
          return opening && !alreadyStored ? [opening,...cloudMessages] : cloudMessages;
        })(),
        initialOpeningMessage:data.openingMessage && String(data.openingMessage.text || '').trim()
          ? {text:String(data.openingMessage.text),at:Number(data.openingMessage.at)||Date.now()}
          : null,
        cloudOwned:true, cloudOwnerUid:user.id, cloudCharacterSnapshot:snapshot
      };
      if (snapshot.id === row.character_id) {
        const existingCharacterIndex = state.characters.findIndex(character => character.id === row.character_id);
        if (existingCharacterIndex >= 0) {
          const existingCharacter = state.characters[existingCharacterIndex];
          // 既有本機角色資料若缺作者 ID，以雲端聊天快照補齊，不覆蓋已存在的作者 ID。
          if (!existingCharacter.authorId && snapshot.authorId) {
            state.characters[existingCharacterIndex] = {
              ...existingCharacter, authorId:snapshot.authorId
            };
          }
        } else {
          state.characters.push({...snapshot, id:row.character_id, name:snapshot.name || row.character_name || '角色',
            visibility:'private', reviewStatus:'draft', authorId:snapshot.authorId || '', owner:false, cloudSnapshotOnly:true});
        }
      }
      changed = true;
    }
    if (changed) { persist(); render(); }
  } catch (error) {
    console.error('雲端聊天載入失敗：', error);
    if (state.account?.uid === user.id) toast('雲端聊天載入失敗：' + error.message);
  }
}

async function saveChatSessionSafely(s) {
  try {
    const saved = await saveChatSessionToCloud(s);
    return saved;
  } catch (error) {
    console.error('PersonaX 聊天同步失敗：',error);
    toast(error.message || '聊天已保存在本機，但雲端同步失敗。');
    return false;
  }
}

async function refreshWalletBalance() {
  const user = currentUser();
  if (!user || !window.mySupabase) return;
  const { data, error } = await window.mySupabase.rpc('ensure_wallet_account');
  if (error) {
    console.warn('聊天扣款後錢包餘額同步失敗：', error.message);
    return;
  }
  const row = Array.isArray(data) ? data[0] : data;

async function clearCloudPendingTurn(s) {
  const user = currentUser();
  const client = window.mySupabase;
  if (!s || !user || !client || !s.cloudOwned || s.cloudOwnerUid !== user.uid) return;
  const { error } = await client.from('chat_sessions')
    .update({session_data:chatSessionData(s),updated_at:new Date().toISOString()})
    .eq('id',s.id).eq('user_id',user.uid);
  if (error) console.warn('清除雲端待處理回合標記失敗：',error.message);

async function runPendingChatTurn(s) {
  const turn = s?.pendingTurn;
  const user = currentUser();
  const client = window.mySupabase;
  if (!turn || !user || !client) return;

  let result = null;
  let invokeError = null;
  try {
    const response = await client.functions.invoke('chat-turn', {
      body: {
        turnId: turn.turnId,
        sessionId: s.id,
        userMessageId: turn.userMessageId,
        assistantMessageId: turn.assistantMessageId
      }
    });
    result = response.data;
    invokeError = response.error;
    if (invokeError && !result) {
      const context = invokeError.context;
      if (context && typeof context.json === 'function') {
        try { result = await context.json(); } catch (_) {}
      }
    }
  } catch (error) {
    invokeError = error;
  }

  if (result?.status === 'insufficient_funds' || result?.error === 'insufficient_funds') {
    // A failed wallet reservation must not leave a USER message that looks sent.
    s.messages = (s.messages || []).filter(message =>
      message.id !== turn.userMessageId && message.id !== turn.assistantMessageId
    );
    delete s.pendingTurn;
    persist();
    renderMessages();
    await saveChatSessionSafely(s);
    await clearCloudPendingTurn(s);
    await refreshWalletBalance();
    openInsufficientFundsDialog('single');
    return;
  }

  if (
    result?.status === 'refunded' ||
    result?.error === 'assistant_persistence_failed' ||
    result?.error === 'turn_already_refunded'
  ) {
    delete s.pendingTurn;
    persist();
    renderMessages();
    await saveChatSessionSafely(s);
    await clearCloudPendingTurn(s);
    await refreshWalletBalance();
    toast('這次回覆未能保存，系統已退回本回合預扣的銀幣／鑽石。');
    return;
  }

  if (
    result?.error === 'chat_session_character_id_invalid' ||
    result?.error === 'chat_session_character_snapshot_mismatch'
  ) {
    // These server-side identity guards run before reserve_chat_turn, so no
    // charge was reserved. Stop retrying this logical turn and preserve the
    // message for diagnosis instead of leaving a permanently pending spinner.
    delete s.pendingTurn;
    persist();
    renderMessages();
    await clearCloudPendingTurn(s);
    toast('聊天角色資料不一致，本回合尚未扣款。請重新整理聊天；若持續發生，請先不要重送並回報問題。');
    return;
  }

  if (
    result?.error === 'user_message_not_found' ||
    result?.error === 'chat_session_not_owned_or_active' ||
    result?.error === 'account_not_active' ||
    result?.error === 'wallet_not_ready'
  ) {
    s.messages = s.messages.filter(message => message.id !== turn.userMessageId);
    delete s.pendingTurn;
    persist();
    await clearCloudPendingTurn(s);
    renderMessages();
    toast('這則訊息尚未進入扣款流程，請重新輸入後再送出。');
    return;
  }

  if (result?.status !== 'settled' || invokeError) {
    // Keep stable IDs locally. The next send action retries the same logical turn;
    // it must not append another user message or create another charge.
    persist();
    const detail=String(result?.message||result?.error||invokeError?.message||'回覆服務未回傳可確認的結果').replace(/\s+/g,' ').slice(0,180);
    const status=Number(invokeError?.context?.status||invokeError?.status||0);
    toast('訊息已保存，但角色回覆未完成：'+detail+(status?'（HTTP '+status+'）':'')+'。再次按送出會沿用同一回合，不會新增訊息或重複扣款。');
    return;
  }

  const reply = result.assistantMessage;
  if (!reply?.id || !String(reply.content || '').trim()) {
    persist();
    toast('扣款狀態已回報成功，但回覆資料尚待確認；請勿重複發送。');
    return;
  }
  // A settled response must belong to the exact assistant message reserved for
  // this pending turn. Never attach an unrelated reply to the current chat.
  if (reply.id !== turn.assistantMessageId) {
    persist();
    console.error('聊天回覆 ID 與待處理回合不一致，已保留回合供查核。', {
      expected:turn.assistantMessageId,
      received:reply.id,
      sessionId:s.id
    });
    toast('回覆識別資料不一致，已保留本回合狀態；請勿重複發送，稍後再試或回報問題。');
    return;
  }

  if (!s.messages.some(message => message.id === reply.id)) {
    s.messages.push({
      id:reply.id,
      role:'assistant',
      text:String(reply.content),
      at:Date.now()
    });
  }
  delete s.pendingTurn;

  const users = s.messages.filter(message => message.role === 'user');
  if (users.length && users.length % 5 === 0) {
    const snippets = users.slice(-5).map(message => [...message.text].slice(0,7).join('')).join('、');
    addMemory(s,[...('本輪對話摘錄：'+snippets+'。')].slice(0,50).join(''));
  }

  persist();
  renderMessages();
  await refreshWalletBalance();

  // The server has already durably saved and settled the assistant reply.
  // A later session-metadata sync failure must never trigger a refund.
  const metadataSaved = await saveChatSessionSafely(s);
  if (!metadataSaved) {
    toast('回覆與扣款已完成，但聊天附加資料同步失敗；回覆不會因此重複扣款。');
  }
}

function toast(text) {
  clearTimeout(toastTimer);
  const notice = $('toast');
  const modal = $('modal');
  // Native dialog occupies the browser top layer, so place notifications inside it when open.
  if (modal?.open && notice.parentElement !== modal) modal.appendChild(notice);
  else if (!modal?.open && notice.parentElement !== document.body) document.body.appendChild(notice);
  notice.textContent = text;
  notice.classList.remove('hidden');
  toastTimer = setTimeout(() => notice.classList.add('hidden'),3500);
}

function safeImage(value) {
  const text = String(value || '');
  if (/^data:image\/(?:png|jpeg|webp);base64,/.test(text)) return text;
  try {
