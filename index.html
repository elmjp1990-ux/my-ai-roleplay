<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonaX - AI 沉浸角色扮演平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- ==================== 頂部導覽列 (Header) ==================== -->
  <header class="h-14 border-b border-slate-800/80 bg-slate-900/90 px-4 flex justify-between items-center backdrop-blur z-20 shrink-0">
    <div class="flex items-center gap-2">
      <button onclick="toggleSidebarCollapse()" class="text-slate-400 hover:text-white text-lg p-1">☰</button>
      <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-semibold">SaaS RP Pro</span>
    </div>
    
    <div class="flex items-center gap-3">
      <div id="userDiamondBar" class="hidden items-center gap-1.5 bg-slate-800/80 border border-slate-700/60 px-3 py-1 rounded-full text-xs font-semibold text-amber-400">
        💎 <span id="diamondBalance">1250</span> 鑽石
        <button onclick="openTaskModal()" class="ml-1 text-[10px] bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/40">賺鑽石</button>
      </div>

      <button onclick="openAuthModal()" id="authBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/20">
        登入 / 註冊
      </button>
    </div>
  </header>

  <!-- ==================== 主體佈局 ==================== -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- 👈 可收合左側導覽列 (Sidebar) -->
    <aside id="sidebar" class="w-60 border-r border-slate-800/80 bg-slate-900/90 flex flex-col shrink-0 transition-all duration-300 z-10 overflow-hidden">
      
      <!-- 1. 網站 LOGO 與 名稱 (收合按鈕) -->
      <div class="p-3.5 border-b border-slate-800/80 flex items-center justify-between shrink-0">
        <div onclick="switchTab('lobby')" class="flex items-center gap-2.5 cursor-pointer overflow-hidden">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shrink-0 text-sm">
            PX
          </div>
          <span class="sidebar-text font-bold text-base text-white tracking-wider whitespace-nowrap">PersonaX</span>
        </div>
        <button onclick="toggleSidebarCollapse()" class="sidebar-text text-slate-400 hover:text-white text-xs p-1 rounded hover:bg-slate-800 transition">
          ◀
        </button>
      </div>

      <!-- 選單按鈕列表 (收合後僅顯示圖片/Icon) -->
      <div class="flex-1 py-3 space-y-1 text-xs">
        <!-- 3. 探索角色 -->
        <button onclick="switchTab('lobby')" id="nav-lobby" title="探索角色" class="w-full text-left px-4 py-3 hover:bg-slate-800/80 text-slate-200 font-medium flex items-center gap-3 transition bg-slate-800/50 border-r-2 border-indigo-500">
          <span class="text-base shrink-0">🏠</span>
          <span class="sidebar-text whitespace-nowrap">探索角色</span>
        </button>

        <!-- 4. 開始暢聊 -->
        <button onclick="switchTab('chat')" id="nav-chat" title="開始暢聊" class="w-full text-left px-4 py-3 hover:bg-slate-800/80 text-slate-400 font-medium flex items-center gap-3 transition">
          <span class="text-base shrink-0">💬</span>
          <span class="sidebar-text whitespace-nowrap">開始暢聊</span>
        </button>

        <!-- 創建角色 (D-001) -->
        <button onclick="openCreatorChatModal()" title="創建角色" class="w-full text-left px-4 py-3 hover:bg-slate-800/80 text-slate-400 font-medium flex items-center gap-3 transition">
          <span class="text-base shrink-0">🧙‍♂️</span>
          <span class="sidebar-text whitespace-nowrap">創建角色</span>
        </button>

        <!-- 系統通知 -->
        <button onclick="switchTab('notifications')" id="nav-notif" title="系統通知" class="w-full text-left px-4 py-3 hover:bg-slate-800/80 text-slate-400 font-medium flex items-center gap-3 transition">
          <span class="text-base shrink-0">🔔</span>
          <span class="sidebar-text whitespace-nowrap">系統通知</span>
        </button>

        <!-- 吾愛角色 -->
        <button onclick="switchTab('favorites')" id="nav-fav" title="吾愛角色" class="w-full text-left px-4 py-3 hover:bg-slate-800/80 text-slate-400 font-medium flex items-center gap-3 transition">
          <span class="text-base shrink-0">💖</span>
          <span class="sidebar-text whitespace-nowrap">吾愛角色</span>
        </button>
      </div>

      <div class="p-3 border-t border-slate-800/80 text-[10px] text-slate-500 text-center sidebar-text whitespace-nowrap">
        PersonaX System v2.5
      </div>
    </aside>

    <!-- ==================== 頁面一：主畫面/可搜尋角色 (Lobby) ==================== -->
    <div id="page-lobby" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-950">
      
      <!-- 活動輪播 Banner -->
      <div class="relative w-full h-40 md:h-48 rounded-2xl bg-gradient-to-r from-indigo-950 via-purple-950 to-slate-900 border border-indigo-500/20 flex items-center px-6 overflow-hidden shadow-2xl">
        <div class="z-10 max-w-xl">
          <span class="bg-indigo-500/20 text-indigo-300 text-[11px] font-semibold px-2.5 py-1 rounded-full border border-indigo-500/30">📢 最新活動公告 (Banner 1/3)</span>
          <h2 class="text-xl md:text-2xl font-bold text-white mt-2">獨家首發：封以恆 CEO (33歲深情版)</h2>
          <p class="text-xs text-slate-300 mt-1 leading-relaxed">解鎖極致冷峻與掌控感！支援雙重 User 人設切換與自動記憶摘要。</p>
          <button onclick="quickStartFeng()" class="mt-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-lg shadow-indigo-600/30">立即體驗對話 ➔</button>
        </div>
      </div>

      <!-- 可搜尋角色列 -->
      <div class="flex justify-between items-center flex-wrap gap-3">
        <div class="flex-1 min-w-[240px]">
          <input type="text" placeholder="🔍 搜尋/可直接輸入標籤名稱或者角色名稱進行篩選..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border
