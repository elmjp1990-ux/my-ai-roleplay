/* Cloud wallet ledger: read the authoritative transaction journal from Supabase. */
async function loadWalletLedger(currency) {
  walletLedgerLoadError = '';
  const uid = state.account?.uid;
  const client = window.mySupabase;
  if (!uid || !client) return false;

  const { data, error } = await client
    .from('wallet_transactions')
    .select('id, currency_type, amount, biz_type, reference_id, created_at')
    .eq('user_id', uid)
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) {
    console.error('讀取錢包花費日誌失敗：', error);
    walletLedgerLoadError = currency;
    toast('花費日誌讀取失敗，請稍後再試。');
    return false;
  }

  const selectedType = currency === 'silver' ? 'silver_coins' : 'diamonds';
  let runningBalance = Number(currency === 'silver'
    ? state.account.silver : state.account.diamonds) || 0;
  const rows = (data || []).filter(row => row.currency_type === selectedType);
  const mappedNewestFirst = rows.map(row => {
    const amount = Number(row.amount) || 0;
    const entry = {
      id: row.id,
      currency: row.currency_type === 'silver_coins' ? 'silver' : 'diamond',
      change: amount,
      reason: ({
        signup_bonus: '註冊贈送',
        chat_turn_charge: '聊天回覆扣款',
        chat_turn_refund: '聊天失敗退款',
        daily_checkin: '每日簽到',
        reward_ad: '觀看獎勵廣告',
        purchase: '購買',
        admin_adjustment: '餘額調整'
      })[row.biz_type] || row.biz_type || '錢包交易',
      at: Date.parse(row.created_at) || Date.now(),
      balance: runningBalance,
      referenceId: row.reference_id || null
    };
    runningBalance -= amount;
    return entry;
  });
  state.ledger = [
    ...state.ledger.filter(entry => entry.currency !== (currency === 'silver' ? 'silver' : 'diamond')),
    ...mappedNewestFirst.reverse()
  ];
  return true;
}

        s.messages=s.messages.filter(m=>m.id!==key);
        if (!persist()) {
          s.messages.push(message);
          s.messages.sort((a,b)=>(Number(a.at)||0)-(Number(b.at)||0));
          // 若本機保存失敗，嘗試撤回剛才的雲端軟刪除，避免兩端狀態不一致。
          if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid && window.mySupabase && isUuid(message.id)) {
            const { error: rollbackError } = await window.mySupabase.from('chat_messages')
              .update({deleted_at:null})
              .eq('id',message.id).eq('session_id',s.id).eq('deleted_at',deletedAt);
            if (rollbackError) console.error('訊息刪除回復同步失敗：',rollbackError.message);
          }
          break;
        }
        closeModal();
        renderMessages();
        break;
      }
      case 'photo':openModal('photo',{id:key});break;
      case 'test-chat-memory':
      case 'test-chat-photo':
      case 'clear-chat-test-data': {
        if (!CHAT_DATA_TEST_MODE || !s || !s.cloudOwned ||
            currentUser()?.uid !== s.cloudOwnerUid || !hasUserMessage(s)) {
          return toast('測試工具只適用於已同步且由目前帳號擁有的聊天。');
        }
        const previousMemories=clone(s.memories);
        const previousAlbum=clone(s.album);
        if (action === 'test-chat-memory') {
          const text='[測試資料] PersonaX 回憶同步測試：新增、重新載入與跨裝置保存。';
          if (memorySize(s.memories)+countChars(text)>3000) {
            return toast('回憶容量不足，請先清除部分測試回憶。');
          }
          s.memories.push({id:id(),text,important:false,at:Date.now(),testData:true});
        } else if (action === 'test-chat-photo') {
          const character=sessionCharacter(s);
          const url=safeImage(character?.image);
          if (!url) return toast('目前角色沒有可用的安全圖片網址，無法建立相簿測試項目。');
          s.album.push({id:id(),url,at:Date.now(),testData:true});
        } else {
          s.memories=s.memories.filter(item=>!item.testData);
          s.album=s.album.filter(item=>!item.testData);
        }
        if (!persist()) {
          s.memories=previousMemories;s.album=previousAlbum;
          return;
        }
        const synced=await saveChatSessionSafely(s);
        if (!synced) {
          s.memories=previousMemories;s.album=previousAlbum;
          persist();render();
          toast('測試資料同步失敗，已還原本機內容。');
          break;
        }
        render();
        toast(action==='clear-chat-test-data' ? '測試資料已清除並同步。' :
          '測試資料已寫入雲端；可重新整理後確認是否仍存在。');
        break;
      }
      case 'fullscreen':
        await $('modal').querySelector('img')?.requestFullscreen?.();break;
      case 'edit-profile':profileImage=currentUser()?.avatar || '';openModal('edit-profile');break;
      case 'shop':openModal('shop',{tab:'monthly'});break;
      case 'shop-tab':openModal('shop',{tab:button.dataset.value});break;
      case 'ledger': {
        await loadWalletLedger('diamond');
        openModal('ledger',{currency:'diamond'});
        break;
      }
      case 'ledger-tab': {
        const currency = button.dataset.value;
        await loadWalletLedger(currency);
        openModal('ledger',{currency});
        break;
      }
      case 'ledger-retry': {
        const currency = button.dataset.value === 'silver' ? 'silver' : 'diamond';
        await loadWalletLedger(currency);
        openModal('ledger',{currency});
        break;
      }
      case 'purchases':openModal('purchases');break;
      case 'delete-account':openModal('delete-account');break;
      case 'bug':openModal('bug');break;
      case 'read-all':
        state.notifications.forEach(n=>n.read=true);persist();render();break;
      case 'read-notice': {
        const n=state.notifications.find(n=>n.id===key);
        if (n) n.read=true;
        persist();render();break;
      }
      case 'notice-tab':
        go({page:'notifications',unread:button.dataset.value==='unread'},true);break;
      case 'reply': {
        const c=(state.comments[route.id] || []).find(c=>c.id===key);
        if (!c || c.deleted) break;
        replyId=key;
        $('replyHint').innerHTML=`回覆 @${e(author(c.authorId).nickname)}
          <button data-action="cancel-reply">取消</button>`;
        $('view').querySelector('form[data-form="comment"] textarea').focus();
        break;
      }
      case 'cancel-reply':replyId=null;$('replyHint').textContent='';break;
      case 'comment-like': {
        if (!requireLogin({page:'detail',id:route.id})) break;
        const c=(state.comments[route.id] || []).find(c=>c.id===key);
        if (!c || c.deleted) break;
        c.likes ||= [];
        const i=c.likes.indexOf(currentUser().uid);
        if (i<0)c.likes.push(currentUser().uid);else c.likes.splice(i,1);
        persist();renderComments();break;
      }
      case 'comment-menu':openModal('comment-menu',{id:key});break;
      case 'edit-comment':openModal('edit-comment',{id:key});break;
      case 'delete-comment': {
        const c=(state.comments[route.id] || []).find(c=>c.id===key);
        if (!c || c.authorId!==currentUser()?.uid || !confirm('確定刪除此評論？')) break;
        c.deleted=true;c.text='';c.likes=[];
        persist();closeModal();break;
      }
      case 'translation':openModal('translation');break;
      case 'report':
        if (!requireLogin({page:route.page,id:route.id})) break;
        openModal('report',{id:key,kind:button.dataset.kind});break;
      case 'share': {
        const kind=button.dataset.kind;
        if (kind==='detail') {
          const c=state.characters.find(c=>c.id===key);
          if (c?.visibility!=='public') return toast('私密角色不能公開分享。');
        }
        const url=routeURL({page:kind,id:key}).href;
        if (navigator.share) await navigator.share({title:'PersonaX',url});
        else if (navigator.clipboard && isSecureContext) {
          await navigator.clipboard.writeText(url);
          toast('分享網址已複製。本機角色尚未支援跨裝置讀取。');
        } else {
          showDialog('分享網址',`<input readonly value="${e(url)}">`);
          $('modal').querySelector('input').select();
        }
        break;
      }
    }
  } catch(error) {
    if (error.name !== 'AbortError') toast(error.message || '操作未完成。');
  }
});

/* Form submissions */
document.addEventListener('submit',async event => {
  const form=event.target.closest('[data-form]');
  if (!form) return;
  event.preventDefault();
  const f=new FormData(form);
  const type=form.dataset.form;
  const o=route.overlay || {};
  const s=currentSession();
  const text=String(f.get('text') || '').trim();

  try {
    switch(type) {
      case 'character': {
        const user = currentUser();
        if (!user?.uid || !window.mySupabase) {
          return toast('請先使用 Google 帳號登入，角色才會保存到雲端。');
        }
        const name=String(f.get('name')).trim();
        if (!validName(name)) return toast('角色名字不符合規則。'+NAME_HELP);
        if (!draftImage) return toast('請上傳角色頭像。');
        const intro=String(f.get('intro')).trim();
        const opening=String(f.get('opening')).trim();
        if (!intro || !opening) return toast('介紹與開場白不能留空。');
        const old=state.characters.find(c=>c.id===route.id);
        if (old && !owned(old)) return;
        const c={
          id:old?.id || id(),name,
          gender:String(f.get('gender')),age:String(f.get('age')).trim(),
          race:String(f.get('race')).trim(),intro,opening,
          privateInfo:String(f.get('privateInfo')).trim(),
          style:String(f.get('style')).trim(),
          visibility:String(f.get('visibility')),image:draftImage,
          rightsConfirmed:f.get('rightsConfirmed') === 'on',
          tags:[...draftTags],authorId:user.uid,owner:true,
          chats:old?.chats || '0',users:old?.users ?? null,
          createdAt:old?.createdAt || Date.now()
        };

        // 先寫入雲端；只有角色資料成功後才更新本機畫面狀態。
        const saveResult = await saveSupabaseCharacter(c, user.uid);
        if (old) state.characters[state.characters.indexOf(old)]=c;
        else state.characters.unshift(c);
        persist();
        go({page:'create'});
        if (saveResult.storyError) toast(saveResult.storyError);
        else toast('角色與開場故事已儲存到雲端。');
        break;
      }
      case 'ai': {
        const name=String(f.get('name')).trim();
        const outline=String(f.get('outline')).trim();
        if (!validName(name)) return toast('角色名稱不符合規則。'+NAME_HELP);
        if (!outline) return toast('請輸入故事大綱。');
        if (!confirm('AI尚未串接，這次只建立可編輯草稿，不生成圖片、不扣鑽石。繼續嗎？')) return;
        state.characters.unshift({
          id:id(),name,gender:'ambiguous',age:'',race:'',
          intro:outline.slice(0,2000),
          opening:'**新的故事開始了。**\n「你好。」',
          privateInfo:outline,style:'',tags:[...draftTags],
          image:state.characters.find(c=>c.id==='seed-1')?.image || '',
          authorId:currentUser().uid,owner:true,visibility:'private',rightsConfirmed:false,
          chats:'0',users:null,createdAt:Date.now()
        });
        persist();go({page:'create'});break;
      }
      case 'tags': {
        const chosen=f.getAll('tag');
        if (o.mode!=='explore' && chosen.length>5) return toast('最多選擇5個標籤。');
        if (o.mode==='explore') {
          exploreTags=chosen;
          state.preferences=[...new Set([...state.preferences,...chosen])];
          persist();
        } else {
          draftTags=chosen;
          if (route.page==='editor') {
            const live=$('view').querySelector('form[data-form="character"]');
            if (live) {
              const values=new FormData(live);
              draftCharacter={
                ...(draftCharacter || {}),
                ...Object.fromEntries(values),
                image:draftImage,tags:draftTags
              };
            }
          }
        }
        back();break;
      }
      case 'delete-character': {
        if (String(f.get('confirm'))!=='Delete') return toast('請輸入「Delete」。');
        const c=state.characters.find(c=>c.id===o.id);
        const user=currentUser();
        if (!owned(c) || !user?.uid || !window.mySupabase) return toast('請登入後再刪除角色。');
        if (!confirm('最後確認：將角色下架？公開列表會隱藏，既有聊天保留，新對話將被禁止。')) return;
        const { data: authResult, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authResult?.user?.id !== user.uid) throw new Error('登入狀態驗證失敗，請重新登入。');
        const { data: deletedAt, error: deleteError } = await window.mySupabase
          .rpc('soft_delete_character',{p_character_id:c.id});
        if (deleteError) throw new Error('角色軟刪除失敗：'+deleteError.message);
        if (!deletedAt) throw new Error('資料庫未確認角色下架成功，請重新整理後再試。');
        c.visibility='private';c.deletedAt=deletedAt;c.deletionReason='author_deleted';
        for (const session of Object.values(state.sessions)) {
          if (session.characterId===c.id) {
const { privateInfo: _legacyPrivateInfo, ...safeCloudSnapshot } = session.cloudCharacterSnapshot || {};
            session.cloudCharacterSnapshot={
              ...safeCloudSnapshot,
              id:c.id,name:c.name,gender:c.gender,age:c.age,image:c.image,intro:c.intro,
              opening:c.opening,
              race:c.race,style:c.style,tags:Array.isArray(c.tags)?c.tags:[],
              authorId:c.authorId,visibility:'private',
              firstPublishedAt:c.firstPublishedAt || session.cloudCharacterSnapshot?.firstPublishedAt || null,
              deletedAt
            };
          }
        }
        state.characters=state.characters.filter(item=>item.id!==c.id);
        state.favorites=state.favorites.filter(v=>v!==c.id);
        delete state.comments[c.id];
        persist();go({page:'create'},true);
        toast('角色已下架；既有聊天保留，不能再開啟新對話。');
        break;
      }
      case 'profile': {
        const name=String(f.get('nickname')).trim();
        if (!validName(name)) return toast('暱稱不符合規則。'+NAME_HELP);
        state.account.nickname=name;
        state.account.bio=String(f.get('bio')).trim();
        state.account.avatar=profileImage;
        state.theme=f.get('day') ? 'day' : 'night';
        persist();
        try {
          if (window.mySupabase?.auth) {
            const { data } = await window.mySupabase.auth.getUser();
            if (data?.user?.id === state.account.uid) await saveSupabaseProfile(state.account);
          }
          back();
          toast('個人資料已儲存。');
        } catch (error) {
          console.error(error);
          toast('本機已更新，但資料庫儲存失敗；請檢查 RLS 權限。');
        }
        break;
      }
      case 'delete-account': {
        if (String(f.get('confirm')).trim() !== 'DELETE') return toast('請輸入「DELETE」。');
        if (!state.account?.uid || !window.mySupabase) return toast('請先使用 Google 帳號登入。');
        if (!confirm('確定提出帳號刪除申請？申請後會暫停使用功能，並可在後端設定的期限內取消。')) return;
        const { data: authData, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authData?.user?.id !== state.account.uid) {
          return toast('登入狀態驗證失敗，請重新登入後再試。');
        }
        const { data, error } = await window.mySupabase.rpc('request_account_deletion');
        if (error) throw new Error('申請刪除失敗：' + error.message);
        const requestRow = Array.isArray(data) ? data[0] : data;
        state.account.accountDeletionPending = true;
        state.account.deletionScheduledFor = requestRow?.scheduled_for || null;
        persist();
        openModal('account-deletion-pending', {scheduledFor: state.account.deletionScheduledFor});
        toast('已提出刪除申請；目前不會刪除錢包或修改餘額。');
        break;
      }
      case 'cancel-account-deletion': {
        if (!state.account?.uid || !window.mySupabase) return toast('請先使用原 Google 帳號登入。');
        const { data: authData, error: authError } = await window.mySupabase.auth.getUser();
        if (authError || authData?.user?.id !== state.account.uid) {
          return toast('登入狀態驗證失敗，請重新登入後再試。');
        }
        const { error } = await window.mySupabase.rpc('cancel_account_deletion');
        if (error) throw new Error('取消刪除失敗：' + error.message);
        delete state.account.accountDeletionPending;
        delete state.account.deletionScheduledFor;
        delete state.account.accountDeletionModalDismissed;
        persist();
        go({page:'home'}, true);
        try {
          await loadSupabaseProfileAndWallet(authData.user, true);
        } catch (refreshError) {
          console.error('帳號已恢復，但個人資料／錢包重新載入失敗：', refreshError);
          toast('已取消刪除申請，但個人資料或錢包重新載入失敗。請重新整理頁面；目前不需要重新申請刪除。');
          break;
        }
        toast('已取消刪除申請，原帳號與錢包餘額已保留。');
        break;
      }
      case 'message': {
        if (!s || !currentUser()) return;
        // Reuse the same turn IDs after an ambiguous response; never create a new
        // charge attempt until the prior turn has an authoritative outcome.
        if (s.pendingTurn) {
          await runPendingChatTurn(s);
          break;
        }
        if (!text.trim()) return toast('請先輸入訊息，再開始新的聊天回合。');

        const previousMessages = s.messages.slice();
        const previousMemories = (s.memories || []).map(memory => ({...memory}));
        const userMessage = {id:id(),role:'user',text,at:Date.now()};
        s.messages.push(userMessage);
        s.pendingTurn = {
          turnId:id(),
          userMessageId:userMessage.id,
          assistantMessageId:id(),
          createdAt:Date.now()
        };

        // First persist only the user message so a first-time local chat obtains
        // an owned cloud session before the trusted server reserves wallet funds.
        const userSaved = await saveChatSessionSafely(s);
        if (!userSaved) {
          s.messages = previousMessages;
          s.memories = previousMemories;
          delete s.pendingTurn;
          persist();
          await clearCloudPendingTurn(s);
          renderMessages();
          toast('訊息尚未保存到雲端，本次沒有扣款；請確認網路後再試。');
          break;
        }

        drafts[s.id]='';
        $('messageInput').value='';
        persist();
        renderMessages();
        await runPendingChatTurn(s);
        break;
      }
      case 'persona': {
        if (!s) return;
        const previousPersona=s.persona || '';
        s.persona=String(f.get('persona'));
        if (!persist()) {
          s.persona=previousPersona;
          break;
        }
        if (s.cloudOwned && currentUser()?.uid===s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.persona=previousPersona;
            persist();render();
            toast('專屬人設同步失敗，已還原原設定。');
            break;
          }
        }
        back();break;
      }
      case 'rename': {
        const item=state.sessions[o.id];
        const name=String(f.get('name')).trim();
        if (!item || !validName(name)) return toast('檔名不符合規則。'+NAME_HELP);
        const duplicate=Object.values(state.sessions).some(other =>
          other.id !== item.id && sessionTitle(other) === name
        );
        if (duplicate) return alert('這個檔名已被你自己的其他聊天或角色使用，請換一個名稱。');
        const previousName=item.name;
        item.name=name;
        if (!persist()) {
          item.name=previousName;
          break;
        }
        if (item.cloudOwned && currentUser()?.uid===item.cloudOwnerUid && hasUserMessage(item)) {
          const synced=await saveChatSessionSafely(item);
          if (!synced) {
            item.name=previousName;
            persist();render();
            toast('聊天名稱同步失敗，已還原原名稱。');
            break;
          }
        }
        openModal('archives');break;
      }
      case 'memory': {
        const m=s?.memories.find(m=>m.id===o.id);
        if (!m || m.important) return;
        const previousMemories=clone(s.memories);
        if (!text) {
          if (!confirm('內容為空，確定刪除此記憶？')) return;
          s.memories=s.memories.filter(m=>m.id!==o.id);
        } else {
          if (memorySize(s.memories)-countChars(m.text)+countChars(text)>3000) {
            return toast('記憶總長度超過3000字。');
          }
          m.text=text;
        }
        if (!persist()) {
          s.memories=previousMemories;
          return;
        }
        if (s.cloudOwned && currentUser()?.uid===s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.memories=previousMemories;
            persist();
            render();
            toast('回憶同步失敗，已還原原內容；請確認網路後再試。');
            return;
          }
        }
        back();break;
      }
      case 'message-edit': {
        const m=s?.messages.find(m=>m.id===o.id);
        const latestUserMessage = m?.role === 'user' &&
          s.messages.filter(item=>item.role==='user').at(-1)?.id===m.id;
        if (!m || !latestUserMessage) return;
        if (!text) return toast('訊息不可為空。');
        const previousText=m.text;
        const wasEdited=!!m.edited;
        m.text=text;m.edited=true;
        if (!persist()) {
          m.text=previousText;
          m.edited=wasEdited;
          break;
        }
        const synced = await saveChatSessionSafely(s);
        if (!synced) {
          m.text=previousText;
          m.edited=wasEdited;
          persist();
          renderMessages();
          toast('雲端同步失敗，已還原原訊息；請確認網路後再重新編輯。');
          break;
        }
        back();break;
      }
      case 'comment':
        if (!requireLogin({page:'detail',id:route.id})) return;
        if (!text) return toast('請輸入評論。');
        state.comments[route.id] ||= [];
        state.comments[route.id].push({
          id:id(),authorId:currentUser().uid,text,
          parentId:replyId,likes:[],deleted:false,at:Date.now()
        });
        replyId=null;form.reset();$('replyHint').textContent='';
        persist();renderComments();break;
      case 'comment-edit': {
        const c=(state.comments[route.id] || []).find(c=>c.id===o.id);
        if (!c || c.deleted || c.authorId!==currentUser()?.uid) return;
        if (!text) return toast('評論不可為空。');
        c.text=text;c.edited=true;
        persist();back();break;
      }
      case 'report':
      case 'bug': {
        if (!text) return toast('請填寫問題說明。');
        const file=f.get('image');
        if (file?.size && !['image/png','image/jpeg','image/webp'].includes(file.type)) {
          return toast('圖片格式需為PNG、JPG或WebP。');
        }
        toast('表單檢查通過。回報API尚未串接，本次沒有實際送出。');
        break;
      }
    }
  } catch(error) {
    if (type === 'cancel-account-deletion') {
      console.error('PersonaX 帳號復原失敗：', error);
      showDialog('復原帳號失敗', `
        <p>系統目前無法取消這筆刪除申請。</p>
        <div class="notice" role="alert" style="white-space:pre-wrap;overflow-wrap:anywhere">${e(error.message || '操作未完成，請稍後再試。')}</div>
        <p class="muted small">這個錯誤視窗會一直保留，直到你手動關閉。此訊息不代表帳號已刪除；請先不要重新申請刪除或修改資料庫。</p>
        <button class="primary" type="button" data-action="back">知道了</button>
      `);
    } else {
      toast(error.message || '儲存未完成。');
    }
  }
});

/* Inputs */
document.addEventListener('input',event => {
  const target=event.target;
  if (target.id==='searchInput') {search=target.value;renderGrid();}
  if (target.id==='chatSearch') {
    chatSearch=target.value;
    $('chatEntries').innerHTML=chatEntries();
  }
  if (target.id==='messageInput') drafts[route.id]=target.value;
});
document.addEventListener('keydown',event => {
  if (event.target.id==='messageInput' &&
      event.key==='Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
});
document.addEventListener('change',async event => {
  const target=event.target;
  try {
    if (target.id==='characterImage') {
      draftImage=await readImage(target.files[0]);
      $('imagePreview').src=draftImage;
      $('imagePreview').classList.remove('hidden');
    }
    if (target.id==='profileImage') {
      profileImage=await readImage(target.files[0]);
      toast('頭像已讀取，儲存後套用。');
    }
    if (target.id==='backgroundSetting') {
      const s=(target.dataset.sessionId && state.sessions[target.dataset.sessionId]) || currentSession();
      if (s && ['avatar','none'].includes(target.value)) {
        const previousBackground=s.background || 'avatar';
        s.background=target.value;
        if (!persist()) {
          s.background=previousBackground;
          target.value=previousBackground;
          return;
        }
        if (s.cloudOwned && currentUser()?.uid === s.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(s);
          if (!synced) {
            s.background=previousBackground;
            persist();render();
            target.value=previousBackground;
            toast('聊天背景同步失敗，已還原原設定。');
            return;
          }
        }
        const panel=$('view').querySelector('.chat-main');
        if (panel && route.id === s.id) {
          panel.style.setProperty('--chat-photo',target.value==='none' ? 'none' :
            `url(${JSON.stringify(safeImage(sessionCharacter(s).image))})`);
        }
      }
    }
    if (target.dataset.memory) {
      const session=currentSession();
      const m=session?.memories.find(m=>m.id===target.dataset.memory);
      if (m) {
        const previousImportant=m.important;
        m.important=target.checked;
        persist();render();
        if (session.cloudOwned && currentUser()?.uid===session.cloudOwnerUid) {
          const synced=await saveChatSessionSafely(session);
          if (!synced) {
            m.important=previousImportant;
            persist();render();
            toast('重大記憶同步失敗，已還原原設定。');
          }
        }
      }
    }
    if (['aiImages','aiImageCount'].includes(target.id)) updateAICost();
    if (target.id==='jsonFile') await importCharacter(target.files[0]);
  } catch(error) {
    toast(error.message);
    if (target.type==='file') target.value='';
  }
});

async function importCharacter(file) {
  $('jsonFile').value='';
  if (!file || !currentUser()) return;
  if (file.size>2097152) throw Error('JSON最多2 MB。');
  const data=JSON.parse(await file.text());
  const name=String(data.name || '').trim();
  const intro=String(data.intro || '').trim();
  const opening=String(data.opening || '').trim();
  if (!validName(name)) throw Error('角色名稱不符合規則。'+NAME_HELP);
  if (!intro || intro.length>2000 || !opening || opening.length>3000) {
    throw Error('需有intro與opening，並符合2000／3000字上限。');
  }
  if (String(data.privateInfo || '').length>10000 || String(data.style || '').length>1000) {
    throw Error('私密資訊或風格超過長度限制。');
  }
  const image=safeImage(data.image);
  if (!image) throw Error('需提供有效的HTTPS或支援的圖片資料。');
  const tags=Array.isArray(data.tags) ? [...new Set(data.tags.filter(t=>TAGS.includes(t)))] : [];
  if (tags.length>5) throw Error('標籤最多5個。');
  const user = currentUser();
  if (!user?.uid || !window.mySupabase) {
    throw Error('請先使用 Google 帳號登入，角色才能儲存到雲端。');
  }
  const character = {
    id:id(),name,intro,opening,image,tags,
    gender:['male','female','ambiguous'].includes(data.gender) ? data.gender : 'ambiguous',
    age:String(data.age || '').slice(0,20),
    race:String(data.race || '').slice(0,50),
    privateInfo:String(data.privateInfo || ''),style:String(data.style || ''),
    authorId:user.uid,owner:true,visibility:'private',rightsConfirmed:false,
    chats:'0',users:null,createdAt:Date.now()
  };
  // 匯入完成即建立雲端私密角色，不必先公開才上傳。
  const saveResult = await saveSupabaseCharacter(character, user.uid);
  state.characters.unshift(character);
  persist();go({page:'create'});
  if (saveResult.storyError) toast('角色已匯入雲端，但故事同步失敗：' + saveResult.storyError);
  else toast('角色已匯入雲端，預設為私密。');
}

/* Image errors do not inject HTML. */
document.addEventListener('error',event => {
  if (event.target instanceof HTMLImageElement) event.target.style.opacity='.15';
},true);

/* Initialization */
route=parseRoute();
history.replaceState({personax:true,depth:0,route},'',routeURL(route));
persist();
render();

// Supabase Auth 的 load 事件會在此之後恢復真正的登入身分。
// 這裡不再另外建立第二套登入 UI，避免兩套狀態互相覆蓋。
if (window.__pendingSupabaseUser) {
  syncSupabaseUser(window.__pendingSupabaseUser);
  window.__pendingSupabaseUser = null;
}
</script>
