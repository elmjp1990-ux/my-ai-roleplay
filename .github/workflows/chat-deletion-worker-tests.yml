name: Chat deletion worker tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/chat-deletion-worker.ts"
      - "supabase/functions/_shared/chat-deletion-worker.test.ts"
      - "supabase/functions/purge-chat-deletions/index.ts"
      - ".github/workflows/chat-deletion-worker-tests.yml"
  push:
    branches:
      - main
      - "security/chat-deletion-lifecycle-reconciliation"
    paths:
      - "supabase/functions/_shared/chat-deletion-worker.ts"
      - "supabase/functions/_shared/chat-deletion-worker.test.ts"
      - "supabase/functions/purge-chat-deletions/index.ts"
      - ".github/workflows/chat-deletion-worker-tests.yml"

jobs:
  chat-deletion-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run deterministic worker adapter tests
        run: deno test --no-check supabase/functions/_shared/chat-deletion-worker.test.ts
