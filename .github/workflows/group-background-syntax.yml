name: Group background UI syntax check

on:
  pull_request:
    paths:
      - "index.html"
      - "encounter-scene.js"
      - "city-map.js"
      - "followed-authors.js"
      - "author-profile.js"
      - "comment-renderer.js"
      - "scripts/test-encounter-schedule-parser.mjs"
      - "scripts/test-encounter-chat-mode-guard.mjs"
      - "scripts/migrate-legacy-chat-images.mjs"
      - "scripts/legacy-image-migration-runner.mjs"
      - "scripts/apply-legacy-chat-image-migration-local.mjs"
      - "scripts/test-migrate-legacy-chat-images.mjs"
      - "scripts/build-disposable-schema-fixture.mjs"
      - "supabase/drafts/current-state-*.json"
      - "supabase/drafts/legacy-image-migration-rpcs.sql"
      - "supabase/drafts/seed-legacy-image-migration-local-test.sql"
      - "supabase/drafts/verify-legacy-image-migration-local-test.sql"
      - "supabase/functions/encounter-session/**"
      - ".github/workflows/group-background-syntax.yml"
      - "supabase/migrations/**"
  push:
    branches:
      - main
      - feat/group-background-unified-album

jobs:
  inline-javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
            .map(match => match[2]);
          if (!blocks.length) {
            console.error('No inline JavaScript blocks found.');
            process.exit(1);
          }
          for (let i = 0; i < blocks.length; i++) {
            const file = path.join('/tmp', 'personax-inline-' + i + '.js');
            fs.writeFileSync(file, blocks[i]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              console.error('Syntax error in inline script block #' + (i + 1));
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
          }
          console.log('Parsed ' + blocks.length + ' inline JavaScript blocks.');
          NODE
      - name: Parse extracted City map module
        run: node --check city-map.js
      - name: Parse extracted Followed authors module
        run: node --check followed-authors.js
      - name: Parse extracted Author profile module
        run: node --check author-profile.js
      - name: Parse extracted Comment renderer module
        run: node --check comment-renderer.js
      - name: Parse extracted Encounter scene module
        run: node --check encounter-scene.js
      - name: Test Encounter schedule parser
        run: node scripts/test-encounter-schedule-parser.mjs
      - name: Test Encounter chat-mode security guard
        run: node scripts/test-encounter-chat-mode-guard.mjs
      - name: Test legacy image migration planner and resume safety
        run: node --test scripts/test-migrate-legacy-chat-images.mjs

  disposable-local-supabase-image-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI and PostgreSQL client
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Verify no hosted Supabase credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Hosted Supabase credentials must not be present in this workflow."
            exit 1
          fi
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          local_project="$RUNNER_TEMP/poyozz-legacy-image-migration"
          mkdir -p "$local_project/supabase/migrations"
          sed 's/^project_id = .*/project_id = "poyozz-legacy-image-migration"/' \
            supabase/config.toml > "$local_project/supabase/config.toml"
          cd "$local_project"
          supabase start
          status="$(supabase status --output env)"
          db_url="$(printf '%s\n' "$status" | sed -n 's/^DB_URL=//p' | sed 's/^"//;s/"$//')"
          service_key="$(printf '%s\n' "$status" | sed -n 's/^SERVICE_ROLE_KEY=//p' | sed 's/^"//;s/"$//')"
          if [[ -z "$db_url" || -z "$service_key" ]]; then
            echo "Could not resolve local Supabase DB_URL or SERVICE_ROLE_KEY."
            exit 1
          fi
          echo "DATABASE_URL=$db_url" >> "$GITHUB_ENV"
          echo "LOCAL_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"
          echo "LOCAL_SUPABASE_PROJECT=$local_project" >> "$GITHUB_ENV"
      - name: Load synthetic schema and fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-disposable-schema-fixture.mjs > "$RUNNER_TEMP/current-state-schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/current-state-schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113050000_allow_existing_chat_character_media_read.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113060000_allow_chat_snapshot_image_storage_reads.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/seed-legacy-image-migration-local-test.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/legacy-image-migration-rpcs.sql
      - name: Apply locally, verify object hashes, and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_URL="http://127.0.0.1:54321"
          export SUPABASE_SERVICE_ROLE_KEY="$LOCAL_SERVICE_ROLE_KEY"
          manifest="$RUNNER_TEMP/legacy-image-migration-manifest.json"
          node scripts/migrate-legacy-chat-images.mjs --apply --confirm-local "--manifest=$manifest"
          node scripts/migrate-legacy-chat-images.mjs --apply --confirm-local "--manifest=$manifest"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-legacy-image-migration-local-test.sql
      - name: Stop and discard local Supabase
        if: always()
        shell: bash
        run: |
          local_project="$RUNNER_TEMP/poyozz-legacy-image-migration"
          if [[ -d "$local_project" ]]; then
            cd "$local_project"
            supabase stop --no-backup
          fi
