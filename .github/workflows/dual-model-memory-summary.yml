name: Dual-model Story memory summary contract

on:
  pull_request:
    paths:
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/group-chat-turn/index.ts"
      - "supabase/functions/_shared/ai-value-utils.ts"
      - "supabase/functions/_shared/ai-value-utils.test.ts"
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/openrouter-chat-completions.ts"
      - "supabase/functions/_shared/story-memory-summary.ts"
      - "supabase/functions/_shared/openrouter-chat-completions.ts"
      - "supabase/functions/_shared/openrouter-provider-policy.ts"
      - "scripts/test-dual-model-memory-summary.mjs"
      - "supabase/migrations/20261105223613_ai_model_usage_and_memory_summaries.sql"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/group-chat-turn/index.ts"
      - "supabase/functions/_shared/ai-value-utils.ts"
      - "supabase/functions/_shared/ai-value-utils.test.ts"
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/openrouter-chat-completions.ts"
      - "supabase/functions/_shared/story-memory-summary.ts"
      - "scripts/test-dual-model-memory-summary.mjs"
      - "supabase/migrations/20261105223613_ai_model_usage_and_memory_summaries.sql"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify existing wallet preflight
        run: node scripts/test-chat-turn-preflight.mjs
      - name: Verify dual-model routing and five-turn summaries
        run: node scripts/test-dual-model-memory-summary.mjs
      - name: Test shared AI value guards
        run: deno test --no-check supabase/functions/_shared/ai-value-utils.test.ts
