name: Chat history pagination checks

on:
  push:
    branches:
      - perf/chat-history-lazy-pagination
  pull_request:
    paths:
      - index.html
      - scripts/check-chat-history-pagination.mjs
      - .github/workflows/chat-history-pagination.yml

permissions:
  contents: read

jobs:
  chat-history-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-chat-history-pagination.mjs
