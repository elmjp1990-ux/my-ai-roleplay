      - name: Verify AI diagnostics expiry and cleanup behavior
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $expiry_default$
          DECLARE
            v_default text;
          BEGIN
            SELECT pg_catalog.pg_get_expr(d.adbin, d.adrelid)
            INTO v_default
            FROM pg_catalog.pg_attribute a
            JOIN pg_catalog.pg_attrdef d
              ON d.adrelid = a.attrelid AND d.adnum = a.attnum
            WHERE a.attrelid = 'public.ai_generation_diagnostics'::regclass
              AND a.attname = 'expires_at';
            IF v_default NOT ILIKE '%14 days%' THEN
              RAISE EXCEPTION 'AI diagnostics expiry default must be 14 days; found %', v_default;
            END IF;
          END
          $expiry_default$;
          INSERT INTO public.ai_generation_diagnostics
            (generation_type, status, expires_at, raw_output_text)
          VALUES
            ('story_chat', 'failed', pg_catalog.clock_timestamp() - interval '1 second', 'expired synthetic diagnostic');
          SELECT public.purge_expired_ai_generation_diagnostics();
          DO $expiry_cleanup$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM public.ai_generation_diagnostics
              WHERE raw_output_text = 'expired synthetic diagnostic'
            ) THEN
              RAISE EXCEPTION 'Expired AI diagnostic row was not purged';
            END IF;
          END
          $expiry_cleanup$;
          SQL

      - name: Apply and verify character worldview tags and construction schedule rules
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124160000_character_worldview_tags_and_construction_scene.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $worldview_contract$
          DECLARE
            v_source_definition text;
            v_trigger_definition text;
            v_trigger_function_definition text;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'characters'
                AND column_name = 'worldview_tags' AND data_type = 'ARRAY'
            ) THEN
              RAISE EXCEPTION 'characters.worldview_tags column missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_constraint
              WHERE conrelid = 'public.characters'::regclass
                AND conname = 'characters_worldview_tags_allowed'
            ) THEN
              RAISE EXCEPTION 'worldview tag constraint missing';
            END IF;
            v_source_definition := pg_catalog.pg_get_functiondef(
              'public.encounter_schedule_source_payload(uuid)'::regprocedure
            );
            IF pg_catalog.strpos(v_source_definition, 'worldview_tags') = 0
               OR pg_catalog.strpos(v_source_definition, 'v11-worldview-tags') = 0 THEN
              RAISE EXCEPTION 'schedule source payload does not include worldview tags/version';
            END IF;
            SELECT pg_catalog.pg_get_triggerdef(t.oid)
            INTO v_trigger_definition
            FROM pg_catalog.pg_trigger t
            WHERE t.tgrelid = 'public.characters'::regclass
              AND t.tgname = 'characters_enqueue_encounter_schedule_ai'
              AND NOT t.tgisinternal;
            IF v_trigger_definition IS NULL
               OR pg_catalog.strpos(v_trigger_definition, 'worldview_tags') = 0 THEN
              RAISE EXCEPTION 'worldview tag change trigger missing';
            END IF;
            v_trigger_function_definition := pg_catalog.pg_get_functiondef(
              'public.on_encounter_character_visibility_changed()'::regprocedure
            );
            IF pg_catalog.strpos(v_trigger_function_definition, 'OLD.worldview_tags') = 0 THEN
              RAISE EXCEPTION 'worldview tag trigger function does not enqueue changed tags';
            END IF;
          END
          $worldview_contract$;
          SQL
          node scripts/test-encounter-schedule-worker.mjs

      - name: Apply and verify Explore daily leaderboards in disposable schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261126072000_explore_character_leaderboards.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $explore_leaderboard_contract$
          DECLARE
            v_function text;
          BEGIN
            IF pg_catalog.to_regclass('public.character_turn_daily_stats') IS NULL THEN
              RAISE EXCEPTION 'daily character turn aggregate table missing';
            END IF;
            IF pg_catalog.to_regprocedure('public.get_public_character_leaderboard(text,integer,integer,text[],text[])') IS NULL THEN
              RAISE EXCEPTION 'public leaderboard RPC missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_trigger
              WHERE tgrelid='public.chat_messages'::regclass
                AND tgname='chat_messages_character_turn_daily_stat'
                AND NOT tgisinternal
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_trigger
              WHERE tgrelid='public.chat_group_messages'::regclass
                AND tgname='chat_group_messages_character_turn_daily_stat'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'single/group daily aggregate triggers missing';
            END IF;
            v_function := pg_catalog.pg_get_functiondef(
              'public.get_public_character_leaderboard(text,integer,integer,text[],text[])'::regprocedure
            );
            IF pg_catalog.strpos(v_function, 'Asia/Taipei') = 0
               OR pg_catalog.strpos(v_function, 'isodow') = 0
               OR pg_catalog.strpos(v_function, 'character_turn_daily_stats') = 0 THEN
              RAISE EXCEPTION 'leaderboard must use Taiwan-local daily buckets and Monday week boundaries';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_class AS c
              JOIN pg_catalog.pg_namespace AS n ON n.oid=c.relnamespace
              WHERE n.nspname='public'
                AND c.relname='character_turn_daily_stats'
                AND c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'daily aggregate table must have RLS enabled';
            END IF;
            IF pg_catalog.has_table_privilege('anon','public.character_turn_daily_stats','SELECT')
               OR pg_catalog.has_table_privilege('authenticated','public.character_turn_daily_stats','SELECT') THEN
              RAISE EXCEPTION 'daily aggregate rows must not be directly readable by client roles';
            END IF;
            IF NOT pg_catalog.has_function_privilege(
              'anon',
              'public.get_public_character_leaderboard(text,integer,integer,text[],text[])',
              'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'anonymous public leaderboard RPC grant missing';
            END IF;
          END
          $explore_leaderboard_contract$;
          SQL

