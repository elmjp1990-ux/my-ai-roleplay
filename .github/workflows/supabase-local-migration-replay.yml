name: Supabase local synthetic schema replay (manual)

on:
  push:
    branches:
      - security/chat-deletion-lifecycle-reconciliation
    paths:
      - "supabase/drafts/replay-deletion-concurrency-setup.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-synthetic-schema-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Verify isolated local-only environment
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test -f supabase/config.toml
          # This workflow intentionally has no Supabase access token or DB password.
          # Never link this runner to a hosted project.
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Hosted Supabase credentials must not be present in this workflow."
            exit 1
          fi

      - name: Verify frontend JavaScript and deletion tombstones
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const storyEdge = fs.readFileSync('supabase/functions/story-session/index.ts', 'utf8');
          assert.ok(
            storyEdge.includes('.from("chat_sessions")') &&
            storyEdge.includes('.is("deleted_at", null)') &&
            storyEdge.includes('encounter_source_session_lookup_failed'),
            'Story carry-over Edge Function must verify an active source session'
          );
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          assert.ok(scripts.length > 0, 'No inline JavaScript script blocks found');
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ' failed syntax parsing: ' + error.message); }
          });

          const start = html.indexOf('  function readDeletedChatTombstones(uid) {');
          const end = html.indexOf('  function cacheSessionsForUser(uid) {', start);
          assert.ok(start >= 0 && end > start, 'Deletion tombstone helper block missing');
          const helperSource = html.slice(start, end);
          const values = new Map();
          const localStorage = {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
          };
          const isUuid = value =>
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
          const helpers = new Function(
            'localStorage', 'isUuid', 'USER_DELETED_CHAT_TOMBSTONES_KEY_PREFIX',
            helperSource + '; return {readDeletedChatTombstones,markDeletedChatTombstone,filterDeletedChatSessions};'
          )(localStorage, isUuid, 'test-tombstones:');

          const uid = '11111111-1111-4111-8111-111111111111';
          const sessionId = '22222222-2222-4222-8222-222222222222';
          const groupId = '33333333-3333-4333-8333-333333333333';
          assert.equal(helpers.markDeletedChatTombstone(uid, 'sessions', sessionId), true);
          assert.equal(helpers.markDeletedChatTombstone(uid, 'groups', groupId), true);
          const filtered = helpers.filterDeletedChatSessions(uid, {
            [sessionId]: { id: sessionId },
            keep: { id: 'keep' },
          });
          assert.equal(filtered[sessionId], undefined, 'Deleted session must be filtered');
          assert.ok(filtered.keep, 'Unrelated session must remain');
          assert.ok(helpers.readDeletedChatTombstones(uid).groups[groupId], 'Group tombstone must persist');
          console.log('Frontend syntax and deletion tombstone checks passed (' + scripts.length + ' inline scripts).');
          NODE

      - name: Start isolated local Supabase database without repository migrations
        shell: bash
        run: |
          set -euo pipefail
          # Use a temporary project directory with an empty migrations folder.
          # Supabase CLI startup otherwise auto-applies this repo's incomplete
          # pre-ledger history before the synthetic current-state schema is loaded.
          local_project="$RUNNER_TEMP/poyozz-local-synthetic"
          mkdir -p "$local_project/supabase/migrations"
          sed 's/^project_id = .*/project_id = "poyozz-local-synthetic"/' \
            supabase/config.toml > "$local_project/supabase/config.toml"
          cd "$local_project"
          supabase db start
          DB_URL="$(supabase status --output env | sed -n 's/^DB_URL=//p' | sed 's/^"//;s/"$//')"
          if [[ -z "$DB_URL" ]]; then
            echo "Could not resolve the isolated local Supabase DB_URL."
            exit 1
          fi
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load synthetic current-state schema and replay deletion security drafts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-disposable-schema-fixture.mjs > "$RUNNER_TEMP/current-state-schema.sql"
          # Platform-owned default ACLs are intentionally skipped by the fixture generator;
          # Supabase Local retains its own defaults for supabase_admin/auth_admin.
          # Synthetic current-state baseline is intentional: the original pre-ledger
          # profiles/characters foundation is unavailable. Do not replay old migrations.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/current-state-schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-current-state-schema-fixture.sql

          # Encounter/chat structural audits and character/account DML all run inside
          # disposable transactions and are rolled back.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-local-security-drafts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-and-test-character-deletion.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-deletion-draft-rollback.sql

          # True independent-connection races use only this disposable local database.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-deletion-concurrency-setup.sql
          DATABASE_URL="$DATABASE_URL" bash scripts/test-deletion-concurrency.sh

      - name: Stop and discard local database
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/poyozz-local-synthetic"
          supabase stop --no-backup
