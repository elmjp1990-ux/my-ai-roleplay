name: Supabase local migration replay (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-migration-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Verify isolated local-only environment
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test -f supabase/config.toml
          # This workflow intentionally has no Supabase access token or DB password.
          # Never link this runner to a hosted project.
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Hosted Supabase credentials must not be present in this workflow."
            exit 1
          fi

      - name: Verify frontend JavaScript and deletion tombstones
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          assert.ok(scripts.length > 0, 'No inline JavaScript script blocks found');
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ' failed syntax parsing: ' + error.message); }
          });

          const start = html.indexOf('  function readDeletedChatTombstones(uid) {');
          const end = html.indexOf('  function cacheSessionsForUser(uid) {', start);
          assert.ok(start >= 0 && end > start, 'Deletion tombstone helper block missing');
          const helperSource = html.slice(start, end);
          const values = new Map();
          const localStorage = {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
          };
          const isUuid = value =>
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
          const helpers = new Function(
            'localStorage', 'isUuid', 'USER_DELETED_CHAT_TOMBSTONES_KEY_PREFIX',
            helperSource + '; return {readDeletedChatTombstones,markDeletedChatTombstone,filterDeletedChatSessions};'
          )(localStorage, isUuid, 'test-tombstones:');

          const uid = '11111111-1111-4111-8111-111111111111';
          const sessionId = '22222222-2222-4222-8222-222222222222';
          const groupId = '33333333-3333-4333-8333-333333333333';
          assert.equal(helpers.markDeletedChatTombstone(uid, 'sessions', sessionId), true);
          assert.equal(helpers.markDeletedChatTombstone(uid, 'groups', groupId), true);
          const filtered = helpers.filterDeletedChatSessions(uid, {
            [sessionId]: { id: sessionId },
            keep: { id: 'keep' },
          });
          assert.equal(filtered[sessionId], undefined, 'Deleted session must be filtered');
          assert.ok(filtered.keep, 'Unrelated session must remain');
          assert.ok(helpers.readDeletedChatTombstones(uid).groups[groupId], 'Group tombstone must persist');
          console.log('Frontend syntax and deletion tombstone checks passed (' + scripts.length + ' inline scripts).');
          NODE

      - name: Start disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          supabase migration list --local

      - name: Apply security drafts on the disposable local database
        shell: bash
        run: |
          set -euo pipefail
          encounter_draft="supabase/drafts/encounter-session-delete-lifecycle-guards.sql"
          diary_draft="supabase/drafts/encounter-diary-chat-deletion-lifecycle-guard.sql"
          truncate_draft="supabase/drafts/revoke-public-truncate-privileges-proposal.sql"
          stats_draft="supabase/drafts/chat-deletion-cumulative-turn-statistics-proposal.sql"
          encounter_migration="supabase/migrations/99999999999996_encounter_session_delete_lifecycle_ci.sql"
          diary_migration="supabase/migrations/99999999999997_encounter_diary_chat_lifecycle_guard_ci.sql"
          truncate_migration="supabase/migrations/99999999999998_revoke_public_truncate_ci.sql"
          stats_migration="supabase/migrations/99999999999999_chat_deletion_cumulative_turn_statistics_ci.sql"
          test -f "$encounter_draft"
          test -f "$diary_draft"
          test -f "$truncate_draft"
          test -f "$stats_draft"
          test ! -e "$encounter_migration"
          test ! -e "$diary_migration"
          test ! -e "$truncate_migration"
          test ! -e "$stats_migration"
          cp "$encounter_draft" "$encounter_migration"
          cp "$diary_draft" "$diary_migration"
          cp "$truncate_draft" "$truncate_migration"
          cp "$stats_draft" "$stats_migration"
          # Explicitly local: no link, no access token, no remote DB password.
          supabase db reset --local --no-seed
          supabase migration list --local

      - name: Verify archived-turn schema, RPC guards and ACLs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(docker ps --format '{{.Names}}' | grep '^supabase_db_' || true)
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            echo "Expected exactly one disposable Supabase database container; found ${#db_containers[@]}."
            docker ps --format '{{.Names}}'
            exit 1
          fi
          docker exec -i "${db_containers[0]}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/drafts/chat-deletion-turn-stats-structural-verification.sql

      - name: Stop and discard local database
        if: always()
        shell: bash
        run: supabase stop --no-backup
