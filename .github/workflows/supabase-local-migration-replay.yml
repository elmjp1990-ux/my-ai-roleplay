name: Supabase local synthetic schema replay (manual)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/*.sql"
      - "supabase/drafts/encounter-schedule-pipeline.sql"
      - "supabase/drafts/replay-encounter-schedule-pipeline.sql"
      - "supabase/drafts/replay-encounter-schedule-output-repair.sql"
      - "supabase/drafts/replay-encounter-schedule-output-soft-hide.sql"
      - "supabase/drafts/replay-encounter-schedule-repair-drafts.sql"
      - "supabase/drafts/replay-encounter-sparse-schedule-windows.sql"
      - "supabase/drafts/replay-encounter-scene-catalog.sql"
      - "supabase/drafts/replay-encounter-session-evaluation-worker.sql"
      - "supabase/drafts/replay-encounter-per-turn-affinity.sql"
      - "supabase/drafts/encounter-relationship-greeting-pools.sql"
      - "supabase/drafts/replay-encounter-relationship-greeting-pools.sql"
      - "supabase/drafts/replay-encounter-worldview-manual-review.sql"
      - "supabase/drafts/replay-encounter-worldview-review-decisions.sql"
      - "supabase/migrations/20261119000500_encounter_schedule_worldview_review_decisions.sql"
      - "index.html"
      - "supabase/drafts/schedule-encounter-evaluation-worker.sql"
      - "supabase/drafts/replay-schedule-encounter-evaluation-worker.sql"
      - "supabase/drafts/encounter-evaluation-evidence-gates.sql"
      - "supabase/drafts/encounter-session-manual-end.sql"
      - "supabase/drafts/current-state-structure.json"
      - "supabase/drafts/verify-current-state-schema-fixture.sql"
      - "scripts/build-disposable-schema-fixture.mjs"
      - ".github/workflows/supabase-local-migration-replay.yml"
  push:
    branches:
      - security/chat-deletion-lifecycle-reconciliation

permissions:
  contents: read

jobs:
  local-synthetic-schema-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Discover pinned CLI migration command and generate isolated migration name
        shell: bash
        run: |
          set -euo pipefail
          supabase migration --help
          supabase migration new --help
          migration_project="$RUNNER_TEMP/poyozz-migration-name-only"
          mkdir -p "$migration_project/supabase/migrations"
          printf '[project]\\nid = "poyozz-migration-name-only"\\n' > "$migration_project/supabase/config.toml"
          cd "$migration_project"
          supabase migration new poyozz_account_deletion_preservation_atomic_lease
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          if [[ -z "$generated" ]]; then
            echo "Supabase CLI did not generate a migration file."
            exit 1
          fi
          echo "CLI_GENERATED_MIGRATION_PATH=$generated"
          echo "CLI_GENERATED_MIGRATION_FILENAME=$(basename "$generated")"

      - name: Verify isolated local-only environment
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test -f supabase/config.toml
          # This workflow intentionally has no Supabase access token or DB password.
          # Never link this runner to a hosted project.
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Hosted Supabase credentials must not be present in this workflow."
            exit 1
          fi

      - name: Verify frontend JavaScript and deletion tombstones
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const storyEdge = fs.readFileSync('supabase/functions/story-session/index.ts', 'utf8');
          assert.ok(
            storyEdge.includes('.from("chat_sessions")') &&
            storyEdge.includes('.is("deleted_at", null)') &&
            storyEdge.includes('encounter_source_session_lookup_failed'),
            'Story carry-over Edge Function must verify an active source session'
          );
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          assert.ok(scripts.length > 0, 'No inline JavaScript script blocks found');
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { throw new Error('Inline script ' + (index + 1) + ' failed syntax parsing: ' + error.message); }
          });

          const start = html.indexOf('  function readDeletedChatTombstones(uid) {');
          const end = html.indexOf('  function cacheSessionsForUser(uid) {', start);
          assert.ok(start >= 0 && end > start, 'Deletion tombstone helper block missing');
          const helperSource = html.slice(start, end);
          const values = new Map();
          const localStorage = {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
          };
          const isUuid = value =>
            /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
          const helpers = new Function(
            'localStorage', 'isUuid', 'USER_DELETED_CHAT_TOMBSTONES_KEY_PREFIX',
            helperSource + '; return {readDeletedChatTombstones,markDeletedChatTombstone,filterDeletedChatSessions};'
          )(localStorage, isUuid, 'test-tombstones:');

          const uid = '11111111-1111-4111-8111-111111111111';
          const sessionId = '22222222-2222-4222-8222-222222222222';
          const groupId = '33333333-3333-4333-8333-333333333333';
          assert.equal(helpers.markDeletedChatTombstone(uid, 'sessions', sessionId), true);
          assert.equal(helpers.markDeletedChatTombstone(uid, 'groups', groupId), true);
          const filtered = helpers.filterDeletedChatSessions(uid, {
            [sessionId]: { id: sessionId },
            keep: { id: 'keep' },
          });
          assert.equal(filtered[sessionId], undefined, 'Deleted session must be filtered');
          assert.ok(filtered.keep, 'Unrelated session must remain');
          assert.ok(helpers.readDeletedChatTombstones(uid).groups[groupId], 'Group tombstone must persist');
          console.log('Frontend syntax and deletion tombstone checks passed (' + scripts.length + ' inline scripts).');
          NODE

      - name: Start isolated local Supabase database without repository migrations
        shell: bash
        run: |
          set -euo pipefail
          # Use a temporary project directory with an empty migrations folder.
          # Supabase CLI startup otherwise auto-applies this repo's incomplete
          # pre-ledger history before the synthetic current-state schema is loaded.
          local_project="$RUNNER_TEMP/poyozz-local-synthetic"
          mkdir -p "$local_project/supabase/migrations"
          sed 's/^project_id = .*/project_id = "poyozz-local-synthetic"/' \
            supabase/config.toml > "$local_project/supabase/config.toml"
          cd "$local_project"
          supabase db start
          DB_URL="$(supabase status --output env | sed -n 's/^DB_URL=//p' | sed 's/^"//;s/"$//')"
          if [[ -z "$DB_URL" ]]; then
            echo "Could not resolve the isolated local Supabase DB_URL."
            exit 1
          fi
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load synthetic current-state schema
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-disposable-schema-fixture.mjs > "$RUNNER_TEMP/current-state-schema.sql"
          # Platform-owned default ACLs are intentionally skipped by the fixture generator;
          # Supabase Local retains its own defaults for supabase_admin/auth_admin.
          # Synthetic current-state baseline is intentional: the original pre-ledger
          # profiles/characters foundation is unavailable. Do not replay old migrations.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/current-state-schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-current-state-schema-fixture.sql

      - name: Replay and verify descriptive character age migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261121100000_character_age_as_text.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $age_check$
          DECLARE
            v_age_type text;
          BEGIN
            SELECT data_type INTO v_age_type
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND table_name = 'characters'
              AND column_name = 'age';
            IF v_age_type IS DISTINCT FROM 'text' THEN
              RAISE EXCEPTION 'characters.age must be text after migration; found %', v_age_type;
            END IF;
          END;
          $age_check$;
          CREATE TEMP TABLE character_age_conversion_fixture(age integer);
          INSERT INTO character_age_conversion_fixture(age) VALUES (28), (3000), (NULL);
          ALTER TABLE character_age_conversion_fixture
            ALTER COLUMN age TYPE text
            USING age::text;
          DO $age_values$
          DECLARE
            v_values text[];
          BEGIN
            SELECT array_agg(age ORDER BY age NULLS LAST) INTO v_values
            FROM character_age_conversion_fixture;
            IF v_values IS DISTINCT FROM ARRAY['28','3000',NULL]::text[] THEN
              RAISE EXCEPTION 'Integer-to-text age conversion did not preserve values: %', v_values;
            END IF;
          END;
          $age_values$;
          SQL

      - name: Replay and behavior-test per-turn Encounter affinity migration
        shell: bash
        run: |
          set -euo pipefail
          # Applies the formal migration and verifies settled-turn idempotency,
          # canonical session seeding, shared Story synchronization and isolation.
          # The dedicated SQL harness wraps all DDL and fixtures in ROLLBACK.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-per-turn-affinity.sql

      - name: Replay failed AI usage migration against synthetic ledger
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.ai_model_usage (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid NOT NULL,
            session_id uuid NOT NULL,
            turn_id uuid,
            assistant_message_id uuid,
            generation_type text NOT NULL,
            batch_number integer,
            source_turn_ids uuid[] NOT NULL DEFAULT '{}',
            model text NOT NULL,
            provider text,
            gateway_request_id text,
            prompt_tokens integer,
            completion_tokens integer,
            total_tokens integer,
            cost_usd numeric,
            status text NOT NULL,
            summary text,
            created_at timestamptz NOT NULL DEFAULT now(),
            processed_at timestamptz,
            important boolean NOT NULL DEFAULT false,
            CONSTRAINT ai_model_usage_generation_fields_check CHECK (
              (generation_type = 'chat_response' AND turn_id IS NOT NULL
                AND assistant_message_id IS NOT NULL AND batch_number IS NULL
                AND cardinality(source_turn_ids) = 0 AND summary IS NULL)
              OR (generation_type = 'memory_summary' AND turn_id IS NULL
                AND assistant_message_id IS NULL AND batch_number IS NOT NULL
                AND batch_number > 0 AND cardinality(source_turn_ids) BETWEEN 1 AND 5)
            ),
            CONSTRAINT ai_model_usage_generation_type_check CHECK (generation_type IN ('chat_response','memory_summary')),
            CONSTRAINT ai_model_usage_status_check CHECK (status IN ('processing','completed','failed'))
          );
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119001300_ai_model_usage_failed_encounter_turns.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.ai_model_usage
            (user_id,session_id,turn_id,assistant_message_id,generation_type,model,status)
          VALUES
            ('11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             '33333333-3333-4333-8333-333333333333',
             NULL,'chat_response','test-model','failed');
          DO $test$
          BEGIN
            BEGIN
              INSERT INTO public.ai_model_usage
                (user_id,session_id,turn_id,assistant_message_id,generation_type,model,status)
              VALUES
                ('11111111-1111-4111-8111-111111111111',
                 '22222222-2222-4222-8222-222222222222',
                 '44444444-4444-4444-8444-444444444444',
                 NULL,'chat_response','test-model','completed');
              RAISE EXCEPTION 'completed usage without assistant_message_id should be rejected';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;
          END
          $test$;
          INSERT INTO public.ai_model_usage
            (user_id,session_id,turn_id,assistant_message_id,generation_type,model,status)
          VALUES
            ('11111111-1111-4111-8111-111111111111',
             '22222222-2222-4222-8222-222222222222',
             '55555555-5555-4555-8555-555555555555',
             '66666666-6666-4666-8666-666666666666',
             'chat_response','test-model','completed');
          DELETE FROM public.ai_model_usage;
          SQL
          echo "Failed usage records without assistant IDs are allowed; completed records still require IDs."
      - name: Replay account deletion release migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-account-deletion-release-migration.sql

      - name: Replay local security and character deletion drafts
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-local-security-drafts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-and-test-character-deletion.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-deletion-draft-rollback.sql

      - name: Replay deletion concurrency
        shell: bash
        run: |
          set -euo pipefail
          # True independent-connection races use only this disposable local database.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-deletion-concurrency-setup.sql
          DATABASE_URL="$DATABASE_URL" bash scripts/test-deletion-concurrency.sh

      - name: Apply Character AI Profile organization queue migration
        shell: bash
        run: |
          set -euo pipefail
          # Profile queue and private derived-profile storage are replayed only
          # in this disposable local Supabase database.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107120000_character_ai_profile_organization_queue.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119160000_character_profile_life_context_version.sql

      - name: Apply formal Encounter schedule pipeline migration
        shell: bash
        run: |
          set -euo pipefail
          # Encounter schedule SQL and its smoke test run only in this disposable local DB.
          # This never links to or authenticates against the hosted Supabase project.
          LOG_FILE="$RUNNER_TEMP/encounter-schedule-replay.log"
          if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095320_encounter_schedule_pipeline.sql >"$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            exit 1
          fi
          cat "$LOG_FILE"

      - name: Apply manual Profile-before-schedule claim migration
        shell: bash
        run: |
          set -euo pipefail
          # This migration adds only an author-scoped manual claim RPC. It does
          # not create or activate any cron schedule.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122120000_manual_character_profile_before_encounter_schedule.sql

      - name: Apply formal Encounter evidence and settlement migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095344_encounter_evaluation_evidence_gates.sql

      - name: Apply formal Encounter relationship greeting migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095358_encounter_relationship_greeting_pools.sql

      - name: Apply formal Encounter manual-end migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095408_encounter_session_manual_end.sql

      - name: Replay Encounter evaluation queue and settlement smoke test
        shell: bash
        run: |
          set -euo pipefail
          # Exercises only the disposable current-state fixture; no OpenRouter or Hosted Supabase access.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-session-evaluation-worker.sql

      - name: Apply formal Encounter evaluation scheduler migration (disabled)
        shell: bash
        run: |
          set -euo pipefail
          # Only creates the disabled-by-default function; no cron job is enabled.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095414_schedule_encounter_evaluation_worker.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-schedule-encounter-evaluation-worker.sql

      - name: Apply Encounter weather decision RLS hardening
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117095918_encounter_schedule_weather_decisions_rls.sql

      - name: Apply generalized Encounter dynamic scene catalog migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117133518_encounter_dynamic_scene_catalog.sql

      - name: Apply schedule batch completion cooldown and partial-publish migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117133525_encounter_schedule_batch_semantics.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117150503_encounter_public_character_schedule_eligibility.sql

      - name: Apply sparse Encounter schedule windows migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074655_encounter_schedules_allow_unavailable_windows.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074708_resolve_only_published_encounter_scenes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074713_encounter_schedule_scene_descriptions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074718_encounter_hourly_schedule_options.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074723_prioritize_pending_encounter_schedule_jobs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118074727_encounter_schedule_raw_output_repair.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118141805_encounter_schedule_home_aliases_and_sleep_guard.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-schedule-output-repair.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-sparse-schedule-windows.sql

      - name: Apply compact 24-hour schedule and dynamic Encounter opening migration
        shell: bash
        run: |
          set -euo pipefail
          # Applies only to the disposable local database; no hosted Supabase or AI calls.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000100_encounter_schedule_compact_output.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000200_encounter_schedule_modern_setting_inference.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000300_encounter_schedule_worldview_manual_review.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-worldview-manual-review.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000500_encounter_schedule_worldview_review_decisions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-worldview-review-decisions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000600_encounter_schedule_output_soft_hide.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-schedule-output-soft-hide.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261124090000_encounter_schedule_repair_drafts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-encounter-schedule-repair-drafts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119000900_encounter_schedule_strict_hourly_options.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119001000_fix_encounter_schedule_publisher_jsonb_key_count.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119001200_fix_encounter_schedule_null_weather_greeting.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261120170000_encounter_schedule_descriptive_location_labels.sql

      - name: Apply author-scoped manual Encounter schedule claim fix
        shell: bash
        run: |
          set -euo pipefail
          # Apply after all schedule migrations that replace the claim function.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122130000_scope_manual_encounter_schedule_claims.sql
          # Match the parser's broad natural-location labels and optional unmapped rain alternatives.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261122140000_encounter_schedule_natural_locations_and_rain_fallbacks.sql

      - name: Apply and verify 14-day AI generation diagnostics retention
        shell: bash
        run: |
          set -euo pipefail
          # This creates the cleanup Cron only inside the disposable local database.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261121120000_ai_generation_diagnostics_14_day_retention.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $diagnostics_check$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relname = 'ai_generation_diagnostics'
                AND c.relrowsecurity IS TRUE
            ) THEN
              RAISE EXCEPTION 'AI generation diagnostics table missing or RLS disabled';
            END IF;
            IF has_table_privilege('anon', 'public.ai_generation_diagnostics', 'SELECT')
               OR has_table_privilege('authenticated', 'public.ai_generation_diagnostics', 'SELECT') THEN
              RAISE EXCEPTION 'AI diagnostics must not be readable by anon/authenticated';
            END IF;
            IF NOT has_table_privilege('service_role', 'public.ai_generation_diagnostics', 'SELECT')
               OR NOT has_table_privilege('service_role', 'public.ai_generation_diagnostics', 'INSERT') THEN
              RAISE EXCEPTION 'service_role diagnostics access missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'ai_generation_diagnostics'
                AND column_name = 'raw_response_body'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'ai_generation_diagnostics'
                AND column_name = 'raw_response_truncated'
            ) THEN
              RAISE EXCEPTION 'raw provider response body diagnostics columns missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_catalog.pg_constraint con
              JOIN pg_catalog.pg_class rel ON rel.oid = con.conrelid
              JOIN pg_catalog.pg_namespace n ON n.oid = rel.relnamespace
              WHERE n.nspname = 'public' AND rel.relname = 'ai_generation_diagnostics'
                AND con.contype = 'f' AND con.confdeltype = 'c'
            ) THEN
              RAISE EXCEPTION 'account deletion cascade foreign key missing';
            END IF;
            IF pg_catalog.to_regclass('cron.job') IS NOT NULL
               AND pg_catalog.to_regprocedure('cron.schedule(text,text,text)') IS NOT NULL
               AND pg_catalog.to_regprocedure('cron.unschedule(bigint)') IS NOT NULL THEN
              IF NOT EXISTS (
                SELECT 1 FROM cron.job WHERE jobname = 'poyozz-ai-generation-diagnostics-purge'
              ) THEN
                RAISE EXCEPTION '14-day AI diagnostics purge Cron job missing';
              END IF;
            ELSE
              RAISE NOTICE 'pg_cron unavailable in local synthetic fixture; hosted migration will schedule when extension exists';
            END IF;
          END
          $diagnostics_check$;
          SQL

