      - "supabase/drafts/verify-deletion-draft-replay.sql"
      - "supabase/drafts/seed-character-deletion-legacy-fixtures.sql"
      - "supabase/drafts/test-character-deletion-behavior.sql"
      - "supabase/drafts/replay-and-test-character-deletion.sql"
      - "supabase/drafts/verify-deletion-draft-rollback.sql"
      - "supabase/drafts/current-state-schema-catalog-manifest-2026-11-02.md"
      - "scripts/test-disposable-schema-catalog-snapshot.mjs"
      - "scripts/build-disposable-schema-fixture.mjs"
      - "scripts/test-build-disposable-schema-fixture.mjs"
      - ".github/workflows/account-deletion-worker-tests.yml"

jobs:
  account-deletion-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check account deletion Edge Function
        run: deno check supabase/functions/account-deletion-worker/index.ts
      - name: Run deterministic account deletion worker tests
        run: deno test supabase/functions/_shared/account-deletion-worker.test.ts
      - name: Type-check character asset cleanup Edge Function
        run: deno check supabase/functions/purge-character-assets/index.ts
      - name: Run deterministic character asset cleanup tests
        run: deno test supabase/functions/_shared/character-asset-cleanup-worker.test.ts
      - name: Check account deletion character-preservation draft invariants
        run: node scripts/test-account-deletion-character-preservation-draft.mjs
      - name: Check character asset cleanup path-lock invariants
        run: node scripts/test-character-history-aware-deletion-draft.mjs
      - name: Validate disposable schema-only catalog snapshot
        run: node scripts/test-disposable-schema-catalog-snapshot.mjs
      - name: Validate disposable schema fixture generation
        run: node scripts/test-build-disposable-schema-fixture.mjs

  disposable-schema-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poyo_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poyo_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poyo_disposable
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable Auth compatibility layer
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/disposable-platform-bootstrap.sql
      - name: Generate current-state schema fixture
        run: node scripts/build-disposable-schema-fixture.mjs > "$RUNNER_TEMP/current-state-schema.sql"
      - name: Replay schema-only fixture in disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/current-state-schema.sql"
      - name: Verify current-state schema fingerprint and empty tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-current-state-schema-fixture.sql
      - name: Replay deletion drafts and run hard/soft delete behavior tests in a rollback transaction
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/replay-and-test-character-deletion.sql
      - name: Verify all deletion draft DDL and synthetic rows were rolled back
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/verify-deletion-draft-rollback.sql
