name: Account deletion worker tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/_shared/account-deletion-worker.ts"
      - "supabase/functions/_shared/character-asset-cleanup-worker.ts"
      - "supabase/functions/_shared/character-asset-cleanup-worker.test.ts"
      - "supabase/functions/purge-character-assets/index.ts"
      - "supabase/drafts/character-history-aware-deletion.sql"
      - "supabase/config.toml"
      - "index.html"
      - "supabase/functions/_shared/account-deletion-worker.test.ts"
      - "supabase/functions/account-deletion-worker/index.ts"
      - "supabase/drafts/account-deletion-character-preservation-draft.sql"
      - "supabase/drafts/account-archived-character-session-insert-guard.sql"
      - "supabase/drafts/prepare-account-deletion-character-preservation-integration.sql"
      - "supabase/drafts/chat-deletion-cumulative-turn-statistics-proposal.sql"
      - "supabase/drafts/account-is-active-auth-user-existence-guard.sql"
      - "supabase/drafts/chat-archive-memory-photo-read-access.sql"
      - "supabase/drafts/chat-deletion-purge-cron.sql"
      - "scripts/test-account-deletion-character-preservation-draft.mjs"
      - ".github/workflows/account-deletion-worker-tests.yml"
  push:
    branches:
      - main
      - "security/chat-deletion-lifecycle-reconciliation"
    paths:
      - "supabase/functions/_shared/account-deletion-worker.ts"
      - "supabase/functions/_shared/character-asset-cleanup-worker.ts"
      - "supabase/functions/_shared/character-asset-cleanup-worker.test.ts"
      - "supabase/functions/purge-character-assets/index.ts"
      - "supabase/drafts/character-history-aware-deletion.sql"
      - "supabase/config.toml"
      - "supabase/functions/_shared/account-deletion-worker.test.ts"
      - "supabase/functions/account-deletion-worker/index.ts"
      - "supabase/drafts/account-deletion-character-preservation-draft.sql"
      - "supabase/drafts/account-archived-character-session-insert-guard.sql"
      - "supabase/drafts/prepare-account-deletion-character-preservation-integration.sql"
      - "supabase/drafts/chat-deletion-cumulative-turn-statistics-proposal.sql"
      - "supabase/drafts/account-is-active-auth-user-existence-guard.sql"
      - "supabase/drafts/chat-archive-memory-photo-read-access.sql"
      - "supabase/drafts/chat-deletion-purge-cron.sql"
      - "scripts/test-account-deletion-character-preservation-draft.mjs"
      - ".github/workflows/account-deletion-worker-tests.yml"

jobs:
  account-deletion-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check account deletion Edge Function
        run: deno check supabase/functions/account-deletion-worker/index.ts
      - name: Run deterministic account deletion worker tests
        run: deno test supabase/functions/_shared/account-deletion-worker.test.ts
      - name: Type-check character asset cleanup Edge Function
        run: deno check supabase/functions/purge-character-assets/index.ts
      - name: Run deterministic character asset cleanup tests
        run: deno test supabase/functions/_shared/character-asset-cleanup-worker.test.ts
      - name: Check account deletion character-preservation draft invariants
        run: node scripts/test-account-deletion-character-preservation-draft.mjs
