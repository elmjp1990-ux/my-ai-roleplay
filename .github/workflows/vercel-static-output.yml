name: Vercel static deployment output

on:
  pull_request:
    paths:
      - "index.html"
      - "memory-capture.js"
      - "chat-render-lifecycle.js"
      - "image-compression.js"
      - "signed-url-manager.js"
      - "city-map.js"
      - "followed-authors.js"
      - "author-profile.js"
      - "scripts/test-author-profile-module.mjs"
      - "scripts/test-followed-authors-module.mjs"
      - "scripts/test-city-map-module.mjs"
      - "memory-album.js"
      - "encounter-scene.js"
      - "scripts/test-media-asset-optimization.mjs"
      - "scripts/test-signed-url-manager.mjs"
      - "scripts/test-chat-render-lifecycle.mjs"
      - ".github/workflows/chat-render-lifecycle.yml"
      - "*.webp"
      - "vercel.json"
      - "scripts/build-vercel-static.mjs"
      - "scripts/test-vercel-static-output.mjs"
      - ".github/workflows/vercel-static-output.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the allowlisted static output
        run: node scripts/build-vercel-static.mjs
      - name: Verify deployed files and local asset references
        run: node scripts/test-vercel-static-output.mjs
      - name: Parse extracted city map module
        run: node --check city-map.js
      - name: Parse extracted followed authors module
        run: node --check followed-authors.js
      - name: Parse extracted author profile module
        run: node --check author-profile.js
      - name: Verify extracted author profile module contract
        run: node scripts/test-author-profile-module.mjs
      - name: Verify followed authors module contract
        run: node scripts/test-followed-authors-module.mjs
      - name: Verify extracted city map module contract
        run: node scripts/test-city-map-module.mjs
      - name: Verify chat render lifecycle contract
        run: node --test scripts/test-chat-render-lifecycle.mjs
