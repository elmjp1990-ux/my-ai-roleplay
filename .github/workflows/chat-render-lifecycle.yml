name: Chat render lifecycle contract

on:
  pull_request:
    paths:
      - "chat-render-lifecycle.js"
      - "image-compression.js"
      - "signed-url-manager.js"
      - "memory-album.js"
      - "encounter-scene.js"
      - "city-map.js"
      - "encounter-scene.js"
      - "scripts/test-signed-url-manager.mjs"
      - "scripts/test-image-compression.mjs"
      - "scripts/test-media-asset-optimization.mjs"
      - "scripts/test-chat-render-lifecycle.mjs"
      - ".github/workflows/chat-render-lifecycle.yml"
      - "index.html"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify shared signed URL manager
        run: node --test scripts/test-signed-url-manager.mjs
      - name: Verify shared image compression presets
        run: node --test scripts/test-image-compression.mjs
      - name: Verify media asset and compression adapter contracts
        run: node scripts/test-media-asset-optimization.mjs
      - name: Parse extracted City map module
        run: node --check city-map.js
      - name: Parse extracted Encounter scene module
        run: node --check encounter-scene.js
      - name: Verify render lifecycle registration and dispatch contract
        run: node --test scripts/test-chat-render-lifecycle.mjs
