name: Story AI content refusal tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/ai-provider-result.test.ts"
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-variables.ts"
      - "index.html"
      - ".github/workflows/story-ai-content-refusal-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/ai-provider-result.test.ts"
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-variables.ts"
      - "index.html"
      - ".github/workflows/story-ai-content-refusal-tests.yml"

jobs:
  story-ai-content-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run provider result normalization tests
        run: deno test --no-check supabase/functions/_shared/ai-provider-result.test.ts
