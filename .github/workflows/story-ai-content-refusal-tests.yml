name: Story AI content refusal tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/ai-provider-result.test.ts"
      - "supabase/functions/_shared/private-context-guard.ts"
      - "supabase/functions/_shared/private-context-guard.test.ts"
      - "supabase/functions/_shared/ai-gateway-policy.ts"
      - "supabase/functions/_shared/ai-gateway-policy.test.ts"
      - "supabase/migrations/20261104090000_move_character_personality_profile_to_private_info.sql"
      - "scripts/test-character-personality-private-migration.sql"
      - "scripts/test-private-personality-column-usage.mjs"
      - "scripts/test-chat-turn-wallet-refund.sql"
      - "memory-capture.js"
      - "scripts/test-memory-capture.cjs"
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-variables.ts"
      - "index.html"
      - ".github/workflows/story-ai-content-refusal-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/ai-provider-result.ts"
      - "supabase/functions/_shared/ai-provider-result.test.ts"
      - "supabase/functions/_shared/private-context-guard.ts"
      - "supabase/functions/_shared/ai-gateway-policy.ts"
      - "supabase/functions/_shared/ai-gateway-policy.test.ts"
      - "supabase/functions/_shared/private-context-guard.test.ts"
      - "supabase/migrations/20261104090000_move_character_personality_profile_to_private_info.sql"
      - "scripts/test-character-personality-private-migration.sql"
      - "scripts/test-private-personality-column-usage.mjs"
      - "scripts/test-chat-turn-wallet-refund.sql"
      - "memory-capture.js"
      - "scripts/test-memory-capture.cjs"
      - "supabase/functions/chat-turn/index.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-variables.ts"
      - "index.html"
      - ".github/workflows/story-ai-content-refusal-tests.yml"

jobs:
  chat-turn-wallet-refund:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test Story wallet reservation, exact refunds, retries and reconciliation on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-chat-turn-wallet-refund.sql

  personality-private-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Replay personality privacy migration twice against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-character-personality-private-migration.sql

  story-ai-content-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify author-only personality data never reads from public characters
        run: node scripts/test-private-personality-column-usage.mjs
      - name: Test five-turn player-first memory capture
        run: node --test scripts/test-memory-capture.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Story chat-turn Edge Function
        run: deno check supabase/functions/chat-turn/index.ts
      - name: Run provider result normalization tests
        run: deno test supabase/functions/_shared/ai-provider-result.test.ts
      - name: Run private context output guard tests
        run: deno test supabase/functions/_shared/private-context-guard.test.ts
      - name: Run AI Gateway privacy policy tests
        run: deno test supabase/functions/_shared/ai-gateway-policy.test.ts
