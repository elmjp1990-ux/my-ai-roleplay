jobs:
  chat-turn-wallet-refund:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve disposable PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter ancestor=postgres:16 --format '{{.Names}}' | head -n1)"
          if [[ -z "$db_container" ]]; then
            echo "Could not identify the disposable PostgreSQL 16 service container."
            docker ps --format 'table {{.Names}}\t{{.Image}}'
            exit 1
          fi
          echo "LOCAL_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          docker cp "$GITHUB_WORKSPACE/." "$db_container:/workspace"
      - name: Test Story wallet reservation, exact refunds, retries and reconciliation on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: docker exec -i -w /workspace "$LOCAL_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-chat-turn-wallet-refund.sql

  story-turn-affinity-phone-events:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve disposable PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter ancestor=postgres:16 --format '{{.Names}}' | head -n1)"
          if [[ -z "$db_container" ]]; then
            echo "Could not identify the disposable PostgreSQL 16 service container."
            docker ps --format 'table {{.Names}}\t{{.Image}}'
            exit 1
          fi
          echo "LOCAL_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          docker cp "$GITHUB_WORKSPACE/." "$db_container:/workspace"
      - name: Test per-turn affinity, phone event ownership and five-turn calibration
        env:
          PGPASSWORD: postgres
        run: docker exec -i -w /workspace "$LOCAL_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-story-turn-affinity-phone-events.sql

  personality-private-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve disposable PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter ancestor=postgres:16 --format '{{.Names}}' | head -n1)"
          if [[ -z "$db_container" ]]; then
            echo "Could not identify the disposable PostgreSQL 16 service container."
            docker ps --format 'table {{.Names}}\t{{.Image}}'
            exit 1
          fi
          echo "LOCAL_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          docker cp "$GITHUB_WORKSPACE/." "$db_container:/workspace"
      - name: Replay personality privacy migration twice against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: docker exec -i -w /workspace "$LOCAL_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-character-personality-private-migration.sql

  character-profile-queue-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve disposable PostgreSQL service container
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter ancestor=postgres:16 --format '{{.Names}}' | head -n1)"
          if [[ -z "$db_container" ]]; then
            echo "Could not identify the disposable PostgreSQL 16 service container."
            docker ps --format 'table {{.Names}}\t{{.Image}}'
            exit 1
          fi
          echo "LOCAL_DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          docker cp "$GITHUB_WORKSPACE/." "$db_container:/workspace"
      - name: Test profile queue coalescing, private access, lease fencing and stale-source rejection
        env:
          PGPASSWORD: postgres
        run: docker exec -i -w /workspace "$LOCAL_DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/test-character-profile-organization-queue.sql

  story-ai-content-refusal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify author-only personality data never reads from public characters
        run: node scripts/test-private-personality-column-usage.mjs
      - name: Verify unresolved Story turns are not presented as safe retries
        run: node scripts/test-chat-turn-reconciliation-ui.mjs
      - name: Verify roleplay prose, character agency and player point-of-view rules
        run: node scripts/test-story-roleplay-prompt.mjs
      - name: Verify phone UI never renders creator-only notification prompts
        run: node scripts/test-phone-notice-presentation.mjs
      - name: Verify Character AI Profile schema and source registry contracts
        run: node scripts/test-character-ai-profile-contract.mjs
      - name: Test five-turn player-first memory capture
        run: node --test scripts/test-memory-capture.cjs
      - name: Verify memory persistence, reload and correction-priority contracts
        run: node scripts/test-memory-persistence-contract.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Story chat-turn Edge Function
        run: deno check supabase/functions/chat-turn/index.ts
      - name: Type-check Character Profile organization Worker
        run: deno check supabase/functions/character-profile-organization-worker/index.ts
      - name: Test Character AI Profile evidence, privacy and OOC validation
        run: deno test supabase/functions/_shared/character-profile-organization.test.ts
      - name: Verify Story phone RPC and suggested reply persistence regressions
        run: node scripts/test-story-phone-and-suggestions-regression.mjs
      - name: Test structured Story turn evaluation parsing
        run: deno test supabase/functions/_shared/story-turn-envelope.test.ts
      - name: Run provider result normalization tests
        run: deno test supabase/functions/_shared/ai-provider-result.test.ts
      - name: Run provider failure safety policy tests
        run: deno test supabase/functions/_shared/provider-failure-policy.test.ts
      - name: Run private context output guard tests
        run: deno test supabase/functions/_shared/private-context-guard.test.ts
      - name: Run OpenRouter provider privacy policy tests
        run: deno test supabase/functions/_shared/openrouter-provider-policy.test.ts
      - name: Run generation claim release failure-path tests
        run: deno test supabase/functions/_shared/chat-turn-claim.test.ts
