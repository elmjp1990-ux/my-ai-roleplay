name: Prompt context tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/prompt-variables.ts"
      - "supabase/functions/_shared/prompt-variables.test.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-context.test.ts"
      - ".github/workflows/prompt-context-tests.yml"
  push:
    branches:
      - main
      - "feat/chat-control-syntax-role-bubbles"
    paths:
      - "supabase/functions/_shared/prompt-variables.ts"
      - "supabase/functions/_shared/prompt-variables.test.ts"
      - "supabase/functions/_shared/prompt-context.ts"
      - "supabase/functions/_shared/prompt-context.test.ts"
      - ".github/workflows/prompt-context-tests.yml"

jobs:
  prompt-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run prompt context and variable tests
        run: deno test --no-check supabase/functions/_shared/prompt-context.test.ts supabase/functions/_shared/prompt-variables.test.ts
