name: Generate Encounter schedule migration shell

on:
  push:
    branches:
      - feat/encounter-ai-integration
    paths:
      - ".github/workflows/generate-encounter-schedule-migration.yml"

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install the repository-pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Create a local migration file only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Hosted Supabase credentials must not be present."
            exit 1
          fi
          supabase migration new encounter_schedule_pipeline
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_encounter_schedule_pipeline.sql' -print | sort | tail -n 1)"
          test -n "$migration_file"
          printf '%s\n' "-- Encounter schedule pipeline. Local migration file generated by Supabase CLI." > "$migration_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_file"
          git commit -m "chore(db): create Encounter schedule migration shell"
          git push origin HEAD:feat/encounter-ai-integration
