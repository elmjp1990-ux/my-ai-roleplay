name: Chat unread navigation badge contract

on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/test-chat-unread-nav-badge.mjs"
      - ".github/workflows/chat-unread-nav-badge.yml"
permissions:
  contents: read
jobs:
  chat-unread-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unread badge and group reply refresh
        run: node scripts/test-chat-unread-nav-badge.mjs
      - name: Parse inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
            .map(match => match[2]);
          for (let i = 0; i < blocks.length; i++) {
            const file = '/tmp/poyozz-inline-' + i + '.js';
            fs.writeFileSync(file, blocks[i]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              console.error('Inline script syntax failed #' + (i + 1));
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
          }
          console.log('Parsed ' + blocks.length + ' inline scripts.');
          NODE
