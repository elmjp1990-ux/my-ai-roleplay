name: Encounter schedule worker tests

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/encounter-schedule-generation.ts'
      - 'supabase/functions/_shared/encounter-schedule-organizer-handler.ts'
      - 'supabase/migrations/**'
      - 'scripts/test-encounter-schedule-worker.mjs'
      - 'index.html'
      - 'city-map.js'
      - '.github/workflows/encounter-schedule-worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run encounter schedule worker contract tests
        run: node scripts/test-encounter-schedule-worker.mjs
